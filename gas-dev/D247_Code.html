<!-- D247_Code.html -->
<!-- Code Search タブ UI -->
<style>
  .code-card { background: var(--white); border: 1px solid var(--gray-300); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
  .code-toolbar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .code-label { font-size: 11px; font-weight: 700; color: var(--gray-500); margin-bottom: 4px; letter-spacing: .06em; text-transform: uppercase; }
  .code-input { padding: 7px 10px; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 13px; font-family: monospace; outline: none; width: 280px; }
  .code-input:focus { border-color: var(--amd-blue); }
  .code-hint { font-size: 12px; color: var(--gray-500); margin-bottom: 12px; }
  .code-err  { font-size: 13px; color: var(--red); margin-bottom: 8px; display: none; }
  .code-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .code-table th { background: var(--gray-100); padding: 7px 10px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--gray-300); white-space: nowrap; }
  .code-table td { padding: 6px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  .code-table tr:hover td { background: var(--gray-50); }
  .kind-def { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; background: var(--amd-blue-xl); color: var(--amd-blue); }
  .kind-ref { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; background: #f3f4f6; color: var(--gray-700); }
  .kind-txt { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; background: #fef3c7; color: #92400e; }
  .snippet-cell { font-family: monospace; font-size: 12px; color: var(--gray-700); max-width: 600px; white-space: pre-wrap; word-break: break-all; }
  .code-tog { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--gray-700); padding-bottom: 2px; }
  .code-tog input { accent-color: var(--amd-blue); width: 15px; height: 15px; }
  .code-note { font-size: 12px; color: var(--gray-400); margin-top: 12px; }
</style>

<div class="code-card">
  <div style="font-weight:700;font-size:16px;margin-bottom:4px;">Code Search</div>
  <div class="code-hint">関数名またはキーワードからソースを横断検索する</div>

  <div class="code-toolbar">
    <div>
      <div class="code-label">search query</div>
      <input id="codeQuery" class="code-input"
        placeholder="例: api_getTickets / DB_DevTickets / toClientSafe_"
        onkeydown="if(event.key==='Enter') runCodeSearch_()">
    </div>
    <div class="code-tog">
      <input type="checkbox" id="codeIncludeRefs">
      <span>参照も探す</span>
    </div>
    <button class="btn-primary" onclick="runCodeSearch_()">検索</button>
    <button class="btn-primary" onclick="copyAllCodeResults_()">全体コピー</button>
    <button class="btn-primary" onclick="rebuildRegistry_()">台帳再生成</button>
    <span id="codeStatus" style="font-size:12px;color:var(--gray-500)"></span>
  </div>

  <div id="codeErr" class="code-err"></div>

  <div style="overflow-x:auto;">
    <table class="code-table">
      <thead>
        <tr>
          <th style="width:90px">kind</th>
          <th style="width:260px">file</th>
          <th style="width:60px">line</th>
          <th>snippet</th>
        </tr>
      </thead>
      <tbody id="codeTbody">
        <tr><td colspan="4" class="code-hint" style="padding:16px 10px">検索してね</td></tr>
      </tbody>
    </table>
  </div>
  <div class="code-note">※ Apps Script API（projects.content）が有効じゃないと動かない</div>
</div>
