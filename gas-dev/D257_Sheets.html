<!-- D257_Sheets.html -->
<!-- 全スプレッドシート シート一覧タブ UI -->
<style>
  .sheets-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .sheets-toolbar h2 { font-size:18px; font-weight:700; }
  .sheets-table { width:100%; border-collapse:collapse; font-size:13px; }
  .sheets-table th { background:var(--gray-100); padding:7px 10px; text-align:left; font-weight:600; border-bottom:2px solid var(--gray-300); }
  .sheets-table td { padding:6px 10px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
  .sheets-table tr:hover td { background:var(--gray-50); }
  .sheets-count { font-size:12px; color:var(--gray-400); margin-top:8px; }
</style>

<div class="sheets-toolbar">
  <h2>Sheets</h2>
  <button class="btn-primary" onclick="sheetsRefresh_(true)">🔄 更新</button>
</div>

<div id="sheetsResult"><p class="loading-text">更新ボタンを押してね（初回は少し時間がかかる）</p></div>
