<!-- D261_Blueprint.html -->
<!-- Blueprint エントリ管理タブ（LLM機能除外版） -->
<style>
.dm-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dm-toolbar select,.dm-toolbar input{padding:4px 8px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px}
.dm-table{width:100%;border-collapse:collapse;font-size:13px}
.dm-table th{background:var(--gray-100);padding:7px 10px;text-align:left;font-weight:600;border-bottom:2px solid var(--gray-300)}
.dm-table td{padding:7px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.dm-table tr:hover td{background:var(--gray-50)}
.dm-badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap}
.dm-badge-vision      {background:#fef3c7;color:#92400e}
.dm-badge-architecture{background:#dbeafe;color:#1e40af}
.dm-badge-feature     {background:#d1fae5;color:#065f46}
.dm-badge-principle   {background:#fce7f3;color:#9d174d}
.dm-badge-dataflow    {background:#e0e7ff;color:#3730a3}
.dm-badge-datamap     {background:#f3f4f6;color:#374151}
.dm-badge-decision    {background:#fff7ed;color:#c2410c}
.dm-badge-risk        {background:#fee2e2;color:#991b1b}
.dm-priority{display:inline-block;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:11px;font-weight:700}
.dm-p1{background:#ef4444;color:#fff}
.dm-p2{background:#f97316;color:#fff}
.dm-p3{background:#eab308;color:#1a1a1a}
.dm-p4{background:#6b7280;color:#fff}
.dm-p5{background:#d1d5db;color:#6b7280}
.dm-content-preview{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151}
.dm-action-btn{padding:2px 8px;font-size:12px;border:1px solid var(--gray-300);border-radius:3px;background:#fff;cursor:pointer}
.dm-action-btn:hover{background:var(--gray-100)}
.dm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9000;align-items:center;justify-content:center}
.dm-overlay.active{display:flex}
.dm-modal{background:#fff;border-radius:8px;padding:24px;width:640px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.dm-modal h3{margin:0 0 16px;font-size:16px;font-weight:700}
.dm-form-row{margin-bottom:12px}
.dm-form-row label{display:block;font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:4px}
.dm-form-row input,.dm-form-row select,.dm-form-row textarea{width:100%;padding:7px 10px;border:1px solid var(--gray-300);border-radius:var(--radius);font-size:13px;box-sizing:border-box;font-family:inherit;outline:none}
.dm-form-row input:focus,.dm-form-row select:focus,.dm-form-row textarea:focus{border-color:var(--amd-blue)}
.dm-form-row textarea{min-height:80px;resize:vertical}
.dm-form-row-half{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.dm-mapping-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dm-form-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dm-json-area{width:100%;min-height:180px;font-family:monospace;font-size:12px;padding:8px;border:1px solid var(--gray-300);border-radius:var(--radius);resize:vertical;box-sizing:border-box}
.dm-status{color:var(--gray-500);font-size:12px;margin-left:4px}
.dm-count{font-size:12px;color:var(--gray-500);margin-bottom:8px}
</style>

<div class="dm-toolbar">
  <select id="dm-filter-type" onchange="dmFilterTable()">
    <option value="">すべてのtype</option>
    <option value="vision">vision</option>
    <option value="architecture">architecture</option>
    <option value="feature">feature</option>
    <option value="principle">principle</option>
    <option value="dataflow">dataflow</option>
    <option value="datamap">datamap</option>
    <option value="decision">decision</option>
    <option value="risk">risk</option>
  </select>
  <select id="dm-filter-domain" onchange="dmFilterTable()">
    <option value="">すべてのdomain</option>
    <option value="全体">全体</option>
    <option value="Cockpit">Cockpit</option>
    <option value="Billing">Billing</option>
    <option value="Admin">Admin</option>
    <option value="Slack">Slack</option>
    <option value="Report">Report</option>
    <option value="DB">DB</option>
    <option value="LLM">LLM</option>
  </select>
  <select id="dm-filter-priority" onchange="dmFilterTable()">
    <option value="">すべての優先度</option>
    <option value="1">P1</option>
    <option value="2">P2</option>
    <option value="3">P3</option>
    <option value="4">P4</option>
    <option value="5">P5</option>
  </select>
  <input type="text" id="dm-search" placeholder="キーワード検索..." oninput="dmFilterTable()" style="width:160px">
  <button class="btn-primary" onclick="dmOpenNew()">＋ 追加</button>
  <button class="btn-primary" onclick="dmCopyLlmContext()">📋 LLMコンテキストをコピー</button>
  <button class="btn-primary" onclick="dmOpenImport()">↑ インポート</button>
  <button class="btn-primary" onclick="dmExportJson()">↓ エクスポート</button>
  <button class="btn-primary" style="background:#7c3aed" onclick="dmGenerateSpec_()">✨ 仕様書生成</button>
  <button class="btn-primary" style="background:#0891b2" onclick="dmGenerateViz_()">📊 ビジュアライズ</button>
  <span class="dm-status" id="dm-status"></span>
</div>
<div id="dm-count" class="dm-count"></div>

<table class="dm-table" id="dm-table">
  <thead>
    <tr>
      <th style="width:28px">P</th>
      <th style="width:90px">type</th>
      <th style="width:70px">domain</th>
      <th style="width:180px">title</th>
      <th>content</th>
      <th style="width:72px">更新日</th>
      <th style="width:70px">操作</th>
    </tr>
  </thead>
  <tbody id="dm-tbody"></tbody>
</table>

<!-- 入力モーダル -->
<div class="dm-overlay" id="dm-overlay" onclick="if(event.target===this)dmCloseModal()">
  <div class="dm-modal">
    <h3 id="dm-modal-title">エントリを追加</h3>
    <input type="hidden" id="dm-edit-id">
    <div class="dm-form-row-half">
      <div class="dm-form-row" style="margin-bottom:0">
        <label>type *</label>
        <select id="dm-type" onchange="dmTypeChanged()">
          <option value="vision">vision — ビジョン・哲学</option>
          <option value="architecture">architecture — アーキテクチャ決定</option>
          <option value="feature">feature — 機能仕様</option>
          <option value="principle">principle — 開発原則</option>
          <option value="dataflow">dataflow — データフロー</option>
          <option value="datamap">datamap — UI×API×DB対応</option>
          <option value="decision">decision — 設計判断</option>
          <option value="risk">risk — リスク・課題</option>
        </select>
      </div>
      <div class="dm-form-row" style="margin-bottom:0">
        <label>priority（1=最重要）</label>
        <select id="dm-priority">
          <option value="1">1 — 最重要</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5 — 低</option>
        </select>
      </div>
    </div>
    <div class="dm-form-row-half" style="margin-top:12px">
      <div class="dm-form-row" style="margin-bottom:0">
        <label>domain</label>
        <select id="dm-domain">
          <option value="全体">全体</option>
          <option value="Cockpit">Cockpit</option>
          <option value="Billing">Billing</option>
          <option value="Admin">Admin</option>
          <option value="Slack">Slack</option>
          <option value="Report">Report</option>
          <option value="DB">DB</option>
          <option value="LLM">LLM</option>
        </select>
      </div>
      <div class="dm-form-row" style="margin-bottom:0">
        <label>status</label>
        <select id="dm-entry-status">
          <option value="active">active</option>
          <option value="proposed">proposed</option>
          <option value="deprecated">deprecated</option>
        </select>
      </div>
    </div>
    <div class="dm-form-row" style="margin-top:12px">
      <label>title *</label>
      <input type="text" id="dm-title" placeholder="エントリのタイトル（短く明確に）">
    </div>
    <div class="dm-form-row">
      <label>content *（何を・どうする）</label>
      <textarea id="dm-content" placeholder="この決定・原則・仕様の内容を書く"></textarea>
    </div>
    <div class="dm-form-row">
      <label>rationale（なぜそうするのか）</label>
      <textarea id="dm-rationale" style="min-height:60px" placeholder="理由・背景（省略可）"></textarea>
    </div>
    <div class="dm-form-row">
      <label>constraints（制約・注意事項、カンマ区切り）</label>
      <input type="text" id="dm-constraints" placeholder="例: toClientSafe_ラップ必須, yyyymm形式のみ">
    </div>
    <div id="dm-mapping-section" style="display:none">
      <div class="dm-form-row">
        <label>UIコンポーネント × API × DB 対応</label>
        <div class="dm-mapping-row">
          <input type="text" id="dm-map-ui"  placeholder="UIファイル名">
          <input type="text" id="dm-map-api" placeholder="API関数名">
          <input type="text" id="dm-map-db"  placeholder="DBシート名">
        </div>
      </div>
    </div>
    <div class="dm-form-footer">
      <button class="btn-ghost" onclick="dmCloseModal()">キャンセル</button>
      <button class="btn-primary" onclick="dmSaveEntry()">保存</button>
    </div>
  </div>
</div>

<!-- ビジュアライズモーダル -->
<div class="dm-overlay" id="dm-viz-overlay" onclick="if(event.target===this)dmCloseViz_()">
  <div class="dm-modal" style="width:860px;max-width:98vw">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="margin:0">AMD OS アーキテクチャ図</h3>
      <div style="display:flex;gap:8px">
        <button class="btn-primary" onclick="dmDownloadViz_()">⬇ SVGダウンロード</button>
        <button class="btn-ghost" onclick="dmCloseViz_()">閉じる</button>
      </div>
    </div>
    <div id="dm-viz-status" style="color:var(--gray-500);font-size:13px;margin-bottom:8px"></div>
    <div id="dm-viz-content" style="background:#fff;border:1px solid var(--gray-300);border-radius:var(--radius);padding:16px;min-height:200px;overflow:auto"></div>
  </div>
</div>

<!-- 仕様書モーダル -->
<div class="dm-overlay" id="dm-spec-overlay" onclick="if(event.target===this)dmCloseSpec_()">
  <div class="dm-modal" style="width:800px;max-width:98vw">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="margin:0">AMD OS 全体設計仕様書</h3>
      <div style="display:flex;gap:8px">
        <button class="btn-primary" onclick="dmCopySpec_()">📋 コピー</button>
        <button class="btn-ghost" onclick="dmCloseSpec_()">閉じる</button>
      </div>
    </div>
    <div id="dm-spec-status" style="color:var(--gray-500);font-size:13px;margin-bottom:8px"></div>
    <div id="dm-spec-content" style="white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:70vh;overflow-y:auto;padding:12px;background:var(--gray-50);border-radius:var(--radius);border:1px solid var(--gray-300)"></div>
  </div>
</div>

<!-- インポートモーダル -->
<div class="dm-overlay" id="dm-import-overlay" onclick="if(event.target===this)dmCloseImport()">
  <div class="dm-modal">
    <h3>JSONインポート</h3>
    <p style="font-size:13px;color:var(--gray-500);margin:0 0 8px">entriesの配列または全体JSONをペースト。既存データとマージします（同一IDは上書き）。</p>
    <textarea class="dm-json-area" id="dm-import-json"
      placeholder='[{"type":"vision","title":"...","content":"..."}]'></textarea>
    <div class="dm-form-footer">
      <button class="btn-ghost" onclick="dmCloseImport()">キャンセル</button>
      <button class="btn-primary" onclick="dmDoImport()">インポート実行</button>
    </div>
  </div>
</div>
