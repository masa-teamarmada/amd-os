<!-- A246_AdminExtractors.html -->
      <div id="sec_extractors" style="display:none;">
        <div class="card" id="exCard">
          <div class="row">
            <div>
              <div style="font-weight:900;">AMD Protocols</div>
              <div class="muted">「分岐点/判断基準」の定義・禁止例など、抽出ルールをここで編集して運用する。</div>
            </div>

            <div class="rowLeft">
              <div>
                <div class="ctlLabel">name</div>
                <input id="exName" class="ctl" style="width:180px" value="protocol_extract" />
              </div>

              <button class="btn" onclick="loadExtractorConfigs()">更新</button>
              <button class="btn" onclick="openNewExtractorInline()">新規</button>
              <button class="btn" id="btnExActivate" onclick="activateSelectedExtractor_()" disabled>有効化</button>
              <button class="btn" id="btnExArchive" style="border-color:#fecaca; color:#b91c1c;" onclick="archiveSelectedExtractor_()" disabled>アーカイブ</button>
            </div>
          </div>

          <div id="exHint" class="hint">-</div>
          <div id="exErr" class="err" style="display:none;"></div>

          <!-- editor -->
          <div id="exEditor" style="margin-top:12px; border:1px dashed var(--line); border-radius:12px; padding:12px; background:#fff;">
            <div class="rowLeft">
              <div>
                <div class="ctlLabel">status</div>
                <input id="exStatus" class="ctl" style="width:120px" value="(not loaded)" disabled />
              </div>

              <div>
                <div class="ctlLabel">version</div>
                <input id="exVersion" class="ctl" style="width:180px" placeholder="例: v3_ctx1" />
              </div>

              <div>
                <div class="ctlLabel">note</div>
                <input id="exNote" class="ctl" style="width:360px" placeholder="任意メモ（何を変えたか）" />
              </div>

              <div>
                <div class="ctlLabel">configId</div>
                <input id="exConfigId" class="ctl mono" style="width:260px" value="" disabled />
              </div>
            </div>

            <div style="margin-top:10px;">
              <div class="ctlLabel">systemPrompt</div>
              <textarea id="exSystemPrompt" class="ctl" style="width:100%; height:260px; resize:vertical;" placeholder="ここにsystem prompt全文（後で入れる）"></textarea>
            </div>

            <div class="row" style="margin-top:12px;">
              <div class="rowLeft">
                <button class="btn" onclick="saveExtractorConfig_()">保存</button>
                <button class="btn" onclick="loadActiveExtractor_()">activeを読み込み</button>
              </div>
              <div class="muted">保存＝新規作成または上書き。有効化＝activeに切替（同名のactiveは自動でarchived）。</div>
            </div>
          </div>

          <!-- list -->
          <div class="tableWrap" style="margin-top:12px;">
            <table class="stickyTable" style="min-width: 1400px;">
              <thead>
                <tr>
                  <th style="width:110px;">status</th>
                  <th style="width:220px;">version</th>
                  <th style="width:420px;">note</th>
                  <th style="width:180px;">updatedAt</th>
                  <th style="width:240px;">操作</th>
                  <th style="width:320px;">configId</th>
                </tr>
              </thead>
              <tbody id="exTbody">
                <tr><td colspan="6" class="muted">loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div><!-- /#sec_extractors -->
