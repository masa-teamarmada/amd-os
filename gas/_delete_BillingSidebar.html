<!--

  <head>
    <base target="_top">
    <style>
      body { font-family: system-ui, -apple-system; padding: 12px; }

    </style>
  </head>
  <body>
    <h3>請求/支払い 入力</h3>
    <div class="small">
      ここで入れた内容が DB_BillingCycle / DB_PayoutDetail に反映される
    </div>

    <label>PJ</label>
    <select id="pj"></select>

    <label>対象月（来月）</label>
    <input id="month" type="month"/>

    <label>来月予算（振込予定額・税抜）</label>
    <input id="budget" type="number" min="0" step="1" placeholder="例: 300000"/>

    <label>メンバー報酬（税抜）</label>
    <div class="row">
      <div>
        <select id="member"></select>
      </div>
      <div>
        <input id="amount" type="number" min="0" step="1" placeholder="例: 50000"/>
      </div>
    </div>
    <button onclick="addPayout()">＋ 追加</button>

    <table>
      <thead>
        <tr><th>member</th><th>報酬(税抜)</th><th></th></tr>
      </thead>
      <tbody id="payoutRows"></tbody>
    </table>

    <div class="small" id="sumInfo"></div>

    <!-- ★追加：月次報告書の添付 
    <label>月次報告書（PDF/Doc等）</label>
    <input id="reportFile" type="file" />
    <div class="small" id="fileInfo">未選択</div>

    <label><input type="checkbox" id="chkScheduled"> 月次報告会のスケジューリングを完了した</label>
    <label><input type="checkbox" id="chkAgreed"> PJ関与メンバー全員が来月報酬額に合意した</label>

    <button onclick="submit()">DBへ反映</button>
    <div id="msg"></div>

    <script>
      let initData = null;
      let payouts = [];

      // ★追加：添付ファイル用
      let reportFileBase64 = "";
      let reportFileName = "";
      let reportMimeType = "";

      function yyyymm01FromMonthInput(v){
        // input type=month -> "YYYY-MM"
        if(!v) return "";
        return v + "-01";
      }

      function renderPayouts(){
        const tbody = document.getElementById("payoutRows");
        tbody.innerHTML = "";
        payouts.forEach((p, idx) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${p.name} (${p.memberId})</td>
            <td style="text-align:right;">${Number(p.amountNet).toLocaleString()}</td>
            <td><button onclick="removePayout(${idx})">削除</button></td>
          `;
          tbody.appendChild(tr);
        });

        const sum = payouts.reduce((s,x)=>s+Number(x.amountNet||0),0);
        document.getElementById("sumInfo").textContent =
          `合計: ${sum.toLocaleString()} 円（税抜）`;
      }

      function removePayout(i){
        payouts.splice(i,1);
        renderPayouts();
      }

      function addPayout(){
        const memberId = document.getElementById("member").value;
        const amountNet = Number(document.getElementById("amount").value || 0);
        if(!memberId) { alert("member選んで"); return; }
        if(amountNet < 0) { alert("報酬マイナス無理"); return; }

        const m = initData.members.find(x => x.memberId === memberId);
        payouts.push({ memberId, name: m ? m.name : memberId, amountNet });
        document.getElementById("amount").value = "";
        renderPayouts();
      }

      function submit(){
        const PJ_ID = document.getElementById("pj").value;
        const targetMonth = yyyymm01FromMonthInput(document.getElementById("month").value);
        const budgetNet = Number(document.getElementById("budget").value || 0);
        const checkScheduled = document.getElementById("chkScheduled").checked;
        const checkAgreed = document.getElementById("chkAgreed").checked;

        const payload = {
          PJ_ID,
          targetMonth,
          budgetNet,
          payouts: payouts.map(p => ({ memberId: p.memberId, amountNet: p.amountNet })),
          checkScheduled,
          checkAgreed,

          // ★追加：月次報告書添付情報（無ければ空で送る）
          reportFileName,
          reportMimeType,
          reportFileBase64,
        };

        setMsg("送信中…");

        google.script.run
          .withSuccessHandler(res => {
            setMsg(`✅ 反映OK cycleId=${res.cycleId}`);
            payouts = [];
            renderPayouts();

            // ★追加：送信後に添付情報をリセット
            reportFileBase64 = "";
            reportFileName = "";
            reportMimeType = "";
            const f = document.getElementById("reportFile");
            if (f) f.value = "";
            document.getElementById("fileInfo").textContent = "未選択";
          })
          .withFailureHandler(err => {
            setMsg(`❌ ${err.message}`, true);
          })
          .submitBillingForm(payload);
      }

      function setMsg(t, isErr){
        const el = document.getElementById("msg");
        el.className = isErr ? "ng" : "ok";
        el.textContent = t;
      }

      function init(){
        google.script.run
          .withSuccessHandler(data => {
            initData = data;

            // PJ
            const pjSel = document.getElementById("pj");
            data.projects.forEach(p => {
              const opt = document.createElement("option");
              opt.value = p.PJ_ID;
              opt.textContent = `${p.PJ名}`;
              pjSel.appendChild(opt);
            });

            // Members
            const memSel = document.getElementById("member");
            data.members.forEach(m => {
              const opt = document.createElement("option");
              opt.value = m.memberId;
              opt.textContent = `${m.name}`;
              memSel.appendChild(opt);
            });

            // month default = next month
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth()+1; // 1-12
            const nm = (m===12) ? 1 : (m+1);
            const ny = (m===12) ? (y+1) : y;
            document.getElementById("month").value = `${ny}-${String(nm).padStart(2,'0')}`;

            // ★追加：ファイル選択イベント
            const fileInput = document.getElementById("reportFile");
            fileInput.addEventListener("change", (e) => {
              const f = e.target.files && e.target.files[0];
              if (!f) return;

              reportFileName = f.name;
              reportMimeType = f.type || "application/octet-stream";
              document.getElementById("fileInfo").textContent = `選択: ${reportFileName}`;

              const reader = new FileReader();
              reader.onload = () => {
                // data:application/pdf;base64,xxxx の形
                const dataUrl = reader.result;
                const base64 = String(dataUrl).split(",")[1] || "";
                reportFileBase64 = base64;
              };
              reader.readAsDataURL(f);
            });

            renderPayouts();
          })
          .withFailureHandler(err => setMsg(`❌ ${err.message}`, true))
          .getBillingFormInitData();
      }

      init();
    </script>
  </body>
</html>
