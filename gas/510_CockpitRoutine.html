<!-- 510_CockpitRoutine.html
     Legacy placeholder. The PM monthly routine UI was abolished on 2026-06-19.
-->
<script>
function cpLoadRoutineFlow() {
  var section = document.getElementById("cpRoutineSection");
  if (section) section.style.display = "none";
}

function cpRenderRoutineFlow(res) {
  var el = document.getElementById("cpRoutineBody");
  if (!el) return;
  el.innerHTML = "";
  var section = document.getElementById("cpRoutineSection");
  if (section) section.style.display = "none";
  return;

  if (!res || !res.ok || !res.flows) {
    el.innerHTML = '<div class="cp-routine-empty">データなし</div>';
    return;
  }

  var html = "";
  var flows = res.flows;

  for (var fi = 0; fi < flows.length; fi++) {
    var f = flows[fi];
    if (f.role !== "main" && !f.hasCycle) {
      if (f.role === "next") {
        html += '<div class="cp-routine-block next">';
        html += '  <div class="cp-routine-block-header">' + cpRoutineFmtYm(f.bizYm) + '（予定）</div>';
        html += '  <div class="cp-routine-empty">まだルーティン未開始</div>';
        html += '</div>';
      }
      continue;
    }

    if (f.role === "prev") {
      var allDone = true;
      for (var ci = 0; ci < f.steps.length; ci++) {
        if (!f.steps[ci].done) { allDone = false; break; }
      }
      if (allDone) continue;
    }

    var roleLabel = f.role === "main" ? "" : f.role === "prev" ? "（残タスク）" : "（予定）";

    html += '<div class="cp-routine-block ' + f.role + '">';
    html += '  <div class="cp-routine-block-header">';
    html += cpRoutineFmtYm(f.bizYm) + roleLabel;
    if (f.hasCycle && f.role !== "prev") {
      if (f.isDeferred) {
        html += ' <span style="font-size:9px;color:#3b82f6;cursor:pointer" onclick="cpChangeInvoiceYm(\'' + f.bizYm + '\',\'' + f.invoiceYm + '\')">[' + cpRoutineFmtYm(f.invoiceYm) + '請求]</span>';
      } else if (f.batchTargetYms && f.batchTargetYms.length > 0) {
        html += ' <span style="font-size:9px;color:#3b82f6">[' + (f.batchTargetYms.length + 1) + 'ヶ月分一括]</span>';
      } else {
        html += ' <span style="font-size:9px;color:#aaa;cursor:pointer" onclick="cpChangeInvoiceYm(\'' + f.bizYm + '\',\'' + f.bizYm + '\')">[請求月変更]</span>';
      }
    }
    html += '</div>';
    html += '  <div class="cp-routine-steps">';

    var currentFound = false;
    for (var si = 0; si < f.steps.length; si++) {
      var s = f.steps[si];

      var cls = s.status || "future";
      var dotContent = String(si + 1);
      if (cls === "deferred") {
        dotContent = "→";
      } else if (s.done) {
        cls = "done";
        dotContent = "✓";
      } else if (!currentFound && !s.done) {
        if (cls === "future") cls = "current";
        currentFound = true;
      }

      if (f.role === "prev" && s.done) continue;
      if (f.role === "prev" && cls === "deferred") continue;

      var clickAttr = "";
      if (cls !== "deferred") {
        if (s.href) {
          clickAttr = ' onclick="window.open(\'' + cpEsc(s.href) + '\',\'_blank\')" style="cursor:pointer"';
        } else if (s.action) {
          clickAttr = ' onclick="' + s.action + '" style="cursor:pointer"';
        }
      }
      html += '<div class="cp-routine-step ' + cls + '"' + clickAttr + '>';
      html += '  <div class="cp-routine-dot">' + dotContent + '</div>';
      html += '  <div class="cp-routine-label">' + cpEsc(s.label) + '</div>';

      if (cls === "deferred") {
        // deferredは何も表示しない（labelに「X月にまとめて請求」が入ってる）
      } else if (s.done && s.doneAt && s.doneAt !== "done" && s.doneAt !== "skipped") {
        html += '<div class="cp-routine-date">〜' + cpRoutineFmtDate(s.doneAt) + '</div>';
      } else if (s.doneAt === "skipped") {
        html += '<div class="cp-routine-date">スキップ</div>';
      } else if (s.deadline) {
        html += '<div class="cp-routine-date ' + cls + '">〜' + cpRoutineFmtDate(s.deadline) + '</div>';
      }

      html += '</div>';
    }

    html += '  </div>';
    html += '</div>';
  }

  if (!html) {
    html = '<div class="cp-routine-empty">ルーティンデータなし</div>';
  }
  el.innerHTML = html;
}

function cpRoutineFmtYm(ym) {
  var s = String(ym || "");
  if (s.length === 6) return s.substring(0, 4) + "/" + s.substring(4, 6);
  return s;
}

function cpChangeInvoiceYm(ym, currentInvoiceYm) {
  // 選択肢を生成（当月 + 1〜6ヶ月後）
  var options = [{ value: '', label: cpRoutineFmtYm(ym) + '（通常・当月請求）' }];
  var cur = Number(ym);
  for (var i = 1; i <= 6; i++) {
    var ny = Math.floor(cur / 100);
    var nm = (cur % 100) + i;
    while (nm > 12) { nm -= 12; ny++; }
    var optYm = String(ny) + ('0' + nm).slice(-2);
    options.push({ value: optYm, label: cpRoutineFmtYm(optYm) + 'にまとめて請求' });
  }

  var html = '<div style="padding:16px">';
  html += '<div style="font-size:13px;font-weight:600;margin-bottom:12px">' + cpRoutineFmtYm(ym) + ' の請求月を変更</div>';
  for (var j = 0; j < options.length; j++) {
    var o = options[j];
    var selected = (o.value === '' && currentInvoiceYm === ym) || o.value === currentInvoiceYm;
    var style = 'display:block;width:100%;padding:8px 12px;margin:4px 0;border:1px solid ' + (selected ? '#2563eb' : '#e2e8f0') + ';border-radius:6px;background:' + (selected ? '#eff6ff' : '#fff') + ';cursor:pointer;font-size:12px;text-align:left;color:#1e293b';
    html += '<button style="' + style + '" onclick="cpDoSetInvoiceYm(\'' + ym + '\',\'' + o.value + '\')">';
    if (selected) html += '● ';
    html += cpEsc(o.label) + '</button>';
  }
  html += '</div>';

  cpShowMiniModal_(html);
}

function cpDoSetInvoiceYm(ym, invoiceYm) {
  cpCloseMiniModal_();
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.ok) {
        cpShowMiniModal_('<div style="padding:16px;color:#991b1b">' + (res ? cpEsc(res.message) : '不明なエラー') + '</div>');
        return;
      }
      cpLoadRoutineFlow();
    })
    .withFailureHandler(function(err) {
      cpShowMiniModal_('<div style="padding:16px;color:#991b1b">エラー: ' + cpEsc(String(err)) + '</div>');
    })
    .cockpit_api_setInvoiceYm({ projectId: CP.projectId, ym: ym, invoiceYm: invoiceYm });
}

function cpRoutineFmtDate(val) {
  if (!val) return "";
  var s = String(val);
  var m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return Number(m[2]) + "/" + Number(m[3]);
  var m2 = s.match(/(\d+)月(\d+)日/);
  if (m2) return m2[1] + "/" + m2[2];
  return s.substring(0, 10);
}

// ===== 簡易モーダル =====
function cpShowMiniModal_(bodyHtml) {
  cpCloseMiniModal_();
  var overlay = document.createElement('div');
  overlay.id = 'cpMiniModalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.onclick = function(e) { if (e.target === overlay) cpCloseMiniModal_(); };
  var box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:340px;width:90%;max-height:80vh;overflow-y:auto';
  box.innerHTML = bodyHtml;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
function cpCloseMiniModal_() {
  var el = document.getElementById('cpMiniModalOverlay');
  if (el) el.remove();
}
</script>
