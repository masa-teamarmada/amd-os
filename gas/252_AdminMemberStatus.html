<!-- 252_AdminMemberStatus.html
     メンバーステータス画面 — RPGステータス風の一覧+詳細表示
-->
<div id="sec_memberStatus" style="display:none;">
  <div class="card" style="margin-top:12px;">

    <!-- Header -->
    <div class="row">
      <div>
        <div style="font-weight:900; font-size:16px;">Member Status</div>
        <div class="muted">スコアは直近3ヶ月の実績から自動算出 / 先手力はPJ単位のamdPctを加重平均</div>
      </div>
      <div class="rowLeft">
        <button class="btn" onclick="memberStatusRefresh()">更新</button>
        <button class="btn" onclick="recomputeStatus_()">再計算</button>
      </div>
    </div>

    <div id="statusErr" class="err" style="display:none;"></div>
    <div id="statusHint" class="muted" style="margin-top:8px;">—</div>

    <!-- 一覧テーブル -->
    <div class="tableWrap">
      <table style="min-width:900px;">
        <thead><tr>
          <th>codeName</th>
          <th style="text-align:center;">総合</th>
          <th style="text-align:center;">先手力</th>
          <th style="text-align:center;">実行力</th>
          <th style="text-align:center;">発信力</th>
          <th style="text-align:center;">連携力</th>
          <th style="text-align:center;">成長力</th>
          <th>称号</th>
          <th style="text-align:center;">充填率</th>
        </tr></thead>
        <tbody id="statusTbody">
          <tr><td colspan="9" class="muted">タブを選択すると読み込みます</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 詳細カード（メンバー選択時に展開） -->
    <div id="statusDetailCard" style="display:none; margin-top:16px; padding:20px; border:1px solid var(--line); border-radius:14px; background:var(--card);">
    </div>

  </div>
</div>

<style>
  .st-bar { display:inline-block; height:8px; border-radius:4px; vertical-align:middle; }
  .st-bar-bg { background:#eee; width:80px; }
  .st-bar-fill { background:#3b82f6; min-width:1px; }
  .st-score-cell { text-align:center; cursor:default; }
  .st-name-link { cursor:pointer; font-weight:700; color:var(--text); }
  .st-name-link:hover { text-decoration:underline; }
  .st-detail-grid { display:grid; grid-template-columns:280px 1fr; gap:24px; }
  .st-radar-wrap { display:flex; justify-content:center; align-items:center; }
  .st-knowledge-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; margin-top:12px; }
  .st-knowledge-slot { padding:10px; border-radius:10px; font-size:12px; line-height:1.5; }
  .st-knowledge-filled { border:1px solid var(--line); background:#f9fafb; }
  .st-knowledge-empty { border:1px dashed #ccc; background:#fafafa; color:#aaa; }
  .st-titles-wrap { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .st-completion-bar { height:6px; border-radius:3px; background:#eee; margin-top:6px; overflow:hidden; }
  .st-completion-fill { height:100%; border-radius:3px; background:linear-gradient(90deg, #3b82f6, #10b981); }
  .st-score-row { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13px; }
  .st-score-label { width:50px; font-weight:700; font-size:11px; color:var(--sub); }
  .st-score-bar-outer { flex:1; height:10px; background:#eee; border-radius:5px; overflow:hidden; }
  .st-score-bar-inner { height:100%; border-radius:5px; transition:width 0.3s; }
  .st-score-val { width:32px; text-align:right; font-weight:700; font-size:13px; }
  @media (max-width: 700px) {
    .st-detail-grid { grid-template-columns:1fr; }
  }
</style>
