<!--
<!doctype html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: system-ui, -apple-system; padding: 16px; max-width: 980px; margin: 0 auto; }
      .top { display:flex; justify-content: space-between; align-items:center; gap:12px; }
      .nav a { margin-left: 12px; }
      .pill { display:inline-block; padding: 4px 10px; border-radius: 999px; background:#f1f1f1; font-size:12px; margin-right:6px; }
      .card { border:1px solid #eee; border-radius:12px; padding:12px; background:#fff; margin-top:12px; }
      .h { font-weight:800; margin:0 0 8px 0; }
      .small { font-size:12px; color:#666; }
      textarea, select { width:100%; padding:10px; box-sizing:border-box; }
      button { padding:10px 14px; cursor:pointer; }
      .row { display:flex; gap:8px; align-items:center; }
      .row > * { flex: 1; }
      .ok { color:#0a7; font-weight:700; }
      .ng { color:#c33; font-weight:700; }
      .list { margin: 8px 0 0 0; padding-left: 18px; }
      .tag { display:inline-block; font-size:11px; padding:2px 8px; border:1px solid #ddd; border-radius:999px; margin-right:6px; color:#555; }
      pre { white-space: pre-wrap; background:#fafafa; border:1px solid #eee; padding:10px; border-radius:10px; }
    </style>
  </head>
  <body>
    <div class="top">
      <div>
        <h2 style="margin:0;">AMD OS | まさBOT（v0）</h2>
        <div class="small" id="who"></div>
      </div>
      <div class="nav">
        <a id="lnkHome" href="?page=home">Home</a>
        <a id="lnkProject" href="?page=project" style="display:none;">Project</a>
        <a id="lnkBilling" href="?page=billing">請求/支払い入力</a>
      </div>
    </div>

    <div class="card">
      <div class="h">質問</div>
      <div class="row">
        <div>
          <div class="small">project（任意）</div>
          <select id="projectSel"></select>
        </div>
        <div style="flex:2;">
          <div class="small">query</div>
          <textarea id="query" rows="3" placeholder="例：来月の請求入力の流れを整理して／合意が取れないときどうする？／このPJの次アクションは？"></textarea>
        </div>
      </div>
      <div style="margin-top:10px;">
        <button onclick="ask()">聞く</button>
        <span id="msg" class="small"></span>
      </div>
    </div>

    <div class="card">
      <div class="h">BOT出力</div>
      <div id="out"></div>
    </div>

    <script>
      let init = null;

      function esc(s){
        return String(s||"")
          .replaceAll("&","&amp;").replaceAll("<","&lt;")
          .replaceAll(">","&gt;").replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
      }

      function setMsg(t, isErr){
        const el = document.getElementById("msg");
        el.className = isErr ? "ng" : "small";
        el.textContent = t;
      }

      function renderInit(data){
        init = data;
        document.getElementById("who").innerHTML =
          `<span class="pill">${esc(data.actor.name)} (${esc(data.actor.memberId)})</span>
           <span class="pill">${data.actor.isAdmin ? "admin" : "pm"}</span>`;

        // project selector
        const sel = document.getElementById("projectSel");
        sel.innerHTML = "";
        const opt0 = document.createElement("option");
        opt0.value = "";
        opt0.textContent = "(未選択)";
        sel.appendChild(opt0);

        data.projects.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.projectId;
          opt.textContent = `${p.projectName} (${p.projectId})`;
          sel.appendChild(opt);
        });
      }

      function ask(){
        const projectId = document.getElementById("projectSel").value;
        const query = document.getElementById("query").value;

        setMsg("loading…");
        document.getElementById("out").innerHTML = "";

        google.script.run
          .withSuccessHandler(res => {
            setMsg("");
            renderOut(res);
          })
          .withFailureHandler(err => {
            setMsg(`❌ ${err.message}`, true);
          })
          .botAsk({ projectId, query });
      }

      function renderOut(res){
        const baseUrl = (init && init.baseUrl) ? init.baseUrl : "";

        const cards = res.cards || [];
        const ps = res.projectSummary;
        const actions = res.actions || [];

        let html = "";

        // project summary
        if (ps) {
          html += `<div class="card" style="margin-top:0;">
            <div class="h">PJサマリ</div>
            <div class="small">
              <b>${esc(ps.projectName)}</b> (${esc(ps.projectId)}) / PM: ${esc(ps.pm||"-")} / stage: ${esc(ps.stageName||"-")} (${esc(ps.currentStageId||"-")}) / progress: ${esc(ps.progress||"-")}
            </div>
            <div style="margin-top:8px;">
              <a href="${esc(baseUrl + `?page=project&projectId=${encodeURIComponent(ps.projectId)}`)}">PJ詳細へ →</a>
            </div>
          </div>`;
        }

        // knowledge cards
        html += `<div class="card">
          <div class="h">関連ノウハウ（上位${cards.length}件）</div>
          ${cards.length === 0 ? `<div class="small">該当カードなし（まず2〜3枚作ると世界が始まる）</div>` : ""}
          <ul class="list">
            ${cards.map(c => `
              <li>
                <div><b>${esc(c.title)}</b> <span class="tag">${esc(c.visibility)}</span> <span class="tag">${esc(c.tags||"")}</span></div>
                <div class="small">${esc(c.body||"")}</div>
              </li>
            `).join("")}
          </ul>
        </div>`;

        // next actions
        html += `<div class="card">
          <div class="h">次アクション（v0）</div>
          <ol class="list">
            ${actions.map(a => `
              <li>
                ${a.href && a.href !== "#" 
                  ? `<a href="${esc(baseUrl + a.href)}">${esc(a.title)}</a>`
                  : `<span>${esc(a.title)}</span>`}
              </li>
            `).join("")}
          </ol>
        </div>`;

        document.getElementById("out").innerHTML = html;
      }

      function initPage(){
        setMsg("loading…");
        google.script.run
          .withSuccessHandler(data => {
            setMsg("");
            renderInit(data);
          })
          .withFailureHandler(err => setMsg(`❌ ${err.message}`, true))
          .getBotInitData();
      }

      initPage();
    </script>
  </body>
</html>
-->
