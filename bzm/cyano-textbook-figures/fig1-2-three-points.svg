<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="「シアノバクテリアが現れた時期」の3つの意味を示す系統の図" font-family='"Noto Sans JP", "Hiragino Sans", sans-serif'>
<rect x="0" y="0" width="760" height="330" fill="#FFFFFF" />
<path d="M 40 170 H 170 V 80 H 720" fill="none" stroke="#909A9F" stroke-width="3" stroke-linejoin="round" /><text x="720" y="68" font-size="13" fill="#253239" text-anchor="end" font-weight="400">光合成をしない近縁の仲間（メライナバクテリアなど）</text><path d="M 170 170 V 210 H 470" fill="none" stroke="#35B9D0" stroke-width="3" stroke-linejoin="round" /><path d="M 470 210 V 170 H 720 M 470 210 V 260 H 720" fill="none" stroke="#35B9D0" stroke-width="3" stroke-linejoin="round" /><text x="720" y="158" font-size="13" fill="#253239" text-anchor="end" font-weight="400">グロエオバクター（チラコイド膜をもたない）</text><text x="720" y="248" font-size="13" fill="#253239" text-anchor="end" font-weight="400">そのほかの今いるシアノバクテリア</text><circle cx="170" cy="170" r="13" fill="#F2A21B" stroke="#FFFFFF" stroke-width="2"><title>近縁の仲間と分かれた時期</title></circle><text x="170" y="175" font-size="14" fill="#253239" text-anchor="middle" font-weight="700">1</text><circle cx="320" cy="210" r="13" fill="#F2A21B" stroke="#FFFFFF" stroke-width="2"><title>酸素発生型光合成を手に入れた時期</title></circle><text x="320" y="215" font-size="14" fill="#253239" text-anchor="middle" font-weight="700">2</text><circle cx="470" cy="210" r="13" fill="#F2A21B" stroke="#FFFFFF" stroke-width="2"><title>今いるシアノバクテリアの共通の祖先</title></circle><text x="470" y="215" font-size="14" fill="#253239" text-anchor="middle" font-weight="700">3</text><text x="190" y="128" font-size="13" fill="#253239" text-anchor="start" font-weight="700">1　近縁の仲間と分かれた時期</text><text x="190" y="146" font-size="12.5" fill="#667278" text-anchor="start" font-weight="400">研究により約36億〜25億年前</text><text x="312" y="236" font-size="13" fill="#253239" text-anchor="middle" font-weight="700">2　酸素発生型光合成を手に入れた時期</text><text x="312" y="254" font-size="12.5" fill="#667278" text-anchor="middle" font-weight="400">1と3のあいだ</text><text x="464" y="290" font-size="13" fill="#253239" text-anchor="middle" font-weight="700">3　今いるシアノバクテリアの共通の祖先</text><text x="464" y="308" font-size="12.5" fill="#667278" text-anchor="middle" font-weight="400">研究により約36億〜10億年前</text><line x1="40" y1="20" x2="300" y2="20" stroke="#667278" stroke-width="1.5" marker-end="url(#arrow)" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667278" /></marker></defs><text x="310" y="25" font-size="12" fill="#667278" text-anchor="start" font-weight="400">時間（左が古く、右が新しい）</text>
</svg>
