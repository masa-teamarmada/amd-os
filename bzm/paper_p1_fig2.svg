<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Helvetica, Arial, sans-serif">
  <!-- Fig. 2: Corollary 3.1(i) — Simpson reversal under single-score practice (SCHEMATIC, no data) -->
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="90" y1="430" x2="850" y2="430" stroke="#333" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="90" y1="430" x2="90" y2="60" stroke="#333" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="470" y="470" font-size="15" fill="#222" text-anchor="middle">ecosystem construction rate ECR_j</text>
  <text x="40" y="245" font-size="15" fill="#222" text-anchor="middle" transform="rotate(-90 40 245)">venture outcome at 24 months</text>

  <!-- Quartile clusters: within each SPS quartile, outcome rises with ECR (positive slope).
       Across quartiles, high-ECR institutions host lower-SPS projects on average,
       so the pooled slope is negative. SCHEMATIC positions. -->

  <!-- Q4 (top-left cluster) -->
  <g fill="#222">
    <circle cx="150" cy="150" r="5"/><circle cx="185" cy="138" r="5"/><circle cx="220" cy="128" r="5"/>
    <circle cx="200" cy="155" r="5"/><circle cx="245" cy="118" r="5"/>
  </g>
  <line x1="130" y1="163" x2="265" y2="108" stroke="#222" stroke-width="2.2"/>
  <text x="150" y="100" font-size="13" fill="#222">SPS quartile Q4 (strongest ventures)</text>
  <text x="150" y="118" font-size="12" fill="#444">γ_k^{Q4} &gt; 0</text>

  <!-- Q3 -->
  <g fill="#555">
    <circle cx="330" cy="235" r="5"/><circle cx="365" cy="222" r="5"/><circle cx="400" cy="212" r="5"/>
    <circle cx="380" cy="240" r="5"/><circle cx="425" cy="202" r="5"/>
  </g>
  <line x1="310" y1="248" x2="445" y2="192" stroke="#555" stroke-width="2.2"/>
  <text x="330" y="185" font-size="12" fill="#555">Q3, γ_k^{Q3} &gt; 0</text>

  <!-- Q2 -->
  <g fill="#777">
    <circle cx="510" cy="315" r="5"/><circle cx="545" cy="302" r="5"/><circle cx="580" cy="292" r="5"/>
    <circle cx="560" cy="320" r="5"/><circle cx="605" cy="282" r="5"/>
  </g>
  <line x1="490" y1="328" x2="625" y2="272" stroke="#777" stroke-width="2.2"/>
  <text x="510" y="265" font-size="12" fill="#777">Q2, γ_k^{Q2} &gt; 0</text>

  <!-- Q1 (bottom-right cluster) -->
  <g fill="#999">
    <circle cx="690" cy="392" r="5"/><circle cx="725" cy="380" r="5"/><circle cx="760" cy="370" r="5"/>
    <circle cx="740" cy="398" r="5"/><circle cx="785" cy="360" r="5"/>
  </g>
  <line x1="670" y1="405" x2="805" y2="350" stroke="#999" stroke-width="2.2"/>
  <text x="690" y="343" font-size="12" fill="#999">Q1 (weakest ventures), γ_k^{Q1} &gt; 0</text>

  <!-- Pooled regression line: negative slope across clusters -->
  <line x1="120" y1="140" x2="820" y2="400" stroke="#111" stroke-width="2.6" stroke-dasharray="10 6"/>
  <text x="640" y="150" font-size="13.5" font-weight="bold" fill="#111">pooled: γ_k^{pool} &lt; 0</text>
  <text x="640" y="168" font-size="12" fill="#444">sign(γ_k^{pool}) ≠ sign(γ_k^{q})  —  Corollary 3.1(i)</text>

  <!-- Reading note -->
  <rect x="120" y="480" width="700" height="1" fill="none"/>
  <text x="470" y="497" font-size="12" fill="#666" text-anchor="middle" font-style="italic">Schematic illustration (no data): within every venture-quality quartile the institution coefficient is positive; pooling across quartiles reverses its sign,</text>
  <text x="470" y="513" font-size="12" fill="#666" text-anchor="middle" font-style="italic">because stronger nurseries systematically host earlier-stage (lower-SPS) projects. Ranking by any single score forces exactly this pooling.</text>
</svg>
