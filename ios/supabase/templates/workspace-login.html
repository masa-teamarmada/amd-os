<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMD OSにログイン</title>
</head>
<body style="margin:0;padding:0;background-color:#faf8f2;color:#25251f;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
    <tr><td align="center" style="padding:24px 16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:480px;">
        <tr><td style="padding:0 0 16px;font-size:14px;line-height:24px;font-weight:700;color:#4338ca;">チームアルマダ OS</td></tr>
        <tr><td style="padding:24px;background-color:#ffffff;border:1px solid #e5dfd2;border-radius:12px;">
          <h1 style="margin:0 0 16px;font-size:24px;line-height:36px;font-weight:700;">AMD OSにログイン</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:28px;">下のボタンから、閲覧を許可されたワークスペース・資料へ進めます。</p>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;">
            <tr><td align="center" bgcolor="#4338ca" style="background-color:#4338ca;border-radius:8px;">
              <a href="{{ .ConfirmationURL }}" style="display:block;padding:16px 12px;font-size:18px;line-height:24px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;">ログインする</a>
            </td></tr>
          </table>
          <p style="margin:24px 0 8px;font-size:14px;line-height:24px;">ログイン画面にこのコードを入力しても入れます。別のブラウザで開いた場合は、コードを使ってください。</p>
          <p style="margin:0;padding:12px;border:1px solid #e5dfd2;border-radius:8px;font-family:monospace;font-size:28px;line-height:36px;font-weight:700;text-align:center;letter-spacing:4px;">{{ .Token }}</p>
          <p style="margin:24px 0 0;font-size:14px;line-height:24px;color:#66645c;">メールアドレスを入力したブラウザで開いてください。メールが複数届いたときは、最新のメールを使ってください。ボタンが失敗した場合は、新しいメールを受け取り、ボタンを押さずにコードを入力してください。</p>
        </td></tr>
        <tr><td style="padding:16px 0 0;font-size:12px;line-height:20px;color:#77746b;">ログインを申し込んでいない場合は、このメールを閉じてください。</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
