<!-- 247_AdminCode.html -->
<div id="sec_code" style="display:none;">
  <div class="card" id="codeCard">
    <div class="row">
      <div>
        <div style="font-weight:900;">Code Search（関数 → ファイル）</div>
        <div class="muted">関数名から「定義」と「参照」を横断検索する</div>
      </div>

      <div class="rowLeft">
        <div>
          <div class="ctlLabel">search query</div>
          <input id="codeQuery" class="ctl mono" style="width:260px"
                placeholder="例: DB_Projects / freeePartnerId / UrlFetchApp" />
        </div>

        <div class="tog" style="margin-top:18px;">
          <input type="checkbox" id="codeIncludeRefs" />
          <span>参照も探す</span>
        </div>

        <button class="btn" onclick="runCodeSearch()">検索</button>
      </div>
    </div>

    <div id="codeHint" class="hint">-</div>
    <div id="codeErr" class="err" style="display:none;"></div>

    <div class="tableWrap" style="margin-top:12px;">
      <table class="stickyTable" style="min-width: 1100px;">
        <thead>
          <tr>
            <th style="width:140px;">kind</th>
            <th style="width:320px;">file</th>
            <th style="width:110px;">line</th>
            <th>snippet</th>
            <th style="width:140px;">copy</th>
          </tr>
        </thead>
        <tbody id="codeTbody">
          <tr><td colspan="5" class="muted">検索してね</td></tr>
        </tbody>
      </table>
    </div>

    <div class="muted" style="margin-top:10px;">
      ※Apps Script API（projects.content）が有効じゃないと動かない
    </div>
  </div>
</div><!-- /#sec_code -->
