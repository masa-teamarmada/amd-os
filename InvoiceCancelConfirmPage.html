<!-- InvoiceCancelConfirmPage -->
<!doctype html>
<html>
<head>
  <base target="_top" />
  <meta charset="utf-8" />
  <style>
    body{ font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; margin:24px; max-width:980px; }
    .card{ border:1px solid #e5e7eb; border-radius:16px; padding:16px; background:#fff; }
    .h{ font-weight:900; font-size:18px; }
    .muted{ color:#6b7280; font-size:12px; margin-top:6px; }
    button{ padding:12px 16px; border-radius:14px; border:1px solid #111827; background:#111827; color:#fff; font-weight:900; cursor:pointer; }
    .ok{ margin-top:10px; color:#065f46; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:12px; padding:10px; display:none; }
    .err{ margin-top:10px; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius:12px; padding:10px; display:none; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <div class="h">請求書取消（完了確認）</div>
    <div class="muted">きよ・まさ専用。freeeで削除したら押してね。</div>

    <div class="muted" style="margin-top:10px;">PJ: <?= projectId ?> / ym: <?= ym ?> / login: <?= userEmail ?></div>

    <div style="margin-top:14px;">
      <button id="btn" type="button" onclick="run()">freee削除完了 → OS側も未発行に戻す</button>
    </div>

    <div id="ok" class="ok"></div>
    <div id="err" class="err"></div>
  </div>

  <script>
    const PROJECT_ID = "<?= projectId ?>";
    const YM = "<?= ym ?>";
    const TOKEN = "<?= token ?>";

    function showOk(msg){ const el=document.getElementById("ok"); el.style.display="block"; el.textContent=msg; }
    function showErr(msg){ const el=document.getElementById("err"); el.style.display="block"; el.textContent=msg; }

    function run(){
      document.getElementById("btn").disabled = true;
      google.script.run
        .withFailureHandler(err => {
          document.getElementById("btn").disabled = false;
          showErr(err?.message || String(err));
        })
        .withSuccessHandler(res => {
          document.getElementById("btn").disabled = false;
          if (!res || !res.ok){ showErr(res?.message || "failed"); return; }
          showOk("OK！OS側も未発行に戻したよ。画面閉じてOK");
        })
        .api_confirmInvoiceCancelByToken({ projectId: PROJECT_ID, ym: YM, token: TOKEN });
    }
  </script>
</body>
</html>
