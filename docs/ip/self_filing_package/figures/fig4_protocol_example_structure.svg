<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="880" viewBox="0 0 1250 880" role="img" aria-labelledby="title desc">
  <title id="title">fig4_protocol_example_structure.svg</title>
