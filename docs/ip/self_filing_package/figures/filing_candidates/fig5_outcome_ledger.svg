<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="900" viewBox="0 0 1250 900" role="img" aria-labelledby="title desc">
  <title id="title">fig5_outcome_ledger.svg</title>
  <desc id="desc">Black and white internal patent figure candidate with reference numerals.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1250" height="900" fill="#fff"/>

  <style>
    .title { font: 700 28px Arial, sans-serif; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .smallbox { fill: #fff; stroke: #000; stroke-width: 1.8; }
    .line { stroke: #000; stroke-width: 2; fill: none; }
    .dash { stroke: #000; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    .text { font: 18px Arial, sans-serif; fill: #000; }
    .small { font: 15px Arial, sans-serif; fill: #000; }
    .num { font: 700 18px Arial, sans-serif; fill: #000; }
    .label { font: 14px Arial, sans-serif; fill: #000; }
  </style>

<rect x="90" y="100" width="330" height="84" rx="0" class="box"/>
<text x="255" y="126" class="text" text-anchor="middle"><tspan x="255" dy="0">270 Protocol</tspan><tspan x="255" dy="22">or 280 Example</tspan></text>
<rect x="90" y="240" width="330" height="84" rx="0" class="box"/>
