<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc">
  <title id="title">fig3_human_approval_master.svg</title>
  <desc id="desc">Black and white internal patent figure candidate with reference numerals.</desc>
  <defs>
