name: CI

# main への push と PR で、型チェックとビルドが通るかを見る。
# 2 人が同じアカウントで main に直接 push する運用なので、
# 「壊れたまま気づかない」を防ぐのがこの CI の役割。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: ビルド
        run: npm run build
