<!-- 222_TimelinePage.html
役割：
- 月次ルーティンを「縦：日付（カレンダー）」×「横：稼働月（bizYmレーン）」で俯瞰するTimeline UI
- “月ズレ”を正確に反映（例：2/4立替締切は1月稼働分）
- 締切系は「締切5日前〜締切」を帯で埋める（締切まで寝かせないUX）
- クリックでモーダル（将来：既存Billingの該当セクションを差し込む）
-->
<!doctype html>
<html>
<head>
  <base target="_top" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AMD OS - Timeline</title>

  <style>
    :root{
      --bg: #f9fafb;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --shadow: 0 6px 18px rgba(17,24,39,.08);
      --radius: 14px;
      --dateColW: 120px;
      --laneW: 240px;
      --pjLaneW: var(--laneW);


      /* 1日行の高さ */
      --rowH: 44px;
      /* 行間（rowのmargin-bottomと揃える） */
      --rowGap: 6px;

      --gap: 12px;

      /* sticky用（Timeline内スクロール前提） */
      --toolBarH: 58px;
      --laneHdrH: 72px;
      --stickyTotal: calc(var(--toolBarH) + var(--laneHdrH));
    }

    *{ box-sizing:border-box; }
    html, body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);

      /* ★ブラウザ縦スクロールを強制復活 */
      overflow-y: auto !important;
      height: auto !important;
    }

    .pageWrap{
      max-width: 1180px;
      margin: 22px auto 64px;
      padding: 0 14px;
    }

    .topBar{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 10px;

      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--bg);
      padding: 14px 0 10px;
      margin-bottom: 0;
    }

    .titleBox{
      display:flex;
      flex-direction:column;
      gap: 6px;
    }
    .title{
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .sub{
      font-size: 13px;
      color: var(--muted);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);

      /* ★ブラウザスクロールを使う（縦幅が狭い時に詰まない） */
      overflow: visible;
      max-height: none;
    }
    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 12px 12px;

      /* ★card内で固定 */
      position: sticky;
      top: 0;
      z-index: 60;

      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .toolbarLeft, .toolbarRight{
      display:flex;
      align-items:center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn{
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover{ filter: brightness(.98); }

    .select{
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      font-weight: 700;
      font-size: 13px;
    }

    /* ====== Timeline grid ====== */
    .timelineWrap{
      /* ★cardがスクロール担当になったので、ここはラッパとしてだけ残す */
      overflow: visible;
      padding: 0;
      max-height: none;
      border-top: 0;
    }
    .grid{
      min-width: calc(var(--dateColW) + var(--laneW) * 3 + 60px);
    }

    .gridHeader{
      /* ★card内でtoolbarの下に固定 */
      position: sticky;
      top: var(--toolBarH);
      z-index: 50;

      background: var(--bg);
      padding: 10px 0 10px;
    }

    .headerRow{
      display: grid;
      grid-template-columns: var(--dateColW) var(--pjLaneW) repeat(var(--laneCount), var(--laneW));
      gap: var(--gap);
      align-items: center;
    }

    .hdrDate{
      padding-left: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .laneHdr{
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 4px 14px rgba(17,24,39,.06);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 8px;
    }
    .laneHdrTitle{
      display:flex;
      flex-direction:column;
      gap: 2px;
      min-width: 0;
    }
    .laneYm{
      font-weight: 900;
      letter-spacing: .3px;
    }
    .laneHint{
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .body{
      padding: 0 0 12px;
    }

    .row{
      display: grid;
      grid-template-columns: var(--dateColW) var(--pjLaneW) repeat(var(--laneCount), var(--laneW));
      gap: var(--gap);
      align-items: stretch;
      height: var(--rowH);
      margin-bottom: var(--rowGap);
    }

    .dateCell{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      padding-left: 10px;
      font-size: 13px;
      color: var(--muted);
      border-left: 3px solid transparent;
    }
    .dateCell.weekend{ color:#9ca3af; }
    .dateCell.today{
      color: var(--text);
      font-weight: 900;
      border-left-color: #111827;
    }
    .dateCell .dateSub{
      margin-left: 8px;
      font-size: 11px;
      color: #9ca3af;
      font-weight: 700;
    }

    .laneCell{
      border: 1px dashed rgba(229,231,235,.9);
      border-radius: 12px;
      background: rgba(255,255,255,.55);
      position: relative;
      overflow: visible; /* ★帯を下方向へ伸ばすため */
    }

    /* ====== 帯タスク ====== */
    .task{
      position:absolute;
      left: 8px;
      right: 8px;
      top: 6px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;

      /* ★左右並びをやめて縦積みにする（タイトル→ピルの順で下へ） */
      display:flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;

      gap: 6px;
      padding: 8px 10px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(17,24,39,.08);
      z-index: 5;

      /* 既定は1行分 */
      height: calc(var(--rowH) - 12px);
    }
    .task:hover{ transform: translateY(-1px); }

    /* 帯の長さ（span日数） */
    .task.range{
      height: calc(
        (var(--rowH) * var(--span)) +
        (var(--rowGap) * (var(--span) - 1)) -
        12px
      );
      align-items: flex-start;
    }

    .taskTitle{
      font-weight: 900;
      font-size: 13px;
      line-height: 1.25;
      margin-top: 2px;

      /* ★全文字表示：クランプ（2行省略）を撤去 */
      display: block;
      overflow: visible;

      /* ★日本語が変に1文字改行になりにくい設定 */
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .taskMetaRow{
      display:flex;
      gap:6px;
      align-items:center;
      margin-top: 6px;
      flex-wrap: wrap;
    }    

    .badge{
      display:inline-flex;
      align-items:center;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background:#fff;
      font-size: 11px;
      font-weight: 900;
      color: var(--muted);
      user-select: none;
    }

    .badge.ok{ color:#065f46; border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.08); }
    .badge.warn{ color:#92400e; border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.10); }
    .badge.todo{ color:#374151; border-color: rgba(107,114,128,.35); background: rgba(107,114,128,.08); }

    /* 種別っぽい見た目差（透過なし：帯は「壁」） */
    .task{
      background: #fff; /* 念のため強制 */
      border-color: var(--line);
    }

    .task.meeting{
      border-color: rgba(59,130,246,.55);
      box-shadow: 0 8px 18px rgba(59,130,246,.12);
    }
    .task.decision{
      border-color: rgba(168,85,247,.50);
      box-shadow: 0 8px 18px rgba(168,85,247,.10);
    }
    .task.ops{
      border-color: rgba(107,114,128,.45);
      box-shadow: 0 8px 18px rgba(107,114,128,.10);
    }
    /* ★月次報告会枠（未確定）：破線で“枠”感 */
    .task.tentative{
      border-style: dashed !important;
    }


    /* ====== Modal ====== */
    .modalBack{
      position: fixed;
      inset: 0;
      background: rgba(17,24,39,.52);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 18px;
      padding-top: 6vh;  /* ★上に余白を作って見やすく */
      z-index: 1000;
    }

    .modal{
      width: min(900px, 100%);
      max-height: min(78vh, 900px);
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      border: 1px solid rgba(229,231,235,.9);
      box-shadow: 0 20px 80px rgba(0,0,0,.25);
    }
    .modalHead{
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .modalTitle{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width: 0;
    }
    .modalTitle .h1{
      font-weight: 900;
      font-size: 16px;
      line-height: 1.25;
    }
    .modalTitle .h2{
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .modalBody{
      padding: 14px 16px 18px;
    }
    .xbtn{
      border: 1px solid var(--line);
      background:#fff;
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 900;
    }

    .section{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      margin-bottom: 10px;
    }
    .sectionTitle{
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .sectionText{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }

    @media (max-width: 980px){
      :root{
        --dateColW: 120px;
        --laneW: 260px;
      }
    }
    /* ★Shell(iframe embed)の時は、Timeline側のstickyを無効化して二重sticky事故を防ぐ */
    body.embedMode .topBar{ position: static !important; top: auto !important; z-index: auto !important; }
    body.embedMode .toolbar{ position: static !important; top: auto !important; z-index: auto !important; }
    body.embedMode .gridHeader{ position: static !important; top: auto !important; z-index: auto !important; }

    /* Shell側でiframeをviewportフィットさせる前提：Timeline側のmax-height制限を外す */
    body.embedMode .timelineWrap{ max-height: none !important; }
  </style>
</head>

<body class="<?= embed ? 'embedMode' : '' ?>">
  <? if (!embed) { ?>
    <?!= navHtml ?>
  <? } ?>
  <div class="pageWrap">
    <div class="card">
      <div class="toolbar">
        <div class="toolbarLeft">
          <button class="btn" onclick="jumpToday()">今日へ</button>
          <button class="btn" onclick="shiftMonths(-1)">← 1ヶ月</button>
          <button class="btn" onclick="shiftMonths(1)">1ヶ月 →</button>
          <span class="pill" id="ctxPill">ctx</span>
          <span class="pill" id="rangePill">range</span>
        </div>
        <div class="toolbarRight"></div>

      <div class="timelineWrap">

  <!-- Modal -->

            -
          </div>

      </div>
    </div>
  </div>

  <!-- ★共通モーダル（BillingPage互換）：Chrome標準モーダル禁止のため -->
  <div id="overlay" class="overlay">

      <div class="mBody" id="mBody"></div>
        <div id="modalFooter" style="margin-top:14px; display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;">

      </div>
    </div>
  </div>

  <style>
    /* ===== BillingPage互換：共通モーダル（overlay） ===== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding: 18px; z-index: 2000; }
    .modal2 { width: min(520px, 100%); background: #fff; border-radius: 16px; border: 1px solid #e5e7eb; padding: 16px; box-shadow: 0 20px 70px rgba(0,0,0,.25); }
    .mTop { display:flex; justify-content:space-between; align-items:center; gap: 10px; }
    .mTitle { margin:0; font-weight: 900; font-size: 16px; }
    .x { border:1px solid #e5e7eb; background:#fff; border-radius: 10px; padding: 6px 10px; cursor:pointer; font-weight: 800; }
    .mBody { margin-top: 10px; font-size: 14px; }
    .btn2{ border:1px solid #d1d5db; background:#f9fafb; color:#111827; border-radius:10px; padding:10px 14px; font-weight:900; cursor:pointer; }
    .btn3{ border:1px solid #d1d5db; background:#f9fafb; color:#111827; border-radius:10px; padding:10px 14px; font-weight:900; cursor:pointer; }
    .btn { border: 1px solid #111827; background:#111827; color:#fff; border-radius:10px; padding:10px 14px; font-weight:900; cursor:pointer; }
    body.embedMode { --topBarH: 0px; }          /* toolbarのsticky計算を壊さない */
    body.embedMode .topBar{ display: none; }

  </style>

  <script>
  // ===== Billing互換：共通モーダルAPI（Timeline専用。modalBackとは別） =====
  let __TL_CONFIRM_OK__ = null;

  function tl_setFooterHtml_(html){
    const footer = document.getElementById("modalFooter");
    if (!footer) return;

    // ★class row に巻き込まれる事故を完全に避ける
    footer.className = "";
    footer.style.display = "flex";
    footer.style.justifyContent = "flex-end";
    footer.style.gap = "10px";
    footer.style.flexWrap = "wrap";

    footer.innerHTML = html || "";
  }

  function tl_openModal(title, body){
    const t = document.getElementById("mTitle");
    const b = document.getElementById("mBody");
    if (t) t.textContent = title || "通知";
    if (b) b.textContent = body || "";

    // OKだけ（必ず見える）
    tl_setFooterHtml_(`
      <button type="button" onclick="tl_closeOverlay()"
        style="border:1px solid #d1d5db; background:#f9fafb; color:#111827; border-radius:10px; padding:10px 14px; font-weight:900; cursor:pointer;">
        OK
      </button>
    `);

    document.getElementById("overlay").style.display = "flex";
  }

  function tl_closeOverlay(){
    document.getElementById("overlay").style.display = "none";
    __TL_CONFIRM_OK__ = null;
  }

  function tl_openConfirm(title, body, onOk){
    __TL_CONFIRM_OK__ = (typeof onOk === "function") ? onOk : null;

    const t = document.getElementById("mTitle");
    const b = document.getElementById("mBody");
    if (t) t.textContent = title || "確認";

    // 本文
    if (b){
      b.innerHTML = `<div style="white-space:pre-wrap;">${escapeHtml(body || "")}</div>`;
    }

    // ★ボタンはインラインstyleで強制表示（CSS戦争に巻き込まれない）
    tl_setFooterHtml_(`
      <button type="button" onclick="tl_closeConfirm()"
        style="border:1px solid #d1d5db; background:#f9fafb; color:#111827; border-radius:10px; padding:10px 14px; font-weight:900; cursor:pointer;">
        キャンセル
      </button>
      <button type="button" onclick="tl_confirmOk()"
        style="border:1px solid #111827; background:#111827; color:#fff; border-radius:10px; padding:10px 14px; font-weight:900; cursor:pointer;">
        OK
      </button>
    `);

    document.getElementById("overlay").style.display = "flex";
  }

  function tl_closeConfirm(){
    __TL_CONFIRM_OK__ = null;
    tl_openModal("通知", "キャンセルした");
  }

  function tl_confirmOk(){
    const fn = __TL_CONFIRM_OK__;
    tl_closeOverlay();
    try{ if (fn) fn(); }catch(e){}
  }

  </script>

<script>
  const STATE = {
    projectId: "",
    ym: "",
    baseYm: "",
    laneCount: 3,
    lanes: [],
    dateStart: null,
    dateEnd: null,

    // start地点だけ持つ（帯はstartセルから縦に伸ばす）
    startTaskMap: {}, // key: `${bizYm}|${startIso}|${taskKey}` -> taskObj

    // ★新規：PJタスク（稼働月に依存しない）
    pjStartTaskMap: {}, // key: `${startIso}|${taskKey}` -> taskObj

    // ★Home→Timelineジャンプ用
    jumpTaskKey: "",   // 例: "send" / "meetingSched" / "paid" ...
  };

    // ===== Observe History Modal =====
  function openObserveHistoryModal_(){
    const pid = String(STATE.projectId || "").trim();
    const ym = String(STATE.baseYm || STATE.ym || "").trim();

    if (!pid || !/^\d{6}$/.test(ym)){
      tl_openModal("観測ログ", "projectId / ym が無い");
      return;
    }

    // 既存の modalBack を流用する（軽い）
    document.getElementById("modalTitle").textContent = "観測ログ（いつ・何が・どう変わったか）";
    document.getElementById("modalSub").textContent = `projectId=${pid} / ym=${ym}`;

    const body = document.getElementById("modalBody");
    body.innerHTML = `
      <div class="section">
        <div class="sectionTitle">読み込み中…</div>
        <div class="sectionText">observe log を取得してる</div>
      </div>
    `;

    document.getElementById("modalBack").style.display = "flex";

    google.script.run
      .withFailureHandler(err => {
        body.innerHTML = `
          <div class="section">
            <div class="sectionTitle">失敗</div>
            <div class="sectionText">${escapeHtml(err?.message || String(err))}</div>
          </div>
        `;
      })
      .withSuccessHandler(res => {
        if (!res || !res.ok){
          body.innerHTML = `
            <div class="section">
              <div class="sectionTitle">失敗っぽい</div>
              <div class="sectionText">${escapeHtml(res?.message || "unknown")}</div>
            </div>
          `;
          return;
        }

        const items = Array.isArray(res.items) ? res.items : [];
        if (!items.length){
          body.innerHTML = `
            <div class="section">
              <div class="sectionTitle">まだログが無い</div>
              <div class="sectionText">抽出/修正/確定/つくよみ追記のどれかが起きると、ここに積まれる</div>
            </div>
          `;
          return;
        }

        const rowsHtml = items.map(it => {
          const rev = String(it.rev || "");
          const at = String(it.createdAtJst || "");
          const by = String(it.createdBy || "");
          const ev = String(it.eventType || "");
          const meaning = String(it.meaningDiff || "");
          const ch = String(it.changedFields || "").trim();

          const chips = [];
          if (ev) chips.push(`<span class="badge todo">${escapeHtml(ev)}</span>`);
          if (ch) chips.push(`<span class="badge warn">${escapeHtml(ch)}</span>`);
          return `
            <div class="section">
              <div class="sectionTitle">rev ${escapeHtml(rev)} <span class="muted" style="margin-left:8px;">${escapeHtml(at)} ${escapeHtml(by)}</span></div>
              <div class="sectionText" style="white-space:pre-wrap; font-weight:900; color:#374151;">
                ${escapeHtml(meaning)}
              </div>
              <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
                ${chips.join("")}
              </div>
            </div>
          `;
        }).join("");

        body.innerHTML = rowsHtml;
      })
      .api_listTimelineObserveLog({ projectId: pid, ymKey: ym, limit: 120 });
  }

  function bindObserveHistoryButton_(){
    try{
      const btn = document.getElementById("btnObsHistory");
      if (!btn) return;
      if (btn.dataset.bound === "1") return;

  function addMonths(date, delta){
    const d = new Date(date.getTime());
    d.setDate(1);
    d.setMonth(d.getMonth() + delta);
    return d;
  }

  function addDays(date, delta){
    const d = new Date(date.getTime());
    d.setDate(d.getDate() + delta);

  }

  function lastDayOfMonth(year, month1to12){

  // ====== 月ズレ込みタスク定義（稼働月bizYmを正にする） ======
  // まさの指定に合わせる：
  // - 立替締切(4日) / 請求書送付(9日) / 着金確認(末日) は「翌月側」で発生（例：2/4は1月稼働分）
  // - 予算・配賦 仮ぎめ(15日) は「前月側」で発生（例：2/15は3月稼働分）
  // - 報告会スケジューリング(10日) は稼働月内
  // - 報告会開催（確定）(20-30日) は稼働月内レンジ
  //
  // さらに締切系は「締切5日前〜締切」を帯にする
  function buildTasksForBizYm(bizYm){
    const base = ymToDate(bizYm);     // 稼働月 1日
    const prev = addMonths(base, -1);
    const next = addMonths(base,  1);

    const y = base.getFullYear();
    const m = base.getMonth()+1;

    const nextY = next.getFullYear();
    const nextM = next.getMonth()+1;
    const nextEnd = lastDayOfMonth(nextY, nextM);

    // 日付（実カレンダー）
    const dtBudgetDraft = new Date(prev.getFullYear(), prev.getMonth(), 15); // 前月15
    const dtSched       = new Date(y, m-1, 10);                              // 当月10
    const dtMeetStart   = new Date(y, m-1, 20);                              // 当月20
    const dtMeetEnd     = new Date(y, m-1, 30);                              // 当月30（固定で30まで表示）
    const dtReimb       = new Date(nextY, nextM-1, 4);                       // 翌月4
    const dtSend        = new Date(nextY, nextM-1, 9);                       // 翌月9
    const dtPaid        = new Date(nextY, nextM-1, nextEnd);                 // 翌月末日

    // 締切帯（5日前〜締切）
    function deadlineBand(deadlineDate){
      const start = addDays(deadlineDate, -5);
      const end = deadlineDate;
      const span = Math.max(1, Math.round((end.getTime() - start.getTime()) / (24*3600*1000)) + 1);
      return { start, end, span };
    }

    // meetingはレンジ（20〜30）
    const meetSpan = Math.max(1, Math.round((dtMeetEnd.getTime() - dtMeetStart.getTime()) / (24*3600*1000)) + 1);

    const t = [];

    // 予算・配賦 仮ぎめ（締切帯にする：10〜15くらいの感覚）
    // ここも「5日前〜当日」ルールで統一
    {
      const band = deadlineBand(dtBudgetDraft);
      t.push({
        bizYm,
        taskKey: "budgetDraft",
        title: "予算配賦案確定",
        kind: "decision",
        start: band.start,
        end: band.end,
        spanDays: band.span,
        meaning: "次月稼働に入るための前提を確定する（予算と配賦“案”）。実支払は実績で変動する。"
      });
    }

    // 月次報告会 スケジューリング（締切帯：5〜10）
    {
      const band = deadlineBand(dtSched);
      t.push({
        bizYm,
        taskKey: "meetingSched",
        title: "月次報告会 スケジューリング",
        kind: "meeting",
        start: band.start,
        end: band.end,
        spanDays: band.span,
        meaning: "報告会の枠取り。ここが遅れると開催がズレて請求がズレる。"
      });
    }

    // 月次報告会 枠（FIX前は「このへんで開催する予定」の意味）
    {
      t.push({
        bizYm,
        taskKey: "meetingHold",
        title: "月次報告会枠",
        kind: "meeting",
        start: dtMeetStart,
        end: dtMeetEnd,
        spanDays: meetSpan,
        meaning: "この期間のどこかで月次報告会を開催する前提の枠。FIXしたら当日1日表示に変わる。",
        ui: { meetingMode: "frame" } // ★破線
      });
    }

    // 立替確認 締切（翌月4。締切帯）
    {
      const band = deadlineBand(dtReimb);
      t.push({
        bizYm,
        taskKey: "reimb",
        title: "立替確認 締切",
        kind: "ops",
        start: band.start,
        end: band.end,
        spanDays: band.span,
        meaning: "立替の回収・確認の締切。ここを落とすと請求書の金額が揺れる。"
      });
    }

    // 請求書送付 締切（翌月9。締切帯）
    {
      const band = deadlineBand(dtSend);
      t.push({
        bizYm,
        taskKey: "send",
        title: "請求書送付 締切",
        kind: "ops",
        start: band.start,
        end: band.end,
        spanDays: band.span,
        meaning: "請求書を送る帯。ここで寝かせると入金遅延リスクが増える。"
      });
    }

    // 着金確認（翌月末日。締切帯）
    {
      const band = deadlineBand(dtPaid);
      t.push({
        bizYm,
        taskKey: "paid",
        title: "着金確認",
        kind: "ops",
        start: band.start,
        end: band.end,
        spanDays: band.span,
        meaning: "入金の事実確認。ここが終わると稼働月をクローズできる。"
      });
    }

    return t;
  }

  // ====== ダミー状態 ======
  function dummyStatusForTask(task){
    // ざっくり：締切系はwarnを混ぜる
    if (task.taskKey === "send") return { text:"期限", level:"warn" };
    if (task.taskKey === "paid") return { text:"未", level:"todo" };
    if (task.taskKey === "meetingHold") return { text:"", level:"ok" };
    return { text:"未", level:"todo" };
  }

  function isHiddenDay_(d){
    // 土日
    if (isWeekend(d)) return true;
    // 固定祝日（既存の関数を使う）
    if (typeof isFixedHolidayJp_ === "function" && isFixedHolidayJp_(d)) return true;
    return false;
  }

  function prevVisibleDay_(d){
    const x = new Date(d.getTime());
    // 無限ループ回避（最長30日探す）
    for (let i=0; i<30; i++){
      if (!isHiddenDay_(x)) return x;
      x.setDate(x.getDate() - 1);
    }
    return x;
  }

  function countVisibleDays_(startDate, endDate){
    const s = new Date(startDate.getTime());
    const e = new Date(endDate.getTime());
    let n = 0;
    for (let d = new Date(s.getTime()); d <= e; d.setDate(d.getDate()+1)){
      if (isHiddenDay_(d)) continue;
      n++;
    }
    return Math.max(1, n);
  }

  function isOverlapping_(a, b){
    // 1日粒度なので inclusive に重なり判定
    return (a.start.getTime() <= b.end.getTime()) && (b.start.getTime() <= a.end.getTime());
  }

  function calcMaxOverlapWithinTask_(task, tasksAll){
    // task と重なるタスクだけ集める
    const rel = tasksAll.filter(x => isOverlapping_(task, x));
    if (rel.length <= 1) return 1;

    // sweep（inclusiveを守るため endは +1ms で扱う）
    const events = [];
    rel.forEach(x=>{
      events.push({ t: x.start.getTime(), d: +1 });
      events.push({ t: x.end.getTime() + 1, d: -1 });
    });

    events.sort((a,b)=>{
      if (a.t !== b.t) return a.t - b.t;
      return b.d - a.d; // +1 を先に
    });

    let cur = 0;
    let mx = 0;
    for (let i=0; i<events.length; i++){
      cur += events[i].d;
      if (cur > mx) mx = cur;
    }
    return Math.max(1, mx);
  }

  function assignColumnsForLane_(tasks){
    const arr = (Array.isArray(tasks) ? tasks.slice() : [])
      .sort((a,b)=> a.start.getTime() - b.start.getTime());

    // 1) まず col を割り当て（greedy）
    const active = [];   // [{end, col}]
    const usedCols = []; // 使用中col
    function release_(tStart){
      for (let i=active.length-1; i>=0; i--){
        if (active[i].end.getTime() < tStart.getTime()){
          usedCols.splice(usedCols.indexOf(active[i].col), 1);
          active.splice(i,1);
        }
      }
    }
    function takeCol_(){
      // 0.. を埋める
      let c = 0;
      while (usedCols.includes(c)) c++;
      return c;
    }

    arr.forEach(t=>{
      release_(t.start);
      const col = takeCol_();
      t.col = col;
      active.push({ end: t.end, col });
      usedCols.push(col);
    });

    // 2) つぎに cols（そのタスクが被ってる範囲での最大同時数）をタスクごとに計算
    arr.forEach(t=>{
      t.cols = calcMaxOverlapWithinTask_(t, arr);
      // 念のため col が cols を超えたら0へ（描画崩れ防止）
      if (t.col >= t.cols) t.col = 0;
    });

    return arr;
  }

  function buildDummy(){
    const base = STATE.baseYm || STATE.ym || "202602";
    const baseDate = ymToDate(base);

    // lanes: 稼働月の連番
    const lanes = [];
    for (let i=0; i<STATE.laneCount; i++){
      const d = addMonths(baseDate, i);
      lanes.push(dateToYm(d));
    }
    STATE.lanes = lanes;

    // ===== 稼働月タスク（既存） =====
    const startMap = {};
    let globalMin = null;
    let globalMax = null;

    // レーンごとに集めて col/cols を計算
    const byLane = {};
    lanes.forEach(ymLane => { byLane[ymLane] = []; });

    lanes.forEach(ymLane=>{
      const tasks = buildTasksForBizYm(ymLane);
      tasks.forEach(task=>{
        const s = dummyStatusForTask(task);
        const t = { ...task, status:s };
        byLane[ymLane].push(t);

        globalMin = globalMin ? minDate(globalMin, t.start) : new Date(t.start.getTime());
        globalMax = globalMax ? maxDate(globalMax, t.end)   : new Date(t.end.getTime());
      });
    });

    Object.keys(byLane).forEach(ymLane=>{
      const laid = assignColumnsForLane_(byLane[ymLane] || []);
      laid.forEach(t=>{
        const startIso = toIsoDate(t.start);
        if (t.col === undefined || t.col === null) t.col = 0;
        if (t.cols === undefined || t.cols === null) t.cols = 1;
        startMap[`${t.bizYm}|${startIso}|${t.taskKey}`] = t;
      });
    });

    // ===== PJタスク（新規：稼働月と別レーン） =====
    // 例：
    // - 2/20 全体定例MTG → 2/17-2/19「定例MTG用資料準備」
    // - 3/05 取締役会 → 3/01-3/04「取締役会資料作成」
    const pjArr = [];
    const pjMap = {};

    function addPjTask(taskKey, title, kind, startDate, endDate, meaning){
      const span = Math.max(1, Math.round((endDate.getTime() - startDate.getTime()) / (24*3600*1000)) + 1);
      const t = {
        bizYm: "PJ",
        taskKey,
        title,
        kind: kind || "pj",
        start: startDate,
        end: endDate,
        spanDays: span,
        meaning: meaning || "",
        status: { text:"", level:"todo" }
      };
      pjArr.push(t);

      globalMin = globalMin ? minDate(globalMin, startDate) : new Date(startDate.getTime());
      globalMax = globalMax ? maxDate(globalMax, endDate)   : new Date(endDate.getTime());

  // ====== レンダリング ======
  function rebuildTaskIndexes_(){
    // biz: key = `${bizYm}|${iso}` -> [task...]
    const bizIndex = {};
    const startMap = STATE.startTaskMap || {};

    Object.keys(startMap).forEach(k=>{
      // k: `${bizYm}|${startIso}|${taskKey}`
      const parts = String(k).split("|");
      const bizYm = parts[0] || "";
      const iso = parts[1] || "";
      if (!bizYm || !iso) return;

      const t = startMap[k];
      if (!t) return;

      const key = `${bizYm}|${iso}`;
      if (!bizIndex[key]) bizIndex[key] = [];
      bizIndex[key].push(t);
    });

    // taskKey順で安定化（ここで1回だけ）
    Object.keys(bizIndex).forEach(key=>{
      bizIndex[key].sort((a,b)=> String(a.taskKey||"").localeCompare(String(b.taskKey||"")));
    });

    // pj: key = iso -> [task...]
    const pjIndex = {};
    const pjMap = STATE.pjStartTaskMap || {};

    Object.keys(pjMap).forEach(k=>{
      // k: `${startIso}|${taskKey}`
      const parts = String(k).split("|");
      const iso = parts[0] || "";
      if (!iso) return;

      const t = pjMap[k];
      if (!t) return;

      if (!pjIndex[iso]) pjIndex[iso] = [];
      pjIndex[iso].push(t);
    });

    Object.keys(pjIndex).forEach(iso=>{
      pjIndex[iso].sort((a,b)=> String(a.taskKey||"").localeCompare(String(b.taskKey||"")));
    });

    STATE.bizTaskIndex = bizIndex;
    STATE.pjTaskIndex = pjIndex;
  }

  function render(){
    const t0 = performance.now();

    // ★描画前に index を作る
    const tIdx0 = performance.now();
    rebuildTaskIndexes_();
    const tIdx1 = performance.now();
    tlProfMark("render:rebuildIndexes", {
      indexMs: Math.round((tIdx1 - tIdx0) * 10) / 10,
      bizIndexKeys: Object.keys(STATE.bizTaskIndex || {}).length,
      pjIndexKeys: Object.keys(STATE.pjTaskIndex || {}).length
    });

    document.documentElement.style.setProperty("--laneCount", String(STATE.lanes.length));

    const tH0 = performance.now();
    renderHeader();
    const tH1 = performance.now();
    tlProfMark("render:header", { headerMs: Math.round((tH1 - tH0) * 10) / 10 });

    const tB0 = performance.now();
    renderBody(); // 分割描画なので完了はrenderBody側で取る
    const tB1 = performance.now();
    tlProfMark("render:body:scheduled", { scheduleMs: Math.round((tB1 - tB0) * 10) / 10 });

    const tP0 = performance.now();
    renderPills();
    const tP1 = performance.now();
    tlProfMark("render:pills", { pillsMs: Math.round((tP1 - tP0) * 10) / 10 });

    const t1 = performance.now();

  }

  function isFixedHolidayJp_(d){
    // 固定日の祝日だけ（正確度優先）
    // 01/01 元日
    // 02/11 建国記念の日
    // 04/29 昭和の日
    // 05/03 憲法記念日
    // 05/04 みどりの日
    // 05/05 こどもの日
    // 08/11 山の日
    // 11/03 文化の日
    // 11/23 勤労感謝の日
    const mmdd = `${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
    const fixed = new Set(["01/01","02/11","04/29","05/03","05/04","05/05","08/11","11/03","11/23"]);
    return fixed.has(mmdd);
  }

  function renderBody(){
    const body = document.getElementById("body");
    body.innerHTML = "";

    // ★分割描画用トークン（古い描画を中断する）
    STATE.renderSeq = Number(STATE.renderSeq || 0) + 1;
    const token = STATE.renderSeq;

    const today = new Date();

    const tBuild0 = performance.now();

    // ===== 表示する日付リスト =====
    const items = [];
    const start = new Date(STATE.dateStart.getTime());
    const end = new Date(STATE.dateEnd.getTime());

    for (let d = new Date(start.getTime()); d <= end; d.setDate(d.getDate()+1)){
      if (isWeekend(d)) continue;
      if (typeof isFixedHolidayJp_ === "function" && isFixedHolidayJp_(d)) continue;
      items.push({ iso: toIsoDate(d), date: new Date(d.getTime()) });
    }

    const tBuild1 = performance.now();
    tlProfMark("renderBody:buildDays", {
      days: items.length,
      buildMs: Math.round((tBuild1 - tBuild0) * 10) / 10
    });

    function renderRow_(iso, d){
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.date = iso;

      const dc = document.createElement("div");
      dc.className = "dateCell";
      if (isSameDay(d, today)) dc.classList.add("today");
      dc.innerHTML = `<span>${pad2(d.getMonth()+1)}/${pad2(d.getDate())}</span><span class="dateSub">${weekdayJa(d)}</span>`;
      row.appendChild(dc);

      // PJ列
      const pjCell = document.createElement("div");
      pjCell.className = "laneCell";
      pjCell.dataset.pj = "1";

      const pjArr = (STATE.pjTaskIndex && STATE.pjTaskIndex[iso]) ? STATE.pjTaskIndex[iso] : [];
      pjArr.forEach(task=>{
        const el = renderTask({
          ...task,
          bizYm: "PJ",
          status: { text:"", level:"todo" }
        });
        pjCell.appendChild(el);
      });
      row.appendChild(pjCell);

      // bizレーン
      (STATE.lanes || []).forEach(ym=>{
        const lc = document.createElement("div");
        lc.className = "laneCell";
        lc.dataset.bizYm = ym;

        const key = `${ym}|${iso}`;
        const arr0 = (STATE.bizTaskIndex && STATE.bizTaskIndex[key]) ? STATE.bizTaskIndex[key] : [];
        const picked = arr0.slice();

        if (picked.length >= 2){
          const needFix = picked.some(t =>
            t.col === undefined || t.col === null ||
            t.cols === undefined || t.cols === null ||
            Number(t.cols || 1) < 2
          );
          if (needFix){
            const n = picked.length;
            picked.forEach((t, i) => { t.cols = n; t.col = i; });
          }
        }

        picked.forEach(task=>{
          const el = renderTask(task);
          lc.appendChild(el);
        });

        row.appendChild(lc);
      });

      return row;
    }

    // ★観測カード（monthlyObserve）を遅延ロード（initを軽くした分ここで取る）
    function loadMonthlyObserveDeferred_(){
      const pid = String(STATE.projectId || "").trim();
      const ymKey = String(STATE.baseYm || STATE.ym || "").trim();
      if (!pid || !/^\d{6}$/.test(ymKey)) return;

      // 二重発火防止
      if (STATE.__OBS_LOADING__ === ymKey) return;
      STATE.__OBS_LOADING__ = ymKey;

      const t0 = performance.now();
      google.script.run
        .withFailureHandler(err => {
          STATE.__OBS_LOADING__ = "";
          console.warn("[Timeline] api_getTimelineMonthlyObserve failed", err);
        })
        .withSuccessHandler(res => {
          const t1 = performance.now();
          console.log("[Timeline] monthlyObserve deferred returned", {
            serverMs: Math.round((t1 - t0) * 10) / 10
          });

          try{
            if (res && Array.isArray(res.profile)){
              console.log("[Timeline] monthlyObserve server profile");
              console.table(res.profile);
            }
          }catch(e){}

          if (!res || !res.ok) return;

          STATE.monthlyObserve = res.monthlyObserve || null;

          // カードDOMが無いなら何もしない（事故防止）
          try{ renderMonthlyObserveTopCard_(); }catch(e){}
        })
        .api_getTimelineMonthlyObserve({ projectId: pid, ymKey: ymKey });
    }

    // ===== 分割描画（50行ずつ） =====
    const BATCH = 50;
    let i = 0;

    const tPaint0 = performance.now();
    let firstPainted = false;

    function step_(){
      if (STATE.renderSeq !== token) return;

      const frag = document.createDocumentFragment();
      for (let k = 0; k < BATCH && i < items.length; k++, i++){
        const it = items[i];
        frag.appendChild(renderRow_(it.iso, it.date));
      }
      body.appendChild(frag);

      if (!firstPainted){
        firstPainted = true;
        const tPaint1 = performance.now();
        tlProfMark("renderBody:firstBatchPainted", {
          firstBatch: BATCH,
          firstPaintMs: Math.round((tPaint1 - tPaint0) * 10) / 10
        });
        tlProfTable("Timeline FE profile (first paint)");

        // ★first paint 後に観測を取りに行く（UX優先）
        setTimeout(loadMonthlyObserveDeferred_, 0);
      }

      if (i < items.length){
        requestAnimationFrame(step_);
        return;
      }

      STATE.renderDone = true;

      const tDone = performance.now();
      tlProfMark("renderBody:done", {
        rows: items.length,
        paintTotalMs: Math.round((tDone - tPaint0) * 10) / 10
      });

      tlProfTable("Timeline FE profile (full)");

      const pend = String(STATE.pendingJumpIso || "").trim();
      if (pend){
        STATE.pendingJumpIso = "";
        requestAnimationFrame(()=> jumpToIsoTop(pend));
      }
    }

    STATE.renderDone = false;
    requestAnimationFrame(step_);
  }

  function renderTask(task){
    const cols = Math.max(1, Number(task.cols || 1));
    const col  = Math.max(0, Number(task.col || 0));
    const gapPx = 6;

    const el = document.createElement("div");

    // ★会議枠（未確定）は破線にしたい：meetingMode=frame
    const meetingMode = String(task?.ui?.meetingMode || "").trim();
    const extraCls = (meetingMode === "frame") ? "tentative" : "";

    el.className = `task range ${task.kind} ${extraCls}`.trim();
    el.style.setProperty("--span", String(task.spanDays || 1));

    el.style.right = "auto";
    el.style.width = `calc((100% - 16px - ${(cols-1)*gapPx}px) / ${cols})`;
    el.style.left  = `calc(8px + ${col} * ( (100% - 16px - ${(cols-1)*gapPx}px) / ${cols} + ${gapPx}px ))`;

    el.onclick = ()=> openTaskModal(task);

    const title = document.createElement("div");
    title.className = "taskTitle";
    title.textContent = task.title;

    el.innerHTML = "";
    el.appendChild(title);

    // ★ステータスだけ表示（空なら行ごと出さない）
    const stText = String(task?.status?.text || "").trim();
    const stLevel = String(task?.status?.level || "todo").trim();

    if (stText){
      const metaRow = document.createElement("div");
      metaRow.className = "taskMetaRow";

      const st = document.createElement("span");
      st.className = `badge ${stLevel}`;
      st.textContent = stText;

      metaRow.appendChild(st);
      el.appendChild(metaRow);
    }

    return el;
  }

    // ====== モーダル ======
    function escapeHtml(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function ymInputFromKey_(bizYmKey){
      const s = String(bizYmKey || "").trim();
      if (!/^\d{6}$/.test(s)) return "";
      return `${s.slice(0,4)}-${s.slice(4,6)}`;
    }

    function jstIsoStart_(ymd){
      // ymd: YYYY-MM-DD
      return new Date(String(ymd).trim() + "T00:00:00+09:00").toISOString();
    }
    function jstIsoEnd_(ymd){
      return new Date(String(ymd).trim() + "T23:59:59+09:00").toISOString();
    }

    function openTaskModal(task){
      const bizYmKey = String(task.bizYm || "").trim();
      const taskKey = String(task.taskKey || "").trim();

      // 0) 予算・配賦 仮ぎめ（今回）
      if ((taskKey === "budgetDraft" || taskKey === "budgetAlloc" || taskKey === "budgetAllocDraft") && /^\d{6}$/.test(bizYmKey)){
        openBudgetAllocDraftModal_(bizYmKey);
        return;
      }

      // ① 会議スケジューリング
      if ((taskKey === "meetingSched" || taskKey === "mtgSched") && /^\d{6}$/.test(bizYmKey)){
        openMeetingSchedModal_(bizYmKey);
        return;
      }

      // ② 月次報告会（議事録/決定）
      if ((taskKey === "meetingHold" || taskKey === "meetingHeld" || taskKey === "mtgHeld") && /^\d{6}$/.test(bizYmKey)){
        openMeetingHoldModal_(bizYmKey);
        return;
      }

      // ③ 月次報告（Navigator）
      if (taskKey === "report" && /^\d{6}$/.test(bizYmKey)){
        openReportModal_(bizYmKey);
        return;
      }

      // ④ 請求書作成・送付
      if ((taskKey === "invoiceSend" || taskKey === "send") && /^\d{6}$/.test(bizYmKey)){
        openInvoiceSendModal_(bizYmKey);
        return;
      }

      // その他：従来どおり（仮モーダル）
      document.getElementById("modalTitle").textContent = task.title;
      document.getElementById("modalSub").textContent =
        `bizYm=${task.bizYm} / ${toIsoDate(task.start)}〜${toIsoDate(task.end)} / taskKey=${task.taskKey}`;

      const meaning = document.getElementById("modalMeaning");
      meaning.textContent = task.meaning || "-";

      const body = document.getElementById("modalBody");
      body.dataset.bizYm = task.bizYm;
      body.dataset.taskKey = task.taskKey;

      document.getElementById("modalBack").style.display = "flex";
    }

    function openBudgetAllocDraftModal_(bizYmKey){
      const pid = String(STATE.projectId || "").trim();

      function bizYmLabel_(yyyymm){
        const s = String(yyyymm||"").trim();
        if (!/^\d{6}$/.test(s)) return s || "-";
        const m = Number(s.slice(4,6));
        return `${m}月稼働分`;
      }
      function yenFmt_(n){
        const x = Number(n || 0);
        if (!isFinite(x)) return "0";
        return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }
      function yenParse_(s){
        const t = String(s ?? "").replace(/[^\d\-]/g,"");
        const n = parseInt(t || "0", 10);
        return isNaN(n) ? 0 : n;
      }

      // ★Billingルール：受領予定額（税抜・立替除く）× 0.65 = 予算（配賦原資）
      function calcBudgetFromReceipt_(receiptYen){
        const r = Number(receiptYen || 0);
        if (!isFinite(r) || r <= 0) return 0;
        return Math.round(r * 0.65);
      }
      function calcReceiptFromBudget_(budgetYen){
        const b = Number(budgetYen || 0);
        if (!isFinite(b) || b <= 0) return 0;
        return Math.round(b / 0.65);
      }

      document.getElementById("modalTitle").textContent = "予算配賦案確定";
      document.getElementById("modalSub").textContent = `${bizYmLabel_(bizYmKey)}（loading）`;

      const modalBody = document.getElementById("modalBody");
      modalBody.innerHTML = `
        <div class="section">
          <div class="sectionTitle">予算配賦案確定</div>
          <div class="sectionText">読み込み中…</div>
        </div>
      `;
      document.getElementById("modalBack").style.display = "flex";

      if (!pid || !/^\d{6}$/.test(String(bizYmKey||""))){
        modalBody.innerHTML = `
          <div class="section">
            <div class="sectionTitle">予算配賦案確定</div>
            <div class="sectionText">projectId / bizYmKey が無い</div>
          </div>
        `;
        document.getElementById("modalSub").textContent = bizYmLabel_(bizYmKey);
        return;
      }

      google.script.run
        .withFailureHandler(err => {
          modalBody.innerHTML = `
            <div class="section">
              <div class="sectionTitle">予算配賦案確定</div>
              <div class="sectionText">失敗… ${escapeHtml(err?.message || String(err))}</div>
            </div>
          `;
          document.getElementById("modalSub").textContent = bizYmLabel_(bizYmKey);
        })
        .withSuccessHandler(res => {
          try{
            if (res && Array.isArray(res.profile)){
              console.log("[Timeline] server profile");
              console.table(res.profile);
            }
          }catch(e){}
          if (!res || !res.ok){
            modalBody.innerHTML = `
              <div class="section">
                <div class="sectionTitle">予算配賦案確定</div>
                <div class="sectionText">失敗っぽい… ${escapeHtml(res?.message || "unknown")}</div>
              </div>
            `;
            document.getElementById("modalSub").textContent = bizYmLabel_(bizYmKey);
            return;
          }

          const cur = res.current || {};
          const prev = res.prev || {};
          const payouts = Array.isArray(cur.payouts) ? cur.payouts : [];

          const prevBudget = Number(prev.budgetTotal || 0);
          const prevPlannedTotal = Number(prev.plannedTotalYen || 0);
          const prevAllocMap = (prev.allocations && typeof prev.allocations === "object") ? prev.allocations : {};

          // ★表示：yyyy-mmは出さない（事故る）
          document.getElementById("modalSub").textContent = `${bizYmLabel_(bizYmKey)}（${bizYmKey}）`;

          // ★当月の予算（配賦原資）＝DBに入ってる budgetTotal を正とする
          const seedBudget = Number(cur.budgetTotal || 0);

          // ★受領予定額は予算から逆算して seed（Billing互換）
          const seedReceipt = calcReceiptFromBudget_(seedBudget);

          // rows（planned/fixed）を構築
          // plannedはデータ源によってキーが違う可能性があるので拾い方を強化
          const rows = payouts.map(p => ({
            memberId: String(p.memberId || "").trim(),
            codeName: String(p.codeName || p.memberId || "").trim(),
            plannedYen: Number(p.plannedYen ?? p.yen ?? p.amountYen ?? p.amount ?? p.totalYen ?? 0),
            fixedYen: Number(p.fixedYen || 0),
          })).filter(x => x.memberId);

          // ★各メンバー配賦：当月fixedが無ければ「前月の配賦」を初期値にする（まさ要望）
          rows.forEach(r => {
            if (Number(r.fixedYen || 0) > 0) return;
            const pv = Number(prevAllocMap[r.memberId] || 0);
            if (pv > 0) r.fixedYen = pv;
          });

          const prevReceiptIncl = calcReceiptFromBudget_(prevBudget);
          const prevReceiptExcl = Math.round(prevReceiptIncl / 1.1);

          // ★UIガイド用：人間は受領額を打つので、前月予算は「受領額×0.65」から作る（逆算させない）
          const prevBudgetGuide = calcBudgetFromReceipt_(prevReceiptExcl);

          // ★当月seed（入力欄の初期値）は budget から逆算して税抜に寄せる
          const seedReceiptIncl = calcReceiptFromBudget_(seedBudget);
          const seedReceiptExcl = Math.round(seedReceiptIncl / 1.1);

          modalBody.innerHTML = `
            <div class="section">
              <div class="sectionTitle">入力</div>
              <div class="sectionText">
                Billingと同じルール：
                「受領予定額（税抜・立替除く）」を入れる → 予算（65%）を自動計算 → 配賦案を確定する。
                <div class="muted" style="margin-top:8px; font-weight:900;">
                  前月受領額（税抜）：${escapeHtml("¥" + yenFmt_(prevReceiptExcl))}　／　前月予算（65%ガイド）：${escapeHtml("¥" + yenFmt_(prevBudgetGuide))}　／　前月配賦額合計：${escapeHtml("¥" + yenFmt_(prevPlannedTotal))}
                </div>
              </div>

              <div style="margin-top:12px; display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;">
                <div style="min-width:280px;">
                  <div style="font-weight:900; margin-bottom:6px;">受領予定額（税抜・立替除く）</div>
                  <input id="tl_receiptYen" type="text"
                    value="${escapeHtml(yenFmt_(seedReceiptExcl))}"
                    placeholder="${escapeHtml("前月受領額：¥" + yenFmt_(prevReceiptExcl))}"
                    style="width:280px; padding:10px; border:1px solid #d1d5db; border-radius:10px; text-align:right;" />
                  <div class="muted" style="margin-top:6px; font-weight:900;">薄字は前月受領額（税抜）</div>
                </div>

                <div style="min-width:240px;">
                  <div style="font-weight:900; margin-bottom:6px;">予算（配賦原資=65%）</div>
                  <input id="tl_budgetYen" type="text"
                    value="${escapeHtml(yenFmt_(seedBudget))}"
                    readonly
                    style="width:240px; padding:10px; border:1px solid #d1d5db; border-radius:10px; text-align:right; background:#f3f4f6;" />
                  <div class="muted" style="margin-top:6px; font-weight:900;">受領予定額 × 0.65 を自動計算</div>
                </div>
              </div>

              <div style="margin-top:16px;">
                <div style="font-weight:900; margin-bottom:6px;">配賦案（円）</div>
                <div class="muted">各メンバーの入力欄は「前月の配賦」を初期値に入れてる。空欄はplanned扱いで保存</div>

                <div style="overflow:auto; border:1px solid #e5e7eb; border-radius:12px;">
                  <table style="width:100%; border-collapse:collapse;">
                    <thead>
                      <tr>
                        <th style="text-align:left; padding:10px; border-bottom:1px solid #e5e7eb;">member</th>
                        <th style="text-align:right; padding:10px; border-bottom:1px solid #e5e7eb;">planned</th>
                        <th style="text-align:right; padding:10px; border-bottom:1px solid #e5e7eb;">前月</th>
                        <th style="text-align:right; padding:10px; border-bottom:1px solid #e5e7eb;">案（入力）</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${rows.map(r => {
                        const prevY = Number(prevAllocMap[r.memberId] || 0);
                        const seedFix = Number(r.fixedYen || 0);
                        return `
                          <tr>
                            <td style="padding:10px; border-bottom:1px solid #f3f4f6; font-weight:900;">${escapeHtml(r.codeName)}</td>
                            <td style="padding:10px; border-bottom:1px solid #f3f4f6; text-align:right;">${escapeHtml(yenFmt_(r.plannedYen))}</td>
                            <td style="padding:10px; border-bottom:1px solid #f3f4f6; text-align:right; color:#6b7280;">${escapeHtml(yenFmt_(prevY))}</td>
                            <td style="padding:10px; border-bottom:1px solid #f3f4f6; text-align:right;">
                              <input data-mid="${escapeHtml(r.memberId)}" class="tl_fixYen" type="text"
                                value="${escapeHtml(seedFix > 0 ? yenFmt_(seedFix) : "")}"
                                placeholder="${escapeHtml(prevY > 0 ? yenFmt_(prevY) : "空欄=planned")}"
                                style="width:160px; padding:8px; border:1px solid #d1d5db; border-radius:10px; text-align:right;" />
                            </td>
                          </tr>
                        `;
                      }).join("")}
                    </tbody>
                  </table>
                </div>
              </div>

              <div style="margin-top:14px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-end;">
                <div id="tl_allocBox" style="border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px; background:#f9fafb; min-width:360px;">
                  <div class="muted" style="font-weight:900;">配賦原資 / 合計 / 残り</div>
                  <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; margin-top:6px;">
                    <div style="font-weight:900;">原資：<span id="tl_allocBudgetYen">¥0</span></div>
                    <div style="font-weight:900;">合計：<span id="tl_allocSumYen">¥0</span></div>
                    <div style="font-weight:900;">残り：<span id="tl_allocRemainYen">¥0</span></div>
                  </div>
                  <div class="muted" id="tl_allocHint" style="margin-top:6px; font-weight:900;"></div>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                  <button class="btn3" id="tl_planClose">閉じる</button>
                  <button class="btn" id="tl_planConfirm">案を確定</button>
                  <span class="muted" id="tl_planInfo" style="font-weight:900;"></span>
                </div>
              </div>
            </div>
          `;

          // ★入力連動：受領予定額 → 予算（65%）
          function syncBudgetFromReceipt_(){
            const r = yenParse_(document.getElementById("tl_receiptYen")?.value || "");
            const b = calcBudgetFromReceipt_(r);
            const be = document.getElementById("tl_budgetYen");
            if (be) be.value = yenFmt_(b);
          }

          // ★Billing互換：配賦合計/残りをリアルタイム更新し、超過時は確定不可
          function calcAllocState_(){
            const budget = yenParse_(document.getElementById("tl_budgetYen")?.value || "");
            let sum = 0;

            // 空欄はplanned扱い（＝rowsのplannedYen）で合計に入れる
            rows.forEach(r => {
              const inp = document.querySelector(`input.tl_fixYen[data-mid="${CSS.escape(r.memberId)}"]`);
              const vRaw = inp ? String(inp.value || "").trim() : "";
              if (vRaw){
                sum += yenParse_(vRaw);
              } else {
                sum += Number(r.plannedYen || 0);
              }
            });

            const remain = budget - sum;
            return { budget, sum, remain };
          }

          function setText_(id, s){
            const el = document.getElementById(id);
            if (el) el.textContent = s;
          }

          function setAllocUi_(){
            const st = calcAllocState_();

            setText_("tl_allocBudgetYen", "¥" + yenFmt_(st.budget));
            setText_("tl_allocSumYen", "¥" + yenFmt_(st.sum));

            const remainEl = document.getElementById("tl_allocRemainYen");
            if (remainEl){
              remainEl.textContent = "¥" + yenFmt_(st.remain);
              // 残りがマイナスなら赤くする
              remainEl.style.color = (st.remain < 0) ? "#b91c1c" : "#111827";
            }

            const hint = document.getElementById("tl_allocHint");
            const btn = document.getElementById("tl_planConfirm");

            if (!st.budget){
              if (hint) hint.textContent = "まず受領予定額を入れて、予算（65%）を確定してね";
              if (btn){
                btn.disabled = true;
                btn.style.opacity = ".45";
                btn.style.cursor = "not-allowed";
              }
              return;
            }

            if (st.remain < 0){
              if (hint) hint.textContent = "⚠️ 合計が配賦原資を超過してる。金額を下げてね";
              if (btn){
                btn.disabled = true;
                btn.style.opacity = ".45";
                btn.style.cursor = "not-allowed";
              }
              return;
            }

            if (hint) hint.textContent = (st.remain === 0)
              ? "✅ ぴったり。案を確定できる"
              : "残りがある（余らせるなら意図を持って）";

            if (btn){
              btn.disabled = false;
              btn.style.opacity = "1";
              btn.style.cursor = "pointer";
            }
          }

          document.getElementById("tl_receiptYen")?.addEventListener("input", () => {
            syncBudgetFromReceipt_();
            setAllocUi_();
          });

          Array.from(document.querySelectorAll("input.tl_fixYen")).forEach(inp => {
            inp.addEventListener("input", () => setAllocUi_());
          });

          // 初期反映
          syncBudgetFromReceipt_();
          setAllocUi_();

          document.getElementById("tl_planClose")?.addEventListener("click", () => closeModal());

          document.getElementById("tl_planConfirm")?.addEventListener("click", () => {
            const info = document.getElementById("tl_planInfo");
            if (info) info.textContent = "";

            // 最終チェック（UIでdisableしてても、保険で弾く）
            const st = calcAllocState_();
            if (!st.budget){
              if (info) info.textContent = "受領予定額が空";
              return;
            }
            if (st.remain < 0){
              if (info) info.textContent = "合計が配賦原資を超過してるので確定できない";
              return;
            }

            if (info) info.textContent = "確定中…";

            const receiptYen = yenParse_(document.getElementById("tl_receiptYen")?.value || "");
            const budgetYen = calcBudgetFromReceipt_(receiptYen);

            const fixedMap = {};
            Array.from(document.querySelectorAll("input.tl_fixYen")).forEach(inp => {
              const mid = String(inp.getAttribute("data-mid") || "").trim();
              if (!mid) return;
              const v = yenParse_(inp.value || "");
              if (v > 0) fixedMap[mid] = v;
            });

            const outPayouts = rows.map(r => ({
              memberId: r.memberId,
              plannedYen: Number(r.plannedYen || 0),
              fixedYen: (fixedMap[r.memberId] !== undefined) ? Number(fixedMap[r.memberId]) : 0
            }));

            google.script.run
              .withFailureHandler(err => {
                if (info) info.textContent = "失敗… " + (err?.message || String(err));
              })
              .withSuccessHandler(r2 => {
                if (!r2 || !r2.ok){
                  if (info) info.textContent = (r2 && r2.message) ? r2.message : "失敗っぽい…";
                  return;
                }
                if (info) info.textContent = "✅ 確定した（Timeline更新中…）";

                loadFromServer_((ok2) => {
                  if (ok2) render();
                  setTimeout(()=> closeModal(), 500);
                });
              })
              .api_confirmTimelineBudgetAllocPlan({
                projectId: pid,
                bizYmKey: bizYmKey,
                budgetYen: budgetYen,
                payouts: outPayouts
              });
          });

        })
        .api_getTimelineBudgetAllocPlanDetail({ projectId: pid, bizYmKey: bizYmKey });
    }

    function openReportModal_(bizYmKey){
      const pid = String(STATE.projectId || "").trim();

      document.getElementById("modalTitle").textContent = "月次報告書";
      document.getElementById("modalSub").textContent = `bizYm=${bizYmKey}（loading）`;

      const modalBody = document.getElementById("modalBody");
      modalBody.innerHTML = `
        <div class="section">
          <div class="sectionTitle">月次サマリ</div>
          <div class="sectionText">読み込み中…</div>
        </div>
      `;
      document.getElementById("modalBack").style.display = "flex";

      if (!pid){
        modalBody.innerHTML = `
          <div class="section">
            <div class="sectionTitle">月次サマリ</div>
            <div class="sectionText">projectId が無い</div>
          </div>
        `;
        document.getElementById("modalSub").textContent = `bizYm=${bizYmKey}`;
        return;
      }

      const ymKey = String(bizYmKey || "").trim(); // yyyymm
      document.getElementById("modalSub").textContent = `bizYm=${bizYmKey}（navigator ym=${ymKey}）`;

      // ===== observe/log を後から差し込む（モーダル即表示のため） =====
      function renderObserveSkeleton_(){
        const el = document.getElementById("rep_observeWrap");
        if (!el) return;
        el.innerHTML = `
          <div class="section">
            <div class="sectionTitle">観測メタ（材料と変化）</div>
            <div class="sectionText">読み込み中…</div>
          </div>
          <details class="section" style="padding:12px;">
            <summary style="cursor:pointer; font-weight:900;">観測ログ（履歴）</summary>
            <div style="margin-top:8px;" id="rep_observeLogWrap">
              <div class="sectionText">読み込み中…</div>
            </div>
          </details>
        `;
      }

      function renderObserveBlock_(obs){
        const o = obs || {};
        const sc = o.sourceCounts || {};
        const d = o.diff || {};

        const upd = String(o.updatedAtJst || "").trim();
        const counts = `items:${Number(sc.monthlyItems||0)} / nudge:${Number(sc.nudgeItems||0)} / issues(open):${Number(sc.issuesOpen||0)}`;
        const meaning = String(o.meaningDiff || "").trim() || "変化はまだ観測できない";

        return `
          <div class="section">
            <div class="sectionTitle">観測メタ（材料と変化）</div>
            <div class="sectionText">
              ${upd ? `updated: ${escapeHtml(upd)}<br/>` : ``}
              ${escapeHtml(counts)}<br/>
              <div style="margin-top:8px; font-weight:900; color:#374151; white-space:pre-wrap;">${escapeHtml(meaning)}</div>
              <div class="muted" style="margin-top:8px;">prevUpdated: ${escapeHtml(String(d.prevUpdatedAtJst||""))} / itemsDelta: ${escapeHtml(String(d.itemsDelta||0))}</div>
            </div>
          </div>
        `;
      }

      function renderObserveLogs_(logs){
        const items = Array.isArray(logs) ? logs : [];
        if (!items.length){
          return `<div class="sectionText">まだ履歴が無い（抽出/修正/確定/つくよみ追記が起きると積まれる）</div>`;
        }

        return items.slice().reverse().map(it=>{
          const rev = String(it.rev||"");
          const at = String(it.createdAtJst||"");
          const by = String(it.createdBy||"");
          const ev = String(it.eventType||"");
          const m = String(it.meaningDiff||"");
          const ch = String(it.changedFields||"").trim();
          return `
            <div style="border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px; background:#fff; margin-top:8px;">
              <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
                <div style="font-weight:900;">rev ${escapeHtml(rev)} <span class="muted" style="margin-left:8px;">${escapeHtml(ev)}</span></div>
                <div class="muted" style="font-weight:900;">${escapeHtml(at)} ${escapeHtml(by)}</div>
              </div>
              <div style="margin-top:6px; white-space:pre-wrap; font-weight:900; color:#374151;">${escapeHtml(m)}</div>
              ${ch ? `<div class="muted" style="margin-top:6px;">changed: ${escapeHtml(ch)}</div>` : ``}
            </div>
          `;
        }).join("");
      }

      function renderEditor_(monthly){
        const m = monthly || {};
        const status = String(m.status || "none").trim();
        const updatedAt = String(m.updatedAt || "").trim();
        const editedAt = String(m.overrideEditedAt || "").trim();
        const editedBy = String(m.overrideEditedBy || "").trim();

        // 今月開催MTG
        const meetings = Array.isArray(m.meetings) ? m.meetings : [];

        function fmtJstMeeting_(s){
          const v = String(s || "").trim();
          if (!v) return "";

          const m1 = v.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
          if (m1) return `${m1[1]}/${m1[2]}/${m1[3]} ${m1[4]}:${m1[5]}`;

          const m2 = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (m2) return `${m2[1]}/${m2[2]}/${m2[3]}`;

          try{
            const d = new Date(v);
            if (!isNaN(d.getTime())){
              return new Intl.DateTimeFormat("ja-JP", {
                timeZone: "Asia/Tokyo",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
              }).format(d);
            }
          }catch(e){}
          return v;
        }

        function renderMeetingsBlock_(){
          if (!meetings.length){
            return `
              <div class="section">
                <div class="sectionTitle">今月開催MTG</div>
                <div class="sectionText">0件（まだ拾えてない）</div>
              </div>
            `;
          }

          const rows = meetings.map(x=>{
            const title = String(x.title || "MTG").trim();
            const start = fmtJstMeeting_(x.startAtJst || x.dateStart || "");
            const url = String(x.notionUrl || "").trim();

            const link = url
              ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Notion</a>`
              : "";

            return `
              <div style="border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px; background:#fff; margin-top:8px;">
                <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start;">
                  <div style="min-width:0;">
                    <div style="font-weight:900; font-size:13px; line-height:1.4; word-break:break-word;">
                      ${escapeHtml(title)}
                    </div>
                    <div style="margin-top:4px; color:#6b7280; font-size:12px; font-weight:800;">
                      ${escapeHtml(start || "")}
                    </div>
                  </div>
                  <div style="font-size:12px; font-weight:900;">
                    ${link}
                  </div>
                </div>
              </div>
            `;
          }).join("");

          return `
            <div class="section">
              <div class="sectionTitle">今月開催MTG</div>
              <div class="sectionText">${meetings.length}件</div>
              <div style="margin-top:6px;">${rows}</div>
            </div>
          `;
        }

        const fields = [
          { key:"summary", label:"要約", value: String(m.summary || "") },
          { key:"decided", label:"確定事項", value: String(m.decided || "") },
          { key:"openQuestions", label:"未解決 / 質問", value: String(m.openQuestions || "") },
          { key:"gapToPlan", label:"計画との差分", value: String(m.gapToPlan || "") },
          { key:"risks", label:"リスク", value: String(m.risks || "") },
          { key:"nextMeetingAdvice", label:"次回アドバイス", value: String(m.nextMeetingAdvice || "") }
        ];

        const editedLineHtml =
          (editedAt || editedBy)
            ? `<div style="margin-top:6px;">edited: ${escapeHtml(fmtJstDateTime_(editedAt))} ${escapeHtml(editedBy)}</div>`
            : ``;

        modalBody.innerHTML = `
          <div id="rep_observeWrap"></div>

          ${renderMeetingsBlock_()}

          <div class="section">
            <div class="sectionTitle">ステータス</div>
            <div class="sectionText">
              status=${escapeHtml(status)}
              ${updatedAt ? `<div style="margin-top:6px;">updatedAt: ${escapeHtml(fmtJstDateTime_(updatedAt))}</div>` : ``}
              ${editedLineHtml}
            </div>
            <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn" id="rep_btnRun">抽出を更新（LLM）</button>
              <button class="btn" id="rep_btnConfirm">確定（confirmed）</button>
              <span class="muted" id="rep_info" style="font-weight:900;"></span>
            </div>
            <div class="muted" style="margin-top:8px;">※直書き保存も残すけど、本命は「誤り指摘→LLM修正」</div>
          </div>

          ${fields.map(f => `
            <div class="section">
              <div class="sectionTitle">${escapeHtml(f.label)}</div>

              <textarea id="rep_${escapeHtml(f.key)}" style="width:100%; min-height:120px; padding:10px; border:1px solid #d1d5db; border-radius:12px;">${escapeHtml(f.value || "")}</textarea>

              <div style="margin-top:10px; display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;">
                <button class="btn" data-save="${escapeHtml(f.key)}">保存（直書き）</button>

                <div style="flex:1; min-width:260px;">
                  <div class="muted" style="font-weight:900; margin-bottom:6px;">LLMへ誤り指摘（ここが間違ってる / こう直したい）</div>
                  <textarea id="rep_fb_${escapeHtml(f.key)}" style="width:100%; min-height:64px; padding:10px; border:1px solid #d1d5db; border-radius:12px;" placeholder="例：この要約は現実と逆。実際は〜。表現は『検証中』にして。"></textarea>
                  <div style="margin-top:8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                    <button class="btn" data-fix="${escapeHtml(f.key)}">LLMに修正させる</button>
                    <span class="muted" id="rep_saved_${escapeHtml(f.key)}"></span>
                  </div>
                </div>
              </div>
            </div>
          `).join("")}
        `;

        // まず骨組みを出す（即表示）
        renderObserveSkeleton_();

        // 抽出更新（従来の再オープンは維持。体感は軽くなる）
        const btnRun = document.getElementById("rep_btnRun");
        if (btnRun){
          btnRun.addEventListener("click", () => {
            tl_openConfirm("抽出を更新", "抽出を更新すると、LLMが下書きを上書きする。更新する？", () => {
              const info = document.getElementById("rep_info");
              if (info) info.textContent = "抽出中…";
              btnRun.disabled = true;
              btnRun.style.opacity = ".55";

              google.script.run
                .withFailureHandler(err => {
                  if (info) info.textContent = "失敗… " + (err?.message || String(err));
                  btnRun.disabled = false;
                  btnRun.style.opacity = "1";
                })
                .withSuccessHandler(res => {
                  if (!res || !res.ok){
                    if (info) info.textContent = "失敗っぽい…";
                    btnRun.disabled = false;
                    btnRun.style.opacity = "1";
                    return;
                  }
                  if (info) info.textContent = "更新した（再読込）";
                  setTimeout(()=> openReportModal_(bizYmKey), 250);
                })
                .nav_runMonthlyExtract({ projectId: pid, ym: ymKey });
            });
          });
        }

        // 確定
        const btnConfirm = document.getElementById("rep_btnConfirm");
        if (btnConfirm){
          btnConfirm.addEventListener("click", () => {
            tl_openConfirm("確定", "月次サマリを確定（confirmed）にする？", () => {
              const info = document.getElementById("rep_info");
              if (info) info.textContent = "確定中…";
              btnConfirm.disabled = true;
              btnConfirm.style.opacity = ".55";

              google.script.run
                .withFailureHandler(err => {
                  if (info) info.textContent = "失敗… " + (err?.message || String(err));
                  btnConfirm.disabled = false;
                  btnConfirm.style.opacity = "1";
                })
                .withSuccessHandler(res => {
                  if (!res || !res.ok){
                    if (info) info.textContent = (res && res.message) ? res.message : "失敗っぽい…";
                    btnConfirm.disabled = false;
                    btnConfirm.style.opacity = "1";
                    return;
                  }

                  if (info) info.textContent = "✅ 確定した（Timeline更新）";
                  loadFromServer_((ok2) => {
                    if (ok2) render();
                    setTimeout(()=> openReportModal_(bizYmKey), 250);
                  });
                })
                .nav_confirmMonthlyExtract({ projectId: pid, ym: ymKey });
            });
          });
        }

        // 直書き保存
        modalBody.querySelectorAll('button[data-save]').forEach(btn => {
          btn.addEventListener("click", () => {
            const fieldKey = String(btn.getAttribute("data-save") || "").trim();
            const ta = document.getElementById("rep_" + fieldKey);
            const v = String(ta?.value || "");

            const infoEl = document.getElementById("rep_saved_" + fieldKey);
            if (infoEl) infoEl.textContent = "保存中…";

            btn.disabled = true;
            btn.style.opacity = ".55";

            google.script.run
              .withFailureHandler(err => {
                if (infoEl) infoEl.textContent = "失敗… " + (err?.message || String(err));
                btn.disabled = false;
                btn.style.opacity = "1";
              })
              .withSuccessHandler(res => {
                if (!res || !res.ok){
                  if (infoEl) infoEl.textContent = (res && res.message) ? res.message : "失敗っぽい…";
                  btn.disabled = false;
                  btn.style.opacity = "1";
                  return;
                }
                if (infoEl) infoEl.textContent = "✅ 保存した";
                btn.disabled = false;
                btn.style.opacity = "1";
              })
              .nav_saveMonthlyOverride({
                projectId: pid,
                ym: ymKey,
                fieldKey: fieldKey,
                text: v,

              });

        modalBody.querySelectorAll('button[data-fix]').forEach(btn => {

            const cur = String(ta?.value || "");
            const feedback = String(fb?.value || "").trim();
            const infoEl = document.getElementById("rep_saved_" + fieldKey);

            if (!feedback){
              if (infoEl) infoEl.textContent = "誤り指摘が空";
              return;
            }

            if (infoEl) infoEl.textContent = "LLM修正中…";
            btn.disabled = true;
            btn.style.opacity = ".55";

            google.script.run
              .withFailureHandler(err => {
                if (infoEl) infoEl.textContent = "失敗… " + (err?.message || String(err));
                btn.disabled = false;
                btn.style.opacity = "1";
              })
              .withSuccessHandler(res => {

                  if (infoEl) infoEl.textContent = (res && res.message) ? res.message : "失敗っぽい…";
                  btn.disabled = false;
                  btn.style.opacity = "1";
                  return;

                const newText = String(res.text || "").trim();
                if (ta && newText) ta.value = newText;

                <div class="sectionText">失敗っぽい… ${escapeHtml(res?.message || "unknown")}</div>
              </div>

          const monthly = res.monthly || {};

      // ② observe/log は並列で取りに行って後から差し込む（直列連打をやめる）
      const reqTag = `rep:${pid}:${ymKey}:${Date.now()}`;
      console.log("[ReportModal] start deferred observe/log", reqTag);

      // observe
      const tObs0 = performance.now();
      google.script.run
        .withFailureHandler(eObs => {
          const ms = Math.round((performance.now() - tObs0) * 10) / 10;
          console.warn("[ReportModal] observe FAILED", reqTag, { ms, err: String(eObs && (eObs.message || eObs) || "unknown") });
        })
        .withSuccessHandler(rObs => {
          const ms = Math.round((performance.now() - tObs0) * 10) / 10;
          console.log("[ReportModal] observe OK", reqTag, { ms, ok: !!(rObs && rObs.ok) });

          try{
            if (rObs && Array.isArray(rObs.profile)){
              console.log("[ReportModal] observe server profile", reqTag);
              console.table(rObs.profile);

          }catch(_e){}

          const obs = (rObs && rObs.ok) ? (rObs.monthlyObserve || null) : null;
          const wrap = document.getElementById("rep_observeWrap");

      // log
      const tLog0 = performance.now();

        .withFailureHandler(eLog => {

          console.warn("[ReportModal] log FAILED", reqTag, { ms, err: String(eLog && (eLog.message || eLog) || "unknown") });
        })

          const items = (rLog && rLog.ok && Array.isArray(rLog.items)) ? rLog.items : [];
          console.log("[ReportModal] log OK", reqTag, { ms, ok: !!(rLog && rLog.ok), count: items.length });

          const logWrap = document.getElementById("rep_observeLogWrap");
          if (logWrap){

        })
        .api_listTimelineObserveLog({ projectId: pid, ymKey: ymKey, limit: 120 });

        })

  function openInvoiceSendModal_(bizYmKey){
    const pid = String(STATE.projectId || "").trim();

      const s = String(yyyymm||"").trim();

      const m = Number(s.slice(4,6));
      return `${m}月稼働分`;

    document.getElementById("modalTitle").textContent = "請求書作成・送付";
    document.getElementById("modalSub").textContent = bizYmLabel_(bizYmKey);

    const modalBody = document.getElementById("modalBody");
    document.getElementById("modalBack").style.display = "flex";

    if (!pid || !ymInput){

          <div class="sectionText">projectId / ym が無い</div>
        </div>`;
      return;
    }

    // ===== helpers =====
    function safeJson_(s, def){
      try{
        const t = String(s || "").trim();
        if (!t) return def;
        const x = JSON.parse(t);
        return (x === null || x === undefined) ? def : x;
      }catch(e){ return def; }
    }
    function yen_(n){
      const x = Number(n || 0);
      if (!isFinite(x)) return "¥0";
      return "¥" + x.toLocaleString("ja-JP");
    }
    function num_(s){
      const t = String(s ?? "").replace(/[^\d]/g,"");
      return Number(t || 0);
    }
    function signedNum_(s){
      if (s === null || s === undefined) return 0;
      let t = String(s).replace(/[^\d\-]/g,"");
      t = t.replace(/(?!^)-/g, "");
      const n = parseInt(t || "0", 10);
      return isNaN(n) ? 0 : n;
    }
    function fmtJst_(iso){
      try{
        const d = new Date(String(iso||""));
        if (isNaN(d.getTime())) return String(iso||"");
        const fmt = new Intl.DateTimeFormat("ja-JP", {
          timeZone: "Asia/Tokyo",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
        return fmt.format(d);
      }catch(e){ return String(iso||""); }
    }
    function splitEmails_(v){
      if (!v) return [];
      if (Array.isArray(v)) return v.map(x=>String(x||"").trim()).filter(Boolean);
      return String(v||"").split(/[,\n;]/).map(x=>String(x||"").trim()).filter(Boolean);
    }

    // ===== local state (modal only) =====

      M.invoiceLines = [{ description:"", quantity:1, unit_price:0 }];

    // ===== テンプレ合流（ここが正しい位置）=====
    (function(){
      const rawT = String(pack.projectInvoiceBaseLinesTemplateJson || "").trim();
      let templ = [];
      try{
        const x = rawT ? JSON.parse(rawT) : [];
        if (Array.isArray(x)) templ = x;
      }catch(e){ templ = []; }

      templ = templ
        .map(x => ({
          description: String(x.description || "").trim(),
          quantity: Math.max(1, Number(x.quantity || 1)),
          unit_price: Math.max(0, Number(x.unit_price || 0)),
        }))
        .filter(x => x.description);

      if (!templ.length) return;

      // stored を description で束ねる（保存済みが優先）
      const byDesc = {};
      (Array.isArray(M.invoiceBaseLines) ? M.invoiceBaseLines : []).forEach(x=>{
        const d = String(x.description||"").trim();

          quantity: Math.max(1, Number(x.quantity || 1)),
          unit_price: Math.max(0, Number(x.unit_price || 0)),

  function fmtJstRange_(startIso, endIso){
    try{
      const s = new Date(String(startIso||""));
      const e = new Date(String(endIso||""));
      if (isNaN(s.getTime()) || isNaN(e.getTime())) return `${startIso} 〜 ${endIso}`;

      const dFmt = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        weekday: "short"
      });
      const tFmt = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });

      return `${dFmt.format(s)} ${tFmt.format(s)}〜${tFmt.format(e)}`;
    } catch(_e){
      return `${startIso} 〜 ${endIso}`;
    }
  }

  function fmtJstDateTime_(iso){
    const v = String(iso || "").trim();
    if (!v) return "";

    // すでに人間向けならそのまま返す（例: 2026/02/09 14:48）
    if (/^\d{4}\/\d{2}\/\d{2}\s+\d{2}:\d{2}$/.test(v)) return v;

    try{
      const d = new Date(v);
      if (isNaN(d.getTime())) return v;

      // JST固定、一般人が読める表記に統一
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);
    }catch(e){
      return v;
    }
  }

    function findFirstTaskStartIso_(taskKey, lanes, startTaskMap){
    const key = String(taskKey || "").trim();
    if (!key) return "";

    const map = startTaskMap || {};
    const ys = Array.isArray(lanes) ? lanes : [];

    let bestIso = "";
    let bestTime = null;

    // bizレーンから探す（優先）
    ys.forEach(ym=>{
      Object.keys(map).forEach(k=>{
        // k: `${bizYm}|${startIso}|${taskKey}`
        if (!k.startsWith(ym + "|")) return;
        if (!k.endsWith("|" + key)) return;

        const parts = k.split("|");
        const startIso = parts[1] || "";
        if (!startIso) return;

        const t = new Date(startIso + "T00:00:00").getTime();
        if (!isFinite(t)) return;

        if (bestTime === null || t < bestTime){
          bestTime = t;
          bestIso = startIso;
        }
      });
    });

    return bestIso;
  }

  function jumpToIsoTop(iso){
    const targetIso = String(iso || "").trim();
    if (!targetIso) return;

    const MAX_TRY = 60; // だいたい1秒以内
    let n = 0;

    function tryJump_(){
      const row = document.querySelector(`.row[data-date="${targetIso}"]`);

      // まだ描画途中なら、出るまで待つ
      if (!row){
        n++;
        if (n >= MAX_TRY){
          // それでも無ければ、描画完了後ジャンプに回す（保険）
          STATE.pendingJumpIso = targetIso;
          return;
        }
        requestAnimationFrame(tryJump_);
        return;
      }

      // ★いまはブラウザスクロール前提なので、素直にscrollIntoViewでOK
      // （stickyがあるのでblock:startでなくcenter寄せ）
      try{
        row.scrollIntoView({ behavior:"smooth", block:"center" });
      }catch(e){
        row.scrollIntoView();
      }
    }

    tryJump_();
  }

    (function tlEnableLongTaskProbe_(){
      try{
        if (!("PerformanceObserver" in window)) return;
        if (STATE.__LT_OBS__) return;

        const obs = new PerformanceObserver((list) => {
          const ents = list.getEntries();
          ents.forEach(e => {

              name: e.name,
              durationMs: Math.round(e.duration * 10) / 10,
              startMs: Math.round(e.startTime * 10) / 10
            });
          });
        });

        obs.observe({ entryTypes: ["longtask"] });
        STATE.__LT_OBS__ = obs;
        console.log("[Timeline] longtask probe enabled");
      }catch(e){}
    })();

    STATE.projectId = String(getParam("projectId") || "").trim();

      if (!ok){
        const t0 = performance.now();
        buildDummy();
        const t1 = performance.now();
        tlProfMark("init:dummyBuilt", { dummyMs: Math.round((t1 - t0) * 10) / 10 });
      }

      render();

      // ★ジャンプ（描画中の可能性があるので pending へ回してもOK）
      (function(){
        if (STATE.jumpTaskKey){
          const iso = findFirstTaskStartIso_(STATE.jumpTaskKey, STATE.lanes || [], STATE.startTaskMap || {});
          if (iso){
            try{
              const d0 = new Date(iso + "T00:00:00");
              const d1 = addDays(d0, -1);
              const dTop = isHiddenDay_(d1) ? prevVisibleDay_(d1) : d1;
              const isoTop = toIsoDate(dTop);
              tlProfMark("init:jumpPlanned", { isoTop: isoTop, reason: "taskKey" });
              setTimeout(()=>jumpToIsoTop(isoTop), 50);
              return;
            }catch(e){
              tlProfMark("init:jumpPlanned", { isoTop: iso, reason: "taskKey(fallback)" });
              setTimeout(()=>jumpToIsoTop(iso), 50);
              return;
            }
          }
        }

        const d0 = new Date();
        const d1 = addDays(d0, -1);
        const dTop = isHiddenDay_(d1) ? prevVisibleDay_(d1) : d1;
        const isoTop = toIsoDate(dTop);
        tlProfMark("init:jumpPlanned", { isoTop: isoTop, reason: "default" });
        setTimeout(()=>jumpToIsoTop(isoTop), 50);
      })();
    });
  }

  init();
</script>
</body>
</html>
