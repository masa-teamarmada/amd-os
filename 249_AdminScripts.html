<!-- 249_AdminScripts.html -->
<script>
  const CAN_ACCESS_ADMIN =
    !!(window.__ADMIN_CTX__ && window.__ADMIN_CTX__.canAccessAdmin);

  function el(id){ return document.getElementById(id); }

  function escapeHtml(s){
    return String(s||"")
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#39;");
  }

  // ★ 属性用（onclickの引数など）に安全に突っ込む用
  function escapeHtmlAttr(s){
    // いったんHTML的に安全化 → さらに ' をエスケープ（JS文字列の事故防止）
    return escapeHtml(s).replaceAll("'", "\\'");
  }

  function showErr(msg){
    const m = msg || "error";

    // Membersタブ用（既存）
    try{
      const e1 = el("err");
      if (e1){
        e1.style.display = "block";
        e1.textContent = m;
      }
    }catch(e){}

    // Codeタブ用（追加：ここが見えてないと詰む）
    try{
      const e2 = el("codeErr");
      if (e2){
        e2.style.display = "block";
        e2.textContent = m;
      }
    }catch(e){}

    // Protocol/Context/Extractorもついでに（見えてるタブに出す）
    try{
      const ids = ["protErr","ctxErr","exErr","pjErr","candErr"];
      ids.forEach(id=>{
        const x = el(id);
        if (x){
          x.style.display = "block";
          x.textContent = m;
        }
      });
    }catch(e){}
  }


  function pill(v){
    const s = String(v||"").trim();
    if (!s) return `<span class="pill gray">-</span>`;
    return `<span class="pill">${escapeHtml(s)}</span>`;
  }

  function numOrDash(v){
    if (v === null || v === undefined || v === "") return "-";
    const n = Number(v);
    if (isNaN(n)) return escapeHtml(String(v));
    return String(n);
  }

  // ===== Members list =====
  let __ALL__ = [];

  function render(list){
    const tb = el("tbody");
    const rows = Array.isArray(list) ? list : [];

    const COLS = 20;

    if (!rows.length){
      tb.innerHTML = `<tr><td colspan="${COLS}" class="muted">該当なし</td></tr>`;
      el("hint").textContent = `rows: 0`;
      return;
    }

    tb.innerHTML = rows.map(u => {
      const memberIdRaw = u.memberId || "";
      const codeNameRaw = u.codeName || "";

      const emRaw = u.email || "";
      const emAttr = escapeHtmlAttr(emRaw);
      const dnAttr = escapeHtmlAttr(u.displayName || "");

      const midAttr = escapeHtmlAttr(memberIdRaw);

      const joinNow = String(u.joinYm || "").trim();
      const leaveNow = String(u.leaveYm || "").trim();
      const joinAttr = escapeHtmlAttr(joinNow);
      const leaveAttr = escapeHtmlAttr(leaveNow);

      // Emailは右側で省略表示（ホバーで全文）
      const emailCellStyle = "max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;";

      return `
        <tr data-mid="${midAttr}">
          <td class="mono nowrap"><b>${escapeHtml(codeNameRaw)}</b></td>
          <td class="mono nowrap">${escapeHtml(memberIdRaw)}</td>

          <td class="nowrap">${escapeHtml(u.displayName||"")}</td>

          <td class="nowrap">${renderRoleSelect_(memberIdRaw, u.role)}</td>
          <td class="nowrap">${renderStatusSelect_(memberIdRaw, u.status)}</td>

          <td class="nowrap">
            <input
              class="ctl mono"
              style="width:90px"
              id="joinYm_${midAttr}"
              value="${joinAttr}"
              data-orig="${joinAttr}"
              placeholder="yyyymm"
              oninput="markDirty('${midAttr}')"
              onchange="markDirty('${midAttr}')"
            />
          </td>
          <td class="nowrap">
            <input
              class="ctl mono"
              style="width:90px"
              id="leaveYm_${midAttr}"
              value="${leaveAttr}"
              data-orig="${leaveAttr}"
              placeholder="yyyymm"
              oninput="markDirty('${midAttr}')"
              onchange="markDirty('${midAttr}')"
            />
          </td>

          <td class="nowrap">${renderNotifyChannelSelect_(memberIdRaw, u.notifyChannel)}</td>

          <td class="nowrap">${renderIsAdminToggle_(memberIdRaw, u.isAdmin)}</td>

          <td class="nowrap">
            <button class="btn" id="save_${midAttr}" onclick="saveMember('${midAttr}', this)" disabled>保存</button>
          </td>

          <td class="nowrap"><b>${numOrDash(u.osInactiveDays)}</b></td>
          <td class="nowrap"><b>${numOrDash(u.googleInactiveDays)}</b></td>
          <td class="nowrap"><b>${numOrDash(u.slackInactiveDays)}</b></td>

          <td class="nowrap">${pill(u.googleState)}</td>
          <td class="small nowrap">${escapeHtml(u.googleLastSeenAt||"-")}</td>
          <td class="nowrap">${pill(u.slackState)}</td>
          <td class="small nowrap">${escapeHtml(u.slackLastSeenAt||"-")}</td>

          <!-- ★Emailを右側へ、短く -->
          <td class="mono" style="${emailCellStyle}" title="${emAttr}">${escapeHtml(emRaw)}</td>

          <td class="nowrap">
            <button
              class="btn"
              onclick="sendGoogleDowngradeNotice('${emAttr}','${dnAttr}', this)"
              title="このメンバーに Google 無償化の事前通知メールを送る"
            >通知</button>
          </td>

          <td class="nowrap">
            <button
              class="btn"
              onclick="sendSlackDowngradeNotice('${emAttr}','${dnAttr}', this)"
              title="このメンバーに Slack 無償化の事前通知メールを送る"
            >通知</button>
          </td>
        </tr>
      `;
    }).join("");

    el("hint").textContent =
      `rows: ${rows.length}（ソート: memberId昇順 / inactiveDaysは 2026-01-14 起点を含む）`;
  }

  function renderRoleSelect_(memberId, current){
    const mid = escapeHtmlAttr(memberId || "");
    const cur = String(current || "").trim();

    // ★roleTagに入れる値（この文字列でDBに保存される）
    const options = ["", "マネージャー", "パートナー", "シニアアソシエイト", "アソシエイト", "クルー"];

    return `
      <select class="ctl" style="width:210px"
        id="role_${mid}"
        data-orig="${escapeHtmlAttr(cur)}"
        onchange="markDirty('${mid}')"
      >
        ${options.map(v => {
          const vv = String(v);
          const sel = (vv === cur) ? "selected" : "";
          const label = vv ? vv : "（未設定）";
          return `<option value="${escapeHtmlAttr(vv)}" ${sel}>${escapeHtml(label)}</option>`;
        }).join("")}
      </select>
    `;
  }

  function renderStatusSelect_(memberId, current){
    const mid = escapeHtmlAttr(memberId || "");
    const cur = String(current || "").trim().toLowerCase();

    const options = [
      "", "active", "inactive", "paused"
    ];

    return `
      <select class="ctl" style="width:140px"
        id="status_${mid}"
        data-orig="${escapeHtmlAttr(cur)}"
        onchange="markDirty('${mid}')"
      >
        ${options.map(v => {
          const vv = String(v);
          const sel = (vv.toLowerCase() === cur) ? "selected" : "";
          const label = vv ? vv : "（未設定）";
          return `<option value="${escapeHtmlAttr(vv)}" ${sel}>${escapeHtml(label)}</option>`;
        }).join("")}
      </select>
    `;
  }

  function renderNotifyChannelSelect_(memberId, current){
    const mid = escapeHtmlAttr(memberId || "");
    const cur = String(current || "").trim().toLowerCase();

    const options = ["gmail","slack"];

    return `
      <select class="ctl" style="width:140px"
        id="notify_${mid}"
        data-orig="${escapeHtmlAttr(cur || "gmail")}"
        onchange="markDirty('${mid}')"
      >
        ${options.map(v => {
          const vv = String(v);
          const sel = (vv === (cur || "gmail")) ? "selected" : "";
          return `<option value="${escapeHtmlAttr(vv)}" ${sel}>${escapeHtml(vv)}</option>`;
        }).join("")}
      </select>
    `;
  }


  function renderIsAdminToggle_(memberId, current){
    const mid = escapeHtmlAttr(memberId || "");
    const cur = String(current || "").trim().toLowerCase();
    const checked = (cur === "true" || cur === "1" || cur === "yes") ? "checked" : "";

    return `
      <label class="rowLeft" style="gap:8px; align-items:center; margin:0;">
        <input
          type="checkbox"
          id="isAdmin_${mid}"
          data-orig="${checked ? "true" : "false"}"
          onchange="markDirty('${mid}')"
        />
        <span class="small">admin</span>
      </label>
    `.replace('id="isAdmin_' + mid + '"', `id="isAdmin_${mid}" ${checked}`);
  }

  function markDirty(memberId){
    const mid = (memberId || "").trim();
    if (!mid) return;

    const roleEl = el(`role_${mid}`);
    const stEl = el(`status_${mid}`);
    const ntEl = el(`notify_${mid}`);
    const adEl = el(`isAdmin_${mid}`);

    const jEl = el(`joinYm_${mid}`);
    const lEl = el(`leaveYm_${mid}`);

    const saveBtn = el(`save_${mid}`);
    if (!roleEl || !stEl || !ntEl || !adEl || !jEl || !lEl || !saveBtn) return;

    const roleOrig = String(roleEl.dataset.orig || "");
    const stOrig = String(stEl.dataset.orig || "");
    const ntOrig = String(ntEl.dataset.orig || "gmail");
    const adOrig = String(adEl.dataset.orig || "false");

    const jOrig = String(jEl.dataset.orig || "");
    const lOrig = String(lEl.dataset.orig || "");

    const roleNow = String(roleEl.value || "").trim().toLowerCase();
    const stNow = String(stEl.value || "").trim().toLowerCase();
    const ntNow = String(ntEl.value || "").trim().toLowerCase();
    const adNow = adEl.checked ? "true" : "false";

    const jNow = String(jEl.value || "").trim();
    const lNow = String(lEl.value || "").trim();

    const changed =
      (roleNow !== roleOrig) ||
      (stNow !== stOrig) ||
      (ntNow !== ntOrig) ||
      (adNow !== adOrig) ||
      (jNow !== jOrig) ||
      (lNow !== lOrig);

    saveBtn.disabled = !changed;
  }

  function saveMember(memberId, btnEl){
    const mid = (memberId || "").trim();
    if (!mid){
      showErr("memberId empty");
      return;
    }

    const roleEl = el(`role_${mid}`);
    const stEl = el(`status_${mid}`);
    const ntEl = el(`notify_${mid}`);
    const adEl = el(`isAdmin_${mid}`);

    const jEl = el(`joinYm_${mid}`);
    const lEl = el(`leaveYm_${mid}`);

    if (!roleEl || !stEl || !ntEl || !adEl || !jEl || !lEl){
      showErr("role/status/notify/isAdmin/joinYm/leaveYm element not found");
      return;
    }

    const joinYm = String(jEl.value || "").trim();
    const leaveYm = String(lEl.value || "").trim();

    function validYm(s){
      const v = String(s || "").trim();
      if (!v) return true;              // 空OK
      if (!/^\d{6}$/.test(v)) return false;
      const mm = Number(v.slice(4,6));
      return (mm >= 1 && mm <= 12);
    }

    if (!validYm(joinYm)){
      showErr("joinYm invalid（yyyymm / 月は01-12 / 空OK）");
      return;
    }
    if (!validYm(leaveYm)){
      showErr("leaveYm invalid（yyyymm / 月は01-12 / 空OK）");
      return;
    }

    const payload = {
      memberId: mid,
      role: (roleEl.value || "").trim(),
      status: (stEl.value || "").trim(),
      notifyChannel: (ntEl.value || "").trim().toLowerCase() || "gmail",
      isAdmin: adEl.checked ? "true" : "false",

      joinYm: joinYm,
      leaveYm: leaveYm
    };

    if (btnEl){
      btnEl.disabled = true;
      btnEl.textContent = "保存中...";
    }
    el("err").style.display = "none";
    el("hint").textContent = `保存中... memberId=${mid}`;

    google.script.run
      .withFailureHandler(err => {
        if (btnEl){
          btnEl.disabled = false;
          btnEl.textContent = "保存";
        }
        showErr(err?.message || String(err));
        markDirty(mid);
      })
      .withSuccessHandler(res => {
        if (btnEl){
          btnEl.textContent = "保存";
        }
        if (!res || !res.ok){
          if (btnEl) btnEl.disabled = false;
          showErr((res && res.message) ? res.message : "save failed");
          markDirty(mid);
          return;
        }

        roleEl.dataset.orig = String(payload.role || "").trim().toLowerCase();
        stEl.dataset.orig = String(payload.status || "").trim().toLowerCase();
        ntEl.dataset.orig = String(payload.notifyChannel || "gmail").trim().toLowerCase();
        adEl.dataset.orig = payload.isAdmin;

        jEl.dataset.orig = String(payload.joinYm || "").trim();
        lEl.dataset.orig = String(payload.leaveYm || "").trim();

        el("hint").textContent = `保存完了：memberId=${mid}`;
        markDirty(mid);
      })
      .admin_updateMemberRoleStatus(payload);
  }

  function sendSlackDowngradeNotice(email, displayName, btnEl){
    const em = (email || "").trim();
    if (!em){
      showErr("email empty");
      return;
    }

    const name = (displayName || "").trim() || em;

    const ok = window.confirm(
      `Slack無償化通知メールを送る？\n` +
      `宛先: ${name} <${em}>\n\n` +
      `inactive days>30となったため無償プランに切り替えます。\n` +
      `有償プランに戻す必要が生じたらマネージャーに言ってね！\n` +
      `引き続き#a1-allは見れるしDMも送れるから安心してねー。`
    );
    if (!ok) return;

    if (btnEl){
      btnEl.disabled = true;
      btnEl.textContent = "送信中...";
    }
    el("err").style.display = "none";
    el("hint").textContent = `送信中... ${em}`;

    google.script.run
      .withFailureHandler(err => {
        if (btnEl){
          btnEl.disabled = false;
          btnEl.textContent = "通知";
        }
        showErr(err?.message || String(err));
      })
      .withSuccessHandler(res => {
        if (btnEl){
          btnEl.disabled = false;
          btnEl.textContent = "通知";
        }
        if (!res || !res.ok){
          showErr((res && res.message) ? res.message : "send failed");
          return;
        }
        el("hint").textContent = `送信完了：${em}`;
      })
      .admin_sendSlackDowngradeNotice(em);
  }

  function sendGoogleDowngradeNotice(email, displayName, btnEl){
    const em = (email || "").trim();
    if (!em){
      showErr("email empty");
      return;
    }

    const name = (displayName || "").trim() || em;

    const ok = window.confirm(
      `Google無償化通知メールを送る？\n` +
      `宛先: ${name} <${em}>\n\n` +
      `inactive days>30となったため無償プランに切り替えます。\n` +
      `有償プランに戻す必要が生じたらマネージャーに言ってね！`
    );
    if (!ok) return;

    if (btnEl){
      btnEl.disabled = true;
      btnEl.textContent = "送信中...";
    }
    el("err").style.display = "none";
    el("hint").textContent = `送信中... ${em}`;

    google.script.run
      .withFailureHandler(err => {
        if (btnEl){
          btnEl.disabled = false;
          btnEl.textContent = "通知";
        }
        showErr(err?.message || String(err));
      })
      .withSuccessHandler(res => {
        if (btnEl){
          btnEl.disabled = false;
          btnEl.textContent = "通知";
        }
        if (!res || !res.ok){
          showErr((res && res.message) ? res.message : "send failed");
          return;
        }
        el("hint").textContent = `送信完了：${em}`;
      })
      .admin_sendGoogleDowngradeNotice(em);
  }

  function getFilters_(){
    const daysRaw = (el("fltDays").value || "").trim();
    const days = daysRaw ? Number(daysRaw) : null;
    const stage = (el("fltStage").value || "").trim().toLowerCase();
    const status = (el("fltStatus").value || "").trim().toLowerCase();
    return { days, stage, status };
  }

  function applyFilter(){
    const f = getFilters_();
    let rows = __ALL__.slice();

    // ★inactiveDays ≥ は「OS/Google/Slack のうち最大のinactive日数」で判定
    if (f.days !== null && !isNaN(f.days)){
      rows = rows.filter(u => {
        const os = Number(u.osInactiveDays || 0);
        const gg = Number(u.googleInactiveDays || 0);
        const sl = Number(u.slackInactiveDays || 0);
        const mx = Math.max(os, gg, sl);
        return mx >= f.days;
      });
    }

    if (f.stage){
      rows = rows.filter(u => String(u.licenseNoticeStage||"").trim().toLowerCase() === f.stage);
    }
    if (f.status){
      rows = rows.filter(u => String(u.status||"").trim().toLowerCase() === f.status);
    }

    render(rows);
  }


  function resetFilter(){
    el("fltDays").value = "";
    el("fltStage").value = "";
    el("fltStatus").value = "";
    render(__ALL__);
  }

  function callGAS_(fnName, args, onOk, onNg){
    try{
      const runner = google.script.run
        .withSuccessHandler(onOk)
        .withFailureHandler(onNg);

      // ★関数名ズレをここで検知して、画面に出す
      const f = runner && runner[fnName];
      if (typeof f !== "function"){
        throw new Error(`[GAS] ${fnName} is not a function（サーバ側に同名の公開関数が無い/名前が違う）`);
      }

      (Array.isArray(args) ? f.apply(runner, args) : f.call(runner, args));
    } catch(e){
      onNg && onNg(e);
    }
  }

  function load(){
    // ここが死ぬと「loading...固定」になるので、とにかく例外で落とさない
    try{
      el("err").style.display = "none";
      el("hint").textContent = "loading...";
      el("tbody").innerHTML = `<tr><td colspan="20" class="muted">loading...</td></tr>`;

      if (!CAN_ACCESS_ADMIN){
        showErr("権限なし（この画面が見えてる時点でルーティングおかしい）");
        return;
      }

      callGAS_(
        "listAdminUsers",
        [],
        (res) => {
          try{
            if (!res || !res.ok){
              showErr((res && res.message) ? res.message : "load failed");
              __ALL__ = [];
              render([]);
              return;
            }

            __ALL__ = res.users || [];
            __ALL__.sort((a,b)=> String(a.memberId||"").localeCompare(String(b.memberId||""), "ja"));
            render(__ALL__);

            el("meta").textContent = res.meta
              ? `データ生成: ${res.meta.generatedAtJst || "-"} / members updatedAt(max): ${res.meta.membersUpdatedAtMax || "-"}`
              : "-";
          } catch(e2){
            showErr(e2?.message || String(e2));
          }
        },
        (err) => {
          showErr(err?.message || String(err));
          // ★落ちてもタブ切替はできるように「loading...」を解除
          try{
            el("hint").textContent = "load failed（上のエラー見て）";
            el("tbody").innerHTML = `<tr><td colspan="20" class="muted">load failed</td></tr>`;
          } catch(_) {}
        }
      );

    } catch(e){
      showErr(e?.message || String(e));
    }
  }

  // ===== PJ list =====
  // __PJS__ は「Protocols/Candidates用：activeのみ」を入れる
  let __PJS__ = [];

  // Projectsタブ（PJ台帳）用：全件（draft含む）
  let __PJS_ALL__ = [];

  // ===== freee partners (pulldown candidates for Projects->Client) =====
  let __FREEE_PARTNERS__ = []; // [{id,name}]

  function fillFreeePartnerDatalist_(){
    const dl = el("freeePartnerDatalist");
    if (!dl) return;

    const rows = Array.isArray(__FREEE_PARTNERS__) ? __FREEE_PARTNERS__ : [];
    const names = rows.map(x => String(x?.name || "").trim()).filter(x=>x);

    const uniq = Array.from(new Set(names)).sort((a,b)=>a.localeCompare(b,"ja"));
    dl.innerHTML = uniq.map(n => `<option value="${escapeHtmlAttr(n)}"></option>`).join("");
  }

  function loadFreeePartners_(){
    // すでに入ってるなら叩かない（必要なら強制更新ボタン後で追加してもいい）
    if (Array.isArray(__FREEE_PARTNERS__) && __FREEE_PARTNERS__.length){
      fillFreeePartnerDatalist_();
      return;
    }

    // サーバ側で freee取引先一覧を返す関数を用意する（後述）
    google.script.run
      .withFailureHandler(err => {
        // 取引先が取れなくてもPJ一覧は出したいので握りつぶす
        try{ console.warn(err); }catch(e){}
        __FREEE_PARTNERS__ = [];
        fillFreeePartnerDatalist_();
      })
      .withSuccessHandler(res => {
        // res: {ok:true, partners:[{id,name}]} or array
        if (Array.isArray(res)){
          __FREEE_PARTNERS__ = res;
        } else if (res && res.ok && Array.isArray(res.partners)){
          __FREEE_PARTNERS__ = res.partners;
        } else {
          __FREEE_PARTNERS__ = [];
        }
        fillFreeePartnerDatalist_();
      })
      .admin_listFreeePartners();
  }

  function reloadFreeePartners_(){
    const btn = el("btnReloadFreeePartners");
    const origText = btn ? btn.textContent : "";

    // ★即時フィードバック
    if (btn){
      btn.disabled = true;
      btn.textContent = "再読み込み中...";
    }
    try{
      el("pjErr").style.display = "none";
      el("pjHint").textContent = "freee取引先を再読み込み中...";
    }catch(e){}

    // ★ローカル候補を一度空にして「変化」を見せる
    __FREEE_PARTNERS__ = [];
    fillFreeePartnerDatalist_();

    google.script.run
      .withFailureHandler(err => {
        if (btn){
          btn.disabled = false;
          btn.textContent = origText;
        }
        try{
          showPjErr("取引先 再読み込み失敗: " + (err?.message || String(err)));
          el("pjHint").textContent = "失敗";
        }catch(e){}
      })
      .withSuccessHandler(res => {
        if (!res || !res.ok){
          if (btn){
            btn.disabled = false;
            btn.textContent = origText;
          }
          try{
            showPjErr((res && res.message) ? res.message : "取引先キャッシュクリア失敗");
            el("pjHint").textContent = "失敗";
          }catch(e){}
          return;
        }

        // ★キャッシュ削除後、即再取得
        google.script.run
          .withFailureHandler(err2 => {
            if (btn){
              btn.disabled = false;
              btn.textContent = origText;
            }
            try{
              showPjErr("取引先 取得失敗: " + (err2?.message || String(err2)));
              el("pjHint").textContent = "失敗";
            }catch(e){}
          })
          .withSuccessHandler(res2 => {
            if (btn){
              btn.disabled = false;
              btn.textContent = origText;
            }

            if (res2 && res2.ok && Array.isArray(res2.partners)){
              __FREEE_PARTNERS__ = res2.partners;
            } else {
              __FREEE_PARTNERS__ = [];
            }

  function markDirtyProjectClient(projectId){
    const pid = String(projectId || "").trim();
    if (!pid) return;

    const btn = el(`pjsave_${pid}`);
    if (!inp || !btn) return;

    const orig = String(inp.dataset.orig || "").trim();

    btn.disabled = (now === orig);

  function saveProjectClient(projectId, btnEl){
    const pid = String(projectId || "").trim();
    if (!pid){
      showPjErr("projectId empty");
      return;
    }

    const inp = el(`pjcl_${pid}`);
    if (!inp){
      showPjErr("client input not found");
      return;
    }

    const nextClientName = String(inp.value || "").trim();
    if (!nextClientName){
      showPjErr("請求先が空");
      return;
    }

    if (btnEl){
      btnEl.disabled = true;
      btnEl.textContent = "保存中...";
    }
    el("pjErr").style.display = "none";
    el("pjHint").textContent = `保存中... clientName ${pid} -> ${nextClientName}`;

    google.script.run
      .withFailureHandler(err => {
        if (btnEl){
          btnEl.disabled = false;
          btnEl.textContent = "保存";
        }
        showPjErr(err?.message || String(err));
        markDirtyProjectClient(pid);
      })
      .withSuccessHandler(res => {
        if (btnEl) btnEl.textContent = "保存";

        if (!res || !res.ok){
          if (btnEl) btnEl.disabled = false;
          showPjErr((res && res.message) ? res.message : "save failed");
          markDirtyProjectClient(pid);
          return;
        }

        // ★サーバが正規化した名前（freee側で作った結果など）を反映
        const fixedName = String(res.clientName || nextClientName).trim();
        inp.value = fixedName;
        inp.dataset.orig = fixedName;

        // updatedAtも差し替え
        const tr = document.querySelector(`tr[data-pid="${CSS.escape(pid)}"]`);
        const updCell = tr ? tr.querySelector("td.pjUpdatedAt") : null;
        const updatedAt = String(res.updatedAt || "").trim();
        if (updCell && updatedAt) updCell.textContent = updatedAt;

        // キャッシュも更新
        const hit = (__PJS_ALL__ || []).find(x => String(x.projectId||"").trim() === pid);
        if (hit){
          hit.clientName = fixedName;
          if (updatedAt) hit.updatedAt = updatedAt;
        }

        el("pjHint").textContent = `保存完了：clientName ${pid} -> ${fixedName}`;
        markDirtyProjectClient(pid);
      })
      .admin_updateProjectClientName({
        projectId: pid,
        clientName: nextClientName,
        // ★「候補にない入力で確定したらfreeeに追加」をAdmin側でやる前提
        createFreeeIfMissing: true
      });
  }

    // ★つくよみ介入対象フラグ（即時保存）
  function toggleTsukuyomiNudgeEnabled_(projectId, chkEl){
    const pid = String(projectId || "").trim();
    if (!pid) return;

    const nextEnabled = !!(chkEl && chkEl.checked);

    // 夜間メンション禁止とかは「実際の介入投稿側（176〜）」で見るので、ここでは純粋にフラグだけ保存する
    // UIは即フィードバック
    try{
      el("pjErr").style.display = "none";
      el("pjHint").textContent = `保存中... つくよみ=${nextEnabled ? "ON" : "OFF"} ${pid}`;
    }catch(e){}

    if (chkEl) chkEl.disabled = true;

    google.script.run
      .withFailureHandler(err => {
        if (chkEl) chkEl.disabled = false;

        // 失敗したらUIを元に戻す（事故防止）
        if (chkEl) chkEl.checked = !nextEnabled;

        showPjErr(err?.message || String(err));
        try{ el("pjHint").textContent = "失敗"; }catch(e){}
      })
      .withSuccessHandler(res => {
        if (chkEl) chkEl.disabled = false;

        if (!res || !res.ok){
          if (chkEl) chkEl.checked = !nextEnabled;
          showPjErr((res && res.message) ? res.message : "save failed");
          try{ el("pjHint").textContent = "失敗"; }catch(e){}
          return;
        }

        // updatedAt 表示だけ差し替え
        const tr = document.querySelector(`tr[data-pid="${CSS.escape(pid)}"]`);
        const updCell = tr ? tr.querySelector("td.pjUpdatedAt") : null;
        const updatedAt = String(res.updatedAt || "").trim();
        if (updCell && updatedAt) updCell.textContent = updatedAt;

        // キャッシュ更新（Projectsタブ内整合）
        const hit = (__PJS_ALL__ || []).find(x => String(x.projectId||"").trim() === pid);
        if (hit){
          hit.tsukuyomiNudgeEnabled = !!res.enabled;
          if (updatedAt) hit.updatedAt = updatedAt;
        }

        try{
          el("pjHint").textContent = `保存完了：つくよみ=${res.enabled ? "ON" : "OFF"} ${pid}`;
        }catch(e){}
      })
      .admin_updateProjectTsukuyomiNudgeEnabled({
        projectId: pid,
        enabled: nextEnabled
      });
  }

function saveProjectStatus(projectId, btnEl){
  const pid = String(projectId || "").trim();
  if (!pid){
    showPjErr("projectId empty");
    return;
  }

  const stEl = el(`pjst_${pid}`);
  if (!stEl){
    showPjErr("status element not found");
    return;
  }

  const nextStatus = String(stEl.value || "").trim().toLowerCase();
  if (!nextStatus){
    showPjErr("nextStatus empty");
    return;
  }

  const tr = document.querySelector(`tr[data-pid="${CSS.escape(pid)}"]`);
  const updCell = tr ? tr.querySelector("td.pjUpdatedAt") : null;

  if (btnEl){
    btnEl.disabled = true;
    btnEl.textContent = "保存中...";
  }
  el("pjErr").style.display = "none";
  el("pjHint").textContent = `保存中... ${pid} -> ${nextStatus}`;

  google.script.run
    .withFailureHandler(err => {
      if (btnEl){
        btnEl.disabled = false;
        btnEl.textContent = "保存";
      }
      showPjErr(err?.message || String(err));
      markDirtyProjectStatus(pid);
    })
    .withSuccessHandler(res => {
      if (btnEl) btnEl.textContent = "保存";

      if (!res || !res.ok){
        if (btnEl) btnEl.disabled = false;
        showPjErr((res && res.message) ? res.message : "save failed");
        markDirtyProjectStatus(pid);
        return;
      }

      // orig更新（変更なし状態へ）
      stEl.dataset.orig = String(nextStatus).toLowerCase();
      markDirtyProjectStatus(pid);

      // ★updatedAt表示だけ差し替え（全体リロードしない）
      const updatedAt = (res.updatedAt || "").trim();
      if (updCell){
        updCell.textContent = updatedAt || "-";
      }

      // __PJS__（activeのみ）と __PJS_ALL__（全件）のキャッシュも更新
      const hit1 = (__PJS__ || []).find(x => String(x.projectId||"").trim() === pid);
      if (hit1){
        hit1.status = nextStatus;
        if (updatedAt) hit1.updatedAt = updatedAt;
      }

      const hit2 = (__PJS_ALL__ || []).find(x => String(x.projectId||"").trim() === pid);
      if (hit2){
        hit2.status = nextStatus;
        if (updatedAt) hit2.updatedAt = updatedAt;
      }


      el("pjHint").textContent = `保存完了：${pid} -> ${res.status || nextStatus}`;
    })
    .admin_updateProjectStatus({ projectId: pid, nextStatus: nextStatus });
}

          __PJS_ALL__ = res.projects;
          __PJS_ALL__ = sortProjectsActiveFirst_(__PJS_ALL__);
          renderProjects(__PJS_ALL__);
          return;
        }

        if (!res || !res.ok){
          const detail = (res === null || res === undefined) ? "null" : JSON.stringify(res);
          showPjErr((res && res.message) ? res.message : `load failed: ${detail}`);
          __PJS_ALL__ = [];
          renderProjects([]);
          return;

        __PJS_ALL__ = res.projects || [];

  function sortProjectsActiveFirst_(list){
    const rows = Array.isArray(list) ? list : [];
    return rows
      .map((p, i) => ({ p, i }))
      .sort((a, b) => {
        const sa = String(a.p?.status || "").trim().toLowerCase();
        const sb = String(b.p?.status || "").trim().toLowerCase();

        const ra = (sa === "active") ? 0 : 1;
        const rb = (sb === "active") ? 0 : 1;
        if (ra !== rb) return ra - rb;

        // 同ランク内は元の順序キープ（安定ソート）
        return a.i - b.i;
      })
      .map(x => x.p);
  }

    // uniq keep order

    const out = [];
    arr.forEach(t => { if (!seen.has(t)) { seen.add(t); out.push(t); }});

    }

    function evidenceText_(p){
      const ev = String(p.evidence || p.notes || "").trim();
      return ev;
    }

    function extractActionText_(p){
      const a1 = String(p.action || "").trim();
      if (a1) return a1;

      const a2 = String(p.decision || "").trim();
      if (a2) return a2;

      const notes = String(p.notes || "").trim();
      const m = notes.match(/(?:^|\n)\s*action\s*:\s*(.+)$/i);
      if (m && m[1]) return String(m[1]).trim();

      return "";
    }

    function escOneLineAttr_(s){
      return escapeHtmlAttr(String(s||"").replace(/[\r\n]+/g, " "));
    }

    function opButtons_(p, mode){
      const kind = String(p.__kind||"");
      if (kind === "notion_candidate"){
        const id = escOneLineAttr_(p.id || "");
        const dp = escOneLineAttr_(p.decisionPoint || "");
        const dc = escOneLineAttr_(p.decisionCriteria || "");
        const ac = escOneLineAttr_(extractActionText_(p) || "");
        return `

        `;
      }

      const protocolId = escapeHtmlAttr(p.protocolId || "");
      if (mode === "candidate"){
        return `
          <button class="btn" onclick="changeProtocolStatus('${protocolId}','confirmed', this)">確定</button>
          <button class="btn" style="border-color:#fecaca; color:#b91c1c;" onclick="changeProtocolStatus('${protocolId}','archived', this)">却下</button>
        `;

    }

    function rowHtml_(p, mode){
      const kind = String(p.__kind||"");

  function loadProtocols(){
    hideProtErr();

    try { buildProjectNameDatalist_(); } catch(e){}

    el("protHint").textContent = "loading...";
    el("protCandTbody").innerHTML = `<tr><td colspan="14" class="muted">loading...</td></tr>`;
    el("protConfTbody").innerHTML = `<tr><td colspan="14" class="muted">loading...</td></tr>`;

    ensureProjectsLoaded_(() => {
      google.script.run
        .withFailureHandler(err => showProtErr(err?.message || String(err)))
        .withSuccessHandler(resProt => {
          if (!resProt || !resProt.ok){
            const detail = (resProt === null || resProt === undefined) ? "null" : JSON.stringify(resProt);
            showProtErr((resProt && resProt.message) ? resProt.message : `load failed: ${detail}`);
            return;
          }

          const protRows = Array.isArray(resProt.protocols) ? resProt.protocols : [];
          const candidates = protRows.filter(p => String(p.status||"").toLowerCase() === "candidate");
          const confirmed  = protRows.filter(p => String(p.status||"").toLowerCase() === "confirmed");

          google.script.run
            .withFailureHandler(err => showProtErr(err?.message || String(err)))
            .withSuccessHandler(resCand => {
              const candRows = (resCand && resCand.ok && Array.isArray(resCand.candidates)) ? resCand.candidates : [];

              const pjMap = Object.create(null);
              (Array.isArray(__PJS__) ? __PJS__ : []).forEach(p=>{
                const id = String(p.projectId||"").trim();
                const name = String(p.projectName||"").trim();
                if (id && name) pjMap[id] = name;
              });

              const notionAsProtocols = candRows.map(c => {
                const pid = String(c.suggestedProjectId || "").trim();
                const pjName = pjMap[pid] || (pid ? pid : "");

                const evidence = (() => {
                  try{
                    const arr = JSON.parse(String(c.evidenceJson||"[]"));
                    if (!Array.isArray(arr) || !arr.length) return "";
                    return arr
                      .slice(0,5)
                      .map(x => String(x||"").trim())
                      .filter(x => x)
                      .join("\n");
                  } catch(e){
                    return String(c.evidenceJson||"").trim();
                  }
                })();

                return {
                  __kind: "notion_candidate",
                  id: String(c.candidateId||"").trim(),
                  status: "candidate",

                  projectId: pid,
                  projectName: pjName || (String(c.suggestedProjectName||"").trim() || ""),

                  decisionPoint: String(c.branchPoint||""),
                  decisionCriteria: String(c.criteria||""),
                  decision: String(c.decision||""), // ★これが無いとUIのアクションが空になる
                  evidence: evidence,

                  confidence: String(c.confidence||""),
                  importance: "1",
                  tags: String(c.suggestedTags||""),
                  sourceType: "notion",
                  sourceRef: String(c.sourcePageId||""),
                  createdAt: String(c.createdAt||""),
                  createdBy: ""
                };
              });

              const mergedCandidates = candidates.concat(notionAsProtocols);

              renderProtocolsTables_(mergedCandidates, confirmed);
              el("protHint").textContent = `candidate:${mergedCandidates.length} / confirmed:${confirmed.length}`;
            })
            .admin_listProtocolCandidates({ status:"new", limit: 300 });
        })
        .admin_listProtocols(getProtocolFilters_());
    });
  }

  function showCandErr(msg){
    el("candErr").style.display = "block";
    el("candErr").textContent = msg || "error";

  function hideCandErr(){
    el("candErr").style.display = "none";
    el("candErr").textContent = "";

  function ensureProjectsLoaded_(cb){
    if (Array.isArray(__PJS__) && __PJS__.length){
      cb && cb();
      return;
    }

    google.script.run
      .withFailureHandler(err => showCandErr(err?.message || String(err)))
      .withSuccessHandler(res => {
        // listProjects は {ok:true, projects:[...]} の形
        if (res && res.ok && Array.isArray(res.projects)){
          __PJS__ = res.projects || [];
        } else if (Array.isArray(res)) {
          // 念のため配列返しも許容（将来の互換）
          __PJS__ = res;
        } else if (res && Array.isArray(res.projects) && (res.ok === undefined)) {
          __PJS__ = res.projects;
        } else {
          __PJS__ = [];
        }

        try { buildProjectNameDatalist_(); } catch(e){}
        cb && cb();
      })
      .listProjects({ statusFilter:["active"], includeAll:false, limit:0 });
  }


  function syncNotionCandidates_(dry){
    hideCandErr();
    el("candHint").textContent = dry ? "Notion同期（dry）中..." : "Notion同期（書込）中...";

    ensureProjectsLoaded_(() => {
      google.script.run
        .withFailureHandler(err => showCandErr(err?.message || String(err)))
        .withSuccessHandler(res => {
          if (!res || !res.ok){
            showCandErr((res && res.message) ? res.message : "sync failed");
            return;
          }

          el("candHint").textContent =
            `同期完了: pages=${res.pages} / noContent=${res.pagesNoContent} / candidates=${res.candidates} / lastSync=${res.lastSyncIso || "-"}`;

          // ★NEW: 内容未入力アラート（コピペ忘れ検知）
          const noCnt = Number(res.pagesNoContent || 0);
          const ids = Array.isArray(res.noContentPageIds) ? res.noContentPageIds : [];
          if (noCnt > 0 && ids.length){

              `<div style="font-weight:900; margin-bottom:8px;">「内容」未入力の議事録がある</div>`,

    });

  function notionPageUrl_(pageId){
    const s = String(pageId||"").trim();
    if (!s) return "";
    const noHyphen = s.replaceAll("-", "");
    return "https://www.notion.so/" + noHyphen;
  }

  function getCandUiFlags_(){
    return {
      onlyLatest: !!el("candOnlyLatestRun")?.checked,
      onlyNotion: !!el("candOnlyNotion")?.checked,
      thinLowConf: !!el("candThinLowConf")?.checked,
      onlyUnknownPj: !!el("candOnlyUnknownPj")?.checked
    };
  }

  function applyCandFilters_(rows){
    const flags = getCandUiFlags_();
    let out = Array.isArray(rows) ? rows.slice() : [];

    const latestRun = String(__CAND_META__.lastRunId || "").trim()
      || (out.length ? String(out[0].runId || "").trim() : ""); // フォールバック（createdAt desc前提）

    if (flags.onlyLatest && latestRun){
      out = out.filter(c => String(c.runId||"").trim() === latestRun);
    }
    if (flags.onlyNotion){
      out = out.filter(c => String(c.sourceType||"").trim().toLowerCase() === "notion");
    }
    if (flags.onlyUnknownPj){
      out = out.filter(c => String(c.suggestedProjectId||"").trim().toLowerCase() === "unknown");
    }

    // thinLowConfは render 側でCSS適用する（フィルタじゃない）
    return out;
  }

  function applyCandFiltersAndRender_(){
    const filtered = applyCandFilters_(__CANDS__);
    renderCandidates(filtered);
  }

  function renderCandidates(list){
    const tb = el("candTbody");
    const rows = Array.isArray(list) ? list : [];

    const latestRun = String(__CAND_META__.lastRunId || "").trim()
      || (rows.length ? String(rows[0].runId || "").trim() : "");
    const metaLine = el("candMetaLine");
    if (metaLine){
      metaLine.textContent =
        `latestRunId: ${latestRun || "-"} / lastSync: ${String(__CAND_META__.lastSyncIso||"") || "-"} / stateUpdatedAt: ${String(__CAND_META__.stateUpdatedAt||"") || "-"}`;
    }

    if (!rows.length){
      tb.innerHTML = `<tr><td colspan="12" class="muted">候補なし</td></tr>`;
      el("candHint").textContent = `candidates: 0`;
      return;
    }

    const flags = getCandUiFlags_();

    // ★activeだけ
    const pjOpts = (Array.isArray(__PJS__) ? __PJS__ : [])
      .filter(p => String(p.status||"").trim().toLowerCase() === "active")
      .map(p => ({ id:String(p.projectId||"").trim(), name:String(p.projectName||"").trim() }))
      .filter(p => p.id && p.name);

    const pjHtml = (selectedId, selId) => {
      const opts = [`<option value="">（選択）</option>`]
        .concat(pjOpts.map(p => {
          const sel = (p.id === selectedId) ? "selected" : "";
          return `<option value="${escapeHtmlAttr(p.id)}" ${sel}>${escapeHtml(p.name)} (${escapeHtml(p.id)})</option>`;
        }));
      return `<select class="ctl" id="${escapeHtmlAttr(selId)}" style="width:240px">${opts.join("")}</select>`;
    };

    function confIsLow_(v){
      const n = Number(v);
      if (!isFinite(n)) return false;
      return n < 0.7;
    }

    tb.innerHTML = rows.map(c => {
      const candId = String(c.candidateId||"").trim();
      const candIdAttr = escapeHtmlAttr(candId);

      const conf = (c.confidence !== "" && c.confidence !== null && c.confidence !== undefined)
        ? String(c.confidence)
        : "-";

      const evText = (() => {
        try{
          const arr = JSON.parse(String(c.evidenceJson||"[]"));
          if (!Array.isArray(arr) || !arr.length) return "";
          return arr.slice(0,5).map(x => String(x||"").trim()).filter(x=>x).join(" / ");
        } catch(e){
          return String(c.evidenceJson||"").trim();
        }
      })();

      const pjSelId = `cand_pj_${candIdAttr}`;
      const impId = `cand_imp_${candIdAttr}`;
      const tagsId = `cand_tags_${candIdAttr}`;

      const srcUrl = notionPageUrl_(c.sourcePageId);

      const thin = (flags.thinLowConf && confIsLow_(c.confidence)) ? "candThin" : "";

      return `
        <tr class="${thin}">
          <td class="nowrap"><b>${escapeHtml(conf)}</b></td>

          <td class="noteCell">${escapeHtml(c.branchPoint||"")}</td>
          <td class="noteCell">${escapeHtml(c.criteria||"")}</td>
          <td class="noteCell"><pre class="muted" style="margin:0; white-space:pre-wrap;">${escapeHtml(evText||"")}</pre></td>

          <td class="nowrap">${pjHtml(String(c.suggestedProjectId||""), pjSelId)}</td>

          <td class="nowrap">
            <select class="ctl" id="${escapeHtmlAttr(impId)}" style="width:110px">
              <option value="1">★</option>
              <option value="2">★★</option>
              <option value="3">★★★</option>
            </select>
          </td>

          <td class="nowrap">
            <input class="ctl" id="${escapeHtmlAttr(tagsId)}" style="width:280px"
              placeholder="例: 事業計画,資本政策"
              value="${escapeHtmlAttr(String(c.suggestedTags||""))}" />
          </td>

          <td class="nowrap">
            <button class="btn" onclick="promoteCandidate('${candIdAttr}')">promote</button>
          </td>

          <td class="small nowrap">${escapeHtml(c.createdAt || "")}</td>
          <td class="small mono nowrap">${escapeHtml(c.runId || "")}</td>

          <td class="noteCell">
            <div class="small mono">pageId: ${escapeHtml(c.sourcePageId||"")}</div>
            <div class="small"><a href="${escapeHtmlAttr(srcUrl)}" target="_blank" rel="noopener noreferrer">Notionを開く</a></div>
          </td>

          <td class="mono nowrap">${escapeHtml(candId)}</td>
        </tr>
      `;
    }).join("");

    el("candHint").textContent = `candidates: ${rows.length}`;
  }


  function loadCandidates(){
    hideCandErr();
    el("candHint").textContent = "loading candidates...";
    el("candTbody").innerHTML = `<tr><td colspan="12" class="muted">loading...</td></tr>`;

    ensureProjectsLoaded_(() => {
      google.script.run
        .withFailureHandler(err => showCandErr(err?.message || String(err)))
        .withSuccessHandler(res => {
          if (!res || !res.ok){
            showCandErr((res && res.message) ? res.message : "load candidates failed");
            __CANDS__ = [];
            __CAND_META__ = { lastRunId:"", lastSyncIso:"", stateUpdatedAt:"" };
            renderCandidates([]);
            return;
          }

          __CANDS__ = res.candidates || [];
          const m = res.meta || {};
          __CAND_META__ = {
            lastRunId: String(m.lastRunId || ""),
            lastSyncIso: String(m.lastSyncIso || ""),
            stateUpdatedAt: String(m.stateUpdatedAt || "")
          };

          applyCandFiltersAndRender_();
        })
        .admin_listProtocolCandidates({ status:"new", limit: 200 });
    });
  }

  function promoteCandidate(candidateId){
    hideCandErr();
    const id = String(candidateId||"").trim();
    if (!id) { showCandErr("candidateId empty"); return; }

    const pjSel = el(`cand_pj_${id}`);
    const impEl = el(`cand_imp_${id}`);
    const tagsEl = el(`cand_tags_${id}`);

    const projectId = String(pjSel?.value || "").trim();
    const importance = String(impEl?.value || "1").trim();
    const tags = String(tagsEl?.value || "").trim();

    if (!projectId){
      showCandErr("promote先PJが未選択");
      return;
    }

    const ok = window.confirm(`promoteする？\ncandidateId=${id}\nprojectId=${projectId}`);
    if (!ok) return;

    el("candHint").textContent = `promote中... ${id}`;

    google.script.run
      .withFailureHandler(err => showCandErr(err?.message || String(err)))
      .withSuccessHandler(res => {
        if (!res || !res.ok){
          showCandErr((res && res.message) ? res.message : "promote failed");
          return;
        }
        el("candHint").textContent = `promote完了：protocolId=${res.protocolId || "-"}`;
        loadCandidates();
        loadProtocols();
      })
      .admin_promoteProtocolCandidate({
        candidateId: id,
        projectId: projectId,
        tags: tags,
        importance: importance
      });
  }

      inp.value = String(opt.defaultValue || "");

      hint.textContent = String(opt.hint || "");

      inp.value = "";

  function addTagFromGenreInput_(){

    // ★マスタ未登録でもそのまま追加（LLMが増やす前提なので縛らない）

  // ===== LLM Context tags master (datalist + chips) =====
  let __CTX_TAGS__ = [];

  function fillCtxTagDatalist_(){
    const dl = el("ctxTagDatalist");
    if (!dl) return;

    const tags = Array.isArray(__CTX_TAGS__) ? __CTX_TAGS__ : [];
    const uniq = Array.from(new Set(tags.map(t => String(t||"").trim()).filter(x=>x)));

    dl.innerHTML = uniq
      .sort((a,b)=>a.localeCompare(b,"ja"))
      .map(t => `<option value="${escapeHtmlAttr(t)}"></option>`)
      .join("");
  }

  function getCtxTags_(){
    const v = (el("ctxNewTagsHidden")?.value || "").trim();
    if (!v) return [];
    const arr = v.split(",").map(x=>String(x||"").trim()).filter(x=>x);
    const seen = new Set();
    const out = [];
    arr.forEach(t => { if (!seen.has(t)) { seen.add(t); out.push(t); }});
    return out;
  }

  function setCtxTags_(tags){
    const arr = Array.isArray(tags) ? tags : [];
    if (el("ctxNewTagsHidden")) el("ctxNewTagsHidden").value = arr.join(",");
  }

  function renderCtxTagChips_(){
    const wrap = el("ctxNewTagsChips");
    if (!wrap) return;

    const tags = getCtxTags_();
    if (!tags.length){
      wrap.innerHTML = `<span class="pill gray">（未設定）</span>`;
      return;
    }

    wrap.innerHTML = tags.map(t => `
      <span class="pill" style="margin-right:6px; margin-bottom:6px; display:inline-flex; align-items:center; gap:6px;">
        ${escapeHtml(t)}
        <button class="btn" style="padding:2px 8px; font-weight:900;"
          onclick="removeCtxTag_('${escapeHtmlAttr(t)}')">×</button>
      </span>
    `).join("");
  }

  function addCtxTag_(tag){
    const t = String(tag||"").trim();
    if (!t) return;

    const tags = getCtxTags_();
    if (!tags.includes(t)) tags.push(t);

    setCtxTags_(tags);
    renderCtxTagChips_();
  }

  function removeCtxTag_(tag){
    const t = String(tag||"").trim();
    const tags = getCtxTags_().filter(x => x !== t);
    setCtxTags_(tags);
    renderCtxTagChips_();
  }

  function addCtxTagFromInput_(){
    const inp = el("ctxNewTagInput");
    if (!inp) return;

    const raw = String(inp.value||"").trim();
    if (!raw) return;

    addCtxTag_(raw);

    // サジェスト体験だけ良くする（即サーバ保存はしない）
    if (!(__CTX_TAGS__ || []).some(t => String(t||"").trim() === raw)){
      __CTX_TAGS__.push(raw);
      fillCtxTagDatalist_();
    }

    inp.value = "";

  function ctxFillTagPick_(){

    const uniq = Array.from(new Set(tags.map(t=>String(t||"").trim()).filter(x=>x)))

    sel.innerHTML = `<option value="">（選択）</option>` + uniq.map(t =>

  function ctxTagsFromHidden_(hiddenId){
    const v = (document.getElementById(hiddenId)?.value || "").trim();
    if (!v) return [];
    const arr = v.split(",").map(x=>String(x||"").trim()).filter(x=>x);
    const seen = new Set();
    const out = [];
    arr.forEach(t=>{ if(!seen.has(t)){ seen.add(t); out.push(t);} });
    return out;
  }

  function ctxSetHidden_(hiddenId, tags){
    const arr = Array.isArray(tags) ? tags : [];
    const elh = document.getElementById(hiddenId);
    if (elh) elh.value = arr.join(",");
  }

  function ctxRenderChips_(wrapId, hiddenId, removeFnName){

        function initResizableColumns_(tableId){
    const tbl = el(tableId);
    if (!tbl) return;

    const keyPrefix = "colw:" + tableId + ":";

    const ths = tbl.querySelectorAll("thead th");
    ths.forEach((th, idx) => {
      // handleを二重に付けない
      if (th.querySelector(".resizeHandle")) return;

      // 保存済み幅を反映
      const colKey = th.getAttribute("data-colkey") || String(idx);
      const saved = localStorage.getItem(keyPrefix + colKey);
      if (saved){
        th.style.width = saved + "px";
      }

      // ハンドル追加
      const h = document.createElement("div");
      h.className = "resizeHandle";
      th.appendChild(h);

      let startX = 0;
      let startW = 0;

      h.addEventListener("mousedown", (e) => {
        e.preventDefault();
        startX = e.clientX;
        startW = th.getBoundingClientRect().width;

        const onMove = (ev) => {
          const dx = ev.clientX - startX;
          const w = Math.max(80, Math.round(startW + dx));
          th.style.width = w + "px";
        };

        const onUp = (ev) => {
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);

          const w = Math.round(th.getBoundingClientRect().width);
          localStorage.setItem(keyPrefix + colKey, String(w));
        };

        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    });
  }

  function cxFillRowTagPick_(rowId){
    const sel = el(`cx_tagPick_${rowId}`);
    if (!sel) return;

    const tags = Array.isArray(__CTX_TAGS__) ? __CTX_TAGS__ : [];
    const uniq = Array.from(new Set(tags.map(t=>String(t||"").trim()).filter(x=>x)))
      .sort((a,b)=>a.localeCompare(b,"ja"));

    sel.innerHTML = `<option value="">（選択）</option>` + uniq.map(t =>
      `<option value="${escapeHtmlAttr(t)}">${escapeHtml(t)}</option>`
    ).join("");

  function cxTagsFromInput_(rowId){
    const v = (el(`cx_tags_${rowId}`)?.value || "").trim();
    if (!v) return [];
    const arr = v.split(",").map(x=>String(x||"").trim()).filter(x=>x);
    const seen = new Set();
    const out = [];
    arr.forEach(t=>{ if(!seen.has(t)){ seen.add(t); out.push(t);} });
    return out;
  }

  function cxSetTagsToInput_(rowId, tags){
    const arr = Array.isArray(tags) ? tags : [];
    const inp = el(`cx_tags_${rowId}`);
    if (inp) inp.value = arr.join(",");
  }

  function cxAddTagToRow_(rowId){
    const sel = el(`cx_tagPick_${rowId}`);
    if (!sel) return;
    const pick = String(sel.value||"").trim();
    if (!pick) return;

    const tags = cxTagsFromInput_(rowId);
    if (!tags.includes(pick)) tags.push(pick);
    cxSetTagsToInput_(rowId, tags);
    cxRenderRowChips_(rowId);

    sel.value = "";

  function cxRemoveTagFromRow_(rowId, tag){
    const t = String(tag||"").trim();
    const tags = cxTagsFromInput_(rowId).filter(x=>x !== t);
    cxSetTagsToInput_(rowId, tags);
    cxRenderRowChips_(rowId);
  }

  function runCodeSearch(){
    hideCodeErr();

    const q = String(el("codeQuery")?.value || "").trim();
    const includeRefs = !!el("codeIncludeRefs")?.checked;

    if (!q){
      showCodeErr("query empty");
      return;
    }

    el("codeHint").textContent = "検索中...";
    el("codeTbody").innerHTML = `<tr><td colspan="5" class="muted">loading...</td></tr>`;

    google.script.run
      .withFailureHandler(err => {
        showCodeErr(err?.message || String(err));
        el("codeHint").textContent = "失敗";
        el("codeTbody").innerHTML = `<tr><td colspan="5" class="muted">error</td></tr>`;
      })
      .withSuccessHandler(res => {
        if (!res || !res.ok){
          showCodeErr((res && res.message) ? res.message : "search failed");
          el("codeHint").textContent = "見つからない";
          el("codeTbody").innerHTML = `<tr><td colspan="5" class="muted">not found</td></tr>`;
          return;
        }

        const rows = Array.isArray(res.matches) ? res.matches : [];
        el("codeHint").textContent = `hits: ${rows.length}`;

        if (!rows.length){
          el("codeTbody").innerHTML = `<tr><td colspan="5" class="muted">not found</td></tr>`;
          return;
        }

        el("codeTbody").innerHTML = rows.map(r => {
          const kind = String(r.kind || "");
          const file = String(r.fileName || "");
          const line = String(r.line || "");
          const snip = String(r.snippet || "");

          const copyText = `${kind}\t${file}:${line}\t${snip}`.replace(/[\r\n]+/g," ");
          const copyAttr = escapeHtmlAttr(copyText);

          return `
            <tr>
              <td class="nowrap">${pill(kind)}</td>
              <td class="mono nowrap">${escapeHtml(file)}</td>
              <td class="mono nowrap">${escapeHtml(line)}</td>
              <td class="noteCell mono">${escapeHtml(snip)}</td>
              <td class="nowrap">
                <button class="btn" onclick="copyToClipboard('${copyAttr}')">Copy</button>
              </td>
            </tr>
          `;
        }).join("");
      })
      .admin_searchCode({
        query: q,
        includeReferences: includeRefs,
        maxResults: 300
      });
  }

  function copyToClipboard(text){
    const s = String(text || "");
    try{
      navigator.clipboard.writeText(s);
    } catch(e){
      // fallback
      try{
        const ta = document.createElement("textarea");
        ta.value = s;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      } catch(e2){}
    }
  }

  function normalizeFreeePartnerName_(s){
    // ★まずは完全一致ベース（事故らせない）
    // 将来ゆるくしたくなったらここで正規化を拡張すればいい
    return String(s || "").trim();
  }

  function findFreeePartnerIdsByName_(name){
    const key = normalizeFreeePartnerName_(name);
    if (!key) return [];

    const rows = Array.isArray(__FREEE_PARTNERS__) ? __FREEE_PARTNERS__ : [];
    const hits = [];

    for (let i=0; i<rows.length; i++){
      const n = normalizeFreeePartnerName_(rows[i]?.name);
      if (n === key){
        const id = String(rows[i]?.id || "").trim();
        if (id) hits.push(id);
      }
    }
    // uniq
    return Array.from(new Set(hits));
  }

  function syncFreeeIdFromClientName_(projectId){
    const pid = String(projectId || "").trim();
    if (!pid) return;

    const clEl = el(`pjcl_${pid}`);
    const frEl = el(`pjfreee_${pid}`);
    if (!clEl || !frEl) return;

    const clientName = String(clEl.value || "").trim();
    if (!clientName) return;

    const ids = findFreeePartnerIdsByName_(clientName);

    if (ids.length === 1){
      const nextId = String(ids[0] || "").trim();

      // ★ユーザーが既にfreeeIdを手で入れてた場合は上書きしない（事故防止）
      const curId = String(frEl.value || "").trim();
      if (!curId){
        frEl.value = nextId;
      }

      // ★origは更新しない（保存まではdirtyにしたい）
      markDirtyProjectRow(pid);

    } else if (ids.length >= 2){
      // 同名が複数はfreee側でよく起きるので自動確定しない
      // ここは "手で入れてね" に寄せる（安全第一）
      try{
        el("pjHint").textContent = `freee取引先が同名で複数ある：${clientName}（freeeIdは手入力して）`;
      }catch(e){}
    }

  function payoutsFillYmSelect(){
    const sel = el("payoutYm");
    if (!sel) return;

    // JST基準でymNow
    const now = new Date();
    const jst = new Date(now.getTime() + 9*60*60*1000);
    const y = jst.getUTCFullYear();
    const m = jst.getUTCMonth() + 1;
    const ymNow = String(y) + String(m).padStart(2,"0");

    sel.innerHTML = `<option value="${escapeHtmlAttr(ymNow)}" selected>${escapeHtml(ymNow)}</option>`;

    callGAS_(
      "admin_listPayoutYmCandidates",
      [],
      (res) => {
        try{
          const list = (res && res.ok && Array.isArray(res.yms)) ? res.yms : [];
          const yms = list.map(x => String(x||"").trim()).filter(x => /^\d{6}$/.test(x));
          const uniq = Array.from(new Set(yms));
          const finalList = uniq.length ? uniq : [ymNow];

          // 表示は新しい順
          const desc = finalList.slice().sort((a,b)=>b.localeCompare(a));
          sel.innerHTML = desc.map(v => `<option value="${escapeHtmlAttr(v)}">${escapeHtml(v)}</option>`).join("");

          // 選択は「未振込が残る最古」
          const asc = finalList.slice().sort((a,b)=>a.localeCompare(b));
          payoutsPickOldestUnpaidYm_(asc, (pickedYm) => {
            const useYm = pickedYm || ymNow || (desc[0] || "");
            if (useYm) sel.value = useYm;
            payoutsRefresh();
          });

        } catch(e){
          try{ sel.value = ymNow; } catch(_) {}
          payoutsRefresh();
        }
      },
      (_err) => {
        try{ sel.value = ymNow; } catch(_) {}
        payoutsRefresh();
      }
    );
  }

  function payoutsPickOldestUnpaidYm_(ymsAsc, cb){
    const list = Array.isArray(ymsAsc) ? ymsAsc.slice() : [];
    let i = 0;

    const step = () => {
      if (i >= list.length){
        cb && cb("");
        return;
      }
      const ym = String(list[i] || "").trim();
      i++;

      callGAS_(
        "admin_getPayoutTable",
        [{ ym }],
        (res) => {
          try{
            const rows = (res && res.ok && Array.isArray(res.rows)) ? res.rows : [];
            const hasUnpaid = rows.some(r => {
              const total = Number(r.totalYen || 0);
              if (!isFinite(total) || total <= 0) return false;
              const paid = !!(r.paid && r.paid.isPaid);
              return !paid;
            });

            if (hasUnpaid){
              cb && cb(ym);
              return;
            }
            step();
          } catch(e){
            step();
          }
        },
        (_err) => step()
      );
    };

    step();
  }

  // ★未振込が残る最古ymを探す（無ければ "" を返す）
  function payoutsPickOldestUnpaidYm_(ymsAsc, cb){
    const list = Array.isArray(ymsAsc) ? ymsAsc.slice() : [];
    let i = 0;

    const step = () => {
      if (i >= list.length){
        cb && cb("");
        return;
      }
      const ym = String(list[i] || "").trim();
      i++;

      callGAS_(
        "admin_getPayoutTable",
        [{ ym }],
        (res) => {
          try{
            const rows = (res && res.ok && Array.isArray(res.rows)) ? res.rows : [];
            // “未振込が残る” 判定：totalYen>0 かつ paid.isPaid が false の行が1つでもある
            const hasUnpaid = rows.some(r => {
              const total = Number(r.totalYen || 0);
              if (!isFinite(total) || total <= 0) return false;
              const paid = !!(r.paid && r.paid.isPaid);
              return !paid;
            });

            if (hasUnpaid){
              cb && cb(ym);
              return;
            }
            step();
          } catch(e){
            step();
          }
        },
        (_err) => {
          step();
        }
      );
    };

    step();
  }

  function payoutsOnShow(){
    try{
      payoutsFillYmSelect();
      payoutsRefresh();
    } catch(e){
      payoutsShowErr(e?.message || String(e));
    }
  }

  function payoutsRefresh(){
    payoutsHideErr();

    const ym = String(el("payoutYm")?.value || "").trim();
    if (!ym || !/^\d{6}$/.test(ym)){
      payoutsShowErr("ym invalid（yyyymm）");
      return;
    }

    const hint = el("payoutHint");
    const tb = el("payoutTbody");
    if (hint) hint.textContent = `loading... ym=${ym}`;
    if (tb) tb.innerHTML = `<tr><td colspan="7" class="muted">loading...</td></tr>`;

    callGAS_(
      "admin_getPayoutTable",
      [{ ym }],
      (res) => {
        try{
          if (!res || !res.ok){
            payoutsShowErr((res && res.message) ? res.message : "load failed");
            payoutsSetCache([]);
            if (tb) tb.innerHTML = `<tr><td colspan="7" class="muted">load failed</td></tr>`;
            if (hint) hint.textContent = `failed: ym=${ym}`;
            return;
          }

          const rows = Array.isArray(res.rows) ? res.rows : [];
          payoutsSetCache(rows);

          const meta = res.meta || {};
          const gen = String(meta.generatedAtJst || "").trim() || "-";
          if (hint) hint.textContent = `ym=${ym} / rows=${rows.length} / generatedAt=${gen}`;

          payoutsRenderTable(__PAYOUT_ROWS__);
        } catch(e2){
          payoutsShowErr(e2?.message || String(e2));
          payoutsSetCache([]);
          if (tb) tb.innerHTML = `<tr><td colspan="7" class="muted">render error</td></tr>`;
        }
      },
      (err) => {
        payoutsShowErr(err?.message || String(err));
        payoutsSetCache([]);
        if (tb) tb.innerHTML = `<tr><td colspan="7" class="muted">error</td></tr>`;
        if (hint) hint.textContent = `failed: ym=${ym}`;
      }
    );
  }

  function payoutsRenderTable(rows){
    const tb = el("payoutTbody");
    if (!tb) return;

    const list = Array.isArray(rows) ? rows : [];
    if (!list.length){
      tb.innerHTML = `<tr><td colspan="7" class="muted">該当なし</td></tr>`;
      return;
    }

    function yen(n){
      const x = Number(n || 0);
      if (!isFinite(x)) return "-";
      return x.toLocaleString("ja-JP") + "円";
    }

    function payoutLinesHtml(payouts, totalYen){
      const arr = Array.isArray(payouts) ? payouts : [];
      const lines = arr.map(p => {
        const pn = String(p.projectName || p.projectId || "").trim();
        const y = yen(p.yen);
        return `<div class="row" style="justify-content:space-between; gap:10px;">
          <span>${escapeHtml(pn)}</span>
          <b class="mono">${escapeHtml(y)}</b>
        </div>`;
      }).join("");

      const total = `<div style="border-top:1px solid var(--line); margin-top:8px; padding-top:8px;" class="row">
        <span class="muted">合計</span>
        <b class="mono">${escapeHtml(yen(totalYen))}</b>
      </div>`;

      return `<div style="min-width:260px;">${lines || `<span class="muted">-</span>`}${total}</div>`;
    }

    function mark_(st){
      const s = String(st || "").trim().toLowerCase();
      const ok = (s === "done");
      return ok
        ? `<span class="pill" style="border-color:#34d399; color:#065f46; font-weight:900;">✅</span>`
        : `<span class="pill gray" style="font-weight:900;">⚠️</span>`;
    }

    function pjStatusHtml(payouts){
      const arr = Array.isArray(payouts) ? payouts : [];
      if (!arr.length) return `<span class="muted">-</span>`;

      return arr.map(p => {
        const pn = String(p.projectName || p.projectId || "").trim();
        const r = String(p.routineStatus || "pending").trim();
        const c = String(p.cashInStatus || "pending").trim();
        return `<div style="margin-bottom:8px;">
          <div><b>${escapeHtml(pn)}</b></div>
          <div class="small rowLeft" style="gap:8px; margin-top:4px;">
            <span class="muted">月次</span>${mark_(r)}
            <span class="muted">入金</span>${mark_(c)}
          </div>
        </div>`;
      }).join("");
    }

    tb.innerHTML = list.map(r => {
      const memberId = String(r.memberId || "").trim();
      const codeName = String(r.codeName || "").trim();

      const payouts = Array.isArray(r.payouts) ? r.payouts : [];
      const totalYen = r.totalYen;

      const notice = r.notice || {};
      const pdfUrl = String(notice.pdfUrl || "").trim();

      const canIssue = !!r.canIssueNotice;
      const canSend  = !!r.canSendNotice || (String((notice && notice.status) || "").trim() === "issued");
      const canMarkPaid = !!r.canMarkPaid;
      const isPaid = !!(r.paid && r.paid.isPaid);

      const statusId = `payoutIssueStatus_${escapeHtmlAttr(memberId)}`;

      const issueBtn = `
        <button class="btn" ${canIssue ? "" : "disabled"} onclick="payoutsIssueNotice('${escapeHtmlAttr(memberId)}', this)">発行</button>
        <div class="payoutInlineStatus" id="${statusId}"></div>
      `;

      const pdfBtn = pdfUrl
        ? `<button class="btn" onclick="window.open('${escapeHtmlAttr(pdfUrl)}','_blank')">PDF</button>`
        : `<button class="btn" disabled>PDF</button>`;

      const sendBtn  = `<button class="btn" ${canSend ? "" : "disabled"} onclick="payoutsSendNotice('${escapeHtmlAttr(memberId)}')">送付</button>`;

      const reasonText = Array.isArray(r.blockReasons) && r.blockReasons.length
        ? r.blockReasons.join(" / ")
        : "";

      const paidChk = `
        <input type="checkbox"
          ${isPaid ? "checked" : ""}
          ${canMarkPaid ? "" : "disabled"}
          title="${escapeHtmlAttr(reasonText)}"
          onchange="payoutsTogglePaid('${escapeHtmlAttr(memberId)}', this)"
        />
      `;

      return `
        <tr>
          <td class="mono nowrap">
            <b>${escapeHtml(codeName || "-")}</b>
            <div class="small">${escapeHtml(memberId || "")}</div>
          </td>

          <td class="noteCell">${payoutLinesHtml(payouts, totalYen)}</td>

          <td class="nowrap">${issueBtn}</td>
          <td class="nowrap">${pdfBtn}</td>
          <td class="nowrap">${sendBtn}</td>

          <td class="noteCell">${pjStatusHtml(payouts)}</td>

          <td class="nowrap">${paidChk}</td>
        </tr>
      `;
    }).join("");
  }

  function payoutsIssueNotice(memberId, btnEl){
    payoutsHideErr();

    const mid = String(memberId || "").trim();
    if (!mid) return payoutsShowErr("memberId empty");

    const ym = String(el("payoutYm")?.value || "").trim();
    if (!ym) return payoutsShowErr("ym empty");

    const row = __PAYOUT_ROW_MAP__[mid];
    if (!row) return payoutsShowErr("row not found (refresh first)");

    const who = row.codeName || mid;
    const total = Number(row.totalYen || 0);

    const bodyHtml = [
      `<div style="font-weight:900; margin-bottom:8px;">支払通知書を発行する？</div>`,
      `<div class="small">member: <b>${escapeHtml(who)}</b></div>`,
      `<div class="small">ym: <b class="mono">${escapeHtml(ym)}</b></div>`,
      `<div class="small">金額: <b>${escapeHtml(total.toLocaleString("ja-JP"))}円</b></div>`
    ].join("");

    openAppModal_(
      "支払通知書 発行",
      bodyHtml,
      () => {
        const st = el(`payoutIssueStatus_${mid}`);
        if (st){
          st.className = "payoutInlineStatus busy";
          st.textContent = "発行中…";
        }
        if (btnEl){
          btnEl.disabled = true;
          btnEl.textContent = "発行中...";
        }

        callGAS_(
          "admin_issuePayoutNotice",
          [{ memberId: mid, ym }],
          (res) => {
            if (btnEl){
              btnEl.disabled = false;
              btnEl.textContent = "発行";
            }
            if (!res || !res.ok){
              if (st){
                st.className = "payoutInlineStatus err";
                st.textContent = "失敗";
              }
              payoutsShowErr(res?.message || "issue failed");
              return;
            }

            row.notice = row.notice || {};
            row.notice.status = "issued";
            row.notice.freeeId = String(res.freeeNoticeId || "");
            row.notice.freeeNo = String(res.freeeNoticeNo || "");
            row.notice.pdfUrl = String(res.pdfUrl || "");
            row.notice.issuedAtJst = String(res.issuedAtJst || "");

            row.canSendNotice = true;

            if (st){
              st.className = "payoutInlineStatus";
              st.textContent = "発行完了";
            }

            payoutsRenderTable(__PAYOUT_ROWS__);
          },
          (err) => {
            if (btnEl){
              btnEl.disabled = false;
              btnEl.textContent = "発行";
            }
            if (st){
              st.className = "payoutInlineStatus err";
              st.textContent = "失敗";
            }
            payoutsShowErr(err?.message || String(err));
          }
        );
      },
      { input:false }
    );
  }

  function payoutsSendNotice(memberId){
    payoutsHideErr();

    const mid = String(memberId || "").trim();
    if (!mid) return payoutsShowErr("memberId empty");

    const ym = String(el("payoutYm")?.value || "").trim();
    if (!ym) return payoutsShowErr("ym empty");

    const row = __PAYOUT_ROW_MAP__[mid];
    if (!row) return payoutsShowErr("row not found (refresh first)");

    const to = String(row.email || "").trim();
    if (!to){
      payoutsShowErr("email empty（DB_Members.email が空）");
      return;
    }

    const notice = row.notice || {};
    const status = String(notice.status || "none").trim();
    if (status !== "issued" && status !== "sent"){
      payoutsShowErr("支払通知書が未発行（先に「発行」）");
      return;
    }

    const pdfUrl = String(notice.pdfUrl || "").trim();
    const who = row.codeName || mid;

    const bodyHtml = [
      `<div style="font-weight:900; margin-bottom:8px;">支払通知書を送付する？</div>`,
      `<div class="small">宛先: <b>${escapeHtml(to)}</b></div>`,
      `<div class="small">member: <b>${escapeHtml(who)}</b></div>`,
      `<div class="small">ym: <b class="mono">${escapeHtml(ym)}</b></div>`,
      `<div class="small">PDF: ${pdfUrl ? "あり" : "未取得"}</div>`
    ].join("");

    openAppModal_(
      "支払通知書 送付",
      bodyHtml,
      () => {
        el("payoutHint").textContent = `送付中... ${to}`;

        callGAS_(
          "admin_sendPayoutNoticeMail",
          [{ to, ym, memberId: mid, pdfUrl }],
          (res) => {
            if (!res || !res.ok){
              payoutsShowErr(res?.message || "send failed");
              el("payoutHint").textContent = "失敗";
              return;
            }

            row.notice = row.notice || {};
            row.notice.status = "sent";
            row.notice.sentAtJst = String(res.sentAtJst || "");

            el("payoutHint").textContent = `送付完了：${to}`;
            payoutsRenderTable(__PAYOUT_ROWS__);
          },
          (err) => {
            payoutsShowErr(err?.message || String(err));
            el("payoutHint").textContent = "失敗";
          }
        );
      },
      { input:false }
    );
  }

  function payoutsTogglePaid(memberId, chk){
    payoutsHideErr();

    const mid = String(memberId || "").trim();
    if (!mid){
      payoutsShowErr("memberId empty");
      chk.checked = !chk.checked;
      return;
    }

    const ym = String(el("payoutYm")?.value || "").trim();
    if (!/^\d{6}$/.test(ym)){
      payoutsShowErr("ym invalid（yyyymm）");
      chk.checked = !chk.checked;
      return;
    }

    const row = __PAYOUT_ROW_MAP__[mid];
    if (!row){
      payoutsShowErr("row not found (refresh first)");
      chk.checked = !chk.checked;
      return;
    }

    // UI上の意図（チェック後の状態）
    const nextPaid = !!chk.checked;

    // 事故防止：未許可なら元に戻す
    if (!row.canMarkPaid){
      payoutsShowErr("この行は振込完了にできない（ゲート未達）");
      chk.checked = !nextPaid;
      return;
    }

    const who = row.codeName || mid;
    const ok = window.confirm(`振込完了を ${nextPaid ? "ON" : "OFF"} にする？\nmember=${who}\nym=${ym}`);
    if (!ok){
      chk.checked = !nextPaid;
      return;
    }

    el("payoutHint").textContent = `保存中... memberId=${mid} paid=${nextPaid ? "true" : "false"}`;

    callGAS_(
      "admin_setPayoutPaid",
      [{ ym, memberId: mid, isPaid: nextPaid, note: "" }],
      (res) => {
        if (!res || !res.ok){
          payoutsShowErr((res && res.message) ? res.message : "save failed");
          chk.checked = !nextPaid;
          el("payoutHint").textContent = "失敗";
          return;
        }

        // JSキャッシュへ反映（リロード無しでも表示整合）
        row.paid = row.paid || {};
        row.paid.isPaid = nextPaid;
        row.paid.checkedAtJst = String(res.checkedAtJst || "");
        row.paid.checkedBy = String(res.checkedBy || "");
        row.paid.note = String(res.note || "");

        el("payoutHint").textContent = `保存完了：${mid}`;
        payoutsRenderTable(__PAYOUT_ROWS__);
      },
      (err) => {
        payoutsShowErr(err?.message || String(err));
        chk.checked = !nextPaid;
        el("payoutHint").textContent = "失敗";
      }
    );
  }

  function payoutsEditBankInfo(memberId, codeName, bankText){
    const mid = String(memberId || "").trim();
    if (!mid){
      payoutsShowErr("memberId empty");
      return;
    }

    const name = String(codeName || "").trim() || mid;
    const current = String(bankText || "").trim();

    const bodyHtml = [
      `<div style="font-weight:900; margin-bottom:8px;">振込先情報 編集</div>`,
      `<div class="small muted" style="margin-bottom:10px;">member: <b>${escapeHtml(name)}</b> (${escapeHtml(mid)})</div>`,
      `<div class="ctlLabel">振込先（複数行OK）</div>`,
      `<textarea id="payoutBankEditText" class="ctl" style="width:100%; height:160px; resize:vertical; margin-top:6px;"`,
      `placeholder="例：\n三井住友銀行 渋谷支店\n普通 1234567\nヤマダ タロウ">${escapeHtml(current)}</textarea>`
    ].join("");

    openAppModal_(
      "振込先 編集",
      bodyHtml,
      () => {
        const next = String(el("payoutBankEditText")?.value || "").trim();

        payoutsHideErr();
        el("payoutHint").textContent = `保存中... memberId=${mid}`;

        callGAS_(
          "payoutUpdateMemberBankInfo",
          [{ memberId: mid, bankInfo: next }],
          (res) => {
            if (!res || !res.ok){
              payoutsShowErr((res && res.message) ? res.message : "save failed");
              return;
            }
            el("payoutHint").textContent = `保存完了：${mid}`;
            // 再読込して反映
            payoutsRefresh();
          },
          (err) => {
            payoutsShowErr(err?.message || String(err));
          }
        );
      },
      { input:false }
    );
  }

  function payoutsExportTsv(){
    payoutsHideErr();

    const ym = String(el("payoutYm")?.value || "").trim();
    if (!/^\d{6}$/.test(ym)){
      payoutsShowErr("ym invalid（yyyymm）");
      return;
    }

    const rows = Array.isArray(__PAYOUT_ROWS__) ? __PAYOUT_ROWS__ : [];
    if (!rows.length){
      payoutsShowErr("rows empty（先に更新）");
      return;
    }

    // 擬似メンバー除外（UIでも安全側）
    function isPseudoMember(r){
      const mid = String(r?.memberId || "").trim();
      if (mid === "ID017") return true;
      const em = String(r?.email || "").trim().toLowerCase();
      if (!em) return true;
      if (em.startsWith("info@")) return true;
      return false;
    }

    // bankText は人間向け自由文なので、TSV用には “そのまま1セル” に押し込む
    // （銀行インポート最適化は次段で bankInfoを構造化してから）
    const targets = rows.filter(r => {
      if (!r) return false;
      if (isPseudoMember(r)) return false;

      const total = Number(r.totalYen || 0);
      if (!isFinite(total) || total <= 0) return false;

      const hasLines = Array.isArray(r.payouts) && r.payouts.length > 0;
      if (!hasLines) return false;

      if (!r.canMarkPaid) return false;

      return true;
    });

    if (!targets.length){
      payoutsShowErr("TSV対象が0件（条件を満たす行がない）");
      return;
    }

    // ヘッダ
    const header = [
      "ym",
      "memberId",
      "codeName",
      "totalYen",
      "bankText"
    ];

    const lines = targets.map(r => {
      const bank = String(r.bankText || "").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
      // TSVなのでタブと改行は潰す（銀行情報は1行に畳む）
      const bankOne = bank.replace(/\t/g," ").replace(/\n+/g," / ").trim();

      return [
        ym,
        String(r.memberId || ""),
        String(r.codeName || ""),
        String(Math.trunc(Number(r.totalYen || 0))),
        bankOne
      ].join("\t");
    });

    const tsv = [header.join("\t")].concat(lines).join("\n");

    try{
      navigator.clipboard.writeText(tsv);
      el("payoutHint").textContent = `TSVコピーした：${targets.length}件（ym=${ym}）`;
    } catch(e){
      // fallback
      try{
        const ta = document.createElement("textarea");
        ta.value = tsv;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        el("payoutHint").textContent = `TSVコピーした：${targets.length}件（ym=${ym}）`;
      } catch(e2){
        payoutsShowErr("clipboard copy failed（ブラウザ制限っぽい）");
      }
    }
  }



</script>
