<!-- HomePage.html -->
<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { --bg:#fafafa; --card:#fff; --line:#eaeaea; --text:#111; --sub:#666; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial; margin:0; background:var(--bg); color:var(--text); }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 20px; }
      .title { margin:0; font-size: 22px; font-weight: 900; letter-spacing: .2px; }
      .subtitle { margin:6px 0 0; color:var(--sub); font-size: 12px; }

            .grid { margin-top: 16px; display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
            @media (max-width: 980px){ .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
            @media (max-width: 640px){ .grid { grid-template-columns: repeat(1, minmax(0, 1fr)); } }

            /* ★ viewモード：カードは少し大きくしてもOKだけど、列数は強制しない */
            body.viewMode .card { min-height: 220px; }

            /* ★セクション一覧は “普通の縦並び” */
            .sections{
              margin-top: 16px;
              display: block;
            }
      
      .card:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
      .card .h { font-weight: 900; margin:0; font-size: 18px; line-height: 1.25; }
      .card .meta { margin-top: 6px; color: var(--sub); font-size: 12px; display:block; }
      .pill { display:inline-flex; align-items:center; gap:6px; padding: 3px 8px; border-radius: 999px; border:1px solid var(--line); background:#fff; font-size:14px; }
      .pill b { font-weight: 800; }

      /* ★新規PJ登録カードを中央レイアウトに */
.newCard{
  border-style: dashed !important;
  display:flex !important;
  flex-direction: column !important;
  align-items:center !important;
  justify-content:center !important;
  gap: 14px !important;
  min-height: 180px !important; /* ★縦長でもバランス取る */
}

.plus{
  width: 58px !important;
  height: 58px !important;
  border-radius: 999px !important;
  border: 2px solid var(--line) !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  font-weight: 900 !important;
  font-size: 32px !important;
}

.newCardTitle{
  font-weight: 900;
  font-size: 16px;
}
.newCardSub{
  font-size: 12px;
  color: var(--sub);
}

/* ===== 全PJトグル（PJカード一覧の下に横幅いっぱい） ===== */
.fullWidthToggle{
  margin-top: 14px;
  width: 100%;
}

.fullWidthToggleBtn{
  width: 100%;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 14px;
  padding: 14px 12px;
  cursor: pointer;
  font-weight: 900;
  display:flex;
  align-items:center;
  justify-content:center;
}

.fullWidthToggleBtn:active{ transform: translateY(1px) scale(.99); }

.fullWidthToggleBtn .label{
  text-align:center;
  line-height: 1.1;
}

.fullWidthToggleBtn .arrow{
  margin-top: 4px;
  font-size: 12px;
  color: var(--sub);
  font-weight: 900;
}


/* ★新規PJ登録のフローティング＋（常時見える） */
.fab{
  position: fixed;
  right: 18px;
  bottom: 18px;
  width: 72px;
  height: 64px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: #111;
  color:#fff;
  font-weight: 900;
  font-size: 28px;
  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  gap: 2px;
  cursor:pointer;
  box-shadow: 0 20px 70px rgba(0,0,0,.18);
  z-index: 9999;
}
.fabLabel{
  font-size: 10px;
  font-weight: 800;
  opacity: .85;
  line-height: 1;
}

.fab:active{ transform: translateY(1px) scale(.99); }

      .muted { color: var(--sub); font-size: 12px; margin-top: 10px; }

      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding: 18px; }
      .modal { width: min(560px, 100%); background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 16px; box-shadow: 0 20px 70px rgba(0,0,0,.25); }
      .mTop { display:flex; justify-content:space-between; align-items:center; gap: 10px; }
      .mTitle { margin:0; font-weight: 900; font-size: 16px; }
      .x { border:1px solid var(--line); background:#fff; border-radius: 10px; padding: 6px 10px; cursor:pointer; font-weight: 800; }
      .row { margin-top: 12px; display:flex; gap: 10px; }
      .row > div { flex:1; }
      label { display:block; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        background: #fff;
        outline: none;
        box-sizing: border-box;
      }
      textarea { min-height: 90px; resize: vertical; }
      .btns { display:flex; justify-content:flex-end; gap: 10px; margin-top: 14px; }
      .btn { border:1px solid var(--line); background:#fff; border-radius: 12px; padding: 10px 12px; cursor:pointer; font-weight: 900; }
      .btnPrimary { background: #111; color: #fff; border-color:#111; }
      .err { margin-top: 10px; color:#b00020; font-size: 12px; display:none; }
      .loading { opacity: .6; pointer-events: none; }
            /* ★後ろの .card 定義が勝つので、ここで「クリックできるカード」に揃える */
      .card { 
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        cursor: pointer; /* ★ default → pointer */
        transition: transform .06s ease, box-shadow .06s ease;
        box-shadow: 0 1px 0 rgba(0,0,0,.02);
        min-height: 92px;
        display:flex;
        flex-direction: column;
        justify-content: space-between;
      }



      .rowTop { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
      .badge { font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:#fff; white-space:nowrap; font-weight:900; }
      .sec { margin-top:10px; }
      .secLabel { font-size:11px; color:var(--sub); font-weight:900; letter-spacing:.02em; }
      .secBody { margin-top:6px; font-size:13px; }
      .remind { margin-top:6px; padding:8px 10px; border-radius:12px; background:#f9fafb; border:1px solid var(--line); }
      .remindOver { border-color:#fecaca; background:#fff1f2; }
      .linkLike { text-decoration:none; font-weight:900; }
      .summaryRow { font-size:12px; color:#374151; margin-top:4px; }
      .btnRow { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
      .btnMini { border:1px solid var(--line); background:#fff; border-radius:12px; padding:8px 10px; cursor:pointer; font-weight:900; font-size:13px; }
      .btnMiniPrimary { background:#111; color:#fff; border-color:#111; }

            .splitClick { margin-top: 10px; }
      .monthlyBox {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background:#fff;
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease;
      }
      .monthlyBox:hover {
        border-color:#4f46e5;
        background:#f5f7ff;
      }

      /* ★Billingと同じノリで、ダッシュボードでも締切近い/超過を色で見せる */
      /*HomePage.html：monthlyBox を黄/赤で枠色にする & 右上ヒントを危険度にする */
      .monthlyBox.warn{
        border-color:#f59e0b;
        background:#fff7ed;
      }
      .monthlyBox.bad{
        border-color:#ef4444;
        background:#fff1f2;
      }
      


      /* セクションタイトル（月次ルーティン / PJチャーター共通） */
      .sectionTitle {
        font-weight: 900;
        font-size: 16px;          /* ★デカく */
        color: var(--text);       /* ★薄グレーやめて読みやすく */
        letter-spacing: .02em;
      }

      /* ★月次ヘッダ：ステータスを次行・左寄せに */
      .monthlyHeadTop{
        width:100%;
      }

      .monthlyHintRow{
        margin-top: 4px;
        width:100%;
        display:flex;
        justify-content:flex-start;
      }

      .monthlyHint{
        font-size:11px;
        color:var(--sub);
        font-weight:900;
      }

      .hintWarn{
        color:#b45309;   /* 濃い橙（危機感） */
      }

      .hintBad{
        color:#b91c1c;   /* 濃い赤 */
      }




      .monthlyHead { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
      .monthlyTitle { /* 互換のため残す（HTML側はsectionTitle使う） */ font-weight:900; font-size:16px; color:var(--text); letter-spacing:.02em; }
      .monthlyHint { font-size:11px; color:var(--sub); }

      .charterHead { display:flex; justify-content:space-between; align-items:center; gap:10px; }


      .taskList { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
      .taskItem {
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:10px;
        padding:8px 10px;
        border-radius:10px;
        border:1px solid var(--line);
        background:#fafafa;
        cursor: pointer;          /* ★ボタン化 */
        transition: transform .06s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
      }

      .taskItem:active{ transform: translateY(1px); }

      /* ★未タスクの青後光（Home版） */
      /* ★Home：次にやる1タスクだけ光らせる（静的・固定） */
      .taskItem.nextGlow{
        position: relative;
      }

      .taskItem.nextGlow::after{
        content:"";
        position:absolute;
        inset: 0;
        border-radius: 12px;
        pointer-events:none;

        box-shadow: 0 0 0 4px rgba(59,130,246,.65);
        opacity: .25;
        animation: glowSoft 4.8s ease-in-out infinite;
      }

      @keyframes glowSoft{
        0%,100% { opacity:.18; }
        50%     { opacity:.85; }
      }

      @keyframes todoPulse{
        0%,100%{ box-shadow: 0 0 0 4px rgba(59,130,246,.20), 0 0 20px rgba(59,130,246,.28); }
        50%{    box-shadow: 0 0 0 8px rgba(59,130,246,.30), 0 0 34px rgba(59,130,246,.42); }
      }


      .taskItem:hover {
        background:#fafafa;       /* ★ 変化なし（もしくはこのhover行ごと削除でもOK） */
      }

      .taskLeft { display:flex; gap:8px; align-items:center; }
      .taskName { font-size:13px; font-weight:800; }
      .taskDue { font-size:11px; color:var(--sub); }

      .statusPill { font-size:11px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); background:#fff; font-weight:900; white-space:nowrap; }

      .pjTextBox {
        margin-top:10px;
        border:1px solid var(--line);
        border-radius:12px;
        padding:10px 12px;
        background:#fff;
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease;
      }
      .pjTextBox:hover {
        border-color:#4f46e5;
        background:#f5f7ff;
      }

      .pjLabel { font-size:11px; color:var(--sub); font-weight:900; letter-spacing:.02em; }
      .pjText { margin-top:6px; font-size:13px; white-space:pre-wrap; }
      .pjText.muted { color:var(--sub); }
      /* ===== OS Insight (Home only) ===== */
      .osInsightWrap{
        position: sticky;
        top: 12px;
        z-index: 5;
        margin-top: 14px;
        margin-bottom: 10px;
        pointer-events: none; /* 全体は邪魔しない */
      }
      .osInsight{
        pointer-events: auto; /* 中身はクリックできる余地を残す（次フェーズ用） */
        display: inline-flex;
        align-items: flex-start;
        gap: 10px;
        max-width: min(720px, 100%);
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(245,246,248,.92);
        border: 1px solid rgba(0,0,0,.06);
        box-shadow: 0 10px 40px rgba(0,0,0,.08);
        backdrop-filter: blur(6px);
      }
      .osInsight .tail{
        width: 0; height: 0;
        border: 8px solid transparent;
        border-right-color: rgba(245,246,248,.92);
        margin-top: 10px;
        filter: drop-shadow(0 1px 0 rgba(0,0,0,.06));
      }
      .osInsight .dot{
        font-size: 10px;
        margin-top: 4px;
        opacity: .9;
      }
      .osInsight .text{
        font-size: 13px;
        line-height: 1.45;
        color: #222;
        font-weight: 700;
        letter-spacing: .01em;
      }
      .osInsight .sub{
        margin-top: 2px;
        font-size: 11px;
        color: var(--sub);
        font-weight: 800;
      }
      .osInsight.loading .text{
        opacity: .65;
      }


    </style>
  </head>

    <script>
      const USER_EMAIL = "<?= userEmail ?>";
      const IS_ADMIN = <?= isAdmin ?>;

      // ★サーバに聞かずにURLを即組み立てる（クリック無反応の主犯を潰す）
      let BASE_URL = "<?= baseUrl ?>";

      function el(id){ return document.getElementById(id); }

      // ★ JSが死んだらここに出す（今回の症状の可視化用）
      window.onerror = function(message, source, lineno, colno, error){
        const msg = `[JS ERROR] ${message} @ ${lineno}:${colno}`;
        el('hint').textContent = msg;
      };

      function escapeHtml(s){
        return String(s)
          .replaceAll('&','&amp;')
          .replaceAll('<','&lt;')
          .replaceAll('>','&gt;')
          .replaceAll('"','&quot;')
          .replaceAll("'","&#39;");
      }

      // ★ WebアプリURLはサーバ側で確実に作る（page=charter 付き）
      let __NAV_LOCK__ = false;

      function ensureNavBlocker_(){
        let b = document.getElementById("navBlocker");
        if (b) return b;

        b = document.createElement("div");
        b.id = "navBlocker";
        b.style.position = "fixed";
        b.style.inset = "0";
        b.style.background = "rgba(255,255,255,.72)";
        b.style.display = "none";
        b.style.alignItems = "center";
        b.style.justifyContent = "center";
        b.style.zIndex = "99999";
        b.style.backdropFilter = "blur(4px)";

        b.innerHTML = `
          <div style="
            display:flex; flex-direction:column; align-items:center; gap:12px;
            padding:16px 18px; border-radius:16px;
            border:1px solid var(--line); background:#fff;
            box-shadow: 0 20px 70px rgba(0,0,0,.18);
            min-width:220px;">
            <div style="
              width:54px; height:54px; border-radius:999px;
              border:8px solid #e5e7eb; border-top-color:#111;
              animation: spin .9s linear infinite;"></div>
            <div style="font-weight:900;">開いてる…</div>
            <div style="font-size:12px; color:var(--sub); font-weight:800;">まあ待て</div>
          </div>
          <style>@keyframes spin{to{transform:rotate(360deg);}}</style>
        `;
        document.body.appendChild(b);
        return b;
      }

      function armNavigateUi_(){
        const blocker = ensureNavBlocker_();
        blocker.style.display = "flex";

        // 連打・二重遷移を物理的に殺す
        try{
          document.documentElement.style.pointerEvents = "none";
          document.body.style.pointerEvents = "none";
        } catch(e){}
      }

      // ★ /exec の絶対URLを必ず作る（BASE_URLが空でも復旧）
      function resolveBaseUrl_(){
        // 1) テンプレ注入が正しければそれを使う
        try{
          const s = String(BASE_URL || "");
          if (s && s.indexOf("/exec") >= 0){
            const u = new URL(s);
            return u.origin + u.pathname;
          }
        } catch(e){}

        // 2) Nav内リンクから拾う（homeUrl等は必ず /exec を含む）
        try{
          const a = document.querySelector('a[href*="/exec"]');
          if (a && a.href){
            const u = new URL(a.href);
            return u.origin + u.pathname;
          }
        } catch(e){}

        // 3) いまのlocationが /exec ならそれ
        try{
          const u = new URL(location.href);
          if (String(u.pathname || "").indexOf("/exec") >= 0){
            return u.origin + u.pathname;
          }
        } catch(e){}

        return "";
      }

      function buildUrlClient_(page, params){
        // ★まず BASE_URL を信頼してみる → ダメなら resolveBaseUrl_() で自動復旧
        const raw = String(BASE_URL || "").trim();

        let base = "";
        try{
          if (raw){
            const u = new URL(raw);
            base = u.origin + u.pathname; // /exec まで（クエリは捨てる）
          }
        } catch(e){
          base = "";
        }

        // ★復旧：Nav内リンクや location から /exec を拾う
        if (!base || base.indexOf("/exec") < 0){
          const recovered = resolveBaseUrl_();
          if (recovered && recovered.indexOf("/exec") >= 0){
            base = recovered;
            BASE_URL = recovered; // 次回以降の安定化
          }
        }

        if (!base || base.indexOf("/exec") < 0){
          throw new Error("BASE_URL invalid: " + raw);
        }

        const q = [];
        q.push("page=" + encodeURIComponent(page || "home"));

        const p = params || {};
        Object.keys(p).forEach(k => {
          if (p[k] === undefined || p[k] === null) return;
          const v = String(p[k]).trim();
          if (!v) return;
          q.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
        });

        return base + "?" + q.join("&");
      }
      
      function go(page, params){
        if (__NAV_LOCK__) return;
        __NAV_LOCK__ = true;

        function restoreUi_(){
          __NAV_LOCK__ = false;
          try{
            const blocker = document.getElementById("navBlocker");
            if (blocker) blocker.style.display = "none";
            document.documentElement.style.pointerEvents = "";
            document.body.style.pointerEvents = "";
          } catch(e){}
        }

        try{
          armNavigateUi_();
          const url = buildUrlClient_(page, params || {});

          if (String(url).indexOf("/exec?") < 0){
            throw new Error("bad url: " + url);
          }

          // ★本丸：postMessageはGoogle側でdropされるので使わない
          // ★ユーザー操作起点で _top に遷移させる（これが一番通る）
          const a = document.createElement("a");
          a.href = url;
          a.target = "_top";
          a.rel = "noopener noreferrer";
          a.style.display = "none";
          document.body.appendChild(a);

          // clickは“今のクリックイベントの流れ”の中で呼ぶのが重要
          a.click();

          // 念のため掃除（ここまで来たら基本遷移する）
          setTimeout(() => {
            try{ a.remove(); } catch(e){}
          }, 50);

        } catch (err){
          restoreUi_();
          el('hint').textContent = '遷移でエラー… ' + (err && err.message ? err.message : err);
        }
      }

      function openCharter(projectId){
        go('charter', { projectId });
      }

      function openCockpit(projectId){
        go('cockpit', { projectId });
      }

      function openModal(){
        if (!IS_ADMIN){
          el('hint').textContent = '閲覧モードなので新規PJ登録は出ないようにしてる';
          return;
        }
        el('overlay').style.display = 'flex';
        el('np_projectName').focus();
        loadPmCandidates_();
      }


      function closeModal(){
        el('overlay').style.display = 'none';
        el('np_err').style.display = 'none';
        el('np_err').textContent = '';
        el('np_projectName').value = '';
        el('np_clientName').value = '';
        el('np_submit').classList.remove('loading');
      }
      function openCharterUrl(url){
        window.location.assign(url);
      }
      function openMonthlyUrl(url){
        window.location.assign(url);
      }

      function pickDefaultBillingYmFromProject_(p){
        // 「前月未完」を示す情報が project に乗っている場合のみ、前月を返す
        // それ以外は空文字（=ym無しで遷移）→ Billing側の自動スイッチに任せる

        if (!p) return "";

        const r = p.routine || {};

        // 1) もしサーバが “前月未完” を直接教えてくれてるなら最優先（確実）
        // 想定キー（どれが来ても拾えるようにする）
        const directFlag =
          (r.prevPending === true) ||
          (r.isPrevPending === true) ||
          (r.hasPrevPending === true) ||
          (r.prevMonthPending === true);

        // 2) もしサーバが「表示すべき業務月」を直接持ってるならそれ（確実）
        // 例：defaultYm="2026-01" / displayYm="2026-01"
        const directYm =
          String(r.defaultYm || r.displayYm || r.bizYm || r.targetYm || "").trim();

        if (directYm && /^\d{4}-\d{2}$/.test(directYm)) return directYm;

        // 3) もしサーバが「yyyymm」を持ってるなら yyyy-mm に変換して使う（確実）
        const directYmKey =
          String(r.defaultYmKey || r.displayYmKey || r.bizYmKey || r.targetYmKey || "").trim();
        if (/^\d{6}$/.test(directYmKey)) return ymInputFromKey_(directYmKey);

        // 4) フラグだけあるなら「現在の業務月（yyyy-mm）」が取れる場合に限り前月へ
        // ここで currentYm が取れないなら推測になるのでやらない
        if (directFlag){
          const current = String(r.currentYm || r.currentBizYm || r.ym || "").trim();
          if (/^\d{4}-\d{2}$/.test(current)) return addMonthsYm_(current, -1);

          const currentKey = String(r.currentYmKey || r.currentBizYmKey || "").trim();
          if (/^\d{6}$/.test(currentKey)) return addMonthsYm_(ymInputFromKey_(currentKey), -1);

          return "";
        }

        return "";
      }

      function ymInputFromKey_(ymKey){
        const s = String(ymKey || "").trim();
        if (!/^\d{6}$/.test(s)) return "";
        return `${s.slice(0,4)}-${s.slice(4,6)}`;
      }

      function addMonthsYm_(ym, delta){
        const [y,m] = String(ym).split("-").map(Number);
        const d = new Date(y, (m||1)-1, 1);
        d.setMonth(d.getMonth() + Number(delta||0));
        const yy = d.getFullYear();
        const mm = String(d.getMonth()+1).padStart(2,"0");
        return `${yy}-${mm}`;
      }

          .withSuccessHandler(res => {
            const list = (res && res.ok && Array.isArray(res.members)) ? res.members : [];
            const opts = [`<option value="">選択してね（必須）</option>`]
              .concat(list.map(m => `<option value="${escapeHtml(m.memberId)}">${escapeHtml(m.codeName)}</option>`));
            sel.innerHTML = opts.join("");
          })
          .api_getMembersMasterForNewProject();
      }
      
      window.__AMD_SHOW_ALL__ = false;

      function toggleAllPjs(){
        window.__AMD_SHOW_ALL__ = !window.__AMD_SHOW_ALL__;
        const b = document.getElementById("btnToggleAll");
        if (b) b.textContent = window.__AMD_SHOW_ALL__ ? "進行中PJだけ表示" : "全PJを表示";
        load();
      }

      load();
    </script>
