     コックピット画面の全CSS。500_CockpitPage.htmlからincludeされる。
     225_ProjectCockpit.htmlの2つのstyleブロックを統合。
-->
<style>
/* ===== リセット＋ベース ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:14px;line-height:1.6}
button{cursor:pointer;font:inherit;border:none;background:none}
a{color:#0066cc;text-decoration:none}

/* ===== レイアウト ===== */

/* ===== リセット＋ベース ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:14px;line-height:1.6}
button{cursor:pointer;font:inherit;border:none;background:none}
a{color:#0066cc;text-decoration:none}

/* ===== レイアウト ===== */
.cp-shell{display:flex;gap:0;max-width:1060px;margin:0 auto;padding:0 12px;align-items:flex-start}
.cp-wrap{flex:1;min-width:0;max-width:720px;padding:16px 0 80px}
.cp-nudge-lane{width:220px;flex-shrink:0;position:sticky;top:12px;padding:16px 0 16px 16px;max-height:calc(100vh - 24px);overflow-y:auto}
@media(max-width:999px){
  .cp-shell{flex-direction:column;max-width:720px}
  .cp-nudge-lane{width:100%;position:static;padding:0 0 8px;max-height:none;order:-1}
  .cp-nudge-items{display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap}
  .cp-nudge-card{min-width:200px;flex-shrink:0}
}

/* ===== つくよみナッジキュー ===== */
.cp-nudge-title{font-size:11px;font-weight:700;color:#86868b;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.cp-nudge-items{}
.cp-nudge-card{position:relative;margin-bottom:10px;margin-left:38px;padding:10px 12px;background:#fff;border:1px solid #e5e5e7;border-radius:10px;font-size:12px;line-height:1.5;color:#1d1d1f;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.cp-nudge-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:#0066cc}
.cp-nudge-icon{position:absolute;left:-38px;top:6px;width:33px;height:33px;border-radius:50%;background:#f0f4ff;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid #bfdbfe}
.cp-nudge-card.warn{border-left:3px solid #ff9500}
.cp-nudge-card.danger{border-left:3px solid #ff3b30}
.cp-nudge-card.info{border-left:3px solid #0066cc}
.cp-nudge-card.ok{border-left:3px solid #34c759}
.cp-nudge-empty{font-size:12px;color:#86868b;padding:8px 0;margin-left:38px}
/* ===== 月次ルーティンフロー ===== */
.cp-routine-section{margin-top:20px;border-top:1px solid #e5e5e7;padding-top:14px}
.cp-routine-title{font-size:11px;font-weight:700;color:#86868b;margin-bottom:10px}
.cp-routine-block{margin-bottom:14px}
.cp-routine-block-header{font-size:10px;font-weight:700;color:#86868b;margin-bottom:6px;letter-spacing:.3px}
.cp-routine-block.prev .cp-routine-block-header{color:#86868b}
.cp-routine-block.main .cp-routine-block-header{color:#0066cc}
.cp-routine-block.next .cp-routine-block-header{color:#86868b}
.cp-routine-steps{}
.cp-routine-step{display:flex;align-items:flex-start;gap:8px;padding:4px 0;position:relative}
.cp-routine-step:not(:last-child)::after{content:"";position:absolute;left:8px;top:22px;bottom:-4px;width:1px;background:#e5e5e7}
.cp-routine-step.done:not(:last-child)::after{background:#34c759}
.cp-routine-step.current:not(:last-child)::after{background:#e5e5e7}
.cp-routine-dot{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;line-height:1;margin-top:1px;z-index:1}
.cp-routine-step.done .cp-routine-dot{background:#34c759;color:#fff}
.cp-routine-step.current .cp-routine-dot{background:#0066cc;color:#fff;box-shadow:0 0 0 3px rgba(0,102,204,.2);animation:cpRoutinePulse 2s infinite}
.cp-routine-step.future .cp-routine-dot{background:#f5f5f7;border:1.5px solid #d1d1d6;color:#d1d1d6}
.cp-routine-step.warn .cp-routine-dot{background:#ff9500;color:#fff}
.cp-routine-step.overdue .cp-routine-dot{background:#ff3b30;color:#fff}
.cp-routine-date.warn{color:#ff9500;font-weight:600}
.cp-routine-date.overdue{color:#ff3b30;font-weight:600}
.cp-routine-step.warn .cp-routine-label{color:#92400e}
.cp-routine-step.overdue .cp-routine-label{color:#ff3b30}
@keyframes cpRoutinePulse{0%,100%{box-shadow:0 0 0 3px rgba(0,102,204,.2)}50%{box-shadow:0 0 0 6px rgba(0,102,204,.1)}}
.cp-routine-label{font-size:11px;color:#1d1d1f;line-height:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-routine-step.done .cp-routine-label{color:#86868b;text-decoration:line-through;text-decoration-color:#d1d1d6}
.cp-routine-step.future .cp-routine-label{color:#aaa}
.cp-routine-date{font-size:9px;color:#86868b;line-height:17px;white-space:nowrap;flex-shrink:0;text-align:right}
.cp-routine-empty{font-size:11px;color:#aaa;padding:4px 0}
.cp-routine-phase-sep{font-size:9px;color:#b0b0b4;padding:3px 0 2px 25px;letter-spacing:.2px}

/* ===== 立替精算セクション ===== */
.cp-reimb-section{margin-top:20px;padding-top:16px;border-top:1px solid #e5e5e7}
.cp-reimb-title{font-size:12px;font-weight:700;color:#86868b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cp-reimb-table{width:100%;border-collapse:collapse;font-size:12px}
.cp-reimb-table th{text-align:left;padding:5px 6px;color:#86868b;font-weight:600;border-bottom:1px solid #e5e5e7;font-size:11px}
.cp-reimb-table td{padding:5px 6px;border-bottom:1px solid #f0f0f0}
.cp-reimb-table .num{text-align:right;font-variant-numeric:tabular-nums}
.cp-reimb-status{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px}
.cp-reimb-status.pending{background:#fef3cd;color:#856404}
.cp-reimb-status.pm-ok{background:#dbeafe;color:#1e40af}
.cp-reimb-status.approved{background:#d1f5d3;color:#1a7a2e}
.cp-reimb-status.billed{background:#e8e8ed;color:#636366}
.cp-reimb-total{display:flex;justify-content:flex-end;gap:16px;margin-top:8px;font-size:12px;font-weight:600;color:#1d1d1f}

/* ===== PJヘッダー ===== */
.cp-header{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e5e5e7}
.cp-header h1{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#e8e8ed;color:#636366;white-space:nowrap}
.cp-badge.active{background:#d1f5d3;color:#1a7a2e}

/* ===== ゴール階層 ===== */
.cp-goals{margin-top:16px;padding:14px 16px;background:#fff;border-radius:12px;border:1px solid #e5e5e7}
.cp-goals-title{font-size:13px;font-weight:700;color:#86868b;margin-bottom:8px}
.cp-goal-row{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:13px;color:#636366}
.cp-goal-row .label{font-weight:600;min-width:80px;color:#1d1d1f}
.cp-goal-row .value{flex:1;color:#86868b;font-style:italic}

/* ===== 月次タイムライン ===== */
.cp-timeline{margin-top:20px}
.cp-month-card{background:#fff;border-radius:12px;border:1px solid #e5e5e7;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.cp-month-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cp-month-card.current{border-color:#0066cc;border-width:2px}

.cp-month-head{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none}
.cp-month-ym{font-size:15px;font-weight:700;min-width:64px}
.cp-month-badges{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.cp-pill{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px}
.cp-pill.done{background:#d1f5d3;color:#1a7a2e}
.cp-pill.pending{background:#fef3cd;color:#856404}
.cp-pill.none{background:#f1f1f1;color:#aaa}
.cp-month-arrow{font-size:12px;color:#86868b;transition:transform .2s}
.cp-month-card.open .cp-month-arrow{transform:rotate(180deg)}

.cp-month-body{display:none;padding:0 16px 14px;font-size:13px;color:#636366}
.cp-month-card.open .cp-month-body{display:block}
.cp-excerpt{margin-top:6px;line-height:1.5;white-space:pre-wrap}
.cp-month-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.cp-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;transition:background .15s}
.cp-btn-primary{background:#0066cc;color:#fff}
.cp-btn-primary:hover{background:#0055b3}
.cp-btn-secondary{background:#e8e8ed;color:#1d1d1f}
.cp-btn-secondary:hover{background:#d8d8dd}

/* ===== モーダル ===== */
.cp-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:flex-start;padding:40px 16px}
.cp-overlay.show{display:flex}
.cp-modal{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden}
.cp-modal-header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid #e5e5e7}
.cp-modal-header h2{flex:1;font-size:16px;font-weight:700}
.cp-modal-close{width:28px;height:28px;border-radius:50%;background:#e8e8ed;display:flex;align-items:center;justify-content:center;font-size:16px;color:#636366}
.cp-modal-close:hover{background:#d8d8dd}

/* モーダルタブ */
.cp-tabs{display:flex;border-bottom:1px solid #e5e5e7;padding:0 20px}
.cp-tab{padding:10px 16px;font-size:13px;font-weight:600;color:#86868b;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.cp-tab.active{color:#0066cc;border-bottom-color:#0066cc}

.cp-modal-body{flex:1;overflow-y:auto;padding:20px}
.cp-tab-content{display:none}
.cp-tab-content.active{display:block}

/* 報告書（プレーンテキストfallback） */
.cp-report-text{white-space:pre-wrap;font-size:13px;line-height:1.7;color:#1d1d1f}
/* 報告書（Markdownレンダリング済み） */
.cp-report-rendered{font-size:13px;line-height:1.8;color:#1d1d1f}
.cp-report-rendered h1{font-size:18px;font-weight:700;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid #e5e5e7}
.cp-report-rendered h2{font-size:16px;font-weight:700;margin:18px 0 6px}
.cp-report-rendered h3{font-size:14px;font-weight:700;margin:14px 0 4px}
.cp-report-rendered p{margin:6px 0}
.cp-report-rendered ul,.cp-report-rendered ol{margin:6px 0;padding-left:20px}
.cp-report-rendered li{margin:3px 0}
.cp-report-rendered strong{font-weight:700}
.cp-report-rendered hr{border:none;border-top:1px solid #e5e5e7;margin:12px 0}
.cp-report-rendered table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.cp-report-rendered th,.cp-report-rendered td{padding:4px 8px;border:1px solid #e5e5e7;text-align:left}
.cp-report-rendered th{background:#f5f5f7;font-weight:600}

/* 予算配賦 */
.cp-billing-table{width:100%;border-collapse:collapse;font-size:13px}
.cp-billing-table th{text-align:left;padding:6px 8px;color:#86868b;font-weight:600;border-bottom:1px solid #e5e5e7}
.cp-billing-table td{padding:6px 8px;border-bottom:1px solid #f0f0f0}

/* 報酬イベント */
.cp-event-card{padding:10px 0;border-bottom:1px solid #f0f0f0}
.cp-event-card:last-child{border-bottom:none}
.cp-event-title{font-weight:600;font-size:13px;color:#1d1d1f}
.cp-event-meta{font-size:12px;color:#86868b;margin-top:2px}
.cp-event-desc{font-size:12px;color:#636366;margin-top:4px}

/* ローディング */
.cp-loading{text-align:center;padding:40px;color:#86868b}
.cp-spinner{display:inline-block;width:20px;height:20px;border:2px solid #e5e5e7;border-top-color:#0066cc;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* empty */
.cp-empty{text-align:center;padding:24px;color:#86868b;font-size:13px}

/* ===== Pending Delta Banner ===== */
.cp-pending-banner{margin-bottom:16px;padding:12px 16px;background:#fff8e1;border:1px solid #ffe082;border-radius:10px}
.cp-pending-banner-title{font-size:13px;font-weight:700;color:#856404;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.cp-pending-banner-meta{font-size:11px;color:#a07800;margin-bottom:10px}
.cp-pending-actions{display:flex;gap:8px;margin-bottom:12px}
.cp-pending-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.cp-pending-btn.apply{background:#34c759;color:#fff}
.cp-pending-btn.apply:hover{background:#2da44e}
.cp-pending-btn.reject{background:#e8e8ed;color:#636366}
.cp-pending-btn.reject:hover{background:#d8d8dd}
.cp-pending-btn.preview{background:#0066cc;color:#fff}
.cp-pending-btn.preview:hover{background:#0055b3}
.cp-pending-btn:disabled{opacity:.5;cursor:not-allowed}
.cp-pending-diff{display:none;margin-top:10px;border:1px solid #e5e5e7;border-radius:8px;overflow:hidden;max-height:400px;overflow-y:auto}
.cp-pending-diff.show{display:block}
.cp-pending-diff-tabs{display:flex;border-bottom:1px solid #e5e5e7}
.cp-pending-diff-tab{padding:6px 14px;font-size:11px;font-weight:600;cursor:pointer;color:#86868b;border-bottom:2px solid transparent}
.cp-pending-diff-tab.active{color:#0066cc;border-bottom-color:#0066cc}
.cp-pending-diff-body{padding:12px;font-size:13px;line-height:1.7}

/* つくよみ推定バナー */
.cp-estimate-banner{margin-bottom:16px;padding:14px 16px;background:#f0f4ff;border:1px solid #bfdbfe;border-radius:10px}
.cp-estimate-banner-title{font-size:13px;font-weight:700;color:#1e40af;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cp-estimate-item{padding:6px 0;border-bottom:1px solid #e5e7eb;font-size:12px}
.cp-estimate-item:last-child{border-bottom:none}
.cp-estimate-item-ms{font-weight:600;color:#1d1d1f}
.cp-estimate-item-pct{color:#0066cc;font-weight:700;margin-left:8px}
.cp-estimate-item-reason{color:#636366;margin-top:2px;line-height:1.5}
.cp-est-inline{margin:4px 0 8px 168px;padding:8px 12px;background:#f0f7ff;border:1px solid #d0e3f7;border-radius:8px;font-size:12px}
.cp-est-inline-header{font-weight:600;color:#1d1d1f;margin-bottom:2px}
.cp-est-inline-delta{color:#0066cc;font-weight:700}
.cp-est-inline-reason{color:#636366;line-height:1.5;margin-bottom:4px}
.cp-est-history{margin:12px 0;font-size:12px}
.cp-est-history-summary{color:#86868b;cursor:pointer;font-size:11px;padding:4px 0}
.cp-est-history-entry{padding:3px 0;border-bottom:1px solid #f0f0f0;color:#636366}
.cp-est-history-ms{font-weight:600;color:#1d1d1f}
.cp-estimate-item-actions{display:flex;gap:6px;margin-top:6px}
.cp-est-btn{font-size:11px;padding:3px 10px;border-radius:4px;cursor:pointer;border:1px solid #ddd;background:#fff;transition:all 0.15s}
.cp-est-btn.adopt{color:#1a7a2e;border-color:#1a7a2e}
.cp-est-btn.adopt:hover{background:#f0fdf4}
.cp-est-btn.reject{color:#ff3b30;border-color:#ff3b30}
.cp-est-btn.reject:hover{background:#fff5f5}
.cp-est-btn.modify{color:#0066cc;border-color:#0066cc}
.cp-est-btn.modify:hover{background:#f0f7ff}
.cp-est-btn:disabled{opacity:0.4;cursor:default}

/* ===== ゴール階層（実データ版） ===== */
.cp-goals-section{margin-bottom:10px}
.cp-goals-level{font-size:12px;font-weight:700;color:#86868b;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.cp-goals-level .icon{font-size:14px}
.cp-ms-list{padding-left:4px}
.cp-ms-item{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:13px;border-bottom:1px solid #f5f5f7}
.cp-ms-item:last-child{border-bottom:none}
.cp-ms-order{font-size:11px;font-weight:700;color:#86868b;min-width:22px}
.cp-ms-title{flex:1;color:#1d1d1f}
.cp-ms-pts{font-size:12px;font-weight:600;color:#0066cc;white-space:nowrap}
.cp-ms-tag{font-size:10px;padding:1px 5px;border-radius:3px;background:#e8e8ed;color:#636366}
.cp-ms-tag.buffer{background:#fef3cd;color:#856404}
.cp-ms-criteria{font-size:11px;color:#86868b;padding:2px 0 2px 30px}
.cp-ms-criteria-list{list-style:none;padding:2px 0 2px 30px;margin:0}
.cp-ms-criteria-list li{font-size:11px;line-height:1.6;display:flex;align-items:baseline;gap:5px}
.cp-ms-criteria-list li .cb{flex-shrink:0;width:13px;height:13px;border:1.5px solid #c0c0c0;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;line-height:1;margin-top:1px}
.cp-ms-criteria-list li.done .cb{background:#d1f5d3;border-color:#1a7a2e;color:#1a7a2e}
.cp-ms-criteria-list li.done .cb::after{content:"✓"}
.cp-ms-criteria-list li.done .txt{color:#b0b0b0;text-decoration:line-through}
.cp-ms-criteria-list li.open .cb{background:#fff}
.cp-ms-criteria-list li.open .txt{color:#636366}
.cp-ms-criteria-list li.draft .cb{background:#fff8e1;border-color:#f9a825;color:#f9a825}
.cp-ms-criteria-list li.draft .cb::after{content:"?"}
.cp-ms-criteria-list li.draft .txt{color:#b8860b;font-style:italic}
.cp-ms-criteria-list li.draft-done .cb{background:#e8f5e9;border-color:#a5d6a7;color:#66bb6a}
.cp-ms-criteria-list li.draft-done .cb::after{content:"?✓"}
.cp-ms-criteria-list li.draft-done .txt{color:#7cb342;font-style:italic}
.cp-criteria-del{margin-left:auto;cursor:pointer;color:#ccc;font-size:10px;padding:0 4px;line-height:1}
.cp-criteria-del:hover{color:#e53935}
.cp-ms-criteria-list li .cb{cursor:pointer}
.cp-ms-criteria-list li .cb:hover{opacity:0.7}
.cp-tab-dot{display:inline-block;width:7px;height:7px;background:#0066cc;border-radius:50%;margin-left:5px;vertical-align:middle}
.cp-goals-empty{font-size:12px;color:#aaa;font-style:italic;padding:4px 0}
.cp-goals-cycle-info{font-size:11px;color:#86868b;margin-bottom:8px;padding:4px 8px;background:#f9f9fb;border-radius:6px}

/* ===== 報酬ダッシュボード ===== */
.cp-reward-section{margin-bottom:16px}
.cp-reward-section-title{font-size:12px;font-weight:700;color:#86868b;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cp-plan-info{font-size:11px;color:#86868b;padding:6px 8px;background:#f9f9fb;border-radius:6px;margin-bottom:10px}

/* マイルストーン消化バー */
.cp-ms-bar-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.cp-ms-bar-label{flex:0 0 200px;min-width:200px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1d1d1f}
.cp-ms-bar-wrap{flex:1;height:14px;background:#f0f0f0;border-radius:7px;position:relative;overflow:visible;min-width:80px}
.cp-ms-bar-fill{max-width:100%;overflow:hidden}
.cp-ms-bar-fill{height:100%;border-radius:7px;transition:width .3s}
.cp-ms-bar-fill.low{background:#34c759}
.cp-ms-bar-fill.mid{background:#ff9500}
.cp-ms-bar-fill.high{background:#ff3b30}
/* 今月増分ストライプ */
.cp-ms-bar-increment{position:absolute;top:0;height:100%}
.cp-ms-bar-increment.round-left{border-radius:7px}
.cp-ms-bar-increment.round-right{border-radius:0 7px 7px 0}
.cp-ms-bar-increment.low{background:repeating-linear-gradient(45deg,#34c759 0,#34c759 3px,rgba(52,199,89,.3) 3px,rgba(52,199,89,.3) 6px)}
