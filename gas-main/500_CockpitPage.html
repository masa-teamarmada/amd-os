<script>
// ===== 状態 =====
var CP = {
  projectId: "<?= projectId ?>",
  projectName: "<?= projectName ?>",
  baseUrl: "<?= baseUrl ?>",
  focusYm: "<?= focusYm ?>",
  data: null,
  modalYm: null
};

// ===== 初期化 =====
document.addEventListener("DOMContentLoaded", function() {
  cpLoadData();
});

function cpLoadData() {
  google.script.run
    .withSuccessHandler(cpRenderPage)
    .withFailureHandler(function(err) {
      document.getElementById("cpRoot").innerHTML =
        '<div class="cp-empty">データ取得に失敗: ' + cpEsc(String(err)) + '</div>';
    })
    .cockpit_api_getData({ projectId: CP.projectId });
}

// ===== ページ描画 =====
function cpRenderPage(res) {
  if (!res || !res.ok) {
    document.getElementById("cpRoot").innerHTML =
      '<div class="cp-empty">' + cpEsc(res ? res.message : "不明なエラー") + '</div>';
    return;
  }
  CP.data = res;

  var p = res.project || {};
  var isActive = (p.status || "").toLowerCase() !== "closed";

  var html = "";

  // [A] PJヘッダー
  html += '<div class="cp-header">';
  html += '  <h1>' + cpEsc(p.projectName || CP.projectName || CP.projectId) + '</h1>';
  if (p.clientName) html += '  <span style="font-size:12px;color:#86868b">' + cpEsc(p.clientName) + '</span>';
  html += '  <span class="cp-badge ' + (isActive ? "active" : "") + '">' + (isActive ? "Active" : "Closed") + '</span>';
  html += '  <a class="cp-btn cp-btn-secondary" href="' + CP.baseUrl + '?page=chronicle&projectId=' + encodeURIComponent(CP.projectId) + '&projectName=' + encodeURIComponent(CP.projectName) + '" target="_top" style="font-size:11px;padding:4px 10px;margin-left:4px">Chronicle →</a>';
  html += '  <a class="cp-btn cp-btn-secondary" href="' + CP.baseUrl + '?page=config&projectId=' + encodeURIComponent(CP.projectId) + '" target="_top" style="font-size:11px;padding:4px 10px;margin-left:4px">Config →</a>';

  // Origin率バッジ
  var or = res.originRate;
  if (or) {
    var orPct = or.amdPct;
    var orClass = "origin-end";
    var orLabel = "";
    if (orPct >= 90) { orClass = "origin-ok"; orLabel = "🟢 先手力 " + orPct + "%"; }
    else if (orPct >= 80) { orClass = "origin-warn"; orLabel = "🟡 危険水域 " + orPct + "%"; }
    else if (orPct >= 70) { orClass = "origin-danger"; orLabel = "🔴 契約終了リスク " + orPct + "%"; }
    else { orClass = "origin-end"; orLabel = "⚫ 末期 " + orPct + "%"; }
    html += '  <span class="cp-origin-health ' + orClass + '" id="cpOriginBadge" title="AMD起点率（AMD提案+協議決定）/ 全イベント　※クリックで詳細" style="cursor:pointer" onclick="cpOpenOriginModal()">' + orLabel + '</span>';
  } else if (or === null) {
    html += '  <span class="cp-origin-health origin-na" id="cpOriginBadge" title="イベント5件未満で判定不能">◻️ 判定不能</span>';
  }
  html += '</div>';

  // [B] ゴール階層（非同期で取得）
  html += '<div class="cp-goals" id="cpGoals">';
  html += '  <div class="cp-goals-title">目標階層</div>';
  html += '  <div style="color:#aaa;font-size:12px">読み込み中...</div>';
  html += '</div>';

  document.getElementById("cpRoot").innerHTML = html;

  // [G] 月次タイムライン → cpMonthlyArea に書き込む
  var tlHtml = '';
  var summaries = res.monthlySummaries || [];
  for (var i = 0; i < summaries.length; i++) {
    var s = summaries[i];
    var isCurrent = (s.ym === res.currentYm);
    var ymLabel = s.ym.substring(0, 4) + "/" + s.ym.substring(4, 6);

    tlHtml += '<div class="cp-month-card open' + (isCurrent ? " current" : "") + '" data-ym="' + s.ym + '" onclick="cpOpenModal(\'' + s.ym + '\')" style="cursor:pointer">';
    tlHtml += '  <div class="cp-month-head">';
    tlHtml += '    <span class="cp-month-ym">' + ymLabel + '</span>';
    if (s.reportNeedsReview) tlHtml += '    <span style="color:#e67e22;font-size:9px;margin-left:4px;vertical-align:middle" title="未FIXの更新あり">●</span>';
    tlHtml += '    <div class="cp-month-badges">';
    tlHtml += cpPill("会議", s.meetingDone);
    tlHtml += cpPill("予算", s.budgetDone);
    tlHtml += cpPill("配賦", s.allocDone);
    tlHtml += cpPill("報告", s.reportDone);
    tlHtml += cpPill("請求", s.invoiceDone);
    tlHtml += cpPill("入金", s.paymentDone);
    tlHtml += '    </div>';
    tlHtml += '  </div>';
    tlHtml += '  <div class="cp-month-body">';
    var msProgData = s.msProgressSummary || {};
    var msItems = msProgData.items || (Array.isArray(s.msProgressSummary) ? s.msProgressSummary : []);
    var visibleMs = msItems.filter(function(m) { return m.tag !== 'buffer'; });

    if (visibleMs.length > 0) {
      // 加重平均進捗を計算
      var totalPts = 0, weightedProg = 0;
      for (var mi = 0; mi < visibleMs.length; mi++) {
        var pts = Number(visibleMs[mi].points || 0);
        totalPts += pts;
        weightedProg += pts * Number(visibleMs[mi].progressPct || 0);
      }
      var overallPct = totalPts > 0 ? Math.round(weightedProg / totalPts) : 0;

      // 経過時間比率を計算
      var expectedPct = 0;
      var startYm = String(msProgData.periodStartYm || '');
      var endYm = String(msProgData.periodEndYm || '');
      var curYm = s.ym;
      if (startYm.length === 6 && endYm.length === 6 && curYm) {
        var totalMonths = (parseInt(endYm.slice(0,4)) - parseInt(startYm.slice(0,4))) * 12
          + (parseInt(endYm.slice(4)) - parseInt(startYm.slice(4))) + 1;
        var elapsedMonths = (parseInt(curYm.slice(0,4)) - parseInt(startYm.slice(0,4))) * 12
          + (parseInt(curYm.slice(4)) - parseInt(startYm.slice(4))) + 1;
        expectedPct = totalMonths > 0 ? Math.round(elapsedMonths / totalMonths * 100) : 0;
      }

      // 信号判定
      var signal, signalColor, signalBg, reason;
      if (expectedPct === 0) {
        signal = '🟢'; signalColor = '#166534'; signalBg = '#f0fdf4'; reason = '';
      } else {
        var gap = expectedPct - overallPct;
        if (gap <= 10) {
          signal = '🟢'; signalColor = '#166534'; signalBg = '#f0fdf4'; reason = '';
        } else if (gap <= 25) {
          signal = '🟡'; signalColor = '#92400e'; signalBg = '#fffbeb';
          reason = '計画比 ' + gap + '% 遅延';
        } else {
          signal = '🔴'; signalColor = '#991b1b'; signalBg = '#fef2f2';
          reason = '計画比 ' + gap + '% 遅延';
        }
      }

      var barFill = signal === '🟢' ? '#22c55e' : signal === '🟡' ? '#f59e0b' : '#ef4444';

      tlHtml += '<div class="cp-ms-summary-block" style="background:' + signalBg + '">';
      tlHtml += '<div class="cp-ms-summary-row">';
      tlHtml += '<span style="font-size:14px">' + signal + '</span>';
      tlHtml += '<div class="cp-ms-prog-bar-wrap" style="flex:1">';
      tlHtml += '<div class="cp-ms-prog-bar" style="width:' + overallPct + '%;background:' + barFill + '"></div>';
      tlHtml += '</div>';
      tlHtml += '<span style="font-size:12px;font-weight:600;color:' + signalColor + '">' + overallPct + '%</span>';
      tlHtml += '</div>';
      if (reason) {
        tlHtml += '<div style="font-size:11px;color:' + signalColor + ';margin-top:3px">' + cpEsc(reason) + '</div>';
      }
      tlHtml += '</div>';
    } else {
      tlHtml += '<div style="font-size:11px;color:#aaa;padding:4px 0">進捗データなし</div>';
    }
    if (s.billingAmount > 0) {
      tlHtml += '    <div style="margin-top:6px;font-size:12px;color:#1d1d1f">請求額: ¥' + cpFmtNum(s.billingAmount) + '</div>';
    }
    tlHtml += '  </div>';
    tlHtml += '</div>';
  }
  var monthlyArea = document.getElementById("cpMonthlyArea");
  if (monthlyArea) monthlyArea.innerHTML = tlHtml;

  // 非同期ロード
  cpLoadGoals();
  cpLoadKanban();
  cpLoadNudgeQueue();
  cpLoadRoutineFlow();
  cpLoadMacroInsights();

  if (CP.focusYm) {
    setTimeout(function() {
      var targetCard = document.querySelector('.cp-month-card[data-ym="' + CP.focusYm + '"]');
      if (targetCard && !targetCard.classList.contains('open')) {
        targetCard.classList.add('open');
      }
      cpOpenModal(CP.focusYm);
    }, 300);
  }
}

</script>
