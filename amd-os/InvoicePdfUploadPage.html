<!-- InvoicePdfUploadPage -->
<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; max-width: 820px; }
      .card { border:1px solid #e5e7eb; border-radius:12px; padding:16px; background:#fff; }
      .h { font-weight:900; font-size:18px; }
      .muted { color:#6b7280; font-size:12px; margin-top:6px; white-space:pre-wrap; }
      .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
      input[type="file"]{ padding:10px; border:1px solid #d1d5db; border-radius:10px; }
      button { padding:10px 14px; border-radius:10px; border:1px solid #111827; background:#111827; color:#fff; cursor:pointer; font-weight:900; }
      button.secondary{ background:#fff; color:#111827; }
      button:active{ transform: translateY(1px); }
      button:disabled{ opacity:.5; cursor:not-allowed; }
      .ok { color:#047857; font-weight:900; }
      .bad{ color:#b91c1c; font-weight:900; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="h">請求書PDFアップロード</div>
      <div class="muted">
PJ: <?= projectId ?>

対象月: <?= ym ?>

freeeInvoiceId: <?= freeeInvoiceId ?>
      </div>

      <div class="row">
        <input id="pdfFile" type="file" accept="application/pdf" />
        <button id="btnUpload" onclick="upload()">アップロード</button>
        <button id="btnClose" onclick="closeMe()" style="display:none;" class="secondary">画面を閉じる</button>
        <span id="status" class="muted"></span>
      </div>


      <div class="muted" style="margin-top:12px;">
やること：
1) freeeからPDFダウンロード
2) ここでPDFをアップロード
3) Billing画面の「invoice pdf」が自動で作成済みになる
      </div>
    </div>

    <script>
      const PROJECT_ID = "<?= projectId ?>";
      const YM = "<?= ym ?>";
      const FREEE_INVOICE_ID = "<?= freeeInvoiceId ?>";
      const TOKEN = "<?= token ?>";

      function fileToBase64(file){
        return new Promise((resolve, reject) => {
          const fr = new FileReader();
          fr.onload = () => resolve(String(fr.result).split(",")[1]);
          fr.onerror = reject;
          fr.readAsDataURL(file);
        });
      }

      async function upload(){
        const f = document.getElementById("pdfFile").files[0];
        const st = document.getElementById("status");
        const btn = document.getElementById("btnUpload");

        if (!f) { st.textContent = "PDF選んで"; st.className="muted"; return; }

        btn.disabled = true;
        st.textContent = "アップロード中...";
        st.className="muted";

        try {
          const base64 = await fileToBase64(f);

          google.script.run
            .withFailureHandler(err => {
              btn.disabled = false;
              st.textContent = "失敗: " + (err && err.message ? err.message : err);
              st.className="bad";
            })
            .withSuccessHandler(res => {
              btn.disabled = false;
              if (res && res.ok) {
                st.textContent = "アップロード完了。この画面を閉じてOK";
                st.className="ok";
                // 閉じるボタン表示
                const c = document.getElementById("btnClose");
                if (c) c.style.display = "inline-block";
              } else {
                st.textContent = "失敗っぽい…";
                st.className="bad";
              }
            })

            .api_uploadInvoicePdf({
              projectId: PROJECT_ID,
              ym: YM,
              freeeInvoiceId: FREEE_INVOICE_ID,
              token: TOKEN,
              fileName: f.name,
              mimeType: f.type || "application/pdf",
              base64: base64
            });

        } catch(e) {
          btn.disabled = false;
          st.textContent = "失敗: " + (e && e.message ? e.message : e);
          st.className="bad";
        }
      }

      function closeMe(){
        // 1) GASのダイアログ/サイドバーなら閉じれる
        try{
          if (google && google.script && google.script.host && google.script.host.close) {
            google.script.host.close();
            return;
          }
        } catch(e){}

        // 2) 新規タブでも閉じれることがあるので試す
        try{
          window.close();
        } catch(e){}

        // 3) 閉じれない（ブラウザ仕様）時のフォールバック
        //    親が居るなら親へ戻す。居ないなら about:blank
        try{
          if (window.opener && !window.opener.closed) {
            // 親にフォーカス戻す
            window.opener.focus();
            // 自分は「閉じれないなら邪魔しない」方針で遷移だけして終わり
            window.location.href = "about:blank";
            return;
          }
        } catch(e){}

        window.location.href = "about:blank";
      }


    </script>
  </body>
</html>
