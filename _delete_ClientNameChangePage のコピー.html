<!-- ClientNameChangePage.html
役割：
- （廃止）クライアント名変更の承認ページ（旧仕様）
- 現在は Admin ページで完結する仕様に移行済み
- このページに来た場合は「古いリンク/導線」が残っているので、移行漏れを炙り出すため明示表示する
-->
<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; max-width: 980px; }
      .card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; background:#fff; }
      .h1 { font-size: 22px; font-weight: 900; margin: 0; }
      .muted { color:#6b7280; font-size: 13px; margin-top: 10px; line-height: 1.6; }
      .warn { margin-top: 14px; color:#b91c1c; background:#fef2f2; border:1px solid #fecaca; border-radius:12px; padding:10px; white-space:pre-wrap; }
      code { background:#f3f4f6; padding: 2px 6px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="h1">このページは廃止済み</div>
      <div class="muted">
        クライアント名の変更は Admin ページで行う仕様に移行済み。<br/>
        この画面に来た場合、古いリンク/導線が残っている。
      </div>

      <div class="warn">
        対応：Adminページからクライアント名を変更してね。<br/>
        もしこのURLがどこかから生成されてるなら、生成元を消す必要あり。<br/><br/>
        ヒント：<code>mode=clientnamechange</code> / <code>ClientNameChangePage</code> / <code>api_getClientNameChangeRequest</code> / <code>api_approveClientNameChange</code>
      </div>
    </div>
  </body>
</html>
