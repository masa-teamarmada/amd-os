<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc"><title id="title">製品化のTRLロードマップ</title><desc id="desc">TRL1から9を左から右へ並べる。現在4、シード目標6、シリーズA期間7、シリーズB期間8。実証目標と期間を同じ図に示す。</desc><rect width="960" height="250" fill="#fff"/><g font-family="Yu Gothic,Hiragino Kaku Gothic ProN,Noto Sans JP,Meiryo,sans-serif"><path d="M44 68 L928 68" stroke="#bbc4ca" stroke-width="2" fill="none"/><path d="M928 64 L936 68 L928 72 Z" fill="#bbc4ca"/><path d="M64 68 L376 68" stroke="#07869e" stroke-width="2" fill="none"/><text x="64" y="52" fill="#62676d" font-size="12" font-weight="600" text-anchor="middle"><tspan x="64" dy="0">TRL 1</tspan></text><circle cx="64" cy="68" r="4" fill="#fff" stroke="#bbc4ca"/><text x="64" y="92" fill="#62676d" font-size="12" font-weight="400" text-anchor="middle"><tspan x="64" dy="0">基本原理</tspan><tspan x="64" dy="16">の確認</tspan></text><text x="168" y="52" fill="#62676d" font-size="12" font-weight="600" text-anchor="middle"><tspan x="168" dy="0">TRL 2</tspan></text><circle cx="168" cy="68" r="4" fill="#fff" stroke="#bbc4ca"/><text x="168" y="92" fill="#62676d" font-size="12" font-weight="400" text-anchor="middle"><tspan x="168" dy="0">用途の</tspan><tspan x="168" dy="16">構想</tspan></text><text x="272" y="52" fill="#62676d" font-size="12" font-weight="600" text-anchor="middle"><tspan x="272" dy="0">TRL 3</tspan></text><circle cx="272" cy="68" r="4" fill="#fff" stroke="#bbc4ca"/><text x="272" y="92" fill="#62676d" font-size="12" font-weight="400" text-anchor="middle"><tspan x="272" dy="0">概念の</tspan><tspan x="272" dy="16">実証</tspan></text><text x="376" y="52" fill="#07869e" font-size="12" font-weight="600" text-anchor="middle"><tspan x="376" dy="0">TRL 4</tspan></text><circle cx="376" cy="68" r="6" fill="#07869e" stroke="#07869e"/><text x="376" y="92" fill="#07869e" font-size="12" font-weight="500" text-anchor="middle"><tspan x="376" dy="0">ラボで</tspan><tspan x="376" dy="16">検証</tspan></text><text x="480" y="52" fill="#62676d" font-size="12" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">TRL 5</tspan></text><circle cx="480" cy="68" r="4" fill="#fff" stroke="#bbc4ca"/><text x="480" y="92" fill="#62676d" font-size="12" font-weight="400" text-anchor="middle"><tspan x="480" dy="0">想定環境</tspan><tspan x="480" dy="16">で検証</tspan></text><text x="584" y="52" fill="#527889" font-size="12" font-weight="600" text-anchor="middle"><tspan x="584" dy="0">TRL 6</tspan></text><circle cx="584" cy="68" r="6" fill="#527889" stroke="#527889"/><text x="584" y="92" fill="#527889" font-size="12" font-weight="500" text-anchor="middle"><tspan x="584" dy="0">試作機</tspan><tspan x="584" dy="16">で実証</tspan></text><text x="688" y="52" fill="#956a00" font-size="12" font-weight="600" text-anchor="middle"><tspan x="688" dy="0">TRL 7</tspan></text><circle cx="688" cy="68" r="6" fill="#956a00" stroke="#956a00"/><text x="688" y="92" fill="#956a00" font-size="12" font-weight="500" text-anchor="middle"><tspan x="688" dy="0">顧客現場</tspan><tspan x="688" dy="16">で実証</tspan></text><text x="792" y="52" fill="#357458" font-size="12" font-weight="600" text-anchor="middle"><tspan x="792" dy="0">TRL 8</tspan></text><circle cx="792" cy="68" r="6" fill="#357458" stroke="#357458"/><text x="792" y="92" fill="#357458" font-size="12" font-weight="500" text-anchor="middle"><tspan x="792" dy="0">製品の</tspan><tspan x="792" dy="16">完成</tspan></text><text x="896" y="52" fill="#62676d" font-size="12" font-weight="600" text-anchor="middle"><tspan x="896" dy="0">TRL 9</tspan></text><circle cx="896" cy="68" r="4" fill="#fff" stroke="#bbc4ca"/><text x="896" y="92" fill="#62676d" font-size="12" font-weight="400" text-anchor="middle"><tspan x="896" dy="0">実運用</tspan><tspan x="896" dy="16">の実績</tspan></text><rect x="340.0" y="8" width="72" height="22" rx="2" fill="#07869e"/><text x="376" y="23" fill="#fff" font-size="12" font-weight="600" text-anchor="middle"><tspan x="376" dy="0">現在ここ</tspan></text><path d="M376 30 L376 36" stroke="#07869e" stroke-width="1" fill="none"/><rect x="644.0" y="8" width="88" height="22" rx="2" fill="#956a00"/><text x="688" y="23" fill="#fff" font-size="12" font-weight="600" text-anchor="middle"><tspan x="688" dy="0">Aで到達</tspan></text><path d="M688 30 L688 36" stroke="#956a00" stroke-width="1" fill="none"/><rect x="748.0" y="8" width="88" height="22" rx="2" fill="#357458"/><text x="792" y="23" fill="#fff" font-size="12" font-weight="600" text-anchor="middle"><tspan x="792" dy="0">Bで到達</tspan></text><path d="M792 30 L792 36" stroke="#357458" stroke-width="1" fill="none"/><text x="584" y="128" fill="#527889" font-size="11" font-weight="500" text-anchor="middle"><tspan x="584" dy="0">シードの到達目標</tspan></text><path d="M16 138 L944 138" stroke="#dce1e5" stroke-width="1" fill="none"/><text x="16" y="159" fill="#07869e" font-size="13" font-weight="600" text-anchor="start"><tspan x="16" dy="0">現在｜TRL4</tspan></text><text x="16" y="178" fill="#1d1d1f" font-size="12" font-weight="400" text-anchor="start"><tspan x="16" dy="0">ラボで処理性能を検証。実排液・10L試験の報告</tspan><tspan x="16" dy="17">次：連続運転・再現性、現場規模への拡張</tspan></text><text x="330" y="159" fill="#956a00" font-size="13" font-weight="600" text-anchor="start"><tspan x="330" dy="0">シリーズA｜TRL7</tspan></text><text x="330" y="178" fill="#1d1d1f" font-size="12" font-weight="400" text-anchor="start"><tspan x="330" dy="0">量産実証工場・顧客現場で供給・品質・原価を実証</tspan><tspan x="330" dy="17">6か月連続で目標達成｜2028.07–2031.03の計画</tspan></text><text x="644" y="159" fill="#357458" font-size="13" font-weight="600" text-anchor="start"><tspan x="644" dy="0">シリーズB｜TRL8</tspan></text><text x="644" y="178" fill="#1d1d1f" font-size="12" font-weight="400" text-anchor="start"><tspan x="644" dy="0">本格工場で品質・供給を安定化</tspan><tspan x="644" dy="17">能力・歩留まり・原価を12か月安定達成</tspan><tspan x="644" dy="17">2031.04–2033.03の計画</tspan></text><text x="16" y="238" fill="#62676d" font-size="11" font-weight="400" text-anchor="start"><tspan x="16" dy="0">A・Bは各ラウンドの資金で目指す到達点。TRLの間隔は期間の長さを表さない。</tspan></text></g></svg>