<svg xmlns="http://www.w3.org/2000/svg" width="960" height="536" viewBox="0 0 960 536" role="img" aria-labelledby="title desc">
<title id="title">色素分解と金属回収の製品構成</title><desc id="desc">左は着色排水を菌体と接触させて色素を分解し、処理水を既存後段へ送る。菌体は保持して条件に応じ交換。右は金属含有排液から菌体へ金属を取り込ませ、処理水を後段へ送り、使用済み菌体を回収して別工程で金属を抽出・精製する。</desc>
<rect width="960" height="536" fill="#fff"/>
<g font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif"><path d="M480 24 L480 512" fill="none" stroke="#dce1e5" stroke-width="1"/>
<path d="M32 24 L448 24" fill="none" stroke="#755094" stroke-width="4"/>
<text x="32" y="60" fill="#755094" font-size="24" font-weight="600" text-anchor="start"><tspan x="32" dy="0">色素分解・脱色</tspan></text>
<text x="32" y="92" fill="#62676d" font-size="16" font-weight="400" text-anchor="start"><tspan x="32" dy="0">色素を分解して、水の色を改善する</tspan></text>
<rect x="80" y="120" width="320" height="64" rx="4" fill="#f6fafb" stroke="#dce1e5"/><text x="240.0" y="158.0" fill="#755094" font-size="18" font-weight="500" text-anchor="middle"><tspan x="240.0" dy="0">着色排水（染色工程など）</tspan></text>
<path d="M240 188 L240 216" fill="none" stroke="#755094" stroke-width="2"/><path d="M235 208 L240 216 L245 208" fill="none" stroke="#755094" stroke-width="2"/>
<rect x="80" y="224" width="320" height="88" rx="4" fill="#f6fafb" stroke="#dce1e5"/><text x="240.0" y="261.0" fill="#755094" font-size="18" font-weight="500" text-anchor="middle"><tspan x="240.0" dy="0">SOLリアクター</tspan><tspan x="240.0" dy="26">菌体と接触させ、色素を分解</tspan></text>
<path d="M240 316 L240 344" fill="none" stroke="#755094" stroke-width="2"/><path d="M235 336 L240 344 L245 336" fill="none" stroke="#755094" stroke-width="2"/>
<path d="M512 24 L928 24" fill="none" stroke="#07869e" stroke-width="4"/>
<text x="512" y="60" fill="#07869e" font-size="24" font-weight="600" text-anchor="start"><tspan x="512" dy="0">金属回収</tspan></text>
<text x="512" y="92" fill="#62676d" font-size="16" font-weight="400" text-anchor="start"><tspan x="512" dy="0">金属を菌体へ取り込み、資源として回収する</tspan></text>
<rect x="560" y="120" width="320" height="64" rx="4" fill="#f6fafb" stroke="#dce1e5"/><text x="720.0" y="158.0" fill="#07869e" font-size="18" font-weight="500" text-anchor="middle"><tspan x="720.0" dy="0">金属を含む工場排液・工程液</tspan></text>
<path d="M720 188 L720 216" fill="none" stroke="#07869e" stroke-width="2"/><path d="M715 208 L720 216 L725 208" fill="none" stroke="#07869e" stroke-width="2"/>
<rect x="560" y="224" width="320" height="88" rx="4" fill="#f6fafb" stroke="#dce1e5"/><text x="720.0" y="261.0" fill="#07869e" font-size="18" font-weight="500" text-anchor="middle"><tspan x="720.0" dy="0">SOLリアクター</tspan><tspan x="720.0" dy="26">菌体に金属を取り込ませる</tspan></text>
<path d="M720 316 L720 336" fill="none" stroke="#07869e" stroke-width="2"/>
<rect x="80" y="352" width="320" height="64" rx="4" fill="#f6fafb" stroke="#dce1e5"/><text x="240.0" y="390.0" fill="#755094" font-size="18" font-weight="500" text-anchor="middle"><tspan x="240.0" dy="0">処理水 → 既存の後段処理へ</tspan></text>
<text x="240" y="456" fill="#62676d" font-size="18" font-weight="400" text-anchor="middle"><tspan x="240" dy="0">菌体は装置内で保持</tspan><tspan x="240" dy="26">使用条件に応じて交換する</tspan></text>
<path d="M620 336 L832 336" fill="none" stroke="#07869e" stroke-width="2"/>
<path d="M620 336 L620 352" fill="none" stroke="#07869e" stroke-width="2"/><path d="M615 344 L620 352 L625 344" fill="none" stroke="#07869e" stroke-width="2"/>
<path d="M832 336 L832 352" fill="none" stroke="#357458" stroke-width="2"/><path d="M827 344 L832 352 L837 344" fill="none" stroke="#357458" stroke-width="2"/>
<rect x="520" y="360" width="200" height="56" rx="4" fill="#f6fafb" stroke="#dce1e5"/><text x="620.0" y="394.0" fill="#07869e" font-size="17" font-weight="500" text-anchor="middle"><tspan x="620.0" dy="0">処理水 → 後段処理</tspan></text>
<rect x="736" y="360" width="192" height="56" rx="4" fill="#f5faf6" stroke="#dce1e5"/><text x="832.0" y="394.0" fill="#357458" font-size="17" font-weight="500" text-anchor="middle"><tspan x="832.0" dy="0">使用済み菌体を回収</tspan></text>
<path d="M832 420 L832 448" fill="none" stroke="#357458" stroke-width="2"/><path d="M827 440 L832 448 L837 440" fill="none" stroke="#357458" stroke-width="2"/>
<rect x="576" y="456" width="352" height="56" rx="4" fill="#f5faf6" stroke="#dce1e5"/><text x="752.0" y="490.0" fill="#357458" font-size="18" font-weight="500" text-anchor="middle"><tspan x="752.0" dy="0">金属の抽出・精製 → 回収金属</tspan></text></g></svg>