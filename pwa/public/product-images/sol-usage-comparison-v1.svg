<svg xmlns="http://www.w3.org/2000/svg" width="520" height="248" viewBox="0 0 520 248" role="img" aria-labelledby="title desc"><title id="title">色素分解と金属回収の製品構成</title><desc id="desc">色素分解では菌体を保持して交換し、金属回収では使用済み菌体を回収して金属を抽出・精製する。いずれも処理水は既存の後段処理へ接続する。</desc><rect width="520" height="248" fill="#fff"/><g font-family="Yu Gothic,Hiragino Kaku Gothic ProN,Noto Sans JP,Meiryo,sans-serif"><path d="M260 8 L260 240" stroke="#dce1e5" stroke-width="1" fill="none"/><text x="12" y="22" fill="#755094" font-size="14" font-weight="600" text-anchor="start"><tspan x="12" dy="0">色素分解・脱色</tspan></text><text x="12" y="40" fill="#62676d" font-size="11" font-weight="400" text-anchor="start"><tspan x="12" dy="0">色素を分解し、水の色を改善</tspan></text><text x="276" y="22" fill="#07869e" font-size="14" font-weight="600" text-anchor="start"><tspan x="276" dy="0">金属回収</tspan></text><text x="276" y="40" fill="#62676d" font-size="11" font-weight="400" text-anchor="start"><tspan x="276" dy="0">金属を菌体に取り込み、資源化</tspan></text><rect x="16" y="52" width="228" height="30" fill="#f7fafb" stroke="#dce1e5"/><text x="130.0" y="71.0" fill="#755094" font-size="12" font-weight="500" text-anchor="middle"><tspan x="130.0" dy="0">着色排水（染色工程など）</tspan></text><path d="M130 83 L130 95" stroke="#755094" stroke-width="1.5" fill="none"/><path d="M127 90 L130 95 L133 90" stroke="#755094" stroke-width="1.5" fill="none"/><rect x="16" y="100" width="228" height="42" fill="#f7fafb" stroke="#dce1e5"/><text x="130.0" y="117.0" fill="#755094" font-size="12" font-weight="500" text-anchor="middle"><tspan x="130.0" dy="0">SOLリアクター</tspan><tspan x="130.0" dy="16">菌体と接触させ、色素を分解</tspan></text><path d="M130 144 L130 158" stroke="#755094" stroke-width="1.5" fill="none"/><path d="M127 153 L130 158 L133 153" stroke="#755094" stroke-width="1.5" fill="none"/><rect x="16" y="164" width="228" height="30" fill="#f7fafb" stroke="#dce1e5"/><text x="130.0" y="183.0" fill="#755094" font-size="12" font-weight="500" text-anchor="middle"><tspan x="130.0" dy="0">処理水 → 既存の後段処理</tspan></text><text x="130" y="215" fill="#62676d" font-size="11" font-weight="400" text-anchor="middle"><tspan x="130" dy="0">菌体は装置内で保持</tspan><tspan x="130" dy="16">使用条件に応じて交換</tspan></text><rect x="276" y="52" width="228" height="30" fill="#f7fafb" stroke="#dce1e5"/><text x="390.0" y="71.0" fill="#07869e" font-size="12" font-weight="500" text-anchor="middle"><tspan x="390.0" dy="0">金属を含む工場排液・工程液</tspan></text><path d="M390 83 L390 95" stroke="#07869e" stroke-width="1.5" fill="none"/><path d="M387 90 L390 95 L393 90" stroke="#07869e" stroke-width="1.5" fill="none"/><rect x="276" y="100" width="228" height="42" fill="#f7fafb" stroke="#dce1e5"/><text x="390.0" y="117.0" fill="#07869e" font-size="12" font-weight="500" text-anchor="middle"><tspan x="390.0" dy="0">SOLリアクター</tspan><tspan x="390.0" dy="16">菌体に金属を取り込ませる</tspan></text><path d="M390 143 L390 153" stroke="#07869e" stroke-width="1.5" fill="none"/><path d="M334 153 L450 153" stroke="#07869e" stroke-width="1.5" fill="none"/><path d="M334 153 L334 161" stroke="#07869e" stroke-width="1.5" fill="none"/><path d="M331 156 L334 161 L337 156" stroke="#07869e" stroke-width="1.5" fill="none"/><path d="M450 153 L450 161" stroke="#357458" stroke-width="1.5" fill="none"/><path d="M447 156 L450 161 L453 156" stroke="#357458" stroke-width="1.5" fill="none"/><rect x="276" y="166" width="110" height="30" fill="#f7fafb" stroke="#dce1e5"/><text x="331.0" y="185.0" fill="#07869e" font-size="11" font-weight="500" text-anchor="middle"><tspan x="331.0" dy="0">処理水 → 後段処理</tspan></text><rect x="394" y="166" width="110" height="30" fill="#f7fafb" stroke="#dce1e5"/><text x="449.0" y="185.0" fill="#357458" font-size="11" font-weight="500" text-anchor="middle"><tspan x="449.0" dy="0">使用済み菌体回収</tspan></text><path d="M450 198 L450 208" stroke="#357458" stroke-width="1.5" fill="none"/><path d="M447 203 L450 208 L453 203" stroke="#357458" stroke-width="1.5" fill="none"/><rect x="302" y="214" width="202" height="26" fill="#f7fafb" stroke="#dce1e5"/><text x="403.0" y="231.0" fill="#357458" font-size="11" font-weight="500" text-anchor="middle"><tspan x="403.0" dy="0">金属の抽出・精製 → 回収金属</tspan></text></g></svg>