<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
<title id="t">九十日役割メモのテンプレート</title>
<desc id="d">誰が・何を・いつまでに・できなかったらどうするかの四列に、持たないものの注記欄を加えた記入ひな型。研究者・外部経営候補・事業化担当・大学の四行に加え、悪い知らせを弱めずに会議へ戻す機能を独立の行として置く。</desc>
<rect width="920" height="560" fill="#ffffff"/>

<text x="40" y="38" font-size="17" font-weight="700" fill="#1a2a52">九十日役割メモ — 軽い紙を一枚</text>
<text x="40" y="58" font-size="11.5" fill="#555">期間: ____年__月__日 〜 九十日後。九十日ごとに開き直し、配置を現実に合わせて書き換える。</text>

<!-- 列見出し帯。列: 誰が(150) 何を(200) いつまでに(120) できなかったら(200) 持たないもの(150) -->
<!-- x: 40 | 190 | 390 | 510 | 710 | 860 (右端) -->
<rect x="40" y="74" width="820" height="38" fill="#eef2fb" stroke="#2a4d8f" stroke-width="1.6"/>
<line x1="190" y1="74" x2="190" y2="112" stroke="#2a4d8f" stroke-width="1"/>
<line x1="390" y1="74" x2="390" y2="112" stroke="#2a4d8f" stroke-width="1"/>
<line x1="510" y1="74" x2="510" y2="112" stroke="#2a4d8f" stroke-width="1"/>
<line x1="710" y1="74" x2="710" y2="112" stroke="#2a4d8f" stroke-width="1"/>
<text x="115" y="98" font-size="12.5" font-weight="700" fill="#1a2a52" text-anchor="middle">誰が</text>
<text x="290" y="98" font-size="12.5" font-weight="700" fill="#1a2a52" text-anchor="middle">何を</text>
<text x="450" y="98" font-size="12.5" font-weight="700" fill="#1a2a52" text-anchor="middle">いつまでに</text>
<text x="610" y="98" font-size="12.5" font-weight="700" fill="#1a2a52" text-anchor="middle">できなかったら</text>
<text x="785" y="98" font-size="12.5" font-weight="700" fill="#5b73b0" text-anchor="middle">持たないもの</text>

<!-- 行 5本。高さ70。y=112,182,252,322,392 -->
<!-- 縦罫線 (本文域) -->
<line x1="190" y1="112" x2="190" y2="462" stroke="#e2e2e8" stroke-width="1"/>
<line x1="390" y1="112" x2="390" y2="462" stroke="#e2e2e8" stroke-width="1"/>
<line x1="510" y1="112" x2="510" y2="462" stroke="#e2e2e8" stroke-width="1"/>
<line x1="710" y1="112" x2="710" y2="462" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>

<!-- 行1 研究者 -->
<rect x="40" y="112" width="820" height="70" fill="#ffffff" stroke="#e2e2e8" stroke-width="1"/>
<text x="115" y="143" font-size="12" font-weight="700" fill="#e07a5f" text-anchor="middle">研究者</text>
<text x="200" y="140" font-size="10.5" fill="#555">技術の核を説明・守りたい線</text>
<text x="200" y="158" font-size="10.5" fill="#555">の判断・賭ける理由を語る</text>
<text x="450" y="143" font-size="10.5" fill="#888" text-anchor="middle">__/__</text>
<text x="520" y="140" font-size="10.5" fill="#555">守りたい線を再確認し、</text>
<text x="520" y="158" font-size="10.5" fill="#555">配置を組み直す</text>
<text x="785" y="143" font-size="10" fill="#5b73b0" text-anchor="middle">資金実務・契約</text>

<!-- 行2 外部経営候補 -->
<rect x="40" y="182" width="820" height="70" fill="#fbfbfd" stroke="#e2e2e8" stroke-width="1"/>
<text x="115" y="213" font-size="12" font-weight="700" fill="#3a7a4a" text-anchor="middle">外部経営候補</text>
<text x="200" y="210" font-size="10.5" fill="#555">資金調達・採用・契約・</text>
<text x="200" y="228" font-size="10.5" fill="#555">資本政策の実務</text>
<text x="450" y="213" font-size="10.5" fill="#888" text-anchor="middle">__/__</text>
<text x="520" y="210" font-size="10.5" fill="#555">経路を変えて次の九十日を</text>
<text x="520" y="228" font-size="10.5" fill="#555">設計し直す・評価は下げない</text>
<text x="785" y="213" font-size="10" fill="#5b73b0" text-anchor="middle">技術の核の判断</text>

<!-- 行3 事業化担当 -->
<rect x="40" y="252" width="820" height="70" fill="#ffffff" stroke="#e2e2e8" stroke-width="1"/>
<text x="115" y="283" font-size="12" font-weight="700" fill="#5b73b0" text-anchor="middle">事業化担当</text>
<text x="200" y="280" font-size="10.5" fill="#555">企業の問いを予算者・検証</text>
<text x="200" y="298" font-size="10.5" fill="#555">条件への問いに翻訳する</text>
<text x="450" y="283" font-size="10.5" fill="#888" text-anchor="middle">__/__</text>
<text x="520" y="280" font-size="10.5" fill="#555">翻訳できた範囲を記録し、</text>
<text x="520" y="298" font-size="10.5" fill="#555">残りを次回へ持ち越す</text>
<text x="785" y="283" font-size="10" fill="#5b73b0" text-anchor="middle">最終的な経営判断</text>

<!-- 行4 大学(知財/制度) -->
<rect x="40" y="322" width="820" height="70" fill="#fbfbfd" stroke="#e2e2e8" stroke-width="1"/>
<text x="115" y="349" font-size="12" font-weight="700" fill="#b8924a" text-anchor="middle">大学</text>
<text x="115" y="365" font-size="9.5" fill="#888" text-anchor="middle">(知財/制度)</text>
<text x="200" y="350" font-size="10.5" fill="#555">出願の順番・開示してよい</text>
<text x="200" y="368" font-size="10.5" fill="#555">範囲・契約審査の管理</text>
<text x="450" y="353" font-size="10.5" fill="#888" text-anchor="middle">__/__</text>
<text x="520" y="350" font-size="10.5" fill="#555">出願計画を再確認し、</text>
<text x="520" y="368" font-size="10.5" fill="#555">安全な開示範囲を更新</text>
<text x="785" y="353" font-size="10" fill="#5b73b0" text-anchor="middle">事業の意思決定</text>

<!-- 行5 機能行 (独立・強調) -->
<rect x="40" y="392" width="820" height="70" fill="#fdeee9" stroke="#e07a5f" stroke-width="1.8"/>
<text x="115" y="420" font-size="11" font-weight="700" fill="#c0563c" text-anchor="middle">悪い知らせを</text>
<text x="115" y="436" font-size="11" font-weight="700" fill="#c0563c" text-anchor="middle">弱めずに戻す</text>
<text x="115" y="452" font-size="9" fill="#c0563c" text-anchor="middle">(担当者名を入れる)</text>
<text x="200" y="420" font-size="10.5" fill="#555">弱い事実を弱いまま会議へ</text>
<text x="200" y="438" font-size="10.5" fill="#555">戻す。言い換えない</text>
<text x="450" y="423" font-size="10.5" fill="#888" text-anchor="middle">毎回</text>
<text x="520" y="420" font-size="10.5" fill="#555">運ぶことが正式な仕事。</text>
<text x="520" y="438" font-size="10.5" fill="#555">運んだ人を責めない</text>
<text x="785" y="423" font-size="10" fill="#5b73b0" text-anchor="middle">人格の評価</text>

<!-- 注記 -->
<text x="40" y="492" font-size="12" fill="#1a2a52" font-weight="700">読み方</text>
<text x="40" y="512" font-size="11" fill="#555">「できなかったらどうするか」の列が心臓部。失敗してよい範囲を先に宣言すると、人が手を挙げやすくなる。</text>
<text x="40" y="530" font-size="11" fill="#555">最下行 = 役割ではなく「機能」。誰かの名前を入れて独立させると、悪い知らせの第一声が出やすくなる。</text>
<text x="40" y="548" font-size="11" fill="#c0563c">これは契約書ではなく軽いメモ。効力の源泉は署名ではなく、全員が同じ紙を見たという事実。</text>
</svg>
