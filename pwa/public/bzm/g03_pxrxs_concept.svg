<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">三因子の積の概念図 — 天井 P × 到達度 R × 生存確率 S</title>
  <desc id="d">天井の大きさ P、到達度 R、生存確率 S の三つを掛け合わせてプロジェクトの価値が決まることを、山・階段・ランナーのメタファーで横並びに示した概念図。</desc>
  <rect width="880" height="460" fill="#ffffff"/>

  <!-- 見出し -->
  <text x="40" y="44" font-size="16" font-weight="700" fill="#1a2a52">プロジェクトの価値 ＝ P × R × S</text>
  <text x="40" y="66" font-size="12" fill="#555">三つは別の量。掛け算なので、どれか一つが低いと全体が沈む</text>

  <defs>
    <marker id="arrR" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#e07a5f"/>
    </marker>
  </defs>

  <!-- ===== P: 天井(山) ===== -->
  <rect x="40" y="92" width="200" height="248" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="1.8"/>
  <text x="140" y="120" font-size="15" font-weight="700" fill="#1a2a52" text-anchor="middle">P ・ 天井</text>
  <text x="140" y="140" font-size="11.5" fill="#555" text-anchor="middle">賞金の大きさ</text>
  <!-- 山 -->
  <path d="M62 300 L128 168 L150 210 L172 184 L218 300 Z" fill="#fff" stroke="#2a4d8f" stroke-width="1.8"/>
  <!-- 頂上の賞金マーク -->
  <circle cx="128" cy="158" r="9" fill="#e07a5f"/>
  <text x="128" y="162" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">¥</text>
  <!-- 高さ目盛りの注記(線と離す) -->
  <line x1="232" y1="160" x2="232" y2="300" stroke="#5b73b0" stroke-width="1.2"/>
  <line x1="228" y1="160" x2="236" y2="160" stroke="#5b73b0" stroke-width="1.2"/>
  <line x1="228" y1="300" x2="236" y2="300" stroke="#5b73b0" stroke-width="1.2"/>
  <text x="140" y="324" font-size="11.5" fill="#2a4d8f" text-anchor="middle">最大でどれだけ大きいか</text>

  <!-- × -->
  <text x="262" y="222" font-size="30" font-weight="700" fill="#888" text-anchor="middle">×</text>

  <!-- ===== R: 到達度(階段) ===== -->
  <rect x="284" y="92" width="200" height="248" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="1.8"/>
  <text x="384" y="120" font-size="15" font-weight="700" fill="#1a2a52" text-anchor="middle">R ・ 到達度</text>
  <text x="384" y="140" font-size="11.5" fill="#555" text-anchor="middle">いまどこまで来たか</text>
  <!-- 階段(積み上がったストック) -->
  <g fill="#fff" stroke="#2a4d8f" stroke-width="1.6">
    <rect x="306" y="276" width="34" height="24"/>
    <rect x="340" y="252" width="34" height="48"/>
    <rect x="374" y="228" width="34" height="72"/>
    <rect x="408" y="204" width="34" height="96"/>
  </g>
  <!-- 現在位置マーカー -->
  <circle cx="391" cy="222" r="8" fill="#e07a5f"/>
  <text x="430" y="226" font-size="11" fill="#c0563c" text-anchor="start">現在地</text>
  <!-- 事業化ライン -->
  <line x1="306" y1="186" x2="442" y2="186" stroke="#3a7a4a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="306" y="178" font-size="10.5" fill="#3a7a4a" text-anchor="start">事業化ライン</text>
  <text x="384" y="324" font-size="11.5" fill="#2a4d8f" text-anchor="middle">消えない達成の蓄積</text>

  <!-- × -->
  <text x="506" y="222" font-size="30" font-weight="700" fill="#888" text-anchor="middle">×</text>

  <!-- ===== S: 生存(ランナー) ===== -->
  <rect x="528" y="92" width="200" height="248" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="1.8"/>
  <text x="628" y="120" font-size="15" font-weight="700" fill="#1a2a52" text-anchor="middle">S ・ 生存</text>
  <text x="628" y="140" font-size="11.5" fill="#555" text-anchor="middle">走り切れるか</text>
  <!-- 走路 -->
  <line x1="548" y1="284" x2="708" y2="284" stroke="#444" stroke-width="1.4"/>
  <line x1="700" y1="270" x2="700" y2="298" stroke="#3a7a4a" stroke-width="2"/>
  <text x="700" y="312" font-size="10.5" fill="#3a7a4a" text-anchor="middle">ゴール</text>
  <!-- ランナー -->
  <g stroke="#1a2a52" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="592" cy="246" r="6" fill="#1a2a52" stroke="none"/>
    <path d="M592 252 L592 268"/>
    <path d="M592 258 L580 264 M592 258 L604 252"/>
    <path d="M592 268 L582 282 M592 268 L604 280"/>
  </g>
  <!-- 燃料ゲージ -->
  <rect x="548" y="160" width="160" height="20" rx="4" fill="#fff" stroke="#3a7a4a" stroke-width="1.4"/>
  <rect x="550" y="162" width="96" height="16" rx="3" fill="#eef7f0"/>
  <line x1="646" y1="160" x2="646" y2="180" stroke="#3a7a4a" stroke-width="1.4"/>
  <text x="628" y="198" font-size="10.5" fill="#3a7a4a" text-anchor="middle">資金・選択肢の残量</text>
  <text x="628" y="324" font-size="11.5" fill="#2a4d8f" text-anchor="middle">死なずに主導権を保つ</text>

  <!-- = 価値 -->
  <text x="752" y="222" font-size="26" font-weight="700" fill="#888" text-anchor="middle">＝</text>

  <!-- 価値の箱 -->
  <rect x="772" y="148" width="84" height="148" rx="8" fill="#3a7a4a" stroke="#2c6038" stroke-width="2"/>
  <text x="814" y="212" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">価値</text>
  <text x="814" y="232" font-size="11" fill="#eef7f0" text-anchor="middle">P×R×S</text>

  <!-- 下部注記 -->
  <text x="40" y="378" font-size="12" fill="#c0563c" font-style="italic">P は「賞金の大きさ」、R は「どこまで来たか」、S は「走り切れるか」。</text>
  <text x="40" y="398" font-size="12" fill="#555">三つを別々に測って初めて、いま何が律速かが見え、次の一手に使える。</text>
  <text x="40" y="424" font-size="11.5" fill="#888">足し算なら「合計点はそこそこ」になる弱点も、積は容赦なく低く出す。</text>
</svg>
