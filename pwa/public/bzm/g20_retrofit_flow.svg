<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">検証の二本立てフロー — retrofit と事前予測</title>
  <desc id="d">左列は終了案件の一次資料を blind 採点して軌跡を再構成し型の照合台帳へ至る retrofit の経路。右列は進行中案件の判定と予測を日付つきで記録し数か月後に答え合わせする事前予測の経路。両列の出力が下部のモデル更新に合流し、左から右へ照合台帳が予測の材料になる横矢印が一本走る。</desc>
  <rect width="820" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2a4d8f"/>
    </marker>
    <marker id="arrGn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3a7a4a"/>
    </marker>
    <marker id="arrO2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#e07a5f"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="15" font-weight="700" fill="#1a2a52">検証の二本立て — 過去で学び、未来で試す</text>

  <!-- ===== 左列: retrofit (過去) ===== -->
  <text x="200" y="76" font-size="14" font-weight="700" fill="#2a4d8f" text-anchor="middle">retrofit (過去)</text>

  <rect x="70" y="92" width="260" height="56" rx="7" fill="#eef2fb" stroke="#2a4d8f" stroke-width="1.8"/>
  <text x="200" y="115" font-size="12.5" font-weight="700" fill="#1a2a52" text-anchor="middle">終了案件の一次資料</text>
  <text x="200" y="134" font-size="10.5" fill="#555" text-anchor="middle">会議メモ・実験報告・契約書 (日付つき)</text>

  <line x1="200" y1="148" x2="200" y2="174" stroke="#2a4d8f" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="70" y="178" width="260" height="56" rx="7" fill="#eef2fb" stroke="#2a4d8f" stroke-width="1.8"/>
  <text x="200" y="201" font-size="12.5" font-weight="700" fill="#1a2a52" text-anchor="middle">blind 採点</text>
  <text x="200" y="220" font-size="10.5" fill="#555" text-anchor="middle">当時の資料のみ・根拠を紐付け</text>

  <line x1="200" y1="234" x2="200" y2="260" stroke="#2a4d8f" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="70" y="264" width="260" height="50" rx="7" fill="#fff" stroke="#5b73b0" stroke-width="1.6"/>
  <text x="200" y="294" font-size="12.5" font-weight="700" fill="#2a4d8f" text-anchor="middle">軌跡の再構成</text>

  <line x1="200" y1="314" x2="200" y2="340" stroke="#2a4d8f" stroke-width="2" marker-end="url(#arrB)"/>

  <rect x="70" y="344" width="260" height="56" rx="7" fill="#fff" stroke="#5b73b0" stroke-width="1.6"/>
  <text x="200" y="367" font-size="12.5" font-weight="700" fill="#2a4d8f" text-anchor="middle">型の照合台帳</text>
  <text x="200" y="386" font-size="10.5" fill="#555" text-anchor="middle">死に方の記録 = 早期警報の元</text>

  <!-- ===== 右列: 事前予測 (未来) ===== -->
  <text x="620" y="76" font-size="14" font-weight="700" fill="#3a7a4a" text-anchor="middle">事前予測 (未来)</text>

  <rect x="490" y="92" width="260" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="620" y="115" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">進行中案件の採点</text>
  <text x="620" y="134" font-size="10.5" fill="#555" text-anchor="middle">現在の軸の値・統合スコア・判定</text>

  <line x1="620" y1="148" x2="620" y2="174" stroke="#3a7a4a" stroke-width="2" marker-end="url(#arrGn)"/>

  <rect x="490" y="178" width="260" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="620" y="201" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">判定・予測を日付つきで記録</text>
  <text x="620" y="220" font-size="10.5" fill="#555" text-anchor="middle">今後6か月の軌跡を先に書く</text>

  <line x1="620" y1="234" x2="620" y2="260" stroke="#3a7a4a" stroke-width="2" marker-end="url(#arrGn)"/>

  <rect x="490" y="264" width="260" height="50" rx="7" fill="#fff" stroke="#3a7a4a" stroke-width="1.6"/>
  <text x="620" y="294" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">数か月後に答え合わせ</text>

  <line x1="620" y1="314" x2="620" y2="340" stroke="#3a7a4a" stroke-width="2" marker-end="url(#arrGn)"/>

  <rect x="490" y="344" width="260" height="56" rx="7" fill="#fff" stroke="#3a7a4a" stroke-width="1.6"/>
  <text x="620" y="367" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">外れの分析</text>
  <text x="620" y="386" font-size="10.5" fill="#555" text-anchor="middle">外れた案件こそ宝 — 仮定を特定</text>

  <!-- 左→右 横矢印 (照合台帳が予測の材料に) -->
  <line x1="330" y1="372" x2="490" y2="372" stroke="#e07a5f" stroke-width="2.2" marker-end="url(#arrO2)"/>
  <text x="410" y="362" font-size="10.5" fill="#c0563c" text-anchor="middle">型の照合台帳が</text>
  <text x="410" y="392" font-size="10.5" fill="#c0563c" text-anchor="middle">予測の材料になる</text>

  <!-- 両列 → 下部のモデル更新へ合流 -->
  <line x1="200" y1="400" x2="370" y2="468" stroke="#444" stroke-width="1.8" marker-end="url(#arrO2)"/>
  <line x1="620" y1="400" x2="450" y2="468" stroke="#444" stroke-width="1.8" marker-end="url(#arrO2)"/>

  <rect x="230" y="474" width="360" height="58" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2.2"/>
  <text x="410" y="499" font-size="13.5" font-weight="700" fill="#1a2a52" text-anchor="middle">モデル更新</text>
  <text x="410" y="519" font-size="11" fill="#555" text-anchor="middle">パラメータ校正・欠落の発見</text>
</svg>
