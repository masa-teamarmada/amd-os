<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">タイミングの窓</title>
  <desc id="d">時間軸の上に、早すぎる設立・適時の帯 (窓)・遅すぎる決断の三帯を示す。中央の適時帯を緑、両端を警告色で表し、それぞれの典型的な結末を書き込む。窓は案件ごとに移動し、固定の正解時期はない。</desc>
  <rect width="860" height="470" fill="#ffffff"/>

  <defs>
    <marker id="arrT" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="40" y="44" font-size="16" font-weight="700" fill="#2a4d8f">タイミングの窓 — 早すぎても、遅すぎても閉じる</text>

  <!-- 三帯 -->
  <!-- 早すぎる (警告色: オレンジ) -->
  <rect x="40" y="78" width="240" height="64" rx="8" fill="#fbeee9" stroke="#c0563c" stroke-width="2"/>
  <text x="160" y="105" font-size="14" font-weight="700" fill="#c0563c" text-anchor="middle">早すぎる設立</text>
  <text x="160" y="127" font-size="11" fill="#555" text-anchor="middle">検証より先に器を作る</text>

  <!-- 適時の窓 (緑) -->
  <rect x="296" y="78" width="268" height="64" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2.4"/>
  <text x="430" y="105" font-size="14.5" font-weight="700" fill="#2c6038" text-anchor="middle">適時の帯 (窓)</text>
  <text x="430" y="127" font-size="11" fill="#555" text-anchor="middle">失うものと得るものが釣り合う区間</text>

  <!-- 遅すぎる (警告色: 濃グレー寄りオレンジ) -->
  <rect x="580" y="78" width="240" height="64" rx="8" fill="#fbeee9" stroke="#c0563c" stroke-width="2"/>
  <text x="700" y="105" font-size="14" font-weight="700" fill="#c0563c" text-anchor="middle">遅すぎる決断</text>
  <text x="700" y="127" font-size="11" fill="#555" text-anchor="middle">確認と調整に時間を使ううちに</text>

  <!-- 時間軸 -->
  <line x1="40" y1="164" x2="828" y2="164" stroke="#555" stroke-width="2" marker-end="url(#arrT)"/>
  <text x="828" y="184" font-size="11.5" fill="#555" text-anchor="end">時間</text>
  <!-- 窓の境界マーカー -->
  <line x1="296" y1="158" x2="296" y2="170" stroke="#3a7a4a" stroke-width="2"/>
  <line x1="564" y1="158" x2="564" y2="170" stroke="#3a7a4a" stroke-width="2"/>

  <!-- 早すぎ側の典型結末 -->
  <text x="40" y="216" font-size="12.5" font-weight="700" fill="#c0563c">早すぎ側の典型結末</text>
  <rect x="40" y="228" width="240" height="170" rx="7" fill="#fff" stroke="#c0563c" stroke-width="1.4"/>
  <text x="58" y="256" font-size="11.5" fill="#555">(1) 器だけの会社</text>
  <text x="58" y="284" font-size="11.5" fill="#555">(2) 固定費の先行</text>
  <text x="58" y="312" font-size="11.5" fill="#555">(3) 研究時間の消失</text>
  <text x="58" y="340" font-size="11.5" fill="#555">(4) 補助金頼みの延命</text>
  <text x="58" y="376" font-size="10.5" fill="#888" font-style="italic">会社は作るより畳むほうが難しい</text>

  <!-- 適時側の注記 -->
  <text x="430" y="216" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">窓は案件ごとに動く</text>
  <rect x="300" y="228" width="260" height="170" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.4"/>
  <text x="430" y="262" font-size="11.5" fill="#2c6038" text-anchor="middle">固定の「正しい設立時期」は</text>
  <text x="430" y="282" font-size="11.5" fill="#2c6038" text-anchor="middle">存在しない</text>
  <text x="430" y="318" font-size="11" fill="#555" text-anchor="middle">技術の性質・競合・知財の状態・</text>
  <text x="430" y="338" font-size="11" fill="#555" text-anchor="middle">担い手の準備・資金で位置が動く</text>
  <text x="430" y="376" font-size="10.5" fill="#888" text-anchor="middle" font-style="italic">問うべきは「判断の持ち主は誰か」</text>

  <!-- 遅すぎ側の典型結末 -->
  <text x="580" y="216" font-size="12.5" font-weight="700" fill="#c0563c">遅すぎ側の典型結末</text>
  <rect x="580" y="228" width="240" height="170" rx="7" fill="#fff" stroke="#c0563c" stroke-width="1.4"/>
  <text x="598" y="256" font-size="11.5" fill="#555">(1) 競合の先行</text>
  <text x="598" y="284" font-size="11.5" fill="#555">(2) 知財と関心の鮮度切れ</text>
  <text x="598" y="312" font-size="11.5" fill="#555">(3) 人が待てない</text>
  <text x="598" y="340" font-size="11.5" fill="#555">(4) 静かな立ち消え</text>
  <text x="598" y="376" font-size="10.5" fill="#888" font-style="italic">遅すぎた失敗は見えない</text>

  <text x="40" y="440" font-size="11" fill="#888">注: 早すぎた失敗は観測され語られ教訓になるが、遅すぎた失敗は数えられない。両方を同じ地図の上で見る。</text>
</svg>
