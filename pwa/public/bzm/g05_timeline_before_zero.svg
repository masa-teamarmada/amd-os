<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Before Zero の時間軸</title>
  <desc id="d">研究成果から法人設立までの長い助走区間を示す。Before Zero の途中で、出願と公開の順序、用途の選択、担い手、初期の資本構成という後から巻き戻しにくい判断が打ち込まれる。</desc>
  <rect width="920" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e07a5f"/>
    </marker>
    <marker id="pinEnd" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M1,0 L9,0 L5,8 Z" fill="#c0563c"/>
    </marker>
  </defs>

  <text x="46" y="48" font-size="18" font-weight="700" fill="#2a4d8f">Before Zero の時間軸 — 会社になる前に、判断が打ち込まれる</text>
  <text x="46" y="76" font-size="12" fill="#555">研究成果からゼロまでの助走区間は空白ではない。ここで選んだ順序・用途・担い手・資本の形が、後から制約になる。</text>

  <g id="timeline">
    <rect x="48" y="118" width="132" height="72" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2.2"/>
    <text x="114" y="147" font-size="15" font-weight="700" fill="#1a2a52" text-anchor="middle">研究成果</text>
    <text x="114" y="169" font-size="11.5" fill="#555" text-anchor="middle">論文 / 発表</text>
    <text x="114" y="184" font-size="11.5" fill="#555" text-anchor="middle">発明の兆し</text>

    <rect x="206" y="112" width="508" height="84" rx="9" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2.1"/>
    <text x="460" y="132" font-size="13" font-weight="700" fill="#2c6038" text-anchor="middle">Before Zero</text>
    <line x1="333" y1="144" x2="333" y2="196" stroke="#3a7a4a" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="460" y1="144" x2="460" y2="196" stroke="#3a7a4a" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="587" y1="144" x2="587" y2="196" stroke="#3a7a4a" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="269" y="171" font-size="13.5" font-weight="700" fill="#2c6038" text-anchor="middle">探索</text>
    <text x="396" y="171" font-size="13.5" font-weight="700" fill="#2c6038" text-anchor="middle">事業化仮説</text>
    <text x="523" y="171" font-size="13.5" font-weight="700" fill="#2c6038" text-anchor="middle">外部接触</text>
    <text x="650" y="171" font-size="13.5" font-weight="700" fill="#2c6038" text-anchor="middle">設立準備</text>

    <rect x="740" y="118" width="132" height="72" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2.2"/>
    <text x="806" y="144" font-size="15" font-weight="700" fill="#1a2a52" text-anchor="middle">ゼロ</text>
    <text x="806" y="166" font-size="11.5" fill="#555" text-anchor="middle">法人設立</text>
    <text x="806" y="181" font-size="11.5" fill="#555" text-anchor="middle">事業開始</text>

    <line x1="206" y1="226" x2="714" y2="226" stroke="#e07a5f" stroke-width="2.4" marker-end="url(#arrowOrange)"/>
    <text x="460" y="248" font-size="12" fill="#c0563c" text-anchor="middle" font-style="italic">時間 — しばしば十年以上</text>
  </g>

  <line x1="48" y1="282" x2="872" y2="282" stroke="#e2e2e8" stroke-width="1.4"/>
  <text x="48" y="312" font-size="15" font-weight="700" fill="#c0563c">後から取り返しにくい判断</text>
  <text x="252" y="312" font-size="12" fill="#555">それぞれの判断は、助走区間のある時点でプロジェクトに埋め込まれる。</text>

  <g id="decision-pins" stroke="#c0563c" stroke-width="1.8" fill="none" marker-end="url(#pinEnd)">
    <line x1="269" y1="202" x2="162" y2="344"/>
    <line x1="396" y1="202" x2="360" y2="344"/>
    <line x1="523" y1="202" x2="560" y2="344"/>
    <line x1="650" y1="202" x2="758" y2="344"/>
  </g>

  <g id="decision-cards">
    <rect x="52" y="352" width="196" height="92" rx="8" fill="#ffffff" stroke="#5b73b0" stroke-width="1.8"/>
    <text x="150" y="381" font-size="12.5" font-weight="700" fill="#2a4d8f" text-anchor="middle">(1) 出願と公開の順序</text>
    <text x="150" y="407" font-size="11" fill="#555" text-anchor="middle">何を出願し、何を発表し、</text>
    <text x="150" y="424" font-size="11" fill="#555" text-anchor="middle">どの順番で外に出すか</text>

    <rect x="266" y="352" width="196" height="92" rx="8" fill="#ffffff" stroke="#5b73b0" stroke-width="1.8"/>
    <text x="364" y="381" font-size="12.5" font-weight="700" fill="#2a4d8f" text-anchor="middle">(2) 用途の選択</text>
    <text x="364" y="407" font-size="11" fill="#555" text-anchor="middle">どの用途から入り、</text>
    <text x="364" y="424" font-size="11" fill="#555" text-anchor="middle">知財・検証・相手を固定するか</text>

    <rect x="480" y="352" width="196" height="92" rx="8" fill="#ffffff" stroke="#5b73b0" stroke-width="1.8"/>
    <text x="578" y="381" font-size="12.5" font-weight="700" fill="#2a4d8f" text-anchor="middle">(3) 担い手</text>
    <text x="578" y="407" font-size="11" fill="#555" text-anchor="middle">誰が、どの機能を、</text>
    <text x="578" y="424" font-size="11" fill="#555" text-anchor="middle">いつ背負うか</text>

    <rect x="694" y="352" width="196" height="92" rx="8" fill="#ffffff" stroke="#5b73b0" stroke-width="1.8"/>
    <text x="792" y="381" font-size="12.5" font-weight="700" fill="#2a4d8f" text-anchor="middle">(4) 初期の資本構成</text>
    <text x="792" y="407" font-size="11" fill="#555" text-anchor="middle">資金の性質が、</text>
    <text x="792" y="424" font-size="11" fill="#555" text-anchor="middle">後の行動を縛る</text>
  </g>

  <rect x="48" y="470" width="824" height="30" rx="7" fill="#fff8f5" stroke="#f0d3c9" stroke-width="1.2"/>
  <text x="460" y="490" font-size="11.5" fill="#555" text-anchor="middle">ゼロの瞬間に問題が生まれるのではなく、助走区間で仕込まれた歪みが会社という器を得て表面化する。</text>
</svg>
