<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Before Zero の時間軸</title>
  <desc id="d">左端の研究成果から右端のゼロ (法人設立) まで、しばしば十年以上に伸びる助走区間。探索・事業化仮説・外部接触・設立準備の四フェーズと、帯の下に打ち込まれる後から取り返しにくい判断を示す。</desc>
  <rect width="860" height="460" fill="#ffffff"/>

  <defs>
    <marker id="arrEnd" markerWidth="11" markerHeight="11" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#e07a5f"/>
    </marker>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="3" refY="7" orient="auto">
      <path d="M0,0 L6,0 L3,7 Z" fill="#c0563c"/>
    </marker>
  </defs>

  <!-- 見出し -->
  <text x="40" y="44" font-size="16" font-weight="700" fill="#2a4d8f">Before Zero の時間軸 — しばしば十年以上の助走区間</text>

  <!-- 左端 研究成果 -->
  <rect x="36" y="78" width="124" height="60" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2"/>
  <text x="98" y="104" font-size="13" font-weight="700" fill="#1a2a52" text-anchor="middle">研究成果</text>
  <text x="98" y="124" font-size="11" fill="#555" text-anchor="middle">論文・発表</text>

  <!-- 右端 ゼロ -->
  <rect x="700" y="78" width="124" height="60" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2"/>
  <text x="762" y="100" font-size="13" font-weight="700" fill="#1a2a52" text-anchor="middle">ゼロ</text>
  <text x="762" y="119" font-size="11" fill="#555" text-anchor="middle">法人設立</text>
  <text x="762" y="133" font-size="11" fill="#555" text-anchor="middle">事業開始</text>

  <!-- 助走帯 (4フェーズ) -->
  <rect x="168" y="82" width="524" height="52" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <line x1="299" y1="82" x2="299" y2="134" stroke="#3a7a4a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="430" y1="82" x2="430" y2="134" stroke="#3a7a4a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="561" y1="82" x2="561" y2="134" stroke="#3a7a4a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="233" y="113" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">探索</text>
  <text x="364" y="113" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">事業化仮説</text>
  <text x="495" y="113" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">外部接触</text>
  <text x="626" y="113" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">設立準備</text>

  <!-- 時間の矢印 (帯の下、判断列とは別の高さ) -->
  <line x1="168" y1="156" x2="690" y2="156" stroke="#e07a5f" stroke-width="2.2" marker-end="url(#arrEnd)"/>
  <text x="430" y="174" font-size="11.5" fill="#c0563c" text-anchor="middle" font-style="italic">時間 — しばしば十年以上</text>

  <!-- 区切りライン -->
  <line x1="36" y1="196" x2="824" y2="196" stroke="#e2e2e8" stroke-width="1.4"/>
  <text x="40" y="222" font-size="13.5" font-weight="700" fill="#c0563c">後から取り返しにくい判断 — 助走の途中で打ち込まれ、巻き戻せない</text>

  <!-- 判断ポイント (4本、各フェーズ下に縦に打ち込む) -->
  <!-- 1 出願と公開の順序 -->
  <line x1="233" y1="240" x2="233" y2="262" stroke="#c0563c" stroke-width="1.8" marker-end="url(#arrDown)"/>
  <rect x="120" y="266" width="226" height="62" rx="7" fill="#fff" stroke="#5b73b0" stroke-width="1.6"/>
  <text x="233" y="290" font-size="12" font-weight="700" fill="#2a4d8f" text-anchor="middle">(1) 出願と公開の順序</text>
  <text x="233" y="312" font-size="11" fill="#555" text-anchor="middle">出願前に公開した発明は特許化不可</text>

  <!-- 2 用途の選択 -->
  <line x1="364" y1="240" x2="364" y2="262" stroke="#c0563c" stroke-width="1.8" marker-end="url(#arrDown)"/>
  <rect x="120" y="338" width="226" height="62" rx="7" fill="#fff" stroke="#5b73b0" stroke-width="1.6"/>
  <text x="233" y="362" font-size="12" font-weight="700" fill="#2a4d8f" text-anchor="middle">(2) 用途の選択</text>
  <text x="233" y="384" font-size="11" fill="#555" text-anchor="middle">知財の範囲・検証順・相手を固定する</text>

  <!-- 3 担い手 -->
  <line x1="495" y1="240" x2="495" y2="262" stroke="#c0563c" stroke-width="1.8" marker-end="url(#arrDown)"/>
  <rect x="512" y="266" width="226" height="62" rx="7" fill="#fff" stroke="#5b73b0" stroke-width="1.6"/>
  <text x="625" y="290" font-size="12" font-weight="700" fill="#2a4d8f" text-anchor="middle">(3) 担い手</text>
  <text x="625" y="312" font-size="11" fill="#555" text-anchor="middle">誰がどの機能を背負うかの設計</text>

  <!-- 4 初期の資本構成 -->
  <line x1="626" y1="240" x2="626" y2="262" stroke="#c0563c" stroke-width="1.8" marker-end="url(#arrDown)"/>
  <rect x="512" y="338" width="226" height="62" rx="7" fill="#fff" stroke="#5b73b0" stroke-width="1.6"/>
  <text x="625" y="362" font-size="12" font-weight="700" fill="#2a4d8f" text-anchor="middle">(4) 初期の資本構成</text>
  <text x="625" y="384" font-size="11" fill="#555" text-anchor="middle">資金の性質が後の足かせになりうる</text>

  <text x="40" y="436" font-size="11" fill="#888">注: 多くの問題はゼロの瞬間に生まれず、手前のフェーズで仕込まれた歪みが会社という器を得て表面化する。</text>
</svg>
