<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">図1-2 三項構造マップ</title>
  <desc id="desc">見えない状態空間 x を、SPS と ECR の二つの観測レンズで別々に測り、RT が観測結果を行動に変えて状態へ働きかける構造図。SPS と ECR の間には合成演算の線を引かない。</desc>
  <rect width="960" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.4" orient="auto">
      <path d="M0,0 L8,3.4 L0,6.8 Z" fill="#2a4d8f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.4" orient="auto">
      <path d="M0,0 L8,3.4 L0,6.8 Z" fill="#3a7a4a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.4" orient="auto">
      <path d="M0,0 L8,3.4 L0,6.8 Z" fill="#e07a5f"/>
    </marker>
    <marker id="arrowAction" markerWidth="12" markerHeight="12" refX="9" refY="3.6" orient="auto">
      <path d="M0,0 L9,3.6 L0,7.2 Z" fill="#c0563c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="48" y="44" font-size="17" font-weight="700" fill="#1a2a52">三項構造マップ</text>
  <text x="48" y="68" font-size="12.5" fill="#555">観測二層と行動一層は、状態 x を挟んで役割を分担する「構造の組」である</text>

  <!-- Group labels -->
  <text x="70" y="100" font-size="14" font-weight="700" fill="#1a2a52">観測二層</text>
  <text x="715" y="204" font-size="14" font-weight="700" fill="#c0563c">行動一層</text>

  <!-- SPS card -->
  <rect x="58" y="114" width="278" height="118" rx="8" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2"/>
  <text x="197" y="144" font-size="17" font-weight="700" fill="#1a2a52" text-anchor="middle">SPS</text>
  <text x="197" y="166" font-size="12.5" fill="#2a4d8f" text-anchor="middle">シーズ有望度 / 案件を測る</text>
  <rect x="93" y="184" width="208" height="28" rx="5" fill="#ffffff" stroke="#5b73b0" stroke-width="1.2"/>
  <text x="197" y="203" font-size="12.5" font-weight="700" fill="#1a2a52" text-anchor="middle">P × R × S</text>
  <text x="197" y="224" font-size="10.8" fill="#555" text-anchor="middle">天井・到達・生存を掛け算で見る</text>

  <!-- ECR card -->
  <rect x="58" y="328" width="278" height="118" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
  <text x="197" y="358" font-size="17" font-weight="700" fill="#2c6038" text-anchor="middle">ECR</text>
  <text x="197" y="380" font-size="12.5" fill="#3a7a4a" text-anchor="middle">エコシステム構築率 / 苗床を測る</text>
  <rect x="93" y="398" width="208" height="28" rx="5" fill="#ffffff" stroke="#6f9b78" stroke-width="1.2"/>
  <text x="197" y="417" font-size="12.2" font-weight="700" fill="#2c6038" text-anchor="middle">重み付き充足率</text>
  <text x="197" y="438" font-size="10.8" fill="#555" text-anchor="middle">欠けている軸を足し算で診断する</text>

  <!-- Non-composition note -->
  <text x="197" y="276" font-size="11.5" fill="#c0563c" text-anchor="middle">二つの測定値は、単一点数へ混ぜない</text>
  <text x="197" y="300" font-size="10.8" fill="#777" text-anchor="middle">SPS と ECR の間には線を引かない</text>

  <!-- Hidden state x -->
  <rect x="382" y="222" width="246" height="112" rx="10" fill="#fffaf4" stroke="#8a6f4d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="505" y="252" font-size="17" font-weight="700" fill="#604822" text-anchor="middle">状態空間 x</text>
  <text x="505" y="276" font-size="14" fill="#604822" text-anchor="middle">x = (ι, F, S₀, I)</text>
  <text x="505" y="300" font-size="11.5" fill="#555" text-anchor="middle">直接は見えない現在地</text>
  <text x="505" y="318" font-size="10.5" fill="#777" text-anchor="middle">断片から現在地を推定する</text>

  <!-- Observable fragments around x -->
  <g font-size="10.5" fill="#777">
    <rect x="418" y="190" width="48" height="20" rx="10" fill="#f7f7f7" stroke="#d0d0d0"/>
    <text x="442" y="204" text-anchor="middle">論文</text>
    <rect x="481" y="184" width="48" height="20" rx="10" fill="#f7f7f7" stroke="#d0d0d0"/>
    <text x="505" y="198" text-anchor="middle">特許</text>
    <rect x="544" y="190" width="48" height="20" rx="10" fill="#f7f7f7" stroke="#d0d0d0"/>
    <text x="568" y="204" text-anchor="middle">契約</text>
  </g>

  <!-- RT card -->
  <rect x="700" y="222" width="220" height="112" rx="8" fill="#fff3ec" stroke="#e07a5f" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="810" y="250" font-size="17" font-weight="700" fill="#c0563c" text-anchor="middle">RT</text>
  <text x="810" y="273" font-size="12.3" fill="#c0563c" text-anchor="middle">ラウンドテーブル / 動かす手</text>
  <rect x="728" y="290" width="164" height="28" rx="5" fill="#ffffff" stroke="#e0a08d" stroke-width="1.2"/>
  <text x="810" y="309" font-size="11.5" font-weight="700" fill="#8d3b27" text-anchor="middle">コミットメント + 権利</text>
  <text x="810" y="329" font-size="10.3" fill="#777" text-anchor="middle">検証途上の仮説的な柱</text>

  <!-- Observation arrows into x -->
  <path d="M338 176 C360 186 364 232 382 252" fill="none" stroke="#2a4d8f" stroke-width="2.1" marker-end="url(#arrowBlue)"/>
  <rect x="335" y="193" width="58" height="18" rx="9" fill="#ffffff"/>
  <text x="364" y="206" font-size="10.8" fill="#2a4d8f" text-anchor="middle">案件観測</text>

  <path d="M338 388 C360 372 364 326 382 304" fill="none" stroke="#3a7a4a" stroke-width="2.1" marker-end="url(#arrowGreen)"/>
  <rect x="335" y="354" width="58" height="18" rx="9" fill="#ffffff"/>
  <text x="364" y="367" font-size="10.8" fill="#3a7a4a" text-anchor="middle">苗床観測</text>

  <!-- Measurement results into RT, routed around x -->
  <path d="M338 132 C496 82 704 106 787 222" fill="none" stroke="#e07a5f" stroke-width="1.9" marker-end="url(#arrowOrange)"/>
  <rect x="496" y="86" width="140" height="20" rx="10" fill="#ffffff"/>
  <text x="566" y="101" font-size="10.8" fill="#c0563c" text-anchor="middle">測定結果を行動へ渡す</text>

  <path d="M338 432 C500 504 704 466 788 334" fill="none" stroke="#e07a5f" stroke-width="1.9" marker-end="url(#arrowOrange)"/>
  <rect x="496" y="459" width="140" height="20" rx="10" fill="#ffffff"/>
  <text x="566" y="474" font-size="10.8" fill="#c0563c" text-anchor="middle">測定結果を行動へ渡す</text>

  <!-- Action arrow back to x -->
  <path d="M698 278 C678 278 654 278 628 278" fill="none" stroke="#c0563c" stroke-width="3" marker-end="url(#arrowAction)"/>
  <rect x="650" y="253" width="48" height="18" rx="9" fill="#ffffff"/>
  <text x="674" y="266" font-size="10.8" fill="#c0563c" text-anchor="middle">動かす</text>

  <!-- Footer -->
  <text x="48" y="506" font-size="11.8" fill="#555">SPS は案件を、ECR は苗床を別々に測る。RT は二層の測定結果を、現実を動かす行動へ変換する。</text>
  <text x="48" y="526" font-size="11.5" fill="#777">三項は積の式ではなく、状態 x をめぐる役割分担の地図である。</text>
</svg>
