<text x="526" y="18" font-size="13" font-weight="700" fill="#b8924a">行政 <tspan font-size="10" font-weight="400">(3刻み/周)</tspan></text>
<text x="526" y="33" font-size="9.5" fill="#b8924a" opacity="0.85">概算要求・公募・年度執行</text>
<circle cx="470" cy="300" r="54" fill="#1a2a52"/>
<text x="470" y="294" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">研究</text>
<text x="470" y="312" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">テーマ</text>
<text x="30" y="548" font-size="12" fill="#1a2a52" font-weight="700">読み方</text>
<text x="30" y="570" font-size="11" fill="#555">各リング = ひとりの関係者の「時計」。</text>
<text x="30" y="588" font-size="11" fill="#555">目盛りが多いほど 1 周が短い = 速く回る。</text>
<text x="30" y="606" font-size="11" fill="#555">内側(研究者)ほど速く、外側(行政)ほど遅い。</text>
<text x="30" y="624" font-size="11" fill="#c0563c">締切が来る速さがリングごとに違い、すれ違う。</text>
