<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">不確実性の地図 — 七つの領域</title>
  <desc id="d">中央のシーズ (研究成果) を、七つの不確実性の領域 — 研究の再現性・用途・顧客・知財と公開の順序・担い手・資金・制度 — が放射状に取り囲む地図。領域同士が線で結ばれ、一つを動かすと他が動く連動関係を示す。</desc>
  <rect width="760" height="640" fill="#ffffff"/>

  <text x="40" y="42" font-size="16" font-weight="700" fill="#2a4d8f">不確実性の地図 — Before Zero で「まだ形になっていないもの」</text>

  <!-- 連動線 (隣接領域どうしを結ぶ円環。箱の中心座標を結ぶ) -->
  <!-- 中心 (380,330) を基準に半径220で7領域を配置 -->
  <g stroke="#e2e2e8" stroke-width="1.4">
    <line x1="380" y1="150" x2="552" y2="220"/>
    <line x1="552" y1="220" x2="590" y2="400"/>
    <line x1="590" y1="400" x2="450" y2="512"/>
    <line x1="450" y1="512" x2="310" y2="512"/>
    <line x1="310" y1="512" x2="170" y2="400"/>
    <line x1="170" y1="400" x2="208" y2="220"/>
    <line x1="208" y1="220" x2="380" y2="150"/>
  </g>

  <!-- 中心から各領域への放射線 (オレンジ、文字とは重ねない短め) -->
  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e07a5f"/>
    </marker>
  </defs>
  <g stroke="#e07a5f" stroke-width="1.6" marker-end="url(#arrR)" opacity="0.85">
    <line x1="380" y1="288" x2="380" y2="178"/>
    <line x1="430" y1="306" x2="528" y2="244"/>
    <line x1="448" y1="338" x2="566" y2="384"/>
    <line x1="430" y1="370" x2="468" y2="492"/>
    <line x1="330" y1="370" x2="332" y2="492"/>
    <line x1="312" y1="338" x2="194" y2="384"/>
    <line x1="330" y1="306" x2="232" y2="244"/>
  </g>

  <!-- 中央 シーズ -->
  <circle cx="380" cy="330" r="62" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2.4"/>
  <text x="380" y="324" font-size="14.5" font-weight="700" fill="#1a2a52" text-anchor="middle">研究成果</text>
  <text x="380" y="346" font-size="12" fill="#2a4d8f" text-anchor="middle">(シーズ)</text>

  <!-- 7領域 (緑系の箱)。順に上→時計回り -->
  <!-- 1 研究の再現性 (上) -->
  <rect x="290" y="98" width="180" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="380" y="122" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">(1) 研究の再現性</text>
  <text x="380" y="142" font-size="10.5" fill="#555" text-anchor="middle">別の場所・人・規模で出るか</text>

  <!-- 2 用途 (右上) -->
  <rect x="498" y="192" width="180" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="588" y="216" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">(2) 用途</text>
  <text x="588" y="236" font-size="10.5" fill="#555" text-anchor="middle">候補が多い＝決まっていない</text>

  <!-- 3 顧客 (右) -->
  <rect x="510" y="372" width="180" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="600" y="396" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">(3) 顧客</text>
  <text x="600" y="416" font-size="10.5" fill="#555" text-anchor="middle">関心の表明は証拠ではない</text>

  <!-- 4 知財と公開の順序 (右下) -->
  <rect x="380" y="484" width="194" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="477" y="508" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">(4) 知財と公開の順序</text>
  <text x="477" y="528" font-size="10.5" fill="#555" text-anchor="middle">二つの時計が衝突する</text>

  <!-- 5 担い手 (左下) -->
  <rect x="186" y="484" width="180" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="276" y="508" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">(5) 担い手</text>
  <text x="276" y="528" font-size="10.5" fill="#555" text-anchor="middle">機能の束を誰が背負うか</text>

  <!-- 6 資金 (左) -->
  <rect x="70" y="372" width="180" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="160" y="396" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">(6) 資金</text>
  <text x="160" y="416" font-size="10.5" fill="#555" text-anchor="middle">使える形が常にずれている</text>

  <!-- 7 制度 (左上) -->
  <rect x="82" y="192" width="180" height="56" rx="7" fill="#eef7f0" stroke="#3a7a4a" stroke-width="1.8"/>
  <text x="172" y="216" font-size="12.5" font-weight="700" fill="#2c6038" text-anchor="middle">(7) 制度</text>
  <text x="172" y="236" font-size="10.5" fill="#555" text-anchor="middle">兼業・利益相反・契約の縛り</text>

  <!-- 凡例 -->
  <rect x="40" y="582" width="680" height="40" rx="7" fill="#fff" stroke="#e2e2e8" stroke-width="1.2"/>
  <line x1="58" y1="602" x2="92" y2="602" stroke="#e2e2e8" stroke-width="1.6"/>
  <text x="100" y="606" font-size="11" fill="#555">領域どうしの連動 (外周)</text>
  <line x1="300" y1="602" x2="330" y2="602" stroke="#e07a5f" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="342" y="606" font-size="11" fill="#555">一手が複数領域を同時に動かす。会社を作っても七つは消えない。</text>
</svg>
