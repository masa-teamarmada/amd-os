<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif" role="img" aria-labelledby="t d">
  <title id="t">不確実性の地図</title>
  <desc id="d">研究成果の周囲に、研究の再現性、用途、顧客、知財と公開の順序、担い手、資金、制度という七つの未整理領域を配置する。領域同士の接続により、一手が複数領域を同時に動かすことを示す。</desc>
  <rect width="900" height="680" fill="#ffffff"/>

  <text x="46" y="48" font-size="18" font-weight="700" fill="#2a4d8f">不確実性の地図 — Before Zero でまだ形になっていないもの</text>
  <text x="46" y="76" font-size="12" fill="#555">研究成果だけでは会社化の判断はできない。周囲の七領域が未整理で、しかも互いに連動している。</text>

  <defs>
    <style>
      .domain-title { font-size: 13px; font-weight: 700; fill: #2c6038; }
      .domain-sub { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <!-- center-to-domain lines: neutral, question relationship -->
  <g stroke="#d9dde6" stroke-width="1.5" fill="none">
    <line x1="450" y1="340" x2="450" y2="151"/>
    <line x1="450" y1="340" x2="660" y2="210"/>
    <line x1="450" y1="340" x2="690" y2="340"/>
    <line x1="450" y1="340" x2="642" y2="485"/>
    <line x1="450" y1="340" x2="450" y2="548"/>
    <line x1="450" y1="340" x2="258" y2="485"/>
    <line x1="450" y1="340" x2="210" y2="340"/>
  </g>

  <!-- strong coupling lines: outer uncertainty system -->
  <g stroke="#e07a5f" stroke-width="2.2" fill="none" opacity="0.92">
    <line x1="450" y1="151" x2="660" y2="210"/>
    <line x1="660" y1="210" x2="690" y2="340"/>
    <line x1="660" y1="210" x2="642" y2="485"/>
    <line x1="690" y1="340" x2="258" y2="485"/>
    <line x1="258" y1="485" x2="450" y2="548"/>
    <line x1="450" y1="548" x2="210" y2="340"/>
    <line x1="210" y1="340" x2="642" y2="485"/>
  </g>

  <!-- subtle outer frame to say system, not checklist -->
  <path d="M450,120 C570,125 725,205 755,330 C785,460 610,570 450,590 C290,570 115,460 145,330 C175,205 330,125 450,120 Z" fill="none" stroke="#eef0f6" stroke-width="8"/>

  <!-- Center -->
  <circle cx="450" cy="340" r="54" fill="#eef2fb" stroke="#2a4d8f" stroke-width="2.4"/>
  <text x="450" y="334" font-size="15" font-weight="700" fill="#1a2a52" text-anchor="middle">研究成果</text>
  <text x="450" y="356" font-size="12" fill="#2a4d8f" text-anchor="middle">(シーズ)</text>

  <!-- Domains -->
  <g id="domain-reproducibility">
    <rect x="330" y="106" width="240" height="72" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
    <text x="450" y="135" text-anchor="middle" class="domain-title">(1) 研究の再現性</text>
    <text x="450" y="159" text-anchor="middle" class="domain-sub">別の場所・人・規模で出るか</text>
  </g>

  <g id="domain-use">
    <rect x="622" y="178" width="218" height="72" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
    <text x="731" y="207" text-anchor="middle" class="domain-title">(2) 用途</text>
    <text x="731" y="231" text-anchor="middle" class="domain-sub">何に使うと価値になるか</text>
  </g>

  <g id="domain-customer">
    <rect x="626" y="306" width="228" height="72" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
    <text x="740" y="335" text-anchor="middle" class="domain-title">(3) 顧客</text>
    <text x="740" y="359" text-anchor="middle" class="domain-sub">誰が痛みと予算を持つか</text>
  </g>

  <g id="domain-ip">
    <rect x="552" y="470" width="250" height="72" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
    <text x="677" y="499" text-anchor="middle" class="domain-title">(4) 知財と公開の順序</text>
    <text x="677" y="523" text-anchor="middle" class="domain-sub">出願・発表・開示の順番</text>
  </g>

  <g id="domain-carrier">
    <rect x="330" y="552" width="240" height="72" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
    <text x="450" y="581" text-anchor="middle" class="domain-title">(5) 担い手</text>
    <text x="450" y="605" text-anchor="middle" class="domain-sub">誰がどの機能を背負うか</text>
  </g>

  <g id="domain-money">
    <rect x="98" y="470" width="238" height="72" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
    <text x="217" y="499" text-anchor="middle" class="domain-title">(6) 資金</text>
    <text x="217" y="523" text-anchor="middle" class="domain-sub">何に使える資金か</text>
  </g>

  <g id="domain-institution">
    <rect x="60" y="306" width="236" height="72" rx="8" fill="#eef7f0" stroke="#3a7a4a" stroke-width="2"/>
    <text x="178" y="335" text-anchor="middle" class="domain-title">(7) 制度</text>
    <text x="178" y="359" text-anchor="middle" class="domain-sub">契約・兼業・利益相反・規制</text>
  </g>

  <g id="legend">
    <rect x="46" y="626" width="808" height="36" rx="8" fill="#ffffff" stroke="#e2e2e8" stroke-width="1.2"/>
    <line x1="68" y1="644" x2="112" y2="644" stroke="#d9dde6" stroke-width="1.5"/>
    <text x="124" y="648" font-size="11.5" fill="#555">研究成果が各領域に問いを投げる</text>
    <line x1="330" y1="644" x2="374" y2="644" stroke="#e07a5f" stroke-width="2.2"/>
    <text x="386" y="648" font-size="11.5" fill="#555">領域どうしの連動。会社を作っても七つの不確実性は消えない。</text>
  </g>
</svg>
