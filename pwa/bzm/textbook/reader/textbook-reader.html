<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Before Zero Manuscript Reader</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --paper: #ffffff;
      --ink: #111827;
      --muted: #687385;
      --line: #d7dde5;
      --accent: #0f766e;
      --accent-2: #9f1239;
      --shadow: 0 18px 60px rgba(15, 23, 42, .16);
      --font-size: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(135deg, rgba(15,118,110,.12), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(159,18,57,.11), transparent 26%),
        var(--bg);
      color: var(--ink);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
      overflow: hidden;
    }

    button, select {
      font: inherit;
    }

    .reader {
      width: 100vw;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      gap: 10px;
    }

    .topbar, .bottombar {
      z-index: 10;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 8px;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
    }

    .bottombar {
      grid-template-columns: auto 1fr auto auto;
    }

    .brand {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand strong {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
    }

    .brand span, .progress {
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    select {
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.82);
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 10px;
      box-shadow: 0 8px 20px rgba(15,23,42,.06);
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.9);
      color: var(--ink);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(15,23,42,.10);
    }

    .icon-button:active {
      transform: translateY(1px);
    }

    .deck {
      height: 100%;
      max-width: 920px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      border-radius: 12px;
      scrollbar-width: none;
    }

    .deck::-webkit-scrollbar { display: none; }

    .page {
      flex: 0 0 100%;
      height: 100%;
      scroll-snap-align: start;
      padding: 4px;
    }

    .sheet {
      height: 100%;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid rgba(148, 163, 184, .55);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: clamp(24px, 7vw, 64px);
      position: relative;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      border-radius: 12px 0 0 12px;
      background: linear-gradient(var(--accent), transparent 72%);
      opacity: .75;
    }

    .chapter-kicker {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1, h2, h3 {
      line-height: 1.3;
      letter-spacing: 0;
      margin: 0 0 .9em;
    }

    h1 {
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 700;
    }

    h2 {
      font-size: clamp(22px, 5.6vw, 32px);
      margin-top: 1.7em;
      padding-top: .4em;
      border-top: 1px solid var(--line);
    }

    h3 {
      font-size: clamp(18px, 4.5vw, 24px);
      color: #253044;
      margin-top: 1.5em;
    }

    p, li {
      font-size: var(--font-size);
      line-height: 1.95;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 1.1em;
    }

    ul, ol {
      padding-left: 1.3em;
      margin: 0 0 1.2em;
    }

    code {
      font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      font-size: .86em;
      color: #7f1d1d;
      background: #f1f5f9;
      border: 1px solid #dbe3ee;
      border-radius: 5px;
      padding: .08em .32em;
      word-break: break-word;
    }

    blockquote {
      margin: 1.4em 0;
      padding: .2em 0 .2em 1.1em;
      border-left: 3px solid var(--accent);
      color: #334155;
    }

    .fineprint {
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      line-height: 1.5;
    }

    .range {
      accent-color: var(--accent);
      min-width: 88px;
    }

    @media (max-width: 640px) {
      .reader { padding-left: 8px; padding-right: 8px; }
      .topbar { grid-template-columns: 1fr auto; }
      .topbar select { grid-column: 1 / -1; }
      .brand span { display: none; }
      .sheet { padding: 24px 20px 30px 24px; }
      .bottombar { grid-template-columns: auto 1fr auto; }
      .range { display: none; }
    }
  </style>
</head>
<body>
  <main class="reader">
    <header class="topbar">
      <div class="brand">
        <strong>Before Zero</strong>
        <span>draft reader / swipe sideways</span>
      </div>
      <select id="chapterSelect" aria-label="章へ移動"></select>
      <button class="icon-button" id="tocButton" title="現在の章へ戻る" aria-label="現在の章へ戻る">⌖</button>
    </header>

    <section class="deck" id="deck" aria-label="横スライド読書ビュー"></section>

    <footer class="bottombar">
      <button class="icon-button" id="prevButton" title="前のページ" aria-label="前のページ">‹</button>
      <div class="progress" id="progress">Loading…</div>
      <input class="range" id="fontRange" type="range" min="16" max="23" value="18" aria-label="文字サイズ" />
      <button class="icon-button" id="nextButton" title="次のページ" aria-label="次のページ">›</button>
    </footer>
  </main>

  <script id="chapters-data" type="application/json">[{"file":"00-prologue.md","title":"Prologue: その一文は、少しだけ強すぎた","markdown":"# Prologue: その一文は、少しだけ強すぎた\n\n発表が終わると、会場は拍手に包まれた。\n\n研究者は壇上で深く頭を下げた。支援プログラムの担当者は、後方の席で小さく拳を握った。若い事業化人材は、ノートPCを閉じる前に、最後のスライドをもう一度だけ見た。\n\n「この技術は、二年以内に産業実装を目指します」\n\n昨日の夜、その一文を入れたのは彼だった。\n\n最初の文は、もっと弱かった。「産業実装の可能性を検証します」。正確ではあった。けれど、弱かった。審査員に伝えるには、企業候補に会うには、支援制度の次の面談に進むには、少し足りない気がした。\n\n研究者も社会に出したいと言っていた。企業の探索担当も「面白いですね」と言っていた。大学の担当者も、知財の確認さえ済めば外部連携は進められると話していた。だから彼は、ほんの少しだけ文を強くした。\n\n嘘を書いたつもりはなかった。\n\n発表後の名刺交換は順調だった。企業の人が列を作り、支援プログラムの担当者は「今日の伝わり方はよかった」と言った。研究者本人も、会場を出るまでは少し高揚していた。\n\n問題は、その一文が、部屋を出たあとも歩き続けたことだった。\n\n翌週、同じスライドは企業候補へ送られた。別の週には、学内説明の資料にも転用された。支援制度の次回面談では、会社化時期の話が自然に出た。投資家に詳しい人からは「代表は誰がやる想定ですか」と聞かれた。\n\n文は便利だった。便利だから、何度も使われた。\n\nけれど研究者は、だんだん口数が少なくなった。\n\n未発表のデータはまだ揺れている。出願範囲も完全には固まっていない。企業の反応は本物だが、予算者はまだ会議にいない。二年以内に産業実装と書いたけれど、誰がその二年間を会社として背負うのかは決まっていない。\n\n若い事業化人材は、研究者の表情を見て初めて、自分が何をしてしまったのかに気づいた。\n\n彼は研究を売り込んだのではない。研究がまだ背負えない約束を、少しだけ早く外へ出してしまったのだ。\n\n## Before Zero\n\n若い事業化人材は、その夜のノートを開いた。\n\n発表後に聞かれたことを、順番に書き出した。\n\n社名はどうするのか。代表者は誰か。資本政策はいつ考えるのか。採用はどうするのか。資金調達は視野に入っているのか。\n\nその行の上に、彼は小さく `Zero` と書いた。\n\nZero の後にも難しいことは山ほどある。だが、ディープテックでは、その前にもっと壊れやすい時間がある。研究成果が強く、周囲が期待し、支援制度が背中を押し、企業が関心を示し、誰かが「そろそろ会社に」と言い始める時間である。\n\nその時間には、まだ名前のついていない仕事が多い。\n\n何を外へ出してよいのか。誰の困りごとを解いているのか。企業の「面白い」は顧客の証拠なのか。研究者本人は何を背負うのか。経営機能は誰が持つのか。小さく稼げる兆しは、本当に顧客の痛みを示しているのか、それとも大きな成長可能性を削る逃げ道なのか。会社を早く作ることは前進なのか、それとも生存確率を下げる早すぎる約束なのか。\n\n普通のスタートアップ論は、創業者がいて、顧客開発を始めるところから語り始めることが多い。\n\nしかし研究機関のシーズには、その前がある。\n\n会社にする前に、研究の真実、顧客の真実、知財の安全、支援制度の期待、研究者の時間、経営機能、資金の性質を同じ紙の上に置かなければならない。どれか一つだけを強く語ると、ほかの何かが後から壊れる。\n\nBefore Zero とは、その壊れ方を先に読むための時間である。\n\n## 誰かが悪かったわけではない\n\nその日のノートには、誰かを責める言葉も書けそうだった。\n\n研究者が慎重すぎる。支援制度が急がせすぎる。大学が遅い。企業は本気ではない。投資家は早すぎる。\n\nでも、どれを書いても、会議室で起きたことから少しずれた。\n\nむしろ彼が見たのは、全員がかなり合理的に動いた結果として起きる失敗だった。\n\n支援プログラムは、伝わる発表を求める。企業は、自社で評価できる条件を知りたい。大学は、知財と研究者の信頼を守る。投資家は、資金を入れた後に会社が動くかを見る。研究者は、自分の研究を正しく社会に出したい。\n\nどれも必要だ。\n\nそれでも、一つのスライド、一つのメール、一つの「顧客候補あり」という便利な言葉が、まだ接続されていない責任を外へ運んでしまうことがある。\n\n彼が追うべきなのは、その瞬間だった。\n\n特定の会社でも、特定の支援者でもない。研究成果が会社になる前の現場そのもの。そこにいる研究者、産学連携担当者、URA、若い事業化人材、企業担当者、投資家、制度設計者が、自分の持ち場だけでは見えないものを、どうやって一枚の地図に戻すか。\n\n最初の問いは、会社にするかどうかではない。\n\nその前に、この一文は強すぎないか。\n\nその問いは、発表会場を出たあと、すぐ別の言葉に姿を変える。\n\n「面白いですね」\n\n企業の人がそう言った瞬間、最初の取り違えはもう始まっていた。\n"},{"file":"01-research-results-are-not-companies.md","title":"Chapter 1: 「面白いですね」は、まだ顧客ではない","markdown":"# Chapter 1: 「面白いですね」は、まだ顧客ではない\n\n企業面談は、悪くなかった。\n\n研究者が技術の原理を説明すると、探索担当の表情が明るくなった。既存材料では重すぎる。今の工程では熱に弱い。規制対応も年々厳しくなる。相手の言葉には、たしかに現場の匂いがあった。\n\n面談の最後に、担当者は言った。\n\n「面白いですね。社内でも少し話してみます」\n\n帰り道、若い事業化人材は、その言葉を何度も思い出していた。研究者は疲れていたが、少しだけ安心していた。大学の産学連携担当者も、次の支援制度に載せる材料が増えたと感じていた。\n\n翌朝、資料の七枚目に一行が加わった。\n\n「複数の事業会社から顧客候補として関心あり」\n\n書いた本人は、悪いことをしているつもりはなかった。実際、関心はあった。面談もした。相手は前向きだった。けれど、その一行は、昨日の会議室にあった弱さを消してしまった。\n\n探索担当は顧客ではなかった。予算者でもなかった。導入責任者でもなかった。現場の痛みは見え始めていたが、誰がどの条件なら試すのかはまだ決まっていなかった。\n\nその一行は、その日の午後には支援制度の進捗メモにも写った。次の面接練習では、「顧客候補が見え始めた案件」として紹介された。研究者の前でその言葉が読まれたとき、研究者は少しだけ視線を落とした。\n\n三日後、若い事業化人材が修正版を出すと、支援者の一人が眉をひそめた。\n\n「ここ、弱くなっていませんか。前は顧客候補と書いていましたよね」\n\n弱くなったのではない。元の場所に戻しただけだった。\n\nけれど、一度強く書かれた言葉を戻すには、少し痛みがいる。期待を下げるように見える。前の資料を作った人の判断を否定するようにも見える。研究者はそこで初めて、昨日の一行が、自分の研究を本人の速度より少し先へ連れて行ってしまったことを知った。\n\n「面白いですね」は、入口である。\n\nそれを顧客証拠として書いた瞬間、入口は出口のように見える。\n\n## 弱い証拠を弱いまま置く\n\n二週間後、二度目の面談が開かれた。\n\n前回の探索担当に加えて、技術評価の担当者が同席した。相手はやはり前向きだった。質問も具体的だった。どの温度まで耐えられるのか。どの工程なら試せるのか。どれくらいの量が必要なのか。\n\n若い事業化人材は、勢いを感じた。\n\nだから、聞くべき問いを一つだけ踏み込んだ。\n\n「この検証を進める場合、評価予算はどの部門で持つ形になりますか」\n\n相手は、少し黙った。\n\n「今年度の評価予算は、まだこのテーマにはついていません。現場部門にも、これから聞く段階です」\n\n悪い返事ではなかった。むしろ誠実だった。だが、帰りの電車の空気は重かった。研究者は窓の外を見ていた。若い事業化人材は、自分の資料にあった「顧客候補」という言葉が、急に雑に見えた。\n\n彼はその夜、資料の一行を書き直した。\n\n「技術探索担当は関心あり。評価担当との初回接点あり。予算者、現場部門、検証条件は未確認。次回、評価枠を持つ人への接続可否を確認する」\n\n見た目は弱くなった。支援制度の申請書には少し使いにくい。ピッチ資料としても歯切れが悪い。\n\nけれど、研究者はその文を見て、初めて小さくうなずいた。\n\n弱い証拠を弱いまま置ける資料は、前進を止める資料ではない。後から関係者の信頼を壊さない資料である。\n\nさらに三週間後、若い事業化人材は、別の会社からもっとはっきりした返事を受け取った。\n\n「技術としては面白いです。ただ、今年度の評価費は出せません」\n\n断られた。\n\nけれど、そのメールには続きがあった。相手は、費用を出せない理由を書いていた。現場部門の困りごとは本物だが、今年度の改善テーマには入っていない。来期に評価枠へ入れるには、既存工程でどれだけ作業時間が減るかを先に示す必要がある。判断するのは探索担当ではなく、工場側の改善予算を持つ人である。\n\n支払い拒否は、冷たい終わりではなかった。\n\n誰が痛みを持っているのか。誰が予算を持っているのか。どの条件なら次の会議に進むのか。それを、関心よりもはっきり教えてくれた。\n\n若い事業化人材は、また資料を直した。\n\n「有償検証は現時点では不可。ただし、評価費の不在理由と来期検討条件を確認。次回、改善予算を持つ部門への接続可否を聞く」\n\nその文は、さらに弱かった。\n\n支援制度の面接資料には、もっと置きにくくなった。研究者は「断られた話を、最初から書くんですか」と聞いた。若い事業化人材も迷った。払われなかった事実を出すと、研究の価値が低く見えるかもしれない。\n\nそれでも、消せなかった。\n\n消せば、次の会議でまた「顧客候補」に戻る。戻れば、投資家に聞かれるまで予算者の不在を隠すことになる。払われなかった理由は、研究成果への判決ではなく、会社化前に聞きに行くべき人を教える地図だった。\n\nだが、この弱さは、会社として生き残るための情報だった。払ってもらえなかったことを隠す資料より、払わない理由を次の問いに変える資料の方が、研究者を守った。\n\n## 研究成果は強い。それでも会社ではない\n\n研究室に戻れば、成果はたしかに強い。\n\n論文として面白い。特許になる可能性もある。既存技術より軽い。環境負荷も低い。企業が関心を示す理由も分かる。支援制度の審査員に伝えれば、社会実装の期待は高まるだろう。\n\nだから危ない。\n\n研究成果が弱いとき、会社化の話は進みにくい。だが研究成果が強いとき、周囲は早く物語を作りたくなる。市場規模を置き、顧客候補を書き、会社化時期を置き、将来の資金調達を描く。強い研究は、強い資料を呼びやすい。\n\nしかし、会社として生き残るには別の証拠がいる。\n\n誰が本当に困っているのか。誰が予算を持つのか。何を満たせば支払うのか。検証に必要なデータや設備は出せるのか。知財や論文の順番は壊れないか。会社を作ったあと、誰が毎週の判断を進めるのか。\n\n研究の強さは、会社の種である。\n\nでも種が強いことと、芽を出してよい季節であることは違う。\n\nこの違いを混ぜると、二つのことが起きる。\n\n一つは、会社化を急ぎすぎることだ。周囲の期待、支援制度の締切、スタートアップ界隈の熱、投資家に会える機会に押されて、まだ稼げる体質が見えていないのに、先に器だけ作ってしまう。\n\nもう一つは、準備不足を研究者個人の問題にしてしまうことだ。顧客証拠が弱い。経営機能が足りない。知財と開示の順番が危うい。それらは構造の未整理なのに、「研究者にビジネス感覚がない」という言葉で片づけられる。\n\nどちらも、研究成果を傷つける。\n\n## 小さく稼ぐことへの違和感\n\nこの段階で「小さくても早く稼げる形を作ろう」と言うと、反論が出ることがある。\n\n小さな売上に満足してしまえば、Jカーブを描く大きな会社になれないのではないか。IPOを目指すなら、目先の受託や小銭稼ぎに逃げるべきではないのではないか。\n\nその批判は、軽く扱ってはいけない。\n\n本当に大きな市場を取りに行ける技術なら、小さな仕事に縛られてはいけない局面がある。目の前の売上が、長期の成長可能性を削ることもある。\n\nそれでも、すべての研究シーズを一律にJカーブとIPOの物語へ押し込むのは危うい。多くのシーズにとって、最初の小さな対価は、楽な道への逃避ではなく、顧客の痛み、予算経路、継続利用の可能性を知るための証拠になる。\n\n大事なのは、小さく稼ぐこと自体ではない。\n\nその対価が、何を明らかにするかである。\n\n相手は何に困って財布を開いたのか。誰が支払ったのか。次も払うのか。支払いの理由は技術の中核にあるのか、それとも周辺作業への便利さにあるのか。その仕事は、会社の生存確率を上げるのか、未来の可能性を狭めるのか。\n\n逆に、支払われなかったときも問いは同じである。\n\nなぜ払わないのか。痛みが弱いのか。予算年度が合わないのか。評価者はいるが予算者がいないのか。技術の中核ではなく、相手の便利な周辺作業だけを期待されているのか。\n\n払われたことだけが証拠ではない。\n\n払われなかった理由を正確に持ち帰れたとき、会社化の判断は少しだけ現実に近づく。\n\nこの問いを持たずに「会社化だ」と急ぐと、研究成果は会社の形だけを先に背負わされる。\n\nその急ぎは、誰か一人の焦りから生まれるわけではない。\n\n同じ技術を囲んでいても、研究者、大学、企業、支援制度、投資家は別々の時計で動いている。強くなりすぎた一文は、その時計の違いを一気に外へ運んでしまう。\n"},{"file":"02-different-clocks.md","title":"Chapter 2: 同じ資料を、別の時計が急がせる","markdown":"# Chapter 2: 同じ資料を、別の時計が急がせる\n\n火曜日の夕方、支援プログラムの事務局からメールが届いた。\n\n「金曜正午までに、審査員事前共有用の最新版をご提出ください」\n\n若い事業化人材は、画面の右上にある日付を見た。あと三日もない。資料は、前回の企業面談を受けて直す必要がある。顧客候補という言葉は弱めたい。だが、発表としては弱くしすぎると伝わらない。\n\n同じ日の午前、研究者は研究室で学生に言っていた。\n\n「そのデータは、まだ外に出さないで。再現性をもう一回見たい」\n\n昼には大学の知財担当者から連絡が来た。\n\n「出願範囲が固まるまで、用途を限定しすぎる表現は避けてください」\n\n夕方には企業の探索担当者から、次回面談の候補日が届いた。\n\n「技術評価の担当も同席できそうです。可能であれば、具体的な使用条件を聞かせてください」\n\n夜には、投資家に詳しいメンターから別のメッセージが来た。\n\n「会社化の時期と、代表候補の考え方は早めに整理しておいた方がいいです」\n\n一つの技術をめぐって、五つの締切が同じ週に重なった。\n\n支援制度は金曜の資料を待っている。研究者は未確認データを守ろうとしている。大学は出願と開示の順番を見ている。企業は評価条件を知りたがっている。投資家側の問いは、会社になった後に誰が進めるのかへ向かっている。\n\n誰も間違っていない。\n\nそれなのに、若い事業化人材の画面では、一枚のスライドだけが全部を同時に引き受けようとしていた。\n\n## 金曜の資料は、誰の前進か\n\n水曜日の夜、彼はスライドを直した。\n\n「二年以内に産業実装を目指す」という文を、少しだけ弱める。「企業評価に向けた条件整理を進める」。市場規模のページには、断定ではなく仮説と書き添える。顧客候補の欄には、予算者未確認と入れる。\n\nよい修正のはずだった。\n\nだが、支援プログラムのメンターからは、すぐにコメントが返ってきた。\n\n「少し弱く見えます。審査員には、なぜ今会社化を目指すのかを強く伝えたいです」\n\n研究者からは、別のコメントが返ってきた。\n\n「この用途は可能性としてはありますが、いま言い切ると誤解されます」\n\n知財担当者からは、さらに別の赤字が入った。\n\n「この表現だと、共同研究先との範囲に触れる可能性があります」\n\n企業候補からは、面談前に聞きたい項目として、具体的な性能条件が送られてきた。\n\nその夜、若い事業化人材は初めて気づいた。\n\n自分は、資料を一つ作っているのではない。五つの時計を一枚の紙に押し込もうとしている。\n\n支援制度の時計では、金曜に伝わる資料が必要だった。研究者の時計では、未確認の事実を強く言いすぎないことが必要だった。大学の時計では、知財と契約の順番を壊さないことが必要だった。企業の時計では、導入判断に足る具体性が必要だった。投資家の時計では、会社化後の体制が必要だった。\n\n同じ「前進」という言葉が、まったく別の意味で使われていた。\n\n## 温度差ではなく、時計の差\n\nこういう場面で、現場ではよく「温度差」という言葉が使われる。\n\n研究者は慎重だ。大学は遅い。企業は本気ではない。支援制度は発表映えを求めすぎる。投資家は早すぎる質問をする。\n\nだが、それを温度差と呼ぶと、相手の合理性が見えなくなる。\n\n研究者が慎重なのは、研究の正確さと未発表情報を守る時計で動いているからだ。大学が止めるのは、知財と研究機関の信頼を守る時計で動いているからだ。企業が具体条件を求めるのは、導入後に自社の責任になる時計で動いているからだ。支援制度が資料を急がせるのは、年度、審査、成果報告の時計で動いているからだ。投資家がCEOを聞くのは、資金を入れた後に会社が前へ進む時計で見ているからだ。\n\n時計が違うこと自体は悪くない。\n\n問題は、どれか一つの時計だけが勝ち、ほかの時計を遅さや抵抗として扱ってしまうことだ。\n\n支援制度の時計だけが勝つと、資料は強くなる。会場では伝わる。だが、開示、顧客、経営機能が追いつかないまま会社らしい物語だけが走る。\n\n大学の時計だけが勝つと、安全は守られる。だが、企業から学ぶ機会を逃し、用途が固まらないことがある。\n\n企業の時計だけが勝つと、検証は具体化する。だが、一社の評価条件に寄りすぎて、研究成果の幅や知財の取り方を狭めることがある。\n\n投資家の時計だけが勝つと、会社としての穴は早く見える。だが、研究者にはそれが「あなたには経営者として足りない」という判定のように聞こえることがある。\n\n若い事業化人材は、メモの端にそう書いた。\n\n同じ言葉を使っているのに、同じ時間を生きていない。\n\n## 一枚の紙に戻す\n\n木曜日の夜、若い事業化人材はスライドとは別に、短いメモを作った。\n\n上には、こう書いた。\n\n「この資料が同時に背負っている時計」\n\nその下に、五つの行を置いた。発表締切。研究の確認。知財の順番。企業評価。会社化後の体制。\n\nそれぞれの横に、いま言えることと、まだ言えないことを書いた。スライドに載せるためではない。誰の時計を優先して、どの時計をまだ守れていないのかを、会議で見失わないためだった。\n\n金曜の朝、そのメモを見た研究者は言った。\n\n「これなら、何を弱く言っているのか分かります」\n\n支援プログラムの担当者は、少し困った顔をしたが、うなずいた。\n\n「審査向けには弱く見えるかもしれません。でも、弱く見せる理由があるなら、その方が後で崩れにくいですね」\n\nその瞬間、会議は少し変わった。\n\n誰が遅いのかを責める会議ではなく、どの時計をどの順番で合わせるかを決める会議になった。\n\nただし、時計を並べただけでは、まだ足りない。\n\n金曜の資料、出願範囲、企業面談、支援制度、会社化時期。これらを誰が一つの判断に戻すのか。そこが空いたままだと、研究者は次の週も別々の部屋で別々の顔を求められる。\n\n時計のずれは、放っておくと孤独になる。\n\n支援者はいる。制度もある。会議も増える。\n\nそれでも、真ん中の責任が誰にも引き受けられないとき、研究者は一人で複数の役割を背負い始める。\n"},{"file":"03-support-can-isolate-researchers.md","title":"Chapter 3: 支援が増えるほど、真ん中が空く","markdown":"# Chapter 3: 支援が増えるほど、真ん中が空く\n\n翌週、研究者は四つの部屋を移動した。\n\n最初の部屋では、起業家として話す練習をした。市場規模を大きく見せる。社会課題との接続を短く言い切る。技術の説明を減らし、顧客の痛みに寄せる。\n\n「研究者本人の言葉で語れるのが強いです」\n\nメンターはそう言った。研究者はうなずいた。自分の成果を社会に出したい気持ちは本物だった。\n\n二つ目の部屋では、大学の担当者がスライドに赤字を入れた。\n\n「ここはまだ言わないでください」\n「この用途は、出願範囲が固まるまで表現を変えましょう」\n「共同研究先との関係に触れないようにしましょう」\n\n研究者はまたうなずいた。守るべきものがあることも分かっていた。\n\n三つ目の部屋では、企業候補が具体的な条件を聞いた。\n\n「既存工程に入れるなら、温度条件はどこまで必要ですか」\n「評価サンプルはどのくらい出せますか」\n「量産したときの品質保証は誰が見る想定ですか」\n\n研究者は、言える範囲で答えた。答えながら、まだ言い切れないことの多さも感じていた。\n\n四つ目の部屋では、投資家に詳しい人が言った。\n\n「この会社を、誰が実際に経営するんですか」\n\nその質問が出た瞬間、研究者の中で、前の三つの部屋の声が一度に重なった。\n\n前に立って語ってください。まだ話しすぎないでください。具体条件を出してください。経営者は誰ですか。\n\nどれも必要な問いだった。\n\nでも、全部を一人の体で受けるには重かった。\n\n## 支援メニューはある。責任の流れがない\n\n研究成果の事業化を支える仕組みは増えている。\n\nGAPファンド、アクセラレーター、大学の産学連携部門、URA、知財相談、企業紹介、投資家面談、経営人材紹介、自治体や国の補助金。研究者が一人で社会実装へ向かわなくてよいように、いくつもの入口が用意されている。\n\nそれでも、研究者が必ず楽になるわけではない。\n\n支援が増えるほど、求められる顔も増えることがある。ある部屋では起業家らしく語る。別の部屋では研究者として慎重に守る。企業には導入可能性を具体的に示す。投資家には会社の体制を答える。\n\nそれぞれの支援は、局所的には正しい。\n\n問題は、それらが一本の責任の流れに戻っていないことだ。\n\n企業の「面白いですね」を、誰が予算者と検証条件へ翻訳するのか。知財担当が止めた表現を、誰が安全な聞き方へ直すのか。支援制度で強くなった会社化ストーリーを、誰が研究者の保護線と照合するのか。投資家が出した「経営者は誰か」という問いを、誰が研究者の人格評価ではなく、未割当の機能として扱うのか。\n\nそこが空くと、支援者はいるのに、研究者だけが統合役になる。\n\n孤独とは、誰も助けてくれない状態だけではない。\n\n助けはあるのに、何を誰が引き受けるかがつながっていない状態も、孤独である。\n\n## 若い事業化人材の失敗\n\n若い事業化人材は、自分が支援者だと思っていた。\n\n資料を整える。企業面談を設定する。支援制度の締切を管理する。研究者の言葉を外に伝わる表現へ変える。彼はそれを、研究者を助ける仕事だと思っていた。\n\nそれは間違っていない。\n\nただ、彼はしばらく、自分が何を引き受けていないのかを見ていなかった。\n\n強くした一文が、研究者の保護線を越えていないか。顧客候補という言葉が、予算者未確認の弱さを消していないか。支援制度で整えた物語が、会社化後の経営機能を誰かに押しつけていないか。\n\n彼は、資料を前へ進めていた。\n\nだが、責任の流れを設計していなかった。\n\nそのことに気づいたのは、研究者が一言だけ言ったときだった。\n\n「この資料だと、私はもう会社をやると決めた人みたいに見えますね」\n\n責める声ではなかった。だから余計に残った。\n\n若い事業化人材は、その日の議事録に初めて、タスクではない欄を足した。\n\n「まだ誰も持っていないもの」\n\nそこには、予算者確認、開示線の再確認、会社化時期の戻る条件、経営機能の仮分担、研究者が背負わなくてよい実務、という言葉が並んだ。\n\nそれは美しい資料ではなかった。\n\nけれど、その欄ができたことで、研究者の孤独は少しだけ紙の上に移った。\n\n## 「研究者CEOか、外部CEOか」の前に\n\n支援の現場では、ある時点で必ずこの問いが出る。\n\n研究者本人が代表をやるのか。外部の経営者を連れてくるのか。\n\nこの問いは大切だ。会社を作るなら、経営機能を誰が担うかは避けられない。資金調達、採用、契約、資本政策、日々の意思決定、顧客との交渉。研究者が全部を一人で背負う必要はないし、背負わせるべきでもないことが多い。\n\nだが、この問いを早く出しすぎると、研究者には別の意味で届く。\n\nついこの前まで、起業家として前に立つことを求められていた。自分の言葉で語ることが評価された。なのに別の部屋では、経営者は外から連れてくるべきだと言われる。\n\n研究者には、「前に出ろ」と「下がれ」が同時に届く。\n\n本当に問うべきなのは、研究者がCEOに向いているかどうかだけではない。\n\nこの会社に必要なCEO機能は何か。そのうち、研究者本人が持たなければならないものは何か。外部人材が補えるものは何か。支援者が一時的に補えるものは何か。会社化前にまだ誰も持っていない機能は何か。\n\nこの順番で問わなければ、CEOの話は、研究者の資質を裁く会話になってしまう。\n\nここまで起きたことは、まだ失敗ではない。\n\n一文が強くなり、企業の反応が顧客証拠に見え、複数の時計が同じ資料を急がせ、支援が増えるほど責任の真ん中が空いた。\n\nその空白は、やがて別の問いになって戻ってくる。\n\n会社を作るなら、誰が何を背負うのか。\n\n研究者が前に立つのか。外から経営者を連れてくるのか。その粗い二択が出た瞬間、研究者はまた少し黙ることになる。\n"},{"file":"04-gap-vc-ceo-function.md","title":"Chapter 4: 起業家として立つ部屋、CEOを問われる部屋","markdown":"# Chapter 4: 起業家として立つ部屋、CEOを問われる部屋\n\n発表の翌朝、研究者はまだ少し高揚していた。\n\n前日の会場では、いつもより大きな拍手が起きた。研究室の言葉ではなく、社会に出すための言葉で話せた。技術の説明は削り、用途を絞り、企業候補の反応も入れた。最後のスライドには、あの一文が残っていた。\n\n「この技術は、二年以内に産業実装を目指します」\n\n審査員の一人は、研究者に言った。\n\n「すごく起業家らしくなりましたね」\n\nその言葉は、研究者を少し安心させた。前に立ってよかったのだと思えた。研究成果を社会に出す話を、自分の言葉で語ってよかったのだと思えた。\n\nところが翌朝、別の会議で同じ資料を開くと、空気は変わった。\n\n投資家経験のある人が、資料のチーム欄を見ながら言った。\n\n「いいですね。ただ、誰が会社を経営するんですか」\n\n若い事業化人材が、少し急いで答えた。\n\n「先生には技術と事業の中心に立ってもらいながら、経営人材も探していく想定です」\n\n相手はうなずいた。\n\n「研究者がCEOをやるのは、かなり難しいと思います。早めに外部CEOを連れてきた方がいいかもしれません」\n\n研究者は笑っていた。けれども、資料の端に置いた手が止まった。\n\n昨日は、前に出たことを褒められた。今日は、前に出るには足りないと言われている。自分はこの会社の顔なのか。それとも、会社になる前に脇へ下がるべき人なのか。\n\n誰も研究者を傷つけようとしていない。支援プログラムが研究者に起業家らしい発表を求めるのも、投資家が経営者を問うのも、それぞれ理由がある。研究者本人が語らなければ、技術の中心は伝わらない。資金を入れる側から見れば、会社を毎日動かす人が必要になる。\n\n問題は、二つの部屋がつながっていないことだった。\n\n前日の部屋では、研究者本人の言葉が事業化の証拠になった。翌朝の部屋では、研究者本人だけでは会社が動かないという不安が出た。その落差を、誰も資料の中に書いていなかった。\n\n若い事業化人材は、ホワイトボードに「CEO候補」と書きかけて、手を止めた。\n\n候補者の名前を並べても、研究者の沈黙は消えない気がしたからだ。\n\n代わりに、こう書いた。\n\n「まだ誰も持っていないもの」\n\nそこから会議は、少しだけ別のものになった。\n\n技術の意味を語る人はいる。研究者本人だ。社会に出したい理由を、自分の研究人生の言葉で語れる人もいる。これも研究者本人だ。\n\nでも、企業候補の「面白いですね」を、予算者と導入条件へ戻す人はまだ弱い。資本政策を設計する人もいない。採用候補に、何を任せるのかを決める人もいない。大学との利益相反、知財ライセンス、研究室との距離を毎週調整する人も、まだ名前がない。\n\n外部CEOという言葉は、便利だった。足りないものを一気に埋めてくれるように見えた。\n\nけれども、外部CEOを入れるという言葉の中にも、いくつもの別の機能が混ざっていた。顧客を読む人。資金を集める人。採用する人。契約を進める人。研究者の言葉を守りながら、会社の言葉へ翻訳する人。厳しいときに、研究者を前に出すのではなく、研究者の納得を先に取りに行く人。\n\nその全部を一人で持つ人は、なかなかいない。\n\n研究者は、しばらく黙ってから言った。\n\n「僕がCEOをやるかどうかより、僕がどこから外されるのかが怖いです」\n\nその言葉で、会議の焦点が変わった。\n\n投資家経験のある人は、すぐには反論しなかった。\n\n代わりに、資料の一文を指差した。\n\n「この技術は、二年以内に産業実装を目指します」\n\n「この文を、外部CEO候補が投資家の前で読むとしたら、どこまで弱めて言える必要がありますか」\n\n研究者は少し考えた。\n\n「二年以内に、ではなく、二年以内に何を確かめるか、です。産業実装を約束しているわけではない」\n\n会議室の空気が、もう一段静かになった。\n\n外部CEOが必要かどうかを話す前に、その人が研究者の守る線を強めずに復唱できるかを見る必要があった。さらに、企業や投資家に悪い知らせを伝えるとき、研究者へ戻す前にきれいな言葉へ薄めてしまわないかを見る必要があった。\n\n外部CEO候補のfitは、経歴の強さだけでは測れない。\n\n研究者の弱い文を、弱いまま外へ運べるか。払われなかった理由や予算者不在を、見栄えの悪い事実として先に言えるか。そこが見えなければ、外部CEOという言葉は補完ではなく、研究者を中心から遠ざける言葉になってしまう。\n\n研究者CEOか、外部CEOか。その二択を急ぐ前に、研究者を会社の中心から外してはいけないものがある。技術の真正性。社会に出す理由。まだ言ってよいことと言ってはいけないことの境界。研究者本人が、これは自分の研究の延長だと思える感覚。\n\n一方で、研究者に背負わせてはいけないものもある。資金繰りを毎週見ること。契約と株主と採用を一人で回すこと。投資家、企業、大学、行政の期待を同時に受け止めること。\n\n二つを分けたとき、CEOという肩書きは少しだけ小さくなった。\n\n大事なのは、誰をCEOと呼ぶかだけではない。会社になる前に、どの機能が空いていて、どの機能は研究者本人から切り離してはいけないかを見えるようにすることだった。\n\n会議の最後、若い事業化人材は資料のチーム欄を書き換えなかった。代わりに、次の会議メモに一行だけ追加した。\n\n「未割当の経営機能: 顧客条件、資金調達設計、採用、大学調整、研究者の真正性の保護」\n\nそれは、完成した答えではない。\n\nでも、研究者を無理に起業家へ押し込む会話でも、研究者から会社を取り上げる会話でもなかった。\n\nそしてその一行は、すぐに次の問題を呼び込んだ。役割がまだ決まっていないのに、資料はもう外へ出ようとしていた。\n"},{"file":"05-before-disclosure.md","title":"Chapter 5: 外に出す前に、守るものを決める","markdown":"# Chapter 5: 外に出す前に、守るものを決める\n\n「この資料、もう送信予約に入っていますか」\n\n知財担当者がそう聞いた瞬間、若い事業化人材は画面から手を離した。\n\nメールは、まだ送られていなかった。送信予約の時刻まで、あと十七分あった。\n\n宛先には、先週の企業面談で紹介された技術評価担当者が入っている。件名は「検証イメージの共有」。本文には、こう書かれていた。\n\n「先日の議論を踏まえ、顧客候補向けの検証イメージをお送りします」\n\n悪い文章には見えなかった。むしろ、事業化支援の現場では自然な文章だった。企業が関心を示した。検証の余地がある。では、次の資料を送ろう。相手の反応をもらって、仮説を磨こう。\n\nけれども、知財担当者が指したのは、資料の八枚目だった。\n\nそこには、研究室内で最もきれいに出たグラフが置かれていた。右側には、企業面談のあとに強められた用途仮説がある。下には、外部CEOの話が出た日に一度だけ線を引いた一文が残っていた。\n\n「二年以内に産業実装を目指します」\n\nさらに、その下に小さく足された言葉があった。\n\n「顧客候補との検証ニーズあり」\n\n研究者は、そのスライドを見て黙った。\n\nグラフは、まだ論文に出していない。用途仮説は、企業の言葉そのものではなく、支援者側の解釈が混ざっている。共同研究先との関係を確認しないと、図の一部は使えないかもしれない。\n\n何より、「顧客候補との検証ニーズあり」という言葉を、研究者本人はまだ了承していなかった。\n\n若い事業化人材は、言い訳をしようとしてやめた。\n\n早く外に出せば、学べると思っていた。相手の反応がなければ、事業化は進まないと思っていた。資料をきれいにすることも、企業候補に送ることも、前進のための仕事だと思っていた。\n\nその認識は、間違いではない。\n\n研究室の中だけで、会社は生まれない。企業に聞かなければ、顧客課題は見えない。投資家に壁打ちしなければ、資金を入れたあとに何を証明すべきかも見えない。\n\nただ、外に出る速度が、守る設計を追い越していた。\n\n知財担当者は、資料を責めなかった。かわりに、スライドの右上に三つの小さな印を置いた。\n\n青は、公開情報だけで話せるもの。\n\n黄は、相手と目的を絞れば話せるもの。\n\n赤は、まだ外へ出さないもの。\n\n八枚目のグラフには赤がついた。用途仮説には黄がついた。「顧客候補との検証ニーズあり」という文には、黄と赤のあいだの印がついた。\n\n「これは、相手が言ったことですか。それとも、こちらの解釈ですか」\n\n誰もすぐには答えなかった。\n\n会議室が静かになったのは、知財の話だけだったからではない。あの「面白いですね」が顧客の証拠へ変わりかけたのと同じ動きが、今度は資料の中で開示の境界を越えようとしていた。\n\n事実、仮説、期待、未開示情報。\n\nそれらは、スライドの中では同じフォントで並ぶ。だが、外へ出たあとに持つ意味はまったく違う。\n\nもしこのまま送られていたら、企業は検証依頼として読んだかもしれない。投資家は顧客の牽引力として読んだかもしれない。共同研究先は、自分たちの関与が別の文脈で使われたと感じたかもしれない。\n\nそして研究者は、こう思ったかもしれない。\n\n自分がまだ言えないと言ったところまで、もう外に出ているのか。\n\n壊れるのは、知財だけではない。\n\n論文の順序が壊れる。共同研究の信頼が壊れる。研究者と支援者の関係が壊れる。企業との次の会話が、学習ではなく修復から始まる。\n\n外に出す前に守るものを決めるとは、情報を囲い込むことではない。研究成果が外に出ても、研究者が次の部屋に安心して入れるようにすることだ。\n\nその日、送信予約は止められた。\n\n若い事業化人材は、メールを消さなかった。本文を弱くしただけでもない。資料の横に、配布記録を作った。\n\nどのファイルを、誰が、誰に、いつ送るのか。青、黄、赤のどれを含むのか。研究者は承認したのか。次に話してはいけない言葉は何か。企業から何を聞きたいのか。その問いに答えるために、どこまで見せる必要があるのか。\n\n資料は、外へ出すために作る。\n\nしかしBefore Zeroでは、資料が外へ出たあとに何を約束してしまうかも見なければならない。ピッチで強く見える言葉は、企業面談では検証依頼に見える。企業面談で便利な言葉は、投資家面談では顧客証拠に見える。支援プログラムで映える図は、知財や論文の順序を傷つけることがある。\n\nだから、開示設計は守りの事務ではない。\n\n物語が保護より速く走り出さないようにする編集である。\n\n資料を止めたことで、会議は一度後ろへ戻ったように見えた。けれども、実際には初めて前へ進んでいた。研究者が何を守りたいのか。企業に何を聞きたいのか。どの言葉なら外に出してよいのか。その線が、やっと同じ紙の上に乗った。\n\nそれでも、会議の最後に別の声が出た。\n\n「とはいえ、会社を作ってしまえば、企業とも投資家とも話しやすくなりますよね」\n\n送信予約を止めたばかりの画面の横で、次の早すぎる約束が始まろうとしていた。\n"},{"file":"06-incorporation-timing.md","title":"Chapter 6: 会社化は早すぎても、遅すぎても壊れる","markdown":"# Chapter 6: 会社化は早すぎても、遅すぎても壊れる\n\n「登記だけ先にしておきましょうか」\n\nその言葉が出たのは、送信予約を止めた会議の終わりだった。\n\n誰かが軽く言っただけだった。けれども、会議室の空気は少し明るくなった。\n\n会社名があれば、企業と話しやすい。投資家にも説明しやすい。経営人材候補にも声をかけやすい。支援制度の成果としても見せやすい。大学内でも、「会社として進む案件」だと伝えやすくなる。\n\nそれは、確かに前進に見える。\n\n若い事業化人材も、一瞬だけ安心した。CEO機能はまだ埋まっていない。開示の線も引き直したばかりだ。企業の「面白いですね」は、まだ予算者の条件に戻っていない。それでも会社という器ができれば、話がまとまる気がした。\n\n研究者は、資料の八枚目を閉じずに聞いていた。\n\n「会社を作ったら、この資料は誰の責任で出すんですか」\n\nその問いで、明るくなった空気が少し戻った。\n\n登記は、ただの手続きではない。社名ができる。代表者が決まる。契約の名義ができる。銀行口座、会計、税務、株主、取締役、利益相反、知財ライセンス、研究者の関与時間が現実の予定になる。\n\n会社になると、柔らかかった問いが硬くなる。\n\n「誰がやるんだろう」は、「代表者は誰か」になる。「企業が面白いと言っている」は、「顧客候補は誰か」になる。「外部CEOを探した方がいい」は、「誰に株を持たせるのか」になる。「資料を少し直そう」は、「会社として何を約束したのか」になる。\n\n器ができると、未整理のものまで器の中に入ってしまう。\n\nそれでも、会社化を遅らせればよい、という単純な話でもない。\n\n企業候補の関心は冷めることがある。経営人材候補は別の案件へ行く。支援制度や政策のタイミングは待ってくれない。大学内の熱量も、何度も会議を重ねるうちに下がっていく。研究者自身も、社会に出したいという気持ちを支え続けるには、前に進んでいる実感が必要になる。\n\n早すぎる会社化は壊れる。\n\n遅すぎる会社化も、別の形で壊れる。\n\nだから会社化の判断は、勇気か慎重さかでは決められない。どの未整理なら会社になったあと背負えるのか。どの未整理は、会社になる前に解かなければならないのか。その線を引く必要がある。\n\nこの案件で、まだ弱かったのは売上ではなかった。\n\n売上がないこと自体は、研究開発型のシーズでは珍しくない。問題は、誰が、何に対して、どの条件なら対価を払うのかがまだ見えていないことだった。\n\n企業の探索担当は「面白い」と言った。技術評価担当にも資料を送りかけた。けれども、予算を持つ人はまだ会っていない。現場が何を評価すれば導入に近づくのかも分かっていない。共同研究費なのか、PoC費なのか、ライセンス料なのか、最初の導入費なのか。会社が呼吸する入口は、まだ霧の中にあった。\n\nここで、二つの意見が割れた。\n\n一人は言った。\n\n「小さくでも対価が出る形を探した方がいいです。誰が払うのかが見えないまま会社にすると、外部資金だけで走ることになります」\n\n別の人は言った。\n\n「でも、小さな受託みたいな仕事に寄ると、大きく伸びる会社になれなくなるのでは。Jカーブを描ける可能性を潰すかもしれません」\n\nどちらも正しかった。\n\n小さく稼げることは、万能ではない。目先の売上ができると、難しい成長へ挑まず、低い天井の仕事に流れる危険がある。研究成果の大きな可能性を、便利な受託や周辺作業に閉じ込めてしまうこともある。\n\n一方で、稼げる体質がまったく見えないまま、すべてをJカーブとIPOの物語へ押し込むことにも危うさがある。多くの研究シーズは、いきなり大きな資本を入れて急成長するよりも、まず誰が困っているのか、誰が費用を負担するのか、何を確認すれば次も払うのかを知る必要がある。\n\n大事なのは、小さく稼ぐか、大きく伸びるかの二択ではない。\n\nその対価が、会社の生存確率を上げる証拠なのか。それとも、将来の可能性を狭める楽な逃げ道なのか。\n\n若い事業化人材は、ホワイトボードに二つの欄を作った。\n\n一つ目は、「生存確率を上げる小さな対価」。そこには、企業の評価部署から出た小さな検証費の話を書いた。\n\n相手は大きな金額を出すわけではない。来期の評価枠に入るかどうかもまだ分からない。ただし、相手は検証条件を具体的に言った。既存工程で困っている温度帯、測りたい性能、評価に参加する部署、来期枠へ入れるために必要な社内説明。その小さな費用は、会社の入口を照らす可能性があった。\n\n二つ目は、「未来を狭める小さな対価」。そこには、別の会社から来た短期受託の話を書いた。\n\nこちらはすぐに払われる。契約もしやすい。支援制度の面接では、初期売上として見せられるかもしれない。けれど中身は、研究成果の中核ではなく周辺分析だった。研究者の時間を食い、企業の導入条件も予算者も見えない。払われる理由は、技術の未来ではなく、目の前の便利さに近かった。\n\n若い事業化人材は、二つ目の案に小さく線を引いた。\n\n「これは、いま受けると楽になります。でも、会社の呼吸を強くするお金ではない気がします」\n\n支援者の一人が言った。\n\n「売上があると言えるのに、断るんですか」\n\n部屋は少し揺れた。\n\nその反論は、もっともだった。\n\n支援制度の面接では、初期売上の一行が効くかもしれない。研究者にとっても、企業が払うという事実は励みになる。外部経営候補に見せても、話が進んでいるように見える。投資家にも、ただの研究ではなく商用接点があると言える。\n\nしかも、その短期受託は悪い仕事ではなかった。企業の担当者も誠実だった。断れば、相手の熱を冷ますかもしれない。研究者は「その分析なら、来月の実験計画を一つ削ればできます」と言った。できてしまうからこそ、危なかった。\n\n若い事業化人材は、研究者のその言葉で迷った。\n\n小さく稼げる体質を見たいと言いながら、最初に来た支払いを断る。これは理屈としては説明できても、会議では格好が悪い。支援者の顔にも、せっかくの売上を捨てるのかという不安が出ていた。\n\n小さな対価を取りに行くと言いながら、目の前の支払いを断るのは矛盾して見える。だが、その矛盾こそ、稼げる体質を見るための核心だった。\n\n払われるかどうかだけでは足りない。\n\n何に払われるのか。誰が払うのか。次の評価条件につながるのか。研究者の時間を未来の中核へ戻すのか、それとも低い天井の仕事へ閉じ込めるのか。\n\n一つ目の小さな検証費は、まだ受けると決めたわけではない。それでも、予算者と評価条件へ進む問いをくれた。\n\n二つ目の短期受託は、支払いそのものは本物だった。それでも、その日は断る方向に傾いた。断ったことで、会議は「小さく稼げばよい」から離れた。\n\n断ったあと、研究者は少し黙った。\n\n「売上になる仕事を断るなら、その代わりに何を取りに行くのかは、はっきりさせたいです」\n\nその言葉で、WAITの条件は厳しくなった。九十日後に戻るとき、ただ予算者に会ったという報告では足りない。短期受託を断った分だけ、企業の評価条件、来期枠、研究の中核に近い支払い理由を、より具体的に持ち帰る必要があった。\n\nこの二つを分けると、登記の話は少し変わった。\n\n「会社を作るか」ではなく、「会社を作ったあとに何で生き延びるのか」が問われ始めた。\n\n結論は、その場ではGOにならなかった。\n\nけれども、単なる先送りでもなかった。\n\n会議メモには、こう残った。\n\n会社化はWAIT。九十日後に再判断する。若い事業化人材は企業の予算者へ接続する。研究者と知財担当者は赤、黄、青の開示線を確定する。外部経営候補とは、研究者の真正性を中心に残す条件を確認する。支援者は、会社化ではなく、最初に下げる不確実性へ資源を寄せる。\n\nそして、九十日後に戻る条件を一つだけ強く書いた。\n\n「誰が、何に、なぜ払うのかが一段具体化していること」\n\nWAITは、止まることではない。\n\n条件を持たないWAITは、ただの保留になる。けれども、戻る日付と担当者と問いを持つWAITは、未来のGOを作ることがある。\n\nこの案件が九十日後に会社化へ進むかは、まだ分からない。\n\nただ、その日の会議で一つだけ変わったことがある。会社化を急ぐ熱量は、少し冷めた。代わりに、会社になる前に何を確かめれば生き延びる確率が上がるのかが、初めて会議の中心に置かれた。\n\n会議が終わる前、若い事業化人材はメモの隅に小さく五つの言葉を書いた。\n\nGO。\n\nWAIT。\n\nHOLD。\n\nNO_GO。\n\nRESOURCE_SHIFT。\n\nまだ誰にも見せるための言葉ではなかった。けれど、次の会議でまた空気に流されないためには、判断を名前で呼べるようにしておく必要があった。\n"},{"file":"07-company-now-later-or-never.md","title":"Chapter 7: いま会社にするべきか、待つべきか、しないべきか","markdown":"# Chapter 7: いま会社にするべきか、待つべきか、しないべきか\n\n九十日後に戻る、と会議メモには書いた。\n\nその一行を書いたとき、部屋の中には少しだけ安堵があった。登記は急がない。けれど止まるわけでもない。若い事業化人材は企業の予算者へ接続する。研究者と知財担当者は、赤、黄、青の開示線を確定する。外部経営候補とは、研究者の真正性を中心に残す条件を確認する。\n\n紙の上では、きれいなWAITだった。\n\n三週間後、そのWAITはもう崩れかけていた。\n\n企業候補との面談は一件増えた。支援プログラムの次回発表も近づいた。投資家紹介の候補日も届いた。大学内では、会社化の可能性があるなら早めに論点を出してほしいと言われた。研究者は、論文の修正と学生指導の合間に、また資料確認を頼まれていた。\n\n誰も悪くない。\n\nただ、WAITのあいだに進める仕事が増えすぎて、何を待っていたのかが薄くなっていた。\n\n若い事業化人材は、最初の会議メモを開いた。\n\nそこには、戻る条件が三つ書いてある。\n\n予算者への接続。\n\n赤、黄、青の開示線の確定。\n\n研究者の真正性を中心に残せる経営候補との確認。\n\nそのうち一つも、まだ終わっていなかった。\n\nそれなのに、会議の空気はGOに近づいている。理由は単純だった。外からの予定が増えたからである。予定が増えると、進んでいるように見える。進んでいるように見えると、会社化の判断も近づいたように見える。\n\nここで、判断語をもう一度出す必要があった。\n\nGO、WAIT、HOLD、NO_GO、RESOURCE_SHIFT。\n\nこの五つは、格好いい分類ではない。会議が熱に飲まれたとき、いま何が本当に変わったのかを戻すための言葉である。\n\nその日の会議で、支援者の一人が言った。\n\n「前回WAITにしましたけど、企業面談も増えていますし、そろそろGOに寄せてもいいのでは」\n\n研究者は、少し疲れた声で聞いた。\n\n「何が変わったからGOなんですか」\n\nその問いに、すぐ答えられる人はいなかった。\n\n企業面談が増えた。だが、予算者にはまだ会っていない。資料は整理された。だが、赤のスライドはまだ投資家版から完全には消えていない。外部経営候補とは会った。だが、その人が研究者の守りたい線を本当に理解しているかは、まだ分からない。\n\nつまり、活動は増えたが、戻る条件は満たされていなかった。\n\n若い事業化人材は、ホワイトボードに大きく書いた。\n\n「WAIT継続。ただしRESOURCE_SHIFT」\n\n投資家紹介を一件減らす。支援プログラム用の市場スライド作成を止める。代わりに、企業候補の評価者と予算者へつなぐ。外部経営候補には、資金調達経験ではなく、研究者の言葉をどう守るかを聞く。大学内の知財確認を、発表資料の直前チェックではなく、資料作成の入口へ戻す。\n\nその判断は、場を盛り上げなかった。\n\nけれど、会議の速度は少し正しくなった。\n\n若い事業化人材は、五つの言葉の横に短い注釈を書いた。\n\nGO。勢いではなく、背負う順番が見えたとき。\n\nWAIT。止まることではなく、戻る条件を取りに行く仕事。\n\nHOLD。判断できないことを認めて、足りない材料を取りに行く短い橋。\n\nNO_GO。研究価値の否定ではなく、この形では会社にしないという逃がし方。\n\nRESOURCE_SHIFT。もっと頑張ることではなく、魅力的に見える活動を減らし、一番低い条件へ資源を向け直すこと。\n\n書くだけなら簡単だった。\n\n難しいのは、その下に具体的に消す活動を書けるかどうかだった。\n\n「投資家紹介を一件減らしましょう」\n\nその一言は、言いにくかった。紹介してくれる人の顔が浮かぶ。機会を逃す不安もある。支援制度の成果として見せやすい活動を減らすことにも抵抗がある。\n\nそれでも、その月に本当に必要だったのは、投資家の反応ではなかった。企業の予算者が、何に対してなら費用を出すのかを知ることだった。\n\n判断語は、言葉ではなく、削る活動で試される。\n\n会議の最後、研究者は少しだけ表情を変えた。\n\n「じゃあ、次の一か月は会社化するかどうかじゃなくて、何なら払われるのかを見に行く、でいいですか」\n\nその確認に、全員がうなずいた。\n\n結論は派手ではない。\n\nでも、ようやく会議は会社化の熱ではなく、生き延びる条件へ戻った。\n\n次に問題になるのは、その仕事を誰が持つかだった。予算者へ会う。開示線を守る。外部経営候補を見る。研究者の言葉を戻す。どれも必要だが、どれも自然には進まない。\n\n判断語だけでは、まだ会社は動かない。\n\n責任の空欄を埋めなければ、次の会議でまた同じ言葉が並ぶだけである。\n"},{"file":"08-who-carries-what.md","title":"Chapter 8: 誰が何を背負うのか","markdown":"# Chapter 8: 誰が何を背負うのか\n\n「予算者に会いに行くのは、誰ですか」\n\n会議の最後、大学の産学連携担当者がそう聞いた。\n\nさっきまで全員がうなずいていた。投資家紹介を一件減らし、企業の予算者へ接続する。開示線を確定する。外部経営候補には、研究者の言葉を守れるかを聞く。WAITは継続するが、RESOURCE_SHIFTする。\n\n方針は決まった。\n\nけれど、方針は仕事をしない。\n\n誰が企業へ連絡するのか。誰が探索担当から現場担当へつないでもらうのか。誰が予算者という言葉を相手に失礼なく出すのか。誰が研究者に同席してもらう範囲を決めるのか。誰が聞いたことを事実、仮説、期待、未確認に分けて戻すのか。\n\nホワイトボードには、また空欄ができた。\n\nその空欄は、予算者に会いに行く人だけではなかった。\n\nもっと小さく、もっと嫌な空欄もあった。\n\n「悪い知らせを、誰が弱めずに持ち帰るのか」\n\n企業が費用を出さないと言ったとき。外部経営候補が研究者の線を少し強く言い換えたとき。知財担当者が、この資料はまだ出せないと言ったとき。支援制度の面接で会社化の勢いを弱める必要が出たとき。\n\nその知らせは、誰かが会議へ戻さなければならない。\n\n戻す人がいないと、悪い知らせは、都合のよい言葉へ薄まる。\n\n「先方は前向きです」\n\n「候補者とは相性が良さそうです」\n\n「開示は大きな問題ではなさそうです」\n\n「売上化の可能性があります」\n\nどれも完全な嘘ではない。だが、どれも低い条件を隠すことがある。\n\nホワイトボードには、さっきまで残っていた五つの判断語がまだ薄く見えていた。\n\nだが、その横には名前がなかった。\n\nGOでもWAITでもHOLDでもNO_GOでもRESOURCE_SHIFTでも、誰かが次の一手を持たなければ、判断は議事録の中で眠る。\n\nその日、若い事業化人材は自分の名前を書こうとして、少し止まった。\n\n全部を持てるわけではない。企業へ会いに行くことはできる。資料の修正もできる。研究者の言葉を聞き直すこともできる。けれど、知財の最終判断は持てない。資本政策も持てない。大学内の利益相反も持てない。外部経営候補を評価する目も、まだ十分ではない。\n\nそれでも、何も持たないよりはいい。\n\n彼はペンを置いて、産学連携担当者に聞いた。\n\n「弱い事実を弱いまま戻す役を、僕が持ってもいいですか」\n\nすぐには返事がなかった。\n\n支援者の一人が言った。\n\n「それを毎回そのまま戻すと、面接資料が弱く見えませんか。企業の反応や候補者の話を、少し前向きに整えるのも支援の仕事では」\n\nそれも、一理あった。\n\n支援は、ただ冷たい事実を並べるだけではない。研究者が前に進めるように、可能性を言葉にする仕事でもある。けれど、その言葉が強すぎると、次の会議で誰かが傷つく。\n\n産学連携担当者は少し考えてから言った。\n\n「戻してください。ただし、弱いまま戻すだけではなく、次に誰が何を確認するかまで持ってきてください」\n\nその一言で、若い事業化人材の小さな権限が決まった。悪い知らせを運ぶだけではない。弱い事実を、次の仕事へ変える役である。\n\n若い事業化人材は、責任分担表ではなく、三十日の行動メモを書いた。\n\n初日。研究者から、技術の意味と守りたい線を聞く。提案しない。説得しない。まず、どの言葉が研究者本人の言葉で、どの言葉が支援者の加工なのかを分ける。\n\n三日目。資料を青、黄、赤に分ける。企業に出してよいもの、相手と目的を絞れば出せるもの、まだ外に出さないものを、研究者と知財担当者と同じ画面で見る。\n\n十日目。企業候補に聞く。技術として面白いかではなく、どの現場で困っているのか。既存手段では何が足りないのか。評価条件は何か。誰が次の判断をするのか。予算はどこから出るのか。\n\n二十日目。聞いたことを戻す。事実、仮説、未確認、約束してはいけないことに分ける。企業の言葉を、こちらに都合よく強めない。\n\n三十日目。研究者、大学、支援者、企業候補、外部経営候補が何を持つかを一枚にする。\n\nそして毎週、悪い知らせを一つでも弱めずに戻す。費用が出ない理由。予算者がいない事実。研究者が違和感を持った文。外部候補者が復唱できなかった線。支援者が言いすぎた期待。\n\nこれはCEOの仕事ではない。少なくとも、肩書きとしてのCEOの仕事ではない。\n\nでも、会社になる前に誰かが持たなければならない仕事だった。\n\nホワイトボードの端に、役職名を書きかけた跡が残っていた。\n\nCEO。\n\n事業開発。\n\n知財。\n\n支援。\n\n若い事業化人材は、その四つを消して、日付の入った欄に戻した。研究者が守る線。大学が見る開示と制度の順番。外部経営候補が持つ企業条件と資金で下げる不確実性。支援者が一時的に支える場と問い。\n\n偉い順ではなく、次の三十日で実際に動く欄だった。\n\nその日、若い事業化人材は自分の欄に、こう書いた。\n\n「企業の予算者へ接続する。聞いたことを強めず戻す。研究者の守る線を毎回確認する。資本政策と大学判断は持たない」\n\n小さな欄だった。\n\nでも、その欄があることで、研究者は少し安心した。\n\n「全部を任せるわけじゃないんですね」\n\n「はい。むしろ、先生に戻すものを間違えない役です」\n\nこの言葉で、若い人材は肩書きではなく信頼を少し得た。\n\nその信頼は、抽象的なものではなかった。\n\n翌週の企業面談で、彼は「先方は前向きです」と書きかけた行を消した。代わりに、「探索担当は関心あり。予算者未確認。評価条件未確定」と書いた。面接資料を整えようとしていた支援者には、弱く見える一文だった。研究者には、ようやく自分の研究が勝手に強められなかった一文だった。\n\nその日変わったのは、責任の定義ではない。\n\n弱い事実を、弱いまま会議へ戻してよい権限が、若い事業化人材に渡ったことである。\n\n次の投資家面談は、その一文を持ったまま始まる。\n"},{"file":"09-before-risk-capital.md","title":"Chapter 9: リスク資本に会う前に証明すること","markdown":"# Chapter 9: リスク資本に会う前に証明すること\n\n投資家面談の前夜、若い事業化人材は資料の最後のページを閉じられなかった。\n\n表紙はよい。研究者の写真も、技術の図も、社会課題の説明も入っている。市場規模のスライドも整った。企業候補との面談数も書いた。資金使途のページには、試作費、人件費、知財費、外注費が並んでいる。\n\n見た目には、会社に近い資料だった。\n\nだからこそ、不安だった。\n\n企業候補が「面白い」と言ったことは事実である。ただし、予算者にはまだ会っていない。技術データは強い。ただし、研究室外ではまだ一回しか試していない。知財は出願準備中。ただし、投資家資料にどこまで書いてよいかは細い線の上にある。研究者は前向きである。ただし、会社化後に毎週の経営判断を担うつもりなのかは、まだ言葉にしていない。\n\nさらに、送信予約を止めたときに赤をつけたはずの用途表現が、別の言い方で戻ってきていた。\n\n「医療現場での展開可能性」\n\n便利な言葉だった。投資家に全体像を伝えるには使いやすい。市場の広がりも見える。社会的意義も伝わる。\n\n研究者は、その一文を見て小さく言った。\n\n「それ、まだ僕らが証明した話じゃないですよね」\n\n資料は嘘をついていない。\n\nでも、事実、仮説、期待、未検証が同じ調子で並んでいる。\n\nそのまま面談に行けば、投資家の質問は厳しくなる。厳しくなるだけならまだいい。関係者がその質問を、研究成果への判決として受け取ってしまうかもしれない。\n\n「市場がまだ見えません」\n\n「チームは誰が引っ張るんですか」\n\n「資金を入れると何が進むんですか」\n\n「知財の自由度はどこまで確認できていますか」\n\nこれらは、技術を否定する言葉ではないことが多い。まだ整理されていない不確実性を照らす言葉である。\n\n面談前夜に必要なのは、強い資料をもっと強くすることではなかった。\n\n弱いところを、弱いまま持っていける資料に変えることだった。\n\n若い事業化人材は、最後のページを消して、四つの欄に書き直した。\n\n分かっていること。\n\n仮にそう見ていること。\n\nまだ分かっていないこと。\n\n資金で下げたい不確実性。\n\n企業二社との面談は、分かっていることに入った。\n\n予算者がいるかどうかは、まだ分かっていないことに入った。\n\n最初の用途がどこかは、仮説に入った。\n\n次の資金でやるべきことは、費目ではなく、研究室外での再現性、企業の評価条件、開示と知財の整理、経営実務の補完に書き換えた。\n\nその作業をしていると、企業からメールが届いた。\n\n探索担当からだった。\n\n「技術としては引き続き興味があります。ただ、今年度の評価予算は別テーマで埋まっています。事業部の導入判断に進むには、来期の検討枠に入る必要があります」\n\n部屋の空気が沈んだ。\n\n研究者は、少しだけ目を伏せた。自分の技術が否定されたわけではないと分かっていても、前の資料で「顧客候補」と少し強く書かれていた分だけ、反動は身体に来る。\n\n支援者も気まずかった。悪意なく、企業の関心を研究者への期待として積み上げていたからである。\n\nでも、そのメールは失敗ではなかった。\n\n止まっていた場所を教えてくれたからである。技術理解ではなく、予算者と年度計画の入口で止まっていた。相手は冷たくなったのではない。次に聞くべき問いを返してくれた。\n\n若い事業化人材は、最初、そのメールを資料から外そうとした。\n\n投資家面談の前夜に、支払いを断られた話を載せるのは怖かった。企業反応のページが弱く見える。研究者にも、また傷を見せることになる。支援者にも、これまでの期待を少し下げてもらわなければならない。\n\nけれど、外すと別の危険が残る。\n\n投資家は、面談数より先に、誰が払わなかったのか、なぜ払わなかったのかを見る。そこを隠せば、最初の厳しい質問で資料全体が弱くなる。\n\n資料の一行を差し替えた。\n\n「企業二社に顧客候補あり」ではない。\n\n「探索担当二社が関心。うち一社は技術評価担当と接点あり。ただし予算者、導入部門、今年度評価枠は未確認。次の資金で、評価条件と予算経路を確認する」\n\n弱い表現になった。\n\nしかし、この弱さは面談での信頼になる。未確認を未確認として持っていけるチームは、資金で何を下げるかを話せるからだ。\n\n次に、CEOのページを直した。\n\n代表予定者の名前を強く置くのではなく、責任の地図を一枚入れた。研究者が持つもの。外部人材に期待するもの。若い事業化人材が三十日だけ持つもの。まだ空いているもの。\n\n肩書きを隠したわけではない。\n\n肩書きだけでは会社が動かないことを、先に見せた。\n\n知財のページも直した。\n\n出願準備中とだけ書かず、何を話せるか、何は限定開示か、何はまだ話さないかを分けた。投資家にすべてを見せる必要はない。見せない理由を、秘密主義ではなく順序として説明できるようにした。\n\n資金使途のページも直した。\n\n試作費、人件費、知財費、外注費。\n\nそれだけでは、何が分かるのかが見えない。\n\nだから、資金で何を下げるのかを書いた。実環境に近い条件で再現できるか。企業の評価条件が具体化するか。最初の有償PoCに近づくか。知財と開示の順序が会社の自由度を支えるか。研究者だけでは持てない事業開発と管理実務を補えるか。\n\n面談当日、投資家は厳しかった。\n\n「まだ顧客とは言えないですね」\n\n「会社化には少し早いかもしれません」\n\nそこで終わらなかった。\n\n投資家は、資料の古い版も見ていた。\n\n「前の版では、顧客候補と書いてありました。今日の資料では探索担当の関心になっている。この差は、いつ分かったんですか」\n\n部屋が一瞬止まった。\n\n若い事業化人材は、喉が乾くのを感じた。差し替えた一行は、正直さのために入れたはずだった。だが、古い一行と並べられると、説明を変えたこと自体が不信に見える。\n\n研究者は、机の下で手を組み直した。支援者は、前の資料を送った日付を思い出していた。\n\n投資家は、差し替えたばかりの一行を指で押さえた。\n\n「この会社は、なぜ払わなかったんですか」\n\n若い事業化人材は、用意していた答えを一瞬忘れた。断られた理由を、技術の評価不足と言われるのが怖かったからだ。\n\n研究者も少し身構えた。\n\nけれど、答えなければならなかった。\n\n「探索担当は関心を持っています。ただ、今年度の評価枠には入っていません。来期枠に進むには、既存工程でどの作業が減るかを、予算者に説明できる必要があります」\n\n投資家はすぐにはうなずかなかった。\n\n少し間を置いてから、言った。\n\n「では、次の資金は、試作品を作るお金ではなく、その予算者が判断できる条件を作るお金ですね。ただ、何を確認すべきかは見えています」\n\nその最後の一言で、部屋の空気が少し変わった。\n\n投資家の反応はGOではなかった。だが、NO_GOでもなかった。\n\n若い事業化人材は、手元のメモに残っていた五つの判断語のうち、WAITとRESOURCE_SHIFTの下に小さく線を引いた。\n\n面談後、研究者は言った。\n\n「きつかったけど、何を見ればいいかは分かりました」\n\nそれは、資金調達の成功ではない。\n\nただ、その言葉は、明るい声ではなかった。\n\n研究者は「次から、企業反応のページは僕にも先に見せてください」と続けた。責めているわけではない。だが、資料を強くした側と、強くされた研究者の間には、薄い距離が残った。\n\n支援者もすぐには笑えなかった。企業の関心を前向きに見せることが、研究者の背中を押す支援だと思っていた。その支援が、投資家の前では古い版として突かれた。\n\nでも、Before Zeroでは大きな前進だった。\n\n投資家面談は、判定を受ける場ではなく、未整理を照らす場に変えられる。もちろん、資金が入らなければ進め方は変わる。現実は甘くない。それでも、問いを正しく持ち帰れれば、関係者は次に何を下げるべきかを共有できる。\n\nこの面談で照らされたのは、三つだった。\n\n予算者がまだ見えていない。\n\n経営機能は名前ではなく実務で埋める必要がある。\n\n資金使途は費目ではなく、不確実性の低下として語らなければならない。\n\nその三つを持ち帰れたなら、厳しい面談は失敗で終わらない。\n\nただし、感情は残る。\n\n研究者は少し傷ついた。支援者は自分の資料の強さを反省した。大学の担当者は、知財の順序を突かれたように感じた。若い事業化人材は、もっと早く予算者へ行くべきだったと思った。\n\nこの感情を放っておくと、次の会議は責任論になる。\n\n若い事業化人材は、面談後のメモを閉じられなかった。\n\n誰かの失敗として片づければ楽だった。けれど、それではまた同じ言葉を強くしてしまう。\n\n重い空気を、次の会議でどう扱うかが残っていた。\n"},{"file":"10-turning-failure-into-learning.md","title":"Chapter 10: 関係を壊さず、学習に変える","markdown":"# Chapter 10: 関係を壊さず、学習に変える\n\n投資家面談の翌週、会議室には同じ資料が置かれていた。\n\nただし、誰もすぐには開かなかった。\n\n研究者は、技術を否定されたように感じていた。大学の担当者は、知財の整理が遅いと言われたように受け取っていた。支援者は、資料を強くしすぎたと思っていた。若い事業化人材は、企業の予算者へ行くのが遅かったと分かっていた。外部経営候補は、自分に何を期待されているのか分からなくなっていた。\n\n面談で実際に言われた言葉は、そこまで長くない。\n\n「まだ顧客とは言えないですね」\n\n「会社化には少し早いかもしれません」\n\n「資金で何を確認するのかは、もっと絞れます」\n\nそれだけである。\n\nしかしBefore Zeroでは、短い反応が大きな感情になる。\n\n誰が悪かったのか。研究者に覚悟が足りなかったのか。大学の確認が遅かったのか。企業が本気ではなかったのか。投資家が厳しすぎたのか。支援者の進め方が悪かったのか。\n\n責任を考えることが必要な場面もある。\n\nでも、毎回責任論だけで閉じると、次の現場に何も残らない。\n\n若い事業化人材は、面談メモの上に新しい紙を置いた。\n\n「誰が悪かったか、ではなく、何を見誤ったかで書きませんか」\n\n最初に書いたのは、企業のことだった。\n\n当初の仮説。企業二社は検査工程に困っていて、技術の性能を見ればPoCに進むはずだった。\n\n実際の観測。探索担当は関心を示したが、予算者はまだ出ていない。一社は今年度の評価予算が埋まっている。現場の評価条件もまだ粗い。\n\n見落とした信号。初回面談で、誰が予算を持つのかを聞けていなかった。「面白いですね」を、顧客課題の証拠として強めすぎた。\n\n修正した問い。次は、現場の困りごと、既存手段の限界、評価条件、PoC後の判断者、予算経路を分けて聞く。探索担当だけでなく、評価者と予算者を同じ地図に置く。\n\n次に書いたのは、投資家面談のことだった。\n\n当初の仮説。技術の強さと企業候補の関心が伝われば、初期資金の議論に進めるはずだった。\n\n実際の観測。投資家は技術に興味を示したが、顧客、チーム、資金使途、知財の順番を繰り返し聞いた。特に、資金で何を下げるのかを見ていた。\n\n見落とした信号。責任分担表の空欄を、面談前に十分埋めていなかった。資金使途を、費目としては書いたが、不確実性の低下としては弱かった。\n\n修正した問い。次の面談前に、研究者が持つ機能、外部人材が担う機能、若い事業化人材が一時的に持つ機能、まだ空いている機能を一枚にする。資金使途を、何を確認するためのお金かに書き換える。\n\n最後に、外部経営候補のことを書いた。\n\n当初の仮説。経営経験があり、資金調達にも詳しい人なら、CEO機能の空白を埋められるはずだった。\n\n実際の観測。候補者は市場と資本の話は強かったが、研究者の技術観や守りたい線を十分に聞かなかった。研究者には、自分の研究が会社の材料として扱われるように見えた。\n\n見落とした信号。経歴だけを見て、技術理解、研究者との信頼形成、大学制約への理解を確認していなかった。\n\n修正した問い。経営人材候補を見るときは、時間投入、技術理解、研究者との対話姿勢、大学や研究機関の制約への尊重を先に確認する。\n\n紙に書くと、空気は少し変わった。\n\n失敗は消えない。傷ついた感覚も消えない。でも、誰か一人の弱さだけでは説明できないことが見え始める。\n\nそれでも、その場で関係が元に戻ったわけではない。\n\n研究者は、次の投資家向け練習に一回だけ出ないと言った。「少し、自分の言葉を整理したいです」とだけ付け加えた。支援者はうなずいたが、顔には痛みが残った。企業の探索担当へ送る次のメールも、その日は出せなかった。\n\n学習ログは、仲直りの道具ではない。\n\n壊れかけた関係を、壊れていないことにしないための道具である。\n\n企業の反応を強めすぎた。\n\n投資家の問いを、資金調達の判定として受け取りすぎた。\n\n外部経営候補の肩書きを、研究者との信頼より先に見た。\n\n支援者が自分の仮説外れを書けると、研究者は少しだけ会議に戻ってくる。\n\n「じゃあ、僕が何を守りたいのかも、先に書いた方がいいですね」\n\nその言葉は、小さな修復だった。\n\n若い事業化人材は、その言葉をログの横に書いた。\n\n「研究者の希望を全部通す、ではない。責める前に、役割、開示、時間、経営機能、大学側の土台を見る」\n\nその下に、大学側の欄も作った。\n\n知財確認に時間がかかる。利益相反の整理が必要になる。共同研究先との関係を見なければならない。市場や投資家の時計から見ると、もどかしい。\n\nでも、大学は長期の信頼を背負っている。研究成果、学生、共同研究、公共性、研究者のキャリア、組織としての説明責任を同時に見ている。そこを障害物として扱えば、会社化後に研究成果は根を失う。\n\n企業や投資家との関係も残せる。\n\n企業が止まったなら、次に何があれば検証条件を出せるかを聞く。投資家が厳しかったなら、いま一番大きく見えている不確実性を確認する。相手の反応を、怒りや落胆ではなく、次に下げるべき不確実性として受け取る。\n\nもちろん、きれいごとではない。\n\n関係が切れることもある。研究者が距離を取ることもある。企業が戻ってこないこともある。投資家が二度目の面談を望まないこともある。\n\nそれでも、学習ログを残すことには意味がある。\n\n次の研究者を守れるからである。\n\n次の案件で、探索担当の「面白いですね」を顧客証拠に変えそうになったとき、前のログが止めてくれる。外部CEO候補の経歴に惹かれすぎたとき、前のログが研究者との対話を思い出させる。WAITと書いたのに誰も戻る条件を持っていないとき、前のログが放置の危険を教えてくれる。\n\n学習ログは、成功談ではない。\n\n現場でつまずいた場所を、次の現場で少し早く見つけるための記憶である。\n\n会議の最後、若い事業化人材は、最初に強くしすぎたdeck sentenceをもう一度開いた。\n\n「この技術は、二年以内に産業実装を目指します」\n\nその文は、もう消さなかった。\n\nただ、横に小さく書いた。\n\n「そのために、いま下げる不確実性: 予算者、開示線、経営機能、研究者の守る線」\n\n同じ一文が、少し違うものになった。\n\n最初は、早すぎる約束だった。\n\n今は、まだ足りないものを照らす問いになっている。\n\n次に必要なのは、この問いを個別案件の反省で終わらせないことだった。\n\n研究成果の会社化は、いつも同じ風の中で起きるわけではない。政策が先に吹くときもある。産業が先に動くときもある。資本が熱くなるときもある。社会の受け止めが遅れるときもある。\n\n面談後の重い空気が少し落ち着いた頃、若い事業化人材の受信箱には、また別の風が届いていた。\n\n公募、企業、投資家。\n\n失敗のログは、外の風の中でもう一度試される。\n"},{"file":"11-macro-tailwinds-as-conditions.md","title":"Chapter 11: 追い風が、判断を急がせる","markdown":"# Chapter 11: 追い風が、判断を急がせる\n\n公募説明会の翌朝、若い事業化人材の受信箱には三通のメールが並んでいた。\n\n一通目は、大学の支援部署からだった。新しい実証枠の案内で、締切は六週間後。対象領域には、研究者の技術に近い言葉が入っていた。\n\n二通目は、企業の探索部門からだった。「昨日の件、社内でも関心がありそうです。公募と合わせて何かできるかもしれません」。短い文面だったが、会議室の空気を変えるには十分だった。\n\n三通目は、投資家からだった。海外の似た領域で大型調達が出たという記事が添えられていた。「この領域、いま追い風ですね。一度アップデートを聞かせてください」\n\n前の週まで、案件は WAIT だった。会社を急がず、企業の予算者を確認し、病院側の作業負荷を聞き、外部経営候補との信頼形成をもう少し見る。投資家には、強すぎる言葉を弱く戻した資料で会う。\n\n戻る条件も決めていた。\n\n予算者が見えること。赤い情報を含まない資料で企業と話せること。小さな対価か、少なくとも相手の実務時間を伴う検証条件が出ること。研究者が外部経営候補に「この人なら研究の中心を乱暴に扱わない」と感じられること。\n\nところが、三通のメールが机に置かれると、その条件は急に慎重すぎるものに見え始めた。\n\n「この公募、逃すのはもったいないですよ」\n\n支援部署の担当者が言った。\n\n「会社を作っておいた方が、外から見ると本気度が伝わります。企業も動きやすいかもしれません」\n\n企業面談を担当していたメンバーもうなずいた。\n\n「探索部門から返事が来ているなら、今は前へ出すタイミングではないですか。予算者確認を待っている間に、社内の熱が冷めるかもしれない」\n\n誰も悪いことを言っていない。\n\n公募は現実だった。企業の関心も現実だった。投資家の熱も現実だった。前に進む理由は、机の上に三枚とも置かれていた。\n\n支援部署の担当者には、締切を逃したくない理由があった。公募は、研究者が会社化前の検証費を得る数少ない機会である。企業側にも、社内の関心が残っているうちに次の会議へ進めたい理由があった。投資家も、領域の熱が上がっているときに、早くチームの輪郭を見たい。\n\nどの理由も、単独で見れば正しい。\n\n危ういのは、その正しさが同じ案件の上で重なったときである。\n\n研究者は黙っていた。\n\n若い事業化人材は、あの送信予約を止めた夜のことを思い出していた。あのときも、資料は外へ出そうとしていた。誰も研究者を傷つけようとしていなかった。ただ、物語の方が保護より速く走った。\n\n今回は、物語だけではない。外の世界そのものが、案件を急がせている。\n\n「いま来ている」という言葉は、Before Zero でとても危ない。\n\n危ないのは、その言葉が間違っているからではない。たいていの場合、少しは正しいからである。\n\nその危うさは、昼前にはもう文章になっていた。\n\n公募申請書の下書きに、支援部署の担当者が一文を入れた。\n\n「本シーズは、地域医療機関および製造企業との連携を通じて、今年度中に実証と会社化準備を進める」\n\nきれいな文だった。\n\n公募の趣旨にも合っていた。企業のメールも、病院の入口も、投資家の熱も、その文を支えているように見えた。\n\nしかし、若い事業化人材は、カーソルをその一文の上に置いたまま動けなかった。\n\n地域医療機関と書くには、医師の前向きな返事しかない。技師の負荷も、倫理窓口も、患者説明もまだ聞けていない。製造企業との連携と書くには、探索部門の関心しかない。評価者も予算者も、導入責任者もまだ奥にいる。会社化準備と書くには、外部経営候補との信頼も、研究者の守る線も、まだ九十日の途中だった。\n\n彼はその文を消した。\n\n代わりに、こう書いた。\n\n「本申請では、地域医療機関に近い相談先と製造企業の探索接点を起点に、医療現場の負荷、企業側の評価者・予算者、開示順序を九十日で確認し、会社化判断の条件を具体化する」\n\n弱くなった。\n\n支援部署の担当者は、少し困った顔をした。\n\n「この書き方だと、採択側に勢いが伝わりにくくないですか」\n\nその心配も正しかった。公募には競争がある。弱い文は、選ばれにくく見えることがある。\n\nけれど、強い文のまま出せば、採択された瞬間に、低い条件まで約束になってしまう。\n\n追い風は、最初に文章を変える。\n\nだから、その文章をどこで弱く戻すかが、次の九十日を決める。\n\n## 締切は、低い条件を消してくれない\n\n会議の途中で、産学連携担当者がホワイトボードの端に日付を書いた。\n\n公募締切。企業との次回面談候補日。投資家アップデート。出願確認の予定。研究者の学会発表。病院側に初回相談できそうな週。\n\n日付だけを見ると、会社化へ急ぐ理由が増えていった。\n\nしかし、日付の横に「何がまだ低いか」を書き始めると、空気は少し変わった。\n\n公募は近い。だが、公募が求めているのは実証計画であって、会社がすでに稼げる体質になっている証明ではない。\n\n企業は関心を持っている。だが、関心を持っているのは探索部門で、予算者でも現場責任者でもない。\n\n投資家は熱い。だが、投資家が見ているのは海外の別用途で、この研究成果の最初の支払い手前の条件ではない。\n\n政策は近い。だが、政策の近さは顧客の切実さを代替しない。\n\n研究は強い。だが、実環境に近い条件での再現性はまだ一回しかない。\n\n外の追い風は、低い条件を消さない。\n\nむしろ、低い条件を見えにくくする。\n\n「追い風があるからGO」ではない。\n\n「追い風を使って、どの低い条件を下げるか」である。\n\n## 追い風を、仕事へ変える\n\n若い事業化人材は、三通のメールを一枚ずつ横に並べた。\n\n公募のメールには、「実証条件を作るために使えるか」と書いた。\n\n企業のメールには、「探索部門から予算者へ進めるための問い」と書いた。\n\n投資家のメールには、「熱い領域の説明ではなく、次に下げる不確実性を伝える」と書いた。\n\n三通のメールは、会社化の根拠ではなくなった。\n\n次の仕事を決める材料になった。\n\n最終的に、その日の会議はGOにはならなかった。ただし、WAITのままでもなかった。\n\n公募には出す。だが、会社化の証明としてではなく、低い条件を下げる実証計画として使う。\n\n企業には会う。だが、「御社も顧客候補です」と強く言うのではなく、「この条件なら検証する意味がありますか」「誰が評価し、誰が予算を持ち、誰が導入の責任を持ちますか」と聞く。\n\n投資家にはアップデートする。だが、海外の熱を借りて大きく見せるのではなく、「熱い領域にいるが、まだ会社化の根拠にしていない条件」を説明する。\n\n病院側には相談する。だが、実証の場所があると言い切るのではなく、医師、技師、倫理窓口、患者説明の負荷を分けて聞く。\n\n外部経営候補とは、もう一度会う。だが、肩書きや調達経験を見るのではなく、研究者が守りたい線を相手がどう聞くかを見る。\n\n追い風は、案件を急がせた。\n\nでも、会議は追い風をそのままGOに変えなかった。\n\n追い風を、仕事へ変えた。\n\n## 熱量ではなく、条件として読む\n\nマクロの追い風は、一つの空気に見える。\n\n政策が来ている。産業が来ている。研究が盛り上がっている。資本が熱い。社会課題として分かりやすい。\n\nだが、現場ではそれぞれ違う速度で来る。\n\n政策は来ているが、顧客の支払い意思はまだ来ていないことがある。研究は強いが、実環境での検証が遅れていることがある。企業は困っているが、制度や社会受容が追いついていないことがある。資本だけが熱く、技術や人材の条件が低いこともある。\n\n追い風を読むとは、勢いを感じることではない。\n\nどの風が来ていて、どの風がまだ来ていないかを分けることである。\n\nその日、案件は追い風の中でもう一度立ち止まった。\n\nだが、立ち止まったことで、次の一手は曖昧ではなくなった。公募、企業、投資家、病院、外部経営候補。それぞれへ何を取りに行くかが見えた。\n\nそれでも、まだ危うさは残る。\n\n追い風を条件として読めても、「準備できていますか」という問いに戻ると、会議はまた混ざる。技術は準備できている。事業はまだ。開示は危うい。人材は空いている。社会受容は未確認。なのに、全部をまとめて「準備できている」と言ってしまう。\n\nその便利すぎる言葉が、次の会議の冒頭でまた置かれた。\n\n「準備はできていますか」\n"},{"file":"12-readiness-axes.md","title":"Chapter 12: 「準備できている」を割る","markdown":"# Chapter 12: 「準備できている」を割る\n\n「準備はできていますか」\n\n大学の部長が聞いた瞬間、会議室に小さな沈黙が落ちた。\n\n誰も即答できなかった。\n\n研究者は、技術データならあると思った。研究室内では再現できている。論文にもできる。特許の相談も進んでいる。\n\n支援部署は、発表資料ならできていると思った。強すぎた文章は弱く戻した。投資家に見せる前に、開示線も一度確認した。\n\n若い事業化人材は、顧客の準備はまだだと思った。企業の探索部門は関心を示したが、予算者はまだ見えていない。現場の評価条件も、相手の作業負荷も、十分には聞けていない。\n\n産学連携担当者は、制度の準備がまだだと思った。出願、共同研究、学会発表、企業面談、投資家資料。それぞれの順番を間違えると、あとで戻れない。\n\n研究者は、外部経営候補との関係もまだだと思った。経歴は強い。だが、研究の中心を守る感覚を共有できるかは、まだ分からない。\n\n同じ問いに、全員が違う景色を見ていた。\n\n「準備できていますか」は便利な言葉である。\n\n便利すぎるから危ない。\n\n危うさは、その場でカレンダーに出た。\n\n支援部署の担当者が、投資家アップデートの候補日を押さえようとしていた。\n\n「技術資料はもう説明できますよね。公募も近いですし、来週あたり一度つなぎませんか」\n\n画面には、木曜十六時の予定が仮で入っていた。\n\n研究者は、その予定を見て黙った。断るほどではない。だが、うなずくには何かが足りない。\n\n若い事業化人材は、招待メールの件名を見た。\n\n「会社化準備アップデート」\n\nその五文字が、部屋の空気を少しだけ速くした。\n\n技術の説明はできる。公募の話もできる。企業の関心も話せる。だが、予算者はまだいない。開示線も相手別には切れていない。病院の現場負荷も、外部経営候補の九十日責任も、まだ途中だった。\n\n彼は送信ボタンを押さず、件名を消した。\n\n「投資家アップデート」ではなく、「未確認条件の相談」に変えた。\n\n木曜十六時の予定も、いったん仮のまま残した。\n\n「準備できています」と答えた瞬間に、会う目的まで変わってしまう。\n\nそこで割るべきなのは、準備という言葉だけではなかった。準備できていると思ったときに、次に入れてしまう予定そのものだった。\n\n## ひとつの言葉で、五つの不安が隠れる\n\n机の上には、これまでの資料が重なっていた。\n\n投資家向けに弱く戻した資料。赤、黄、青の印をつけた開示メモ。企業の探索部門から来た短いメール。公募の要領。外部経営候補との面談メモ。研究者の実験データ。\n\n一枚ずつ見れば、どれも前に進んでいる。\n\nだから「準備できている」と言いたくなる。\n\nしかし、若い事業化人材が資料を並べ替えると、別のものが見えた。\n\n技術の紙には強さがある。だが、実環境での再現性はまだ細い。\n\n企業のメールには関心がある。だが、支払いに近い言葉はまだない。\n\n開示メモには慎重さがある。だが、誰がどの場で何を話すかはまだ揺れる。\n\n公募要領には機会がある。だが、公募に乗ることと会社として生き残ることは別である。\n\n面談メモには人材候補がある。だが、研究者との信頼はまだ始まったばかりである。\n\n「準備できている」は、五つの違う不安を隠していた。\n\n若い事業化人材は、部長の問いの下に、五つの小さな丸を書いた。\n\n技術の準備。\n\n事業の準備。\n\n制度とガバナンスの準備。\n\n社会や導入現場の準備。\n\n人材と組織の準備。\n\n五つ目の丸を書いたところで、ペンが止まった。\n\nそれぞれが違う速度で進んでいる。\n\n## 技術が強い案件ほど、事業の弱さが見えにくい\n\n研究者が説明すると、会議室は安心した。\n\n原理はきれいだった。データにも説得力があった。企業が興味を持つ理由も分かる。支援者の中には、「これだけ技術が強いなら、あとは事業化だけですね」と言う人もいた。\n\nその言葉に、若い事業化人材は引っかかった。\n\n「あとは事業化だけ」\n\n現場では、この言葉がよく出る。\n\nだが、この「あとは」はとても重い。\n\n企業の探索部門が面白いと言ったことは、顧客の準備ではない。大きな市場があることは、最初の顧客が支払うことではない。PoCをやりたいという空気は、予算者がいることではない。\n\n技術が強い案件ほど、事業の弱さは見えにくくなる。\n\nなぜなら、技術の強さが会議を救ってくれるからである。\n\n投資家に聞かれても、研究の新規性を話せる。企業に聞かれても、性能を話せる。公募に書くときも、社会課題と技術の独自性をつなげられる。\n\nでも、誰がいくら払うのか。どの条件なら導入するのか。導入の失敗は誰の責任になるのか。既存手段から変える痛みはどこにあるのか。\n\nそこは、技術の強さだけでは埋まらない。\n\n「面白いですね」は、まだ顧客の言葉ではない。\n\n「この条件なら、うちのこの部署で検証したい」\n\n「現行手段では、ここでコストが詰まっている」\n\n「予算はこの部門で、次の稟議にはこのデータが必要」\n\n「失敗した場合でも、この仮説は学べる」\n\nそういう言葉が出始めて、はじめて事業の準備は動き出す。\n\n## 制度の弱さは、速く進んだ後で刺さる\n\n制度やガバナンスの準備は、会議で後回しにされやすい。\n\n「そこは大学が見てくれるはず」\n\n「法務確認はあとで」\n\n「出願前後の話は、資料が固まってから」\n\n「投資家には一般的な話だけするから大丈夫」\n\nどれも、忙しい現場では自然に聞こえる。\n\nだが、送信予約の残り十七分は、その自然さの中で起きた。\n\n資料はよくできていた。話を前に進めるための文章だった。企業にも投資家にも、この案件の魅力を伝えたかった。だからこそ、赤い情報、黄色い情報、青い情報が一枚の資料に混ざりかけた。\n\n制度の準備が低いと、最初は速く進む。\n\n資料は出る。面談は入る。紹介は増える。\n\nしかし、あとで止まる。\n\n知財の順番が崩れる。共同研究先との関係が曖昧になる。学会発表と企業面談の線が混ざる。投資家資料の前提を戻せなくなる。研究者の兼業や利益相反が後から重くなる。\n\n制度は、スピードを殺すためにあるのではない。\n\n戻れない事故を避けるためにある。\n\nその日の会議で、産学連携担当者は言った。\n\n「進めるなら、話す順番も進めましょう。開示線を置かないまま資料だけ前に出すのは、進んでいるようで、あとで研究者を止めます」\n\n研究者は小さくうなずいた。\n\nこのうなずきは、制度の話ではなく、信頼の話だった。\n\n## 低い軸を上げる仕事へ戻す\n\n会議の最後、部長はもう一度聞いた。\n\n「では、この案件は準備できていますか」\n\n今度は、誰も一言で答えなかった。\n\n研究者は、技術は進んでいるが実環境の再現性をもう少し見たいと言った。\n\n若い事業化人材は、企業の探索部門ではなく予算者と評価条件を取りに行くと言った。\n\n産学連携担当者は、資料の開示線と出願・学会・企業面談の順番を置くと言った。\n\n支援部署は、公募を会社化の証明ではなく、低い条件を上げる実証費として組み替えると言った。\n\n研究者は、外部経営候補ともう一度、研究の中心と守る線について話したいと言った。\n\n「準備できているか」は、答えではなくなった。\n\n低い軸を上げる仕事の一覧になった。\n\nここで、ようやく名前が少しだけ役に立つ。\n\n技術の準備。事業の準備。制度やガバナンスの準備。社会の準備。人材の準備。\n\n名前は、現場の混乱を消すためではない。\n\n「準備できている」という便利な言葉を、何度でも割るために使う。\n\nまだ残る不安がある。\n\n五つの軸を分けても、人を見る場面ではまた混ざる。研究者はCEOに向いているのか。外部CEO候補は強いのか。若い事業化人材はどこまで持つべきか。資質と実務、真正性と経験、信頼と肩書きがまた一つの言葉に押し込められる。\n\nその不安は、次の面談で人の話として戻ってくる。\n\n外部経営候補は強いのか。研究者は何を持ち続けるのか。若い事業化人材はどこまで言えるのか。\n\n準備という言葉を割ったあとでも、人を見る言葉はまだ荒いままだった。\n"},{"file":"13-founder-readiness-field-language.md","title":"Chapter 13: 外部CEOという言葉の前で、研究者が黙った理由","markdown":"# Chapter 13: 外部CEOという言葉の前で、研究者が黙った理由\n\n外部経営候補との二回目の面談は、前回より長くなった。\n\n前回は、経歴の確認で終わった。資金調達の経験、大企業との事業開発、採用、投資家との関係。支援者たちは安心した。研究者も、礼儀正しくうなずいていた。\n\nしかし、面談後に研究者は言った。\n\n「研究の話を、あまり聞かれなかった気がします」\n\nその言葉が残っていた。\n\nだから二回目の面談では、若い事業化人材が最初に資料を配らなかった。投資家向けの資料も、ピッチ資料も、まだ机の中央には置かなかった。\n\n代わりに、研究者へ聞いた。\n\n「この研究で、外に出すときに絶対に粗く扱われたくない線はどこですか」\n\n研究者はすぐには答えなかった。\n\n少し考えてから、三つ話した。\n\nまだ確かめきれていない性能条件。共同研究先との関係。研究室の学生に負荷がかかる可能性。\n\n外部経営候補は、それをメモした。\n\nそのあとで、若い事業化人材は候補者へ聞いた。\n\n「この三つを守りながら、それでも会社化へ進めるとしたら、あなたは最初の九十日で何を持ちますか」\n\n部屋の空気が変わった。\n\n外部CEOを連れてくるかどうかの面談ではなくなった。\n\n誰が、どの機能を、どの責任で持つのかを確かめる面談になった。\n\n## 外部CEOは、研究者を置き換える言葉ではない\n\nBefore Zero の現場では、外部CEOという言葉が強く響く。\n\n研究者には経営は難しい。資金調達には経営者が必要。投資家に見せるにはチームを整えたい。こうした言葉は、一定の現実を含んでいる。\n\n研究者が、採用、資本政策、契約、会計、労務、顧客開拓、投資家対応、取締役会運営をすべて持つのは難しい。研究を続けながら、それを背負うのはなおさらである。\n\nだから、外部から経営機能を補うことは必要になる。\n\nしかし、外部CEOという言葉が、研究者を置き換える言葉になると危ない。\n\n研究の意味を語る中心。何をまだ言い切ってはいけないかを知る感覚。社会に出したい理由。共同研究先や学生への責任。大学との信頼。技術の限界を誠実に扱う態度。\n\nこれらは、外から簡単に持ち込めない。\n\n経営経験は補える。\n\nだが、研究の中心を雑に扱えば、会社は強くなる前に折れる。\n\n外部CEO候補を見るとき、最初に見るべきなのは肩書きではない。\n\nその人が研究者を置き換えようとしているのか、それとも研究者の中心を残したまま、足りない機能を持とうとしているのかである。\n\n## 創業者を見る問いは、人柄だけでは足りない\n\n面談の途中で、支援者の一人が言った。\n\n「人柄は良さそうですね」\n\nたしかに、候補者は良い人に見えた。聞き方も丁寧だった。研究者への敬意もあった。強く売り込みすぎる感じもなかった。\n\nでも、若い事業化人材は、それだけでは足りないと感じていた。\n\n良い人かどうか。\n\n強い経歴かどうか。\n\n投資家受けしそうかどうか。\n\n研究者と相性が良さそうかどうか。\n\nどれも大切だが、それだけでは会社化前の判断にはならない。\n\n面談の途中で、若い事業化人材は、あえて見栄えの悪い情報を一つ出した。\n\n「企業の一社は、今年度の評価費を出せません。理由は、技術への関心不足ではなく、来期枠へ入れる条件がまだ弱いからです」\n\n候補者は、少しだけ身を乗り出した。\n\n「では、投資家向けには、来期予算化に向けた企業連携が進行中、と言えばよさそうですね」\n\n研究者の顔が固くなった。\n\nその言い方は、悪くない。資料としては読みやすい。けれど、支払い拒否の意味を少しだけ強くしている。\n\n外部CEOという言葉が最初に出た部屋でも、候補者が研究者の線を復唱できるかは見た。\n\nここで見たいのは、その復唱が面談の中だけの丁寧さで終わらないかだった。悪い知らせを、次の九十日の仕事として持てるか。投資家向けに整えたい誘惑が出た瞬間にも、弱い事実を弱いまま置けるか。\n\n若い事業化人材は、候補者にもう一度頼んだ。\n\n「弱いまま言ってもらえますか」\n\n候補者は、今度はゆっくり言い直した。\n\n「企業探索担当は関心を持っている。ただし、今年度の評価費は出ない。来期枠へ進むには、予算者が判断できる条件を作る必要がある」\n\n研究者は、そこで初めてメモを取った。\n\nただし、それで候補者への不安が消えたわけではない。\n\n研究者は、面談後に「言い直せるのは分かりました。でも、毎週それをやれるかは、まだ分かりません」と言った。候補者も少し悔しそうだった。強い言葉へ寄せる癖は、経験の中で身についた武器でもあったからだ。\n\nその不安は、翌朝のメールで戻ってきた。\n\n候補者は支援部署へ、面談のお礼と次の進め方を送っていた。丁寧な文だった。研究者への敬意もあった。責めるようなところは何もない。\n\nただ、最後の一文だけが少し強かった。\n\n「来期予算化に向けた企業連携を軸に、投資家向けの説明も整えていければと思います」\n\n若い事業化人材は、その一文を読んで、昨日の会議室を思い出した。\n\n昨日、候補者は弱いまま言い直せた。\n\nでも、メールになるとまた滑らかになった。\n\n滑らかな文は、相手を安心させる。支援部署も動きやすい。投資家にも伝わりやすい。候補者の経験からすれば、それは仕事の技術だった。\n\nだからこそ、ここで直す必要があった。\n\n若い事業化人材は、候補者へ返信した。\n\n「昨日の言い方に戻したいです。企業探索担当は関心を持っている。ただし今年度の評価費は出ない。来期枠へ進むには、予算者が判断できる条件を作る必要がある。投資家向けにも、この弱さを残したまま進めたいです」\n\n送る前に、少しだけ手が止まった。\n\n相手は年上で、経験もある。候補者の文は、悪い文ではない。支援部署から見れば、若い事業化人材が細かく止めているように見えるかもしれない。\n\nそれでも送った。\n\nその日の午後、候補者から短い返事が来た。\n\n「了解しました。たしかに強めていました。投資家向けには、弱い条件を残した版で作ります」\n\n研究者はその転送を見て、何も大きなことは言わなかった。\n\nただ、次の面談候補日に丸をつけた。\n\n信頼は、面談の中だけでは決まらない。\n\n面談が終わった後の一文で、もう一度試される。\n\n外部経営候補を見るとき、悪い知らせをどう扱うかは大きい。\n\nきれいに言い換えて安心させる人なのか。弱い事実を弱いまま持ち、次の仕事へ変えられる人なのか。その違いは、会社になる前の信頼を左右する。\n\n創業者を見るとは、その人を好き嫌いで評価することではない。\n\n悪い知らせが来た瞬間に、その人が何を強め、何を弱いまま置き、何を次の仕事へ変えるかを見ることである。\n\nこの候補者は、最初に強い言葉へ寄った。だが、言い直した。しかも、言い直したあとで不満も残した。そこに、この人の局所合理性があった。外部の経営人材は、期待を集め、資金を呼び、採用を進めるために、可能性を前へ出す訓練を受けている。その武器を全部捨てろと言われれば、候補者にとっても不安になる。\n\nだからこそ、面談で見たいのは従順さではない。\n\n強い言葉が必要な場面を知りながら、研究者の線を越える直前で戻れるかである。\n\n## 若い事業化人材の役割も、ここで変わる\n\nこの面談で、もう一人の役割も見え始めた。\n\n若い事業化人材である。\n\n彼はCEO候補ではなかった。投資家に見せる肩書きも、まだ強くない。資金調達の経験もない。だが、この案件では、いくつもの場面で同じ空白を見つけていた。\n\n強すぎる資料を弱く戻した。\n\n企業の「面白いですね」を予算者確認へ戻した。\n\nWAITが放置へ崩れないよう、戻る条件を持とうとした。\n\n研究者が黙ったとき、その沈黙を会議の外へ出さなかった。\n\n外部経営候補に対しても、最初の九十日で何を持つかを聞いた。\n\nこの人材は、まだ会社の役員ではない。\n\nそれでも、Before Zero では重要な機能を持っていた。\n\n資料と現場のズレを見つける。研究者の言葉を強くしすぎない。企業や投資家の問いを、人格評価ではなく条件へ戻す。誰も持っていない責任を、一時的に見える場所へ置く。\n\nこの面談メモでは、若い事業化人材を脇へ押し出すことはできなかった。\n\n若い事業化人材は、面談メモの余白に三つの名前を並べた。\n\n研究者本人、外部経営候補、若い事業化人材。\n\n三者の間で、会社化前の創業者機能は少しずつ組まれていく。\n\n## 最初の九十日で、何を持つか\n\n面談が進んだところで、若い事業化人材は紙を一枚出した。\n\nそこには、肩書きではなく、最初の九十日に必要な機能だけが短く書かれていた。\n\n研究者は、技術の意味と、まだ言い切れない条件を持つ。\n\n外部経営候補は、企業の検証条件と、資金で下げる不確実性を持つ。\n\n若い事業化人材は、資料の強さ、予算者の空白、戻る条件の記録を持つ。\n\n大学や支援部署は、知財、開示、兼業、利益相反、共同研究、ライセンスの順番を持つ。\n\nこの紙を見た外部経営候補は、少し考えてから言った。\n\n「私が最初に持つべきなのは、投資家資料ではなく、企業の検証条件ですね」\n\n研究者は、その言葉で少し表情を緩めた。\n\nその日、外部CEOを決めたわけではない。\n\nだが、外部CEOという言葉が、研究者を置き換えるものではなくなった。\n\n会社化前の機能を、誰がどの順番で持つかを考える言葉に変わった。\n\n## 補えるものと、補えないもの\n\nその紙で見たかったのは、言葉の定義ではない。\n\n研究者に経営経験がないから向いていない、と決めるのは早い。外部経営候補に調達経験があるから任せればよい、と決めるのも早い。若い事業化人材に肩書きがないから中心ではない、と見るのも早い。\n\n補えるものがある。資金調達、採用、契約、管理、営業、投資家対応、事業開発。\n\n補いにくいものもある。研究の意味を語る真正性。まだ言い切れないことを守る自己認識。悪い知らせを隠さない透明性。研究者と経営人材が、同じ不確実性を見られる信頼。\n\n補えるものを、人格の欠点として責めない。補いにくいものを、肩書きでごまかさない。\n\n名前は、まだなくてよかった。\n\nまずは、研究者が黙った理由を聞く。外部経営候補が何を最初に持つかを見る。若い事業化人材がどの空白を拾っているかを見る。\n\n## 人を見たあと、土壌を見る\n\n面談が終わったあと、研究者は廊下で言った。\n\n「今日の話なら、もう一度会ってもいいと思います」\n\nそれは小さな前進だった。\n\nだが、若い事業化人材は、まだ安心していなかった。\n\n研究者と外部経営候補の関係が少し進んでも、この案件を支える土壌が弱ければ、また研究者に負荷が戻る。知財の順番を誰が持つのか。企業との資料を誰が確認するのか。公募で何を証明するのか。兼業や利益相反を誰が早めに扱うのか。失敗したときに、誰が関係修復の場を作るのか。\n\n個人の相性だけでは、会社化前の混乱は受け止めきれない。\n\n支援メニューが多いかではない。\n\n若い事業化人材は、面談メモの最後に一行だけ書き足した。\n\n「この関係を、次の会議で研究者だけに戻さない」\n\nその一行は、人の話から、土壌の話へつながっていた。\n"},{"file":"14-institution-as-nursery.md","title":"Chapter 14: 研究者を孤独にしない土壌","markdown":"# Chapter 14: 研究者を孤独にしない土壌\n\n研究者は、支援メニューの一覧を見ていた。\n\n起業講座。ピッチイベント。知財相談。ギャップファンド。企業マッチング。VC紹介。外部経営人材の候補リスト。インキュベーション施設。産学連携窓口。\n\n紙の上では、支援は多かった。\n\nそれでも研究者は、最初のページから先へ進めなかった。\n\n「結局、最初に誰へ相談すればいいんですか」\n\nその声は、研究者が四つの部屋を回ったあと、廊下で聞いたものと同じだった。\n\n支援メニューが増えても、責任の流れが見えなければ、研究者はまた別々の部屋を歩き回る。知財相談では出願の話をする。起業講座ではピッチを磨く。企業面談では用途を聞かれる。VC紹介ではチームを問われる。外部経営候補とはCEOの話になる。学内では兼業や利益相反を確認する。\n\nどの部屋も、善意で動いている。\n\nだが、研究者の中では一つの案件である。\n\n一つの研究成果が、どこまで話してよいのか、誰に会うべきなのか、会社を作るべきなのか、誰と組むべきなのか、何を守るべきなのか。その順番が見えないまま、部屋だけが増えていく。\n\nこれが、研究者を孤独にする。\n\n翌週、別の研究者にも同じ一覧が送られた。\n\n今度の研究者は、医療ではなく材料の研究をしていた。会社化に強い関心があるわけではない。ただ、企業から問い合わせが来て、何を話してよいか分からなくなっていた。\n\n支援メニューのPDFは、前より見やすくなっていた。\n\n窓口の名前も増えていた。知財相談のリンクも、起業支援の説明も、企業マッチングの案内も、外部人材紹介のページもあった。\n\nそれでも、その研究者は最初のページで止まった。\n\n「これは、どこから行けばいいんですか。企業には来週返事しないといけません」\n\n前の研究者と、同じ声だった。\n\n若い事業化人材は、その瞬間に気づいた。\n\n支援メニューをきれいにしても、最初の一人が見えなければ、孤独は減らない。\n\n必要なのは、もっと親切な一覧ではなかった。\n\n最初に研究者の話を受け、開示、企業返答、支援制度、人材、資金の順番を一緒にほどく人だった。\n\nその日から、支援メニューの最初の行は変わった。\n\n「まずここに相談してください」\n\nその下には、講座名も制度名も書かなかった。\n\n最初の面談で確認することだけを書いた。\n\n外に出してよい情報。企業へ返す期限。研究者が守りたい線。急いでいる理由。まだ誰も持っていない責任。\n\nメニューはその後でよかった。\n\n## 支援メニューは、道ではない\n\n大学や研究機関には、多くの支援がある。\n\n一つひとつは必要である。\n\n知財相談がなければ、外へ話す前に守るものを確認できない。ギャップファンドがなければ、会社化前の検証費が足りない。企業マッチングがなければ、顧客候補へ近づけない。VC紹介がなければ、資本の問いに触れにくい。起業講座がなければ、研究者は会社化の言葉を持ちにくい。外部経営人材との接点がなければ、研究者に経営実務が戻る。\n\nだが、支援メニューの数と、支援が道になっていることは違う。\n\nメニューは点である。\n\n道は、順番と責任である。\n\nこの案件では、点はたくさんあった。\n\nしかし、誰が最初に研究者の違和感を受け止めるのかが見えなかった。誰が企業に出す資料の開示線を見るのかが曖昧だった。誰が企業の「面白い」を予算者確認へ戻すのかが空いていた。誰が外部経営候補と研究者の信頼形成を見るのかも決まっていなかった。WAITの戻る条件を持つ人も、失敗後の関係修復を持つ人も、毎回会議の中で探していた。\n\n支援はあった。\n\nでも、案件を運ぶ手が途切れていた。\n\n## 苗床は、研究者の覚悟を責めない\n\n研究者が事業化に不安を持つと、現場ではときどき「覚悟」の話になる。\n\n起業する覚悟があるか。CEOになる覚悟があるか。投資家の前に立つ覚悟があるか。研究室を出て会社を背負う覚悟があるか。\n\n覚悟は大切である。\n\nだが、覚悟という言葉だけで研究者の不安を片づけると、土壌の弱さが見えなくなる。\n\n外に何を話してよいか分からない。\n\n企業面談の前に誰へ相談すればよいか分からない。\n\n外部経営候補が来たとき、自分の研究が自分から離れていくのではないかと感じる。\n\n会社に関わることで、学生や共同研究者に迷惑がかからないか不安になる。\n\n投資家や企業に強い期待を持たせたあと、応えられなかったら研究者として傷つくのではないかと思う。\n\nこれらを全部、覚悟不足と呼ぶのは乱暴である。\n\n制度で減らせる不安がある。\n\n順番で減らせる不安がある。\n\n誰かが持てば減らせる不安がある。\n\n研究機関を苗床として見るとは、研究者の覚悟を測る前に、研究者が安心して社会実装へ関われる土壌があるかを見ることである。\n\n## 責任が流れると、同じ場面が変わる\n\n同じ案件でも、責任の流れがあると、場面は変わる。\n\n企業の探索部門が「面白い」と言ったとき、誰かが予算者と評価条件へ戻せる。\n\n送信予約された資料に赤い情報が混ざりかけたとき、誰かが研究者を責めずに止められる。\n\n公募締切が来たとき、誰かが会社化の根拠ではなく、低い条件を下げる資金として組み直せる。\n\n外部経営候補が現れたとき、誰かが肩書きだけで安心せず、研究者の守る線と最初の九十日の責任を聞ける。\n\n投資家面談で厳しい問いを受けたとき、誰かが敗北ではなく証拠更新へ戻せる。\n\nこれらは、特別な才能だけで起こることではない。\n\n土壌に組み込める。\n\n若い事業化人材は、支援メニューの一覧を裏返し、空白の面に短い線を引いた。\n\n研究成果を見つける人。知財と開示の順番を見る人。企業の関心を顧客条件へ変える人。資金で何を下げるか設計する人。外部人材との関係形成を見る人。会社化判断を記録する人。研究者保護を制度へつなぐ人。\n\n線は部署名ではなく、責任が途切れやすい場所を指していた。\n\nそれぞれが別々の部署にいてもよい。\n\n外部の支援者と組んでもよい。\n\n大切なのは、研究者が毎回自分で部屋を渡り歩いて、全体をつなぎ直さなくてもよいことだ。\n\n## 資金は、急がせるためではない\n\nギャップファンド、公的資金、大学ファンド、企業PoC予算、VC、CVC。\n\n資金の導線は、研究成果を前へ動かす。\n\n資金を出す側にも、急ぐ理由がある。\n\n公募には期限がある。支援制度には採択後の成果説明がある。企業PoC予算には年度があり、担当者は社内で「なぜこのテーマに使うのか」を説明しなければならない。投資家は、資本を入れたあとに会社が伸びる道筋を見る責任がある。\n\nだから、資金の側が前へ進ませようとすること自体は悪ではない。\n\nしかし、資金が見えると、現場は急ぎやすくなる。\n\n公募があるから応募する。応募するなら会社を作る。投資家に会えるから登記する。企業PoCがあるから資料を強くする。\n\nこうして、資金が低い条件を下げる道具ではなく、会社化を急がせる圧力になる。\n\n苗床としての研究機関は、資金を目的化させない。\n\nこの資金で何を確かめるのか。技術のどの条件を再現するのか。顧客のどの仮説を聞くのか。知財や開示のどの危うさを減らすのか。外部経営候補との関係形成に何を使うのか。次の資金調達までに、何が分かっていればよいのか。\n\n資金は、研究者を急がせるためではない。\n\n研究者を守りながら、不確実性を下げるためにある。\n\n## 同じ孤独を、次の案件で繰り返さない\n\nこの案件の会議が終わったあと、若い事業化人材は一枚のメモを残した。\n\nどの支援メニューを使ったかではない。\n\nどこで責任が空いたかである。\n\n企業の「面白い」を顧客条件へ戻す人が、最初は空いていた。\n\n開示線を送信前に止める人が、偶然に近かった。\n\nWAITの戻る条件を持つ人が、会議のたびに揺れた。\n\n外部経営候補との信頼形成を、誰が見るかが曖昧だった。\n\n投資家面談後の傷を、学習ログへ変える場が後追いだった。\n\nこのメモは、個別案件の反省ではない。\n\n次の研究者を孤独にしないための土壌メモである。\n\n研究機関が苗床になるとは、すべての案件を成功させることではない。\n\n同じ孤独を、次の案件で繰り返さないことである。\n\n## 苗床を見る\n\n最初のほうで、研究者は廊下に立っていた。\n\n支援は多いのに、中心がない。\n\nここで、その孤独は個人の感情ではなく、土壌の問題として戻ってきた。\n\nここまでで、現場の混乱はかなり見えていた。\n\n企業の「面白い」が顧客証拠へ化ける。資料が保護より速く走る。外部CEOという言葉が研究者を黙らせる。登記の圧力が生存確率を見えにくくする。WAITが放置に崩れる。投資家面談が人を傷つける。追い風が条件を消して見せる。準備度が一つの言葉に混ざる。支援メニューが多くても責任が流れない。\n\nこの混乱を、もう勘や経験だけで受け止めるには限界があった。\n\n研究者が黙った瞬間、送信予約の残り十七分、予算者が見えない企業メール、九十日のWAITが崩れかけた会議。そうした手触りを失わないまま、次の案件で同じ迷いを早く見つける地図が必要になっていた。\n\n若い事業化人材は、これまでの紙をもう一度机に並べた。\n\n強すぎた一文。赤、黄、青の開示メモ。企業のメール。WAITの戻る条件。公募申請書の弱く戻した文。外部候補のフォローアップメール。支援メニューの最初の行。\n\nそれらは別々の出来事ではなかった。\n\n同じ現場が、別の角度から何度も見せていたものだった。\n"},{"file":"15-why-model-the-field.md","title":"Chapter 15: なぜ現場をモデルにするのか","markdown":"# Chapter 15: なぜ現場をモデルにするのか\n\n翌週の会議は、前より静かに始まった。\n\n机の上には、同じ案件の紙がまた積まれていた。弱く戻した投資家資料。赤、黄、青の印がついた開示メモ。九十日のWAIT条件。企業の予算者へつなぐためのメール。公募の要領。外部経営候補との面談記録。研究者が守りたい線を書いた紙。\n\nどれも、別々の会議では一度ずつ整理したはずだった。\n\nそれでも会議は、また混ざった。\n\n公募の面接日が近づいていた。支援部署は、面接で「会社化の見通し」を聞かれるだろうと言った。企業の探索担当からは、装置化の可能性をもう少し詳しく知りたいという返事が来ていた。病院の医師は協力的だったが、技師の作業負荷と倫理窓口の入口はまだ見えていなかった。研究者は、出願前の図を外へ出さない線をもう一度確認したいと言った。外部経営候補は、投資家に見せるなら地域実証と企業関心をもう少し強く言った方が伝わると言った。\n\n若い事業化人材は、ノートの一行目に「同じ話が戻ってきた」と書いた。\n\n誰も後戻りしたいわけではない。\n\nむしろ、前へ進めたいからこそ、同じものが戻ってくる。\n\n期待が戻る。低い条件が戻る。研究者の傷つきかけた感覚が戻る。資金の締切が戻る。企業の関心が戻る。会社化という便利な言葉が戻る。\n\nそのたびに、現場語だけでは会議が割れた。\n\n「有望です」と言う人がいた。\n\n「まだ危ないです」と言う人がいた。\n\n「会社にしないと資金が取りにくい」と言う人がいた。\n\n「会社にすると、まだ背負えない約束が硬くなる」と言う人がいた。\n\nどれも一部は正しかった。\n\nだから困った。\n\n間違った意見を消せば済む会議ではない。正しい意見が同時にあり、しかも互いに別のものを見ている。研究者は技術と守る線を見ている。支援部署は公募と成果の言葉を見ている。企業は評価条件を見ている。病院は現場負荷を見ている。外部経営候補は投資家に伝わる絵を見ている。若い事業化人材は、その全部を一枚の資料に戻そうとしている。\n\nここで初めて、地図が必要になる。\n\n## 強い一文を、また弱くする\n\n会議の途中で、支援部署の担当者が公募面接用の文章を読み上げた。\n\n「本技術は、地域医療機関との実証と製造企業との装置化検討を進め、会社化に向けた準備が整いつつあります」\n\n文章としては、きれいだった。\n\nしかし研究者は、すぐに首を振った。\n\n「地域医療機関との実証、という言い方はまだ強いです。医師とは相談しています。でも、倫理審査も技師の負荷も、患者説明もまだです」\n\n企業面談を担当していた人も、少し遅れて言った。\n\n「製造企業との装置化検討、も強いかもしれません。探索担当は前向きですが、予算を持つ部門にはまだ行けていません」\n\n外部経営候補は、腕を組んだ。\n\n「でも、面接では弱く見えませんか」\n\n若い事業化人材は、そこで前の投資家面談を思い出した。強く見せた資料は、面談の入口では便利だった。だが、予算者、開示、経営機能、研究者の守る線を突かれた瞬間に、便利さは信頼の薄さに変わった。\n\n彼は文章を消して、こう書き直した。\n\n「地域医療機関に近い相談先があり、製造企業の探索担当も関心を示している。ただし、医療現場の負荷、倫理入口、企業側の評価者と予算者は未確認である。公募では、この未確認を下げるための実証条件を設計する」\n\n弱くなった。\n\nけれど、会議は少し落ち着いた。\n\n弱い文は、逃げではない。弱い文は、まだ言えないものを守り、次に確かめるものを見えるようにする。\n\nその文を見て、若い事業化人材は、やっと地図を置いてもよい気がした。強い言葉を作るためではない。弱いまま前へ進むための地図だった。\n\n## 現場語は必要だが、足りなくなる\n\nBefore Zero の現場には、よく使われる言葉がある。\n\n有望。準備できている。顧客がいる。会社化できそう。支援がある。CEO候補がいる。地域で実証できる。追い風が来ている。\n\nどれも、会議を進めるには便利である。\n\nだが、この案件では、便利な言葉ほど危なかった。\n\n「有望」は、技術の強さ、公募の近さ、企業の関心、病院の近さ、人材の存在を一つにまとめてしまった。\n\n「顧客がいる」は、探索担当の好反応を予算者の痛みのように見せた。\n\n「病院連携」は、協力的な医師の存在を、現場実証の合意のように聞こえさせた。\n\n「外部CEO候補」は、経歴の強さを、研究者の守る線を預けられる信頼のように見せた。\n\n「支援がある」は、支援メニューの数を、責任が流れる土壌のように見せた。\n\n現場語は、最初の会話には必要である。専門家でない人同士が、同じ案件を囲むには、ざっくりした言葉がいる。\n\nしかし、会社化判断の直前では、そのざっくりさが事故になる。\n\n若い事業化人材は、会議メモの余白に短く書いた。\n\n「期待を消さない。期待の種類を分ける」\n\n「低い条件を責めない。低さの種類を分ける」\n\n「人を裁かない。誰が何を持つかを分ける」\n\n「資金を急がせない。何の不確実性を下げるかを分ける」\n\nそれは表ではなかった。\n\n手元の小さなメモだった。\n\nだが、そのメモがあると、会議の言葉は変わった。\n\n「この案件は有望ですか」ではなく、「何が高く、何がまだ低いですか」と聞ける。\n\n「会社化できますか」ではなく、「会社になる前に、どの低さを下げないと生存確率が落ちますか」と聞ける。\n\n「小さく稼げますか」ではなく、「小さな対価が、顧客の痛み、予算経路、継続利用の可能性を明らかにしますか。それとも、将来の可能性を狭める便利な仕事に流れますか」と聞ける。\n\n「外部CEOを入れますか」ではなく、「研究者から委ねてはいけない中心と、外から補える実務は何ですか」と聞ける。\n\n理論は、この問いのためにある。\n\n## BZMは、現場を置き換えない\n\nこの時点で、会議に初めて BZM という名前が置かれた。\n\nBZMは、会社化前の混乱を一つの点数へ押し込むための名前ではない。研究者の沈黙、強すぎた資料、予算者の空白、送信予約の残り十七分、九十日のWAIT、外部経営候補の復唱の失敗、支援メニューが多いのに責任が流れない土壌を、消さずに並べるための地図である。\n\nこの地図がなければ、会議はまた「進めるか、止めるか」に戻る。\n\nでも本当は、進める部分と、止める部分と、弱く言い直す部分と、資金を当てる部分と、人を補う部分が同時にある。\n\n技術は強い。だが現場条件はまだ低い。\n\n企業は関心を示している。だが顧客の痛みと予算者はまだ低い。\n\n公募は近い。だが資金を何の不確実性へ使うかはまだ粗い。\n\n研究者は中心である。だが全部を背負わせると壊れる。\n\n外部経営候補は実務を補える。だが研究者の言葉を守れなければ、かえって壊す。\n\n研究機関には支援がある。だが責任の流れはまだ薄い。\n\nBZMは、この「同時にある」を見えるようにする。\n\nだから、その名前は最初から置かれなかった。\n\n送信予約を止め、短期受託を断り、九十日WAITを書き、古い一文を投資家に突かれ、支援メニューの前で別の研究者が止まったあとで、ようやく置かれた。\n\n## 地図が決めるのは、次の一手である\n\nその日の会議の結論は、派手ではなかった。\n\n会社化GOではない。\n\n全停止でもない。\n\n公募には出す。ただし、会社化の証明としてではなく、医療現場の負荷、企業の評価条件、開示順序を下げる実証計画として出す。\n\n企業には会う。ただし、装置化の期待を強めるためではなく、誰が評価し、誰が予算を持ち、何が導入判断に近づくかを聞く。\n\n病院には相談する。ただし、実証合意としてではなく、医師、技師、倫理窓口、患者説明の不安を分ける。\n\n外部経営候補とはもう一度会う。ただし、経歴を見るためではなく、研究者の守る線をその人の言葉で復唱できるかを見る。\n\n若い事業化人材は、自分のメモの最後にこう書いた。\n\n「地図は、結論を立派にするためではない。次に下げる不確実性を間違えないためにある」\n\nその日、BZMはようやく入口に立った。\n\nだが、地図を置いただけでは、まだ会議は動かない。\n\nそのメモのすぐ下に、支援部署の担当者が別の言葉を書き足した。\n\n「では、この案件は準備できていると言ってよいのか」\n\n同じ会議で、全員が別々の準備を見ていた。\n"},{"file":"16-readiness-axes-field-guide.md","title":"Chapter 16: 「準備できている」を五つに分ける","markdown":"# Chapter 16: 「準備できている」を五つに分ける\n\n「では、準備はできていると言っていいんですね」\n\n支援部署の担当者がそう聞いた。\n\n若い事業化人材は、返事をしようとして止まった。\n\nその一文は、公募面接の冒頭に置かれる予定だった。\n\n「本シーズは、技術、事業、制度、社会実装体制の準備が進んでいます」\n\n悪い文ではない。\n\n研究者の技術は強くなっていた。製造企業の探索担当は関心を持っていた。病院の医師は臨床上の意味を感じていた。産学連携担当者は出願と開示の順番を見始めていた。外部経営候補も、研究者の線を強めずに言い直せるようになってきた。\n\nそれでも、研究者はその文を見て黙った。\n\n「準備が進んでいます、というと、何の準備の話ですか」\n\nその問いで、会議室は止まった。\n\n同じ案件について話しているのに、全員が別の準備を見ていた。\n\n## 一文目は、研究者に戻された\n\n研究者は、実験データのページを開いた。\n\n「技術としては、前よりかなり見えています。ただ、病院の実検体で同じように動くかは、まだ言い切れません」\n\n若い事業化人材は、冒頭文の横に小さく書いた。\n\n「技術は進んでいる。ただし、実環境での再現は未確認」\n\nそれだけで、文は少し弱くなった。\n\nだが、弱くなったことで、研究者はうなずいた。\n\nこの弱さは、技術の価値を下げるものではない。研究室で見えている強さと、病院条件でまだ見えていないものを分けるための弱さだった。\n\n技術の準備度は高くなっている。\n\nしかし、それだけで会社の準備が整ったとは言えない。\n\n## 二文目は、企業に戻された\n\n製造企業の探索担当は、装置化の可能性を面白がっていた。\n\nただ、その人は予算を持っていなかった。評価条件も、事業部の年度計画も、導入後の責任者もまだ見えていなかった。\n\n若い事業化人材は、次の文を消した。\n\n「製造企業が関心を示している」\n\nそして書き直した。\n\n「探索担当は関心を示している。評価者、予算者、導入責任者は未確認」\n\n文はまた弱くなった。\n\n企業側にも、その方が正直だった。\n\nまだ評価条件がないのに顧客のように書かれたら、企業もあとで困る。探索担当の関心は入口であって、購入や導入の約束ではない。\n\n事業の準備は、褒め言葉では上がらない。\n\n誰が困っているのか。何が既存手段では足りないのか。誰が評価し、誰が予算を持ち、どの条件なら次へ進むのか。そこが見え始めて、初めて動く。\n\n## 三文目は、大学に戻された\n\n産学連携担当者は、資料の図に指を置いた。\n\n「この図は、まだ出せません。一般説明はできます。でも、このデータは出願前です。共同研究先の確認も必要です。病院の名前も、正式な同意前には出さない方がいい」\n\n会議の熱は下がった。\n\nしかし、この熱の下がり方は必要だった。\n\n制度やガバナンスの準備は、後で見る事務ではない。\n\n資料は出せる。企業面談は増やせる。投資家にも見せられる。公募にも書ける。\n\nだが、順番を間違えれば、あとで戻れなくなる。\n\n研究者がまだ出したくない図が外へ出る。共同研究先との信頼が揺れる。病院が正式合意前に実証先のように見える。投資家向け資料で、言い過ぎた用途が残る。\n\n産学連携担当者は、スピードを殺しているのではない。\n\n事故が起きたあと、研究者だけが傷つかないように順番を置いている。\n\n## 四文目は、病院に戻された\n\n病院側の医師は、協力的だった。\n\n「医療上の意味はあります。ただ、現場の人に聞かないと分からないことがあります」\n\nその後、臨床検査の現場から短いコメントが返ってきた。\n\n「検査手順が五分増えるなら、夜間では回りません」\n\nこの一言で、病院連携という強い言葉は弱くなった。\n\n医師が前向き。\n\n地域医療の課題に合う。\n\n病院に近い。\n\nそれだけでは、使われる準備にはならない。\n\n実際に手を動かす人が受け止められるか。患者説明で不安が増えないか。倫理窓口が何を確認するか。結果が曖昧だったとき、誰が説明するか。\n\n若い事業化人材は、病院メモの下にこう書いた。\n\n「医師が前向き、は入口。技師、倫理、患者説明は別の準備」\n\n## 五文目は、若い事業化人材自身に戻った\n\n最後に、若い事業化人材は自分の名前が入ったメモを見た。\n\n研究者はいる。産学連携担当者もいる。支援部署もいる。企業探索担当もいる。病院の医師もいる。外部経営候補も紹介されている。\n\n人はいる。\n\nそれでも、会議の最後には空白が残った。\n\n誰が毎週、この案件の低い条件を見続けるのか。\n\n誰が企業の「面白い」を予算者の問いへ戻すのか。\n\n誰が病院の不安を技術条件へ翻訳するのか。\n\n誰が外部経営候補と研究者のすれ違いを早めに見つけるのか。\n\n誰が公募の言葉を、会社化の圧力ではなく不確実性を下げる計画へ変えるのか。\n\n人がいることと、機能があることは違う。\n\nこの違いを見ないまま会社を作ると、肩書きだけが先に決まり、仕事はまた研究者へ戻る。\n\n## その一文は、五回書き直された\n\n公募面接の冒頭文は、結局こうなった。\n\n「本シーズは、研究室内の技術検証が進んでいる。一方で、病院条件での再現、企業の評価者・予算者、開示順序、現場負荷、会社化前の統合判断には未確認が残る。本申請では、その未確認を九十日で下げる」\n\n最初の文より、弱い。\n\nしかし、弱くしたことで、次の一手は見えた。\n\n研究者は、病院条件で何を再現するかを決める。\n\n若い事業化人材は、企業の評価者と予算者へつなぐ。\n\n産学連携担当者は、企業向け、病院向け、公募向けの資料で、話してよい範囲を分ける。\n\n病院側には、医師だけでなく技師と倫理窓口の不安を聞く。\n\n外部経営候補とは、投資家資料ではなく、研究者の守る線をどう扱うかから話す。\n\nこの五つを、TRL、BRL、GRL、SRL、HRL と呼ぶ。\n\n略語を覚えるためではない。\n\n若い事業化人材は、五つの名前の下に、それぞれ次の会議で聞く相手を書き足した。\n\n「準備できている」という一語を、何度でも割るためである。\n\n## まだ同じ速さでは動いていない\n\n会議の最後、支援部署の担当者が言った。\n\n「分けるのは分かりました。でも、公募の締切は動きません」\n\nその通りだった。\n\n準備を五つに割っても、外の時計は待ってくれない。公募は六週間後である。企業の評価会議は来月である。病院の倫理窓口はもっと時間がかかる。研究者の出願と論文には別の順番がある。自治体は地域課題として早く語りたい。\n\n準備度を分けても、追い風の位相差は残る。\n\n五つに割った準備度は、会議を少しだけ正直にした。\n\nそれでも、外の締切は止まらない。\n\n政策、研究、産業、社会は同じ速度で動かない。そのずれを読まなければ、五つに割った準備度も、また一つの「タイミングが来た」に飲まれてしまう。\n\n## Model Note: 五つの準備度\n\nこの章で分けた五つの準備は、補遺では TRL、BRL、GRL、SRL、HRL と呼ぶ。\n\nTRLは技術、BRLは事業と顧客、GRLは規制・知財・開示、SRLは使われる現場と社会受容、HRLは人と組織の準備を見る。どれか一つが高いことより、次の判断を壊しうる低い軸がどこにあるかを見る。\n\nこのModel Noteは、本文を読むために必須ではない。必要になったときだけ、巻末の `Method Appendix M3 — 五つの準備度` を開けばよい。\n"},{"file":"17-macro-alignment-and-triple-helix.md","title":"Chapter 17: 追い風の位相差を読む","markdown":"# Chapter 17: 追い風の位相差を読む\n\n公募事務局からのメールは、朝八時十二分に届いた。\n\n「地域医療課題の解決に資する実証テーマを募集します。産学官連携による社会実装の見通しを重視します」\n\n若い事業化人材は、その文を見てすぐに会議へ転送しそうになった。\n\nこの案件に合っている。医療に近い検査技術。地域の病院。製造企業。大学の産学連携窓口。自治体の実証担当。これまで何度も出てきた言葉が、公募の文章にも並んでいる。\n\nしかし、彼は送信ボタンを押す前に止まった。\n\n会議室の机には、「準備できています」という一文を五回書き直した紙が、まだ裏返しで置かれていた。\n\n公募のメールは、その低さを消さない。\n\nそれでも、会議室に届けば、追い風として読まれる。\n\n追い風は、悪いものではない。\n\nだが、同じ速さで吹いているとは限らない。\n\n## メールは同じ週に来るが、時計は同じではない\n\nその週、案件には四つの連絡が来た。\n\n公募事務局からは、地域医療実証の案内が来た。締切は六週間後。自治体の担当者は、地域課題として説明しやすいテーマだと言った。\n\n研究者からは、出願前データの扱いについて確認が来た。論文投稿の予定もあり、外へ出す図を急いで決めたくない。\n\n病院の医師からは、前向きな返信が来た。ただし、技師の作業負荷を確認しないと、実証とは言えないと書いてあった。\n\n製造企業の探索担当からは、装置化に関心があるという返事が来た。ただし、来期の評価枠に入るには事業部の困りごとと評価指標が必要だとも書いてあった。\n\n自治体、研究者、病院、企業。\n\n全員が動いている。\n\nでも、同じ速度ではない。\n\n自治体と政策の時計は、公募の締切で動いている。研究者の時計は、出願と論文で動いている。病院の時計は、倫理と現場負荷で動いている。企業の時計は、評価予算と年度計画で動いている。\n\n一週間の中に、四つの速度が重なっていた。\n\n## ホワイトボードの通路\n\n若い事業化人材は、ホワイトボードに地域の通路を描いた。\n\n大学から病院へ。病院から技師と倫理窓口へ。大学から製造企業へ。製造企業から評価部門と事業部へ。大学から自治体へ。自治体から公募事務局へ。公募から実証費へ。実証費から会社化判断へ。\n\n線は描けた。\n\nしかし、どの線にも小さな止まりがあった。\n\n病院の線には、現場負荷。\n\n企業の線には、予算者。\n\n自治体の線には、政策目的と個別技術のずれ。\n\n研究者の線には、出願前の開示。\n\n若い人材の線には、誰の代理で動くのかという権限。\n\n近くに資源があることと、通路が通っていることは違う。\n\n地域に病院がある。自治体の実証枠がある。企業が近くにいる。大学に支援窓口がある。\n\nそれだけでは、会社化前の通路はできない。\n\nどの順番でつながり、どこで止まるかを見る必要がある。\n\n## 追い風は、同じ方向に見える\n\n会議では、三つの波が同じ方向に見えた。\n\n研究の波は強い。研究者の技術は進んでいる。専門家評価もある。学会での反応もある。\n\n政策の波も来ている。地域医療、検査効率化、産学官連携、実証、スタートアップ支援。公募の言葉は、案件に合っているように見える。\n\n産業の波も入口にはいる。製造企業の探索担当は前向きである。装置化の可能性もある。\n\nこの三つだけを見ると、会議はGOへ傾く。\n\nだが、ホワイトボードの止まりを見ると、同じ方向に見えた波の位相はずれていた。\n\n研究は強いが、病院条件での再現はまだ浅い。\n\n政策は近いが、公募の締切は研究者の出願順序を待ってくれない。\n\n企業は関心を持っているが、予算者と評価条件はまだ奥にある。\n\n社会受容は、医師の前向きさの奥で、技師と患者説明の不安として残っている。\n\nこのずれを sigma_SU と呼ぶことができる。学、産、官、社会の波が、会社化前の通路でどれだけ噛み合っているかを見る言葉である。\n\n若い事業化人材は、その名前をホワイトボードの端に小さく書き、すぐ下に「8:12のメール」と書いた。\n\nただし、先に見えるのは名前ではない。\n\n朝八時十二分のメールと、ホワイトボードの小さな止まりである。\n\n## 公募はGOの理由にも、WAITの理由にもなる\n\n会議では、公募をどう扱うかで意見が割れた。\n\n「この公募は出した方がいいです。地域実証の入口になります」\n\n支援部署の担当者が言った。\n\n「ただ、面接で会社化の見通しを聞かれたら、強く言わないと通らないのでは」\n\n外部経営候補もうなずいた。\n\n「産学官で実証します、と言えた方が伝わります」\n\n研究者は、少し顔を伏せた。\n\n若い事業化人材は、あの送信予約の画面を思い出した。資料を外へ出す直前、強く見える言葉が研究者の守る線を越えかけた。今回も同じだった。公募に合わせて言葉を強くすると、まだ合っていない波を、合っているように見せてしまう。\n\n彼は、公募の扱いを一文に落とした。\n\n「公募は会社化の証明ではなく、位相差を縮めるために使う」\n\nそれなら、資金の使い道は変わる。\n\n公募で病院を巻き込むなら、医師の協力を実証合意として書くのではなく、技師の作業負荷、倫理入口、患者説明の不安を確認する費用として置く。\n\n製造企業と進めるなら、装置化の期待を書くのではなく、評価者、予算者、導入責任者を特定するための検証条件として置く。\n\n自治体と話すなら、地域課題の大義を会社化の根拠にするのではなく、誰が負担し、誰が説明し、誰が継続して使うのかを聞く。\n\n研究者のデータを使うなら、出願前の図を強く出すのではなく、公開済み情報でどこまで仮説を説明できるかを決める。\n\n公募はGOの理由にもなる。\n\nだが、WAITをよりよい仕事にする理由にもなる。\n\n追い風があるから進むのではない。追い風を使って、どのずれを縮めるかを決める。\n\n## 社会の波を最後にしない\n\n地域の通路を描くと、社会受容の遅れが見えた。\n\n自治体は地域課題として語れる。\n\n医師は臨床上の意味を感じている。\n\n企業は装置化の可能性を見る。\n\n研究者は技術を守りたい。\n\nそれでも、使う人の声はまだ薄かった。\n\n検査時間が五分増えるなら、夜間の現場では回らないかもしれない。検査が増えることを、患者は安心として受け取るのか、不安として受け取るのか。結果が曖昧だった場合、誰が説明するのか。偽陽性や偽陰性の責任を、どの場で扱うのか。\n\n社会の波は、広報の言葉では読めない。\n\n現場で手を動かす人と、結果を受け取る人の不安で読む。\n\n若い事業化人材は、病院側への次回メールにこう書いた。\n\n「医師の先生に追加で伺いたいことがあります。技師の方が気にする手順、患者説明で先に確認すべき不安、倫理窓口で止まりやすい点を、実証計画の前に分けて聞かせてください」\n\nそのメールは、派手な前進ではない。\n\nだが、波のずれを縮める仕事は、派手とは限らない。\n\n合っていない波を、合っていないまま見つけることから始まる。\n\n## 位相差を読むと、資金の意味が変わる\n\n会議の最後、公募の使い方はこう決まった。\n\n会社化を急がせる資金としては使わない。\n\n病院の現場負荷、企業の評価条件、開示順序、社会受容の不安を下げる資金として使う。\n\n公募資料には、産学官がそろったと書きすぎない。\n\n代わりに、研究の強さ、政策の機会、産業側の入口、社会受容の未確認を分けて書く。\n\n弱い資料になるかもしれない。\n\nしかし、弱さを隠して採択されるよりも、弱さを下げる計画として採択された方が、この案件は生き残りやすい。\n\n生存確率を上げるとは、強く見える資金を取ることだけではない。\n\n資金を使って、次に壊れそうなずれを小さくすることである。\n\n地域の通路は、一本のきれいな道ではなかった。病院、企業、自治体、研究者、産学連携担当者、若い事業化人材の時計が、少しずつずれている通路だった。\n\nそのずれを読めるようになると、残る問いはまた人へ戻る。\n\n誰がこの通路を持つのか。\n\n研究者本人か。外部経営候補か。若い事業化人材か。研究機関か。\n\nただし、今度は人格評価では足りない。\n\n守る線の復唱、最初の九十日、誰が何を持つか。\n\n人の話は、配置の話として戻ってきた。\n"},{"file":"18-founder-readiness-field-first.md","title":"Chapter 18: 創業者機能を、人格評価にしない","markdown":"# Chapter 18: 創業者機能を、人格評価にしない\n\n外部経営候補は一度、企業の支払い拒否を強い言葉へ直しかけた。\n\nそれは悪意ではなかった。\n\n「来期予算化に向けた企業連携が進行中」と言えば、投資家向けには読みやすい。支援者にも安心感が出る。候補者自身も、前へ進む人材として見えやすい。\n\nだが、その言葉は研究者の守る線を少し越えていた。\n\n言い直したあと、候補者は「企業探索担当は関心を持っている。ただし、今年度の評価費は出ない。来期枠へ進むには、予算者が判断できる条件を作る必要がある」と言った。\n\n同じ面談をもう一度採点するためではない。\n\nあの言い直しを、次の九十日にどう移すかを見るためだった。\n\n外部CEOを入れるかどうか。研究者がCEOに向いているかどうか。若い事業化人材がどこまで持てるか。\n\nこうした問いは、すぐ人格評価に変わる。\n\n研究者は経営に向いていない。外部人材は経験がある。若い人材はまだ弱い。大学は遅い。\n\nどれも一部は事実かもしれない。\n\nだが、会社化前に本当に見るべきなのは、誰が偉いかではない。\n\n誰に何を背負わせると壊れるかである。\n\n## 九十日メモは、役職案ではなかった\n\nその九十日メモを、若い事業化人材はもう一度開いた。\n\nそこには、役職名ではなく、壊れやすいものだけが書かれていた。\n\n研究者は、技術の意味と守る線を持つ。ただし、企業交渉、資金、採用、管理を全部背負わない。\n\n外部経営候補は、企業の検証条件と予算者への道を持つ。ただし、研究者の承認なしに病院実証や顧客合意を言わない。\n\n若い事業化人材は、記録と翻訳と戻る条件を持つ。ただし、知財判断や資本政策を持ったふりはしない。\n\n研究機関は、開示と制度の順番、責任導線を持つ。ただし、支援メニューの数で安心しない。\n\nこの紙を見ると、会議の言葉が少し変わった。\n\n「候補者は強いですか」ではなく、「候補者に何を持たせると危ないですか」と聞ける。\n\n「研究者は代表に向いていますか」ではなく、「研究者から切り離してはいけない中心は何ですか」と聞ける。\n\n「若い人材に任せられますか」ではなく、「何なら持てて、何は持ってはいけませんか」と聞ける。\n\n## 補える実務と、委ねられない中心\n\n外部経営候補の経歴は強かった。\n\n資金調達、企業交渉、採用、事業開発。会社化後に必要になりそうな実務を、候補者はかなり持っていた。\n\n一方で、強い言葉へ寄せる癖もあった。\n\nそれは欠点というより、経験から身についた武器だった。投資家の前では、弱い事実をそのまま出すと話が止まることがある。支援制度の面接では、可能性を言い切らないと選ばれにくいことがある。企業との会話でも、弱い関心を次の接点へ育てるには、前向きな言葉が必要なことがある。\n\nだから、強い言葉を使う人を悪者にしない。\n\n見るべきなのは、その武器を、研究者の中心を傷つけない位置へ戻せるかである。\n\n補える実務はある。\n\n資金調達、企業交渉、採用、契約、管理、資本政策、事業開発。これらは外から補える。経験者が持てる。若い人材が学んで持てる。研究機関や支援者が一時的に支えられる。\n\n一方で、委ねにくい中心がある。\n\n研究の意味を守れるか。まだ分からないことを、分からないと言えるか。強い物語に押されても、言ってはいけない線を守れるか。悪い知らせを隠さず、研究者、企業、病院、投資家へ戻せるか。\n\nこの中心は、肩書きだけでは移せない。\n\n候補者が資金調達に強くても、研究者の守る線を強く言い換えるなら、会社化前の創業者機能は上がらない。\n\n研究者が真正性を持っていても、資金、顧客、採用、契約を全部背負わされるなら、機能は上がらない。\n\n若い事業化人材が丁寧に翻訳できても、弱い事実を戻す権限がなければ、機能は不安定なままである。\n\n## 配置を変えると、判断が変わる\n\n人格評価で見ると、会議はすぐ荒くなる。\n\n研究者に経営経験がない。候補者は言葉が強い。若い人材は未熟。大学は遅い。\n\nしかし、配置設計として見ると、同じ事実の意味が変わる。\n\n研究者に経営経験がないなら、実務を補う。\n\n候補者の言葉が強いなら、弱い事実を戻す条件を置く。\n\n若い人材が未熟なら、持てる範囲と持ってはいけない範囲を切る。\n\n大学が慎重なら、開示と制度の順番を早く見える場所へ出す。\n\n人格評価をやめると、会議は少しやさしくなる。\n\nだが、判断は甘くならない。\n\nむしろ、誰が何を持っていないかがはっきりする。研究者を中心に残すだけでは足りない。外部人材を入れるだけでも足りない。若い人材を動かすだけでも足りない。研究機関の土壌がなければ、責任はまた流れてしまう。\n\n## 名前は、配置を忘れないために置く\n\nこの見方を、FRLと呼ぶ。\n\n創業者機能の準備度である。\n\nただし、人を点数化するための言葉ではない。研究者、外部経営候補、若い事業化人材、研究機関のあいだに、会社化前の機能をどう配置するかを忘れないための言葉である。\n\nその中には、委ねにくい中心がある。研究の意味、守る線、透明性、悪い知らせを隠さない態度。\n\nそこには、補える実務もある。資金調達、企業交渉、採用、契約、管理、事業開発。\n\n前者を F_character、後者を F_capability と呼ぶことができる。\n\n若い事業化人材は、その二つの名前を九十日メモの右下に小さく書いた。\n\nだが、名前は最後でよい。\n\n先に見るべきなのは、九十日メモである。\n\n誰が何を持つと進むのか。\n\n誰に何を背負わせると壊れるのか。\n\nこの配置が見えないままGOへ進むと、強い肩書きの下に低い条件が隠れる。\n\n配置が見えれば、WAITは放置ではなくなる。外部人材の参加は置き換えではなくなる。若い人材の記録は雑務ではなくなる。研究機関の慎重さは遅さではなく、壊れやすい順番を守る働きになる。\n\nこれで、案件の輪郭はかなり見えてきた。\n\n技術は高い。追い風もある。人の補完設計も見えてきた。それでも、顧客条件、開示、社会受容、責任導線には低さが残る。\n\n若い事業化人材は、九十日メモの最後に、まだ空いている欄を丸で囲んだ。\n\n顧客条件。\n\n開示。\n\n社会受容。\n\n責任導線。\n\n次の一手は、いちばん低い欄から決まる。\n"},{"file":"19-integrated-score-as-next-action.md","title":"Chapter 19: 統合地図は、次の一手を変えるために使う","markdown":"# Chapter 19: 統合地図は、次の一手を変えるために使う\n\n支援制度の面接日は、二週間後に迫っていた。\n\n会議室には、少しだけ久しぶりの明るさが戻っていた。研究成果は強い。公募の言葉とも合う。企業の探索担当は前向きで、病院側にも入口がある。外部経営候補は研究者の言葉を強めすぎないようになり始めた。若い事業化人材も、最初に強くしすぎたdeck sentenceを、もう一度弱く言い直せるようになっていた。\n\n誰かが言った。\n\n「ここまで見えているなら、面接では会社化へ進む方向で話してよいのではないですか」\n\nその場にいた人たちは、うなずきかけた。\n\n期待は高い。ここで弱く見せすぎれば、支援制度の面接で勢いを失うかもしれない。企業側の熱も冷めるかもしれない。外部経営候補も、いつまでも肩書きのない関係に付き合ってくれるとは限らない。\n\nけれど、研究者はまだ黙っていた。\n\n若い事業化人材は、九十日メモの横に置いていた一枚の地図を開いた。そこには点数はなかった。順位もなかった。あるのは、次に下げないと危ない低さだけだった。\n\n研究室内の技術は強い。だが、病院条件での再現はまだ浅い。\n\n企業の関心はある。だが、予算者と来期評価枠はまだ薄い。\n\n開示線は引いた。だが、誰がどの相手に何を言わないかまでは、まだ場面ごとに決まっていない。\n\n外部経営候補は前より信頼できる。だが、研究者の守る線を毎週の実務で守れるかは、まだ見ていない。\n\n地図は、会議の空気を少し冷ました。\n\nただし、それは挑戦を冷ますためではなかった。会社が生き延びるために、次の九十日をどこへ向けるかを決めるためだった。\n\n## 点数ではなく、生存会話に戻す\n\n統合地図の根にある問いは、派手な期待ではない。\n\nこの案件は、会社になったあと生き延びられるのか。\n\n生存確率という言葉は、ときどき冷たく聞こえる。研究者の情熱を数字にするようにも見える。だが、ここで見ているのは情熱の大きさではない。会社化した瞬間から、誰が費用を持ち、誰が使い、誰が評価し、誰が継続判断をし、誰が悪い知らせを受け止めるのかという、きわめて現実的な問いである。\n\n特に大事なのは、稼げる体質が育つ見込みだった。\n\nいま大きな売上があるかどうかではない。小さな受託を積めばよいという話でもない。将来の大きな市場を語れるかどうかだけでもない。小さな対価や相手の実務時間が、顧客の痛み、予算経路、評価条件、継続利用の可能性を明らかにするかどうかを見る。\n\n会議では、二つの有償案が並んだ。\n\n一つ目は、企業の評価部署が、来期の小さな検証費で実環境に近い条件を一緒に測る案だった。金額は大きくない。だが、その検証には予算者、評価者、現場担当が入る。成功しても失敗しても、次に何を満たせば進むかが分かる。\n\n二つ目は、研究成果の中核とは少し離れた周辺分析を、短期の受託として受ける案だった。こちらはすぐに対価が出る。だが、研究者の時間を食い、病院条件も企業の導入条件も見えない。小さな安心は得られるが、会社の未来を狭めるかもしれない。\n\nその横に、若い事業化人材は有償にならなかった返事も置いた。\n\n今年度は払えない。ただし、来期枠へ進むには、既存工程で何分の作業が減るか、評価者だけでなく予算者が納得できる形で示す必要がある。\n\nそれは売上ではない。\n\nだが、生存確率を上げる情報だった。払われなかった理由が、次の検証設計を具体化していたからである。\n\n小さく稼ぐことそのものが善ではない。\n\n一方で、稼げる入口がまったく見えないまま、すべてをJカーブやIPOの物語へ押し込むことにも危うさがある。大きな資本を早く入れるべきシーズはある。だが、すべての研究成果が同じ曲線を描けるわけではない。描けないものまで同じ物語に乗せると、会社化は挑戦ではなく、早すぎる固定になる。\n\n投資家経験のある支援者は、そこで反対した。\n\n「でも、弱く出しすぎると、本当に大きく伸びる案件まで小さく畳むことになります。Jカーブを描ける可能性を、こちらが先に潰してしまうのも危険です」\n\nその反論で、会議は少し緊張した。\n\n小さな対価を重視する言葉は、ときどき守りの言葉に聞こえる。大きな市場へ挑む怖さから、目の前の小さな仕事へ逃げているようにも見える。この支援者は、派手な物語を好んでいるだけではなかった。研究成果の大きさを、小さな受託で削りたくなかった。\n\n若い事業化人材は、すぐには返さなかった。\n\n「その可能性は残したいです。ただ、今月の時間を市場規模スライドではなく、予算者条件へ使うという話です。大きな挑戦をやめるのではなく、大きく挑む前に、何で生き延びるかを一段だけ見に行きたいです」\n\n統合地図は、この二つの危険を同時に見るためにある。\n\n大きな挑戦を小さな仕事へ閉じ込めないこと。\n\n稼げる入口のない会社化を、熱量だけで進めないこと。\n\nその間で、次に下げる不確実性を選ぶ。\n\n## RESOURCE_SHIFTという引き算\n\n最初の結論は、GOに近かった。\n\n面接では会社化の方向を強く出す。投資家紹介を増やす。外部経営候補には肩書きの相談を始める。市場規模のスライドを磨く。企業と病院の名前を、可能な範囲で資料に入れる。\n\nどれも、前に進んでいるように見える活動だった。\n\nけれど、統合地図を見たあと、その結論は変わった。\n\nGOではない。WAITだけでもない。NO_GOでもない。\n\nRESOURCE_SHIFTだった。\n\n資源を、見栄えのよい活動から、低い条件を下げる活動へ移す。\n\n若い事業化人材は、A4の紙を横向きに置いた。上には、大きくこう書いた。\n\n「RESOURCE_SHIFTメモ。見直し日、九十日後の月曜」\n\nその下には、きれいな文章ではなく、消し込み線の残る短い行が並んだ。\n\n「投資家紹介、今月二件減らす。曇る人は、紹介を準備していた支援者。戻る資源は、面談準備三時間と研究者説明一回分。下げる不確実性は、企業の評価条件と予算経路」\n\n「市場規模スライドの磨き込み、半分にする。曇る人は、面接の勢いを気にする外部経営候補。戻る資源は、資料作業二晩分。下げる不確実性は、病院側の技師負荷と倫理窓口」\n\n「肩書き打診の面談、延期する。曇る人は、早く役割を固めたい外部経営候補。戻る資源は、候補者面談一回分。下げる不確実性は、研究者の守る線を強めずに運べるか」\n\n「短期受託、今月は受けない。曇る人は、来月の実験費を心配する研究者。戻る資源は、研究者の週二日。下げる不確実性は、実環境で何が評価条件になるか」\n\n最後の行だけ、少し字が大きかった。\n\n「九十日後に戻す。戻せなければ、切った活動はただの我慢になる」\n\nその紙が置かれると、会議は抽象的な賛否から離れた。誰が困るかが見えた。どの時間が戻るかが見えた。何を確認できたら、切った活動を戻せるかも見えた。\n\n投資家紹介は二件減らした。市場規模のスライドを磨く時間も半分にした。外部経営候補へ肩書きを打診する面談は延期した。支援制度の面接では、「会社化します」と言い切るのではなく、「会社化前に、この資金で三つの不確実性を下げます」と言うことにした。\n\n増やしたのは、地味な仕事である。\n\n切った活動には、それぞれ相手がいた。\n\n投資家紹介を減らすと、紹介を準備していた支援者の顔が曇った。市場規模スライドを磨く時間を減らすと、外部経営候補は「面接で勢いを失うかもしれない」と言った。短期受託を断ると、研究者は来月の実験費をどう埋めるかを考えなければならなかった。\n\nその曇りは、抵抗ではなかった。\n\n支援者は、紹介のタイミングを逃すことで領域の熱が冷めることを知っていた。外部経営候補は、弱い資料のままでは資金も人も集まりにくいことを知っていた。研究者は、来月の実験費がなくなれば、そもそも検証が止まることを知っていた。\n\nだから、RESOURCE_SHIFTは、正しい人たちの仕事を軽く扱う判断ではない。\n\n正しい仕事同士がぶつかったときに、今月だけ何を下げるかを選ぶ判断である。\n\nRESOURCE_SHIFTは、きれいな整理ではない。\n\n誰かが準備した前進を、いったん止める判断である。\n\n企業には、探索担当、評価者、予算者、導入責任者を分けて聞く。\n\n短期受託は受けない。研究者の週二日を、その仕事に使わない。売上実績として見せられる一行を、今月は捨てる。\n\n病院には、医師の賛同だけでなく、技師の作業負荷、倫理窓口、患者説明の入口を聞く。\n\n資料は、青、黄、赤に分け直す。青は公開済み。黄は相手と目的を絞れば話せる。赤はまだ出さない。\n\n外部経営候補とは、資金調達経験より先に、研究者の守る線をそのまま復唱できるかを見る。\n\n若い事業化人材は、毎週のメモに一行を追加した。\n\n「今月やらないこと: 出願前情報を広げない。投資家面談を増やさない。肩書きだけで外部人材を置かない」\n\nRESOURCE_SHIFTは、足し算ではない。\n\n魅力的な活動を切る判断である。切った分だけ、低い条件へ時間を戻す判断である。\n\n## 面接で強く言わない勇気\n\n支援制度の面接資料も変わった。\n\n以前なら、こう書きたくなっただろう。\n\n「企業候補と病院実証を起点に、会社化へ進む」\n\n今回は、その文を弱くした。\n\n「企業の評価条件、病院側の現場負荷、開示安全性を九十日で確認し、会社化判断の条件を具体化する」\n\n弱い文に見える。\n\nけれど、弱くしたことで、面接官の質問は変わった。\n\n「会社を作る気があるのか」ではなく、「九十日で何が分かれば、次の判断に進めるのか」と聞かれた。\n\n若い事業化人材は、そこで答えた。\n\n企業側では、評価者と予算者が分かれる。病院側では、医師の賛同と技師の負荷が分かれる。開示では、資料分類と話者のルールが分かれる。外部経営候補では、経歴と研究者の信頼が分かれる。\n\nだから九十日は、この分かれ目を確認する時間にする。\n\n面接官は、派手な成長物語を聞きたかったのかもしれない。だが、少なくともこの会議では、支援資金が何の不確実性を下げるかがはっきりした。\n\n統合地図は、責任を代わりに取ってくれない。\n\nそれでも、会議を責任ある言葉へ戻すことはできる。\n\n## 九十日後の地図\n\n九十日後、案件はまだ会社になっていなかった。\n\nだが、止まってもいなかった。\n\n企業では、探索担当の奥に評価者が見え、予算者が来期枠の条件を出した。病院では、医師の協力だけでなく、技師の作業を減らす検証設計が一つ作れた。開示メモは研究者の承認を得て、投資家向けの言葉も弱いまま整った。外部経営候補は、研究者の「まだ言えない」を自分の言葉で強めずに言えるようになった。\n\nまだGOではない。\n\nけれど、三か月前のRESOURCE_SHIFTは、未来のGO候補を作っていた。\n\n会議メモの最後には、こう書かれた。\n\n「高期待だがGOではない、から、条件付きGO候補へ。評価枠、開示安全性、現場負荷、研究者中心の補完設計を満たしたら、設立準備へ進む」\n\n統合地図を順位として読んでいたら、この案件は早く前へ押し出されていたかもしれない。点数として読んでいたら、高い項目だけが目立ったかもしれない。\n\n次の不確実性を下げる地図として読んだから、資源の向きが変わった。\n\nそれでも、この地図が正しかったとは限らない。\n\n企業の条件はまた変わるかもしれない。病院の負荷はもっと重いかもしれない。外部経営候補との信頼も、悪い知らせが出たときに初めて試される。支援制度の資金が、低い条件を下げるのではなく、また会社化の圧力になることもある。\n\n地図は、外れる。\n\n外れた地図を捨てるのか。\n\nそれとも、どの証拠を強く読みすぎたのかを見直すのか。\n\n九十日後の会議室には、その問いが残っていた。\n\n## Model Note: 統合準備度\n\nこの章の統合地図は、補遺では `S = K * product((X_i + 1)^alpha_i)` のように書ける。\n\nただし、ここで大事なのは式の形そのものではない。軸ごとの低さが、次に減らすべき不確実性を見せることである。統合準備度は、案件を順位づけるためではなく、投資家紹介、市場規模スライド、短期受託、予算者確認のどれに時間を戻すかを決めるために使う。\n\n詳しい記号と感度の読み方は、巻末の `Method Appendix M5 — 統合準備度と次の一手` に置いた。\n"},{"file":"20-retrofit-validation-as-learning.md","title":"Chapter 20: 外れた地図を、証拠ルールから直す","markdown":"# Chapter 20: 外れた地図を、証拠ルールから直す\n\n九十日後の会議室は、前より静かだった。\n\n支援制度の面接は通った。資料の開示線も整った。企業には評価者が見え始めた。病院側では、医師だけでなく技師の作業負荷も聞けた。外部経営候補は、研究者の守る線を前より丁寧に聞くようになった。\n\nそれでも、計画どおりには進まなかった。\n\n投資家紹介を二件減らした代わりに見に行った予算者条件は、思ったより細く、支援者は「紹介を止めた時間に見合ったのか」ともう一度たずねた。\n\n企業の評価者は前向きだったが、予算者は「来期の小さな評価枠なら検討できる」と言っただけだった。病院の医師は協力的だったが、技師は「このままでは通常業務の外で持つことになる」と言った。外部経営候補は慎重になったが、投資家向けの短い説明で、また一度だけ言葉を滑らかにしすぎた。\n\n失敗ではない。\n\nけれど、地図は外れた。\n\n机の上には、これまで何度も書き換えた資料が並んでいた。最初の発表資料。弱く戻したdeck sentence。赤、黄、青の開示メモ。WAIT ledger。統合地図。RESOURCE_SHIFTの会議メモ。\n\nどれも、その時点では必要だった。\n\nそれでも、資料の中で強く見えたものが、現場では弱かった。企業関心は予算へ届くまでに時間がかかる。医師の賛同は、技師の負荷や倫理手続きを消さない。経営経験は、研究者の信頼を自動では作らない。\n\nここで捨てるべきなのは、案件ではなかった。\n\n捨てるべきなのは、古い証拠の読み方だった。\n\n## 人を責める前に、証拠ルールを見る\n\n会議の最初、空気は少し犯人探しに傾いた。\n\n企業へもっと早く行くべきだったのか。病院側を楽観視しすぎたのか。外部経営候補を急ぎすぎたのか。支援制度の面接で、会社化前の検証計画を弱く見せすぎたのか。\n\nどれも、考える必要はある。\n\nけれど、人の失敗として閉じると、次の案件ではまた同じことが起きる。\n\n若い事業化人材は、白板に「古いルール」と書いた。\n\nその下に、五つの文を並べた。\n\n「企業が面白いと言えば、事業の準備度は上がる」\n\n「医師が協力的なら、医療現場の受容は近い」\n\n「資料を三色に分ければ、開示は安全になる」\n\n「経営経験者が入れば、創業者機能は上がる」\n\n「資金採択は、進捗の証拠である」\n\nこの文は、どれも完全に間違いではない。だから危ない。\n\n企業関心は大事だ。医師の協力も大事だ。開示資料の整理も、経営経験も、資金採択も大事である。ただし、それだけで次の判断を強くしてよいほど、証拠としては太くない。\n\n古いルールは、現場を少し楽観的に読ませていた。\n\nだから、隣に新しいルールを書いた。\n\n企業関心を見るときは、探索担当、評価者、予算者、導入責任者を分ける。\n\n医療現場を見るときは、医師、技師、倫理窓口、患者説明を分ける。\n\n開示を見るときは、資料の色だけでなく、誰が、どの相手に、どの場で、何を言わないかを決める。\n\n経営人材を見るときは、経歴より先に、研究者の守る線を復唱できるか、悪い知らせを戻せるかを見る。\n\n資金を見るときは、採択されたかどうかではなく、その資金でどの不確実性を下げるかを月ごとに見る。\n\n地図を直すとは、きれいな反省を書くことではない。\n\n次の会議で、同じ証拠を強く読みすぎないようにすることである。\n\n## 過去判断の地図を、上書きしない\n\nこの作業で大事なのは、過去のメモを消さないことだった。\n\n三か月前の会議メモには、「企業評価者の確認を進める」と書いてあった。その時点では、予算者まで見えていなかった。だから今になって、「予算者未確認だったから判断が甘い」とだけ書くのは、あと知恵になる。\n\n若い事業化人材は、古いメモの横に、赤字ではなく灰色の追記を入れた。\n\n「当時確認できていたこと: 探索担当と評価者の入口」\n\n「当時未確認だったこと: 予算者、年度枠、導入責任者」\n\n「今回分かったこと: 来期の小さな評価枠なら検討可能」\n\n「次の証拠ルール: 企業関心は、評価条件と予算経路が見えるまで顧客準備とは呼ばない」\n\n同じように、病院メモにも追記した。\n\n「医師の協力は入口。技師の負荷、倫理窓口、患者説明は別の証拠として扱う」\n\n外部経営候補メモにも追記した。\n\n「研究者の線を一度復唱できても、投資家向けに短くするときに強める危険が残る。週次で悪い知らせを戻す場を見る」\n\nこれは、過去の判断を裁く作業ではない。\n\n過去の判断が、どの証拠ルールの上で成り立っていたかを見えるようにする作業である。\n\n見えるようになれば、次の現場で地図が少しだけ賢くなる。\n\n## 外れた地図は、生存確率を下げたのか\n\n証拠ルールを直すとき、もう一つ見なければならない問いがある。\n\nその誤読は、会社の生存確率をどれだけ下げたのか。\n\n企業関心を強く読みすぎると、会社化後に売れるつもりで採用や開発費を積むかもしれない。病院の協力を強く読みすぎると、現場負荷を抱えたままPoCが始まり、関係が壊れるかもしれない。経営経験者を強く読みすぎると、研究者の中心がずれ、技術の意味が会社の言葉の中で薄くなるかもしれない。\n\n逆に、誤読が分かったことで、生存確率が上がることもある。\n\n予算者がまだ薄いと分かれば、設立前に評価枠を確認できる。技師の負荷が重いと分かれば、検証設計を軽くできる。外部経営候補が言葉を強めがちだと分かれば、肩書きの前に信頼形成を置ける。\n\nretrofitは、過去を責めるためではない。\n\n未来の会社を、少し死ににくくするためにある。\n\n## 現場メモを、次の問いへ変える\n\n会議の最後、若い事業化人材は、最初に書いた生のメモをそのまま共有しなかった。\n\n企業名、担当者名、年度計画の細部、病院側の具体手順、研究者が漏らした不安、外部経営候補への違和感。そうしたものは、次の判断には大切だが、公開したり広く配ったりするものではない。\n\nだから、メモは問いへ変換した。\n\n「誰が面白いと言ったか」ではなく、「その人は評価条件、予算、導入責任のどれを持つか」\n\n「医師は協力的か」ではなく、「医師以外に、誰の作業が増えるか」\n\n「資料は三色に分かれているか」ではなく、「その相手に、その話者が、その場で言ってよいか」\n\n「経営経験者がいるか」ではなく、「研究者の守る線を強めずに運べるか」\n\n「採択されたか」ではなく、「資金でどの低い条件が下がったか」\n\nこの変換をした瞬間、個別の停滞は、次の案件で使える道具になる。\n\n人の名前を出さず、関係を壊さず、それでも同じ誤読を減らす。\n\nそれが、外れた地図を学習に変える最低条件である。\n\n## それでも、研究者へ戻してはいけない\n\n証拠ルールは直った。\n\nだが、個別案件の中でルールを直すだけでは足りない。\n\n若い事業化人材は、学習ログの最後に新しい欄を作った。\n\n「次の案件でも、また空きそうなもの」\n\n企業の予算者へ誰がたどり着くのか。\n\n病院の技師や倫理窓口へ誰が初回相談を作るのか。\n\n外部経営候補との信頼形成を誰が見守るのか。\n\n低い条件を月ごとに誰が見直すのか。\n\nその欄を見て、産学連携担当者が言った。\n\n「これは、次の案件でもまた空きますね」\n\n会議室が静かになった。\n\n外れた地図を直すたびに、研究者と若い事業化人材だけが部屋を回るなら、次のシーズでも同じ孤独が始まる。\n\nその日の最後に、研究機関側だけの打ち合わせが一つ入った。\n"},{"file":"21-institution-readiness-as-nursery.md","title":"Chapter 21: 個別案件と苗床を混ぜない","markdown":"# Chapter 21: 個別案件と苗床を混ぜない\n\n証拠ルールを直した翌週、研究機関側の打ち合わせが開かれた。\n\n議題は、あの医療隣接シーズを会社にするかどうかではなかった。\n\n同じ詰まりを、次の研究者にも背負わせるのか。\n\nその問いだった。\n\n会議室には、産学連携担当者、起業支援の担当者、知財担当者、若い事業化人材、病院連携の窓口、外部人材紹介に関わる人がいた。研究者本人は呼ばれていない。今回は、研究者にもう一度説明させる会議ではなく、研究機関側が自分たちの導線を見る会議だった。\n\n最初の白板には、支援メニューが並んだ。\n\n知財相談。共同研究相談。起業支援。企業マッチング。メンター紹介。外部経営人材。公募支援。病院連携。\n\n数だけ見れば、少なくない。\n\nけれど、前の案件では研究者が孤独になった。開示の順番は毎回その場で確認された。企業の「面白い」は予算者まで届かなかった。病院の医師は協力的でも、技師の負荷は後から出た。外部経営候補との信頼形成は、経歴確認とは別に設計が必要だった。若い事業化人材も、何を持ってよいのかを会議ごとに探していた。\n\nメニューはあった。\n\n導線がなかった。\n\n## 案件の低さと、苗床の低さ\n\n個別案件として見るなら、低い条件はすでに見え
