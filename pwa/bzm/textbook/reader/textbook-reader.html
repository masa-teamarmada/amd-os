ていた。\n\n事業の準備はまだ薄い。社会受容は医師だけでは読めない。制度と開示は場面ごとのルールが足りない。創業者機能は、研究者と外部人材と若い人材の間で組み直す必要がある。\n\nけれど、研究機関側から見ると、同じ低さは別の顔になる。\n\n企業の予算者が見えないのは、この案件の事業準備が低いというだけではない。研究機関の企業接続が、探索担当で止まりやすいということでもある。\n\n病院の技師や倫理窓口が遅れたのは、この案件の社会受容が低いというだけではない。医療PoCの初回相談導線が、まだ標準化されていないということでもある。\n\n外部経営候補との信頼形成が難しかったのは、この案件の創業者機能が低いというだけではない。外部人材を紹介する前に、研究者の守る線を共有する手順がないということでもある。\n\nこの二つを混ぜると、行動がぼやける。\n\n案件が弱いのか。機関の導線が弱いのか。\n\n両方かもしれない。だが、同じ紙に足し算してはいけない。\n\n個別案件の地図は、次に下げる不確実性を見るためにある。苗床の地図は、次の研究者が同じ場所で一人にならないよう、機関側の運用を変えるためにある。\n\n## unknownとnot_startedを分ける\n\n会議で最初に起きたのは、未確認を未整備と決めつける危険だった。\n\n「外部経営人材のリストは、ないんでしたっけ」\n\n若い事業化人材がそう言うと、別の担当者が首をかしげた。\n\n「卒業生ネットワークには何人かいるかもしれません。ただ、誰が見ているか分かりません」\n\n知財担当者は言った。\n\n「開示前レビュー表は、今回の案件で作りました。でも、標準の型としてはまだ置いていません」\n\n病院連携の窓口は、少し困った顔をした。\n\n「倫理の相談入口はあります。ただ、会社化前のPoC相談として誰が最初に受けるかは、まだ確認していません」\n\n白板に、三つの色が置かれた。\n\n青は、確認済み。\n\n黄は、unknown。まだ知らない。二営業日で確認する。\n\n赤は、not_started。まだ始まっていない。九十日の設計に入れる。\n\nこの区別だけで、会議の荒さが減った。\n\n外部経営人材リストはunknownだった。起業支援部門、卒業生ネットワーク、地域企業ネットワークに確認すれば、あるかもしれない。\n\n開示前レビュー表はnot_startedに近かった。今回の案件で作ったものはあるが、次の案件が使える型にはなっていない。\n\n企業予算者への導線はnot_startedだった。探索担当との接点はあるが、評価者、予算者、導入責任者へ進む条件を聞く仕組みがない。\n\n医療PoCの倫理入口はunknownだった。窓口はあるが、会社化前の相談手順として見えていない。\n\n月次の低い条件レビューはnot_startedだった。案件ごとの任意会議に頼っていて、WAITやRESOURCE_SHIFTが戻る場がない。\n\nunknownは、確認する仕事である。\n\nnot_startedは、作る仕事である。\n\nこの二つを混ぜると、機関は自分を不当に弱く見るか、実際の未整備を先送りする。\n\n## 支援メニューではなく、責任pipelineを見る\n\nその日の会議で、支援メニューの数はもう増やさなかった。\n\nかわりに、一つのpipelineを書いた。\n\n研究者が相談する。\n\n知財担当が、発表、論文、出願、企業面談の順番を確認する。\n\n産学連携担当者が、企業の探索担当だけでなく、評価者と予算者へ進む条件を聞く。\n\n病院連携の窓口が、医師、技師、倫理窓口、患者説明の入口を分ける。\n\n起業支援担当者が、外部経営候補に研究者の守る線を事前に共有し、経歴だけで人を置かない。\n\n若い事業化人材が、会議で聞いたことを事実、仮説、解釈、未確認に分け、研究者へ戻す。\n\n月次の場で、個別案件の低い条件と戻る条件を見る。\n\n誰かが言った。\n\n「これは、新しい支援メニューというより、既存メニューの間に責任の通路を引く作業ですね」\n\nその言い方が、会議の空気を変えた。\n\n研究機関を苗床にするとは、すべての研究者に同じ起業支援を浴びせることではない。研究者が毎回、自分でメニューの間をつなぎ直さなくてよいようにすることである。\n\n研究者が一人で「企業には何を話してよいのか」「病院には誰から入ればよいのか」「外部人材には何を委ねてよいのか」を探さなくてよいようにすることだった。\n\n## 機関の準備度を、案件の点に足さない\n\n研究機関側の導線が整えば、個別案件は進みやすくなる。\n\nこれは事実である。\n\nだが、機関の準備度を、個別案件の統合地図にそのまま足してはいけない。\n\n強い研究機関にあるからといって、目の前のシーズの事業条件が高いわけではない。支援メニューが豊富だからといって、企業予算者が見えているわけではない。外部人材ネットワークがあるからといって、研究者の中心を守れる人がいるとは限らない。\n\n逆も同じである。\n\n個別案件が弱いからといって、研究機関全体が弱いとは限らない。未確認の導線を、未整備と決めつけてもいけない。\n\nだから、二つの地図を分ける。\n\n案件の地図では、このシーズの低い条件を見る。\n\n苗床の地図では、次のシーズが同じ低さで孤独にならないための機関行動を見る。\n\nこの分離があると、会議は落ち着く。\n\n「この案件はまだGOではない」と言いながら、「機関側では開示前レビュー表を標準化する」と言える。\n\n「企業予算者はまだ薄い」と言いながら、「企業接続の導線は九十日で作る」と言える。\n\n「外部経営候補は未確定」と言いながら、「候補者面談の最初に研究者の守る線を置く」と言える。\n\n案件の遅さを、機関の怠慢にしない。\n\n機関の整備を、案件のGO理由にしない。\n\n分けるから、両方が動く。\n\nこの分離は、責任逃れではない。\n\n産学連携担当者が慎重なのは、研究者を止めたいからではない。出願、共同研究、企業面談、兼業、利益相反の順番を間違えると、研究成果そのものを傷つけるからである。起業支援担当者が前へ出したいのは、研究者を急かしたいからではない。機会を逃すと、次の検証費も人材接点も細くなることを知っているからである。\n\n慎重さも、前進させたい気持ちも、どちらも局所的には合理的である。\n\n苗床の仕事は、その二つを勝ち負けにしないことだった。\n\n## 次の研究者が経験することを変える\n\n九十日の終わりに、研究者本人へ報告する場があった。\n\nそこでは、個別案件の結論だけを話さなかった。\n\n次の研究者が最初に相談したとき、開示前レビュー表が出る。企業の「面白い」を聞いたら、評価者、予算者、導入責任者を分けて聞く。病院相談では、医師だけでなく技師と倫理窓口の負荷を先に置く。外部経営候補には、研究者の守る線を最初に復唱してもらう。WAITやRESOURCE_SHIFTは、月次の場へ戻る。\n\n研究者は、少しだけ長く黙ってから言った。\n\n「次の人は、最初からそこに行けるんですね」\n\nそれが、苗床としての研究機関が変わるということだった。\n\n理論語はいくつも出てきた。準備度。統合地図。retrofit。validation。ERSと呼べる機関側の見方。\n\nけれど、最後に残るのは言葉ではない。\n\n次の研究者が、最初から一人で迷わなくてよいこと。\n\n次に下げる不確実性を、誰が持つかが見えること。\n\n個別案件の学びが、次の現場で消えないこと。\n\n研究者は、報告書の最後のページを閉じた。\n\n「これは、私の案件だけの話ではないんですね」\n\n若い事業化人材は、すぐには答えなかった。\n\nその通りだと言えば、研究者の痛みを教材にしてしまう気がした。違うと言えば、次の研究者を守る道が細くなる。\n\nだから、彼は少しだけ間を置いて言った。\n\n「同じ痛みを、そのまま次の人に渡さないための話です」\n\nその報告のあと、若い事業化人材は会議で使った紙を三つに分けた。\n\n一つ目は、現場メモだった。強すぎた一文、送信前の沈黙、研究者が止まった瞬間を、誰かを責める記録にしないための紙。\n\n二つ目は、判断と開示の紙だった。GO、WAIT、RESOURCE_SHIFT、赤、黄、青、予算者確認を、結論直前に置くための紙。\n\n三つ目は、研究機関の九十日pilotだった。次の研究者が、同じ場所で一人にならないようにするための紙。\n\n若い事業化人材は、三つの紙を重ねず、少し間を空けて机に置いた。\n\nその日の会議は、そこで静かに終わった。\n\n残ったのは、会議室から持ち帰る道具だった。\n"},{"file":"22-field-note-safety-loop.md","title":"Field Toolkit A: 現場メモを、安全な問いに変える","markdown":"# Field Toolkit A: 現場メモを、安全な問いに変える\n\nここは、本編の余韻を伸ばす章ではない。\n\n現場で残したメモを、次の会議で使える問いへ変えるための道具である。生々しさを消しきらず、誰かの未整理な事情を外へ出しすぎないために使う。\n\n## 使う場面\n\n会議のあと、ノートを閉じられないことがある。\n\n企業の探索担当は前向きだったが、予算者ではなかった。医師は協力的だったが、技師の負荷はまだ聞いていなかった。研究者は投資家向けの一文で手を止めた。外部経営候補は悪意なく、研究者の慎重さを急かした。公募の面接は、会社化の夢ではなく九十日の不確実性低減を問う場になった。\n\nどれも、次の現場では役に立つ。\n\nけれど、そのまま共有すれば、誰かを傷つける。\n\nこの道具は、そういうメモを「失敗談」ではなく「次に聞く問い」へ変えるためにある。\n\n## 手順1: 生の記録を残す\n\n最初に、起きたことを短く残す。\n\n- 誰が、どの場面で、何を言ったか\n- その場で何が強くなりすぎたか\n- 誰の負荷や責任が見えなくなったか\n- どの情報が、まだ外へ出せないか\n\nここでは、無理にきれいな教訓へしない。\n\n会議室の沈黙、弱く言い直した一文、誰も答えられなかった予算者の問い、研究者が手を止めた瞬間。そうした粗さがあるから、あとで問いが生きる。\n\n## 手順2: 層を分ける\n\n次に、メモへ五つの印をつける。\n\n**事実**\n\n見たこと、聞いたこと、資料に書かれたこと。\n\n「企業の探索担当が関心を示した」は事実である。\n\n**仮説**\n\nそこから進むかもしれない見立て。\n\n「この企業は顧客になるかもしれない」は仮説である。\n\n**解釈**\n\n場の空気や反応をどう読んだか。\n\n「相手は熱量が高い」は解釈である。\n\n**未確認**\n\nまだ聞いていないこと。\n\n「予算者がいるか」は未確認である。\n\n**約束してはいけないこと**\n\n今の証拠では言い切れないこと。\n\n「来期に実証できる」は、まだ約束してはいけない。\n\nこの分け方をしないと、メモはすぐに強くなる。関心が顧客になる。協力が合意になる。不安が反対になる。違和感が人格評価になる。未確認が進捗になる。\n\n安全化は、匿名化だけでは足りない。\n\n書いた人自身が、何を見て、何を推測し、何をまだ知らないのかを分けるところから始まる。\n\n## 手順3: 問いへ変える\n\n固有名を落としても残るものだけを、問いにする。\n\n「あの企業の担当者は前向きだったが予算者ではなかった」\n\nこれは、次の問いになる。\n\n「面白いと言った人は、評価者、予算者、導入責任者のどれか」\n\n「研究者は投資家資料の一文に違和感を持った」\n\nこれは、次の問いになる。\n\n「その表現は、研究者本人が守りたい線を越えていないか」\n\n「病院側は協力的だが、技師の負荷を気にしていた」\n\nこれは、次の問いになる。\n\n「医師の賛同とは別に、誰の作業が増えるか」\n\n「外部経営候補は実績が強いが、研究者の慎重さを急かした」\n\nこれは、次の問いになる。\n\n「経営経験より先に、技術への敬意と透明性を確認したか」\n\n問いに変わった瞬間、メモは誰かの失敗談ではなくなる。\n\n次の会議で使える道具になる。\n\n## 手順4: 濃さを選ぶ\n\n現場知は、濃ければよいわけではない。\n\n濃さは四つから選ぶ。\n\n**合成場面にする**\n\n会議室の沈黙、言い直した一文、予算者の空白など、複数の現場にまたがる構造として見せる。\n\n**道具の記入例にする**\n\n開示色分け、戻る条件、予算者確認、現場負荷の問いのように、読者が紙へ写せる形にする。\n\n**章末の問いにする**\n\n細部を落とし、次の現場で聞く一文だけを残す。\n\n**出さずに残す**\n\n固有技術、担当者名、未公開条件、具体的な金額、個人評価、研究者本人の揺れが強すぎる言葉は、公開へ出さない。\n\n出さないことも、現場知を守る作業である。\n\n## 手順5: 残す、移す、圧縮する\n\n削る前に、三つだけ確認する。\n\n**残す**\n\n場面の核になっていて、読者が判断を変えられるもの。\n\n例: 予算者が見えないまま企業反応を強く書こうとしたこと。\n\n**移す**\n\n本文に置くと重いが、道具として必要なもの。\n\n例: 戻る条件、開示の色、投資家前の証拠更新、九十日の運用紙。\n\n**圧縮する**\n\n思想としては残すが、生の言葉では出さないもの。\n\n例: 早すぎる会社化への警戒、小さな対価が未来を開く場合と低い天井へ閉じ込める場合の違い、野心的な成長曲線を全否定せず一律適用もしない判断。\n\n現場の直感は、個人の声として前に出すものではない。\n\n読者が使える問いとして残す。\n\n## 手順6: 次の会議へ戻す\n\n安全なメモは、保存のためだけに作らない。\n\n次の会議で、一つの問いとして戻す。\n\n「面白いと言った人は、評価条件、予算、導入責任のどれを持っていますか」\n\n「この一文は、研究者本人が守りたい線を越えていませんか」\n\n「医師の賛同とは別に、誰の作業が増えますか」\n\n名前は出していない。具体的な失敗も出していない。\n\nそれでも、学びは消えていない。\n\n現場メモの役割は、裏話を保存することではない。\n\n次の研究者を、同じ孤独から少しだけ守ることだ。\n\n## 持ち帰る型\n\n- 起きたことを書く\n- 事実、仮説、解釈、未確認、約束してはいけないことに分ける\n- 固有情報を落としても残る問いへ変える\n- 合成場面、記入例、章末の問い、非公開のどれにするか選ぶ\n- 残す、移す、圧縮するを決める\n- 次の会議で一つの問いとして使う\n\n次のToolkitでは、その問いを結論直前の会議で使う。判断、開示、WAIT、予算者確認、投資家前の証拠更新を、四枚の紙として置く。\n"},{"file":"23-decision-and-disclosure-toolkit.md","title":"Field Toolkit B: 判断と開示の道具を会議に置く","markdown":"# Field Toolkit B: 判断と開示の道具を会議に置く\n\nここは、会議を説明する章ではない。\n\n結論が出そうになった直前に置く、四枚の紙である。\n\nToolkit Aで安全な問いに変えたメモは、会議で使われなければ反省で終わる。進めましょう。投資家に見せましょう。企業に当てましょう。会社化の方向で話しましょう。どれも悪い言葉ではない。\n\nただ、その言葉の前に、四枚だけ見る。\n\n## 四枚の紙\n\n**一枚目: deck sentenceを弱く戻す紙**\n\n強い文を、一度だけ安全な文へ戻す。\n\n**二枚目: 開示地図**\n\n赤、黄、青だけでなく、誰が、誰に、どの場面で話すかまで決める。\n\n**三枚目: WAIT ledger**\n\n戻る条件、担当者、戻る日、今月やらないことを書く。\n\n**四枚目: 予算者確認と証拠更新メモ**\n\n投資家へ行く前に、企業反応が本当に顧客証拠になっているかを見る。\n\n## 一枚目: deck sentenceを弱く戻す\n\n使う場面は、資料の一文が気持ちよく強くなったときである。\n\n紙には三つだけ書く。\n\n- 強い文\n- 安全な文\n- 強い文へ戻すために必要な証拠\n\nたとえば、強い文がこうなっていたとする。\n\n「大手企業が導入に前向き」\n\n実際には、探索担当が関心を示した段階だった。評価者は見え始めたが、予算者も導入責任者もまだ薄い。\n\n安全な文は、こうなる。\n\n「企業の探索担当が関心を示しており、評価条件と予算経路を確認中」\n\n強い文へ戻すために必要な証拠は、こうなる。\n\n「評価者が検証条件を出す。予算者が来期枠の条件を話す。導入責任者が現場負荷を確認する」\n\nもう一つ。\n\n強い文がこうなっていたとする。\n\n「病院実証へ進む」\n\n安全な文は、こうなる。\n\n「医師との協力相談は始まっているが、技師負荷、倫理窓口、患者説明の入口を確認中」\n\ndeck sentenceを弱く戻すことは、魅力を消すことではない。\n\n証拠が育ったら、また強くできるようにすることだ。\n\n## 二枚目: 開示地図を話者まで決める\n\n使う場面は、外へ出す資料、面談、メール、制度面接の直前である。\n\n色は三つ。\n\n**青**\n\n公開済み情報。論文で言えること、一般的な課題、既存技術の限界。\n\n**黄**\n\n相手と目的を絞れば話せる情報。検証条件の仮説、相手現場に合わせた説明、未公開データの外側だけ。\n\n**赤**\n\nまだ出さない情報。出願前の中核図、共同研究先由来の未整理情報、研究者がまだ外へ出したくない用途表現。\n\nただし、色だけでは足りない。\n\n誰が話すかまで決める。\n\n研究者が言えることと、若い事業化人材が言えることは違う。産学連携担当者が確認することと、外部経営候補が投資家に言うことも違う。\n\n使い方は短い。\n\n「この文は黄。企業評価者には言える。ただし投資家向け資料では、予算者未確認を一緒に書く」\n\n「この図は赤。秘密保持の約束があっても、出願前は出さない」\n\n「この用途表現は黄。研究者本人が確認した範囲でだけ使う」\n\n開示は、秘密主義ではない。\n\n外へ出るための順番である。\n\n## 三枚目: WAIT ledgerにやらないことを書く\n\n使う場面は、「いったん待つ」が曖昧になりそうなときである。\n\nWAITは止まることではない。\n\nけれど、戻る条件がなければ保留になる。担当者がいなければ、誰かの頭の中で眠る。やらないことが決まっていなければ、活動量だけが増え、結局は強い言葉へ戻る。\n\nledgerには五つだけ書く。\n\n- 判断\n- 根拠\n- 次に下げる不確実性\n- 担当者と戻る日\n- 今月やらないこと\n\nある会議では、判断はRESOURCE_SHIFTだった。\n\n根拠は、研究と公募の追い風は強いが、予算者、現場負荷、開示安全性がまだ低いこと。\n\n次に下げる不確実性は、企業の評価条件、病院側の作業負荷、投資家向けに言ってよい範囲。\n\n戻る日は、九十日後。\n\n今月やらないことは三つだった。\n\n- 投資家紹介を増やさない\n- 肩書きだけで外部経営候補を置かない\n- 出願前情報を含む資料を広げない\n\nやらないことを書くと、会議は少し窮屈になる。\n\nその窮屈さが、研究者を守ることがある。\n\n## 四枚目: 予算者確認と証拠更新メモ\n\n使う場面は、投資家面談の前である。\n\n企業反応は、資料を強く見せる。企業名があると進んでいるように見える。面談数があると証拠が増えたように見える。\n\nけれど、その前に四人を分ける。\n\n- 誰が探索しているのか\n- 誰が評価条件を出すのか\n- 誰が予算を持つのか\n- 誰が導入後の責任を持つのか\n\n四人は、同じ人かもしれない。別の人かもしれない。まだ見えていないかもしれない。\n\n見えていないなら、投資家向け資料には強く書かない。\n\n「企業候補二社」ではなく、こう書く。\n\n「探索担当二社。うち一社は評価条件確認中。予算者と導入責任者は未確認」\n\n弱い。\n\nだが、弱い文は悪い文ではない。\n\n投資家は、弱い文からも見る。このチームは、何をまだ知らないかを分かっている。資金で何を下げるかを分かっている。企業ロゴで顧客証拠を膨らませない。そう見えることがある。\n\n最後に、資金曲線を確認する。\n\n早く大きなリスク資本を入れ、Jカーブを狙うべき研究成果もある。そうしなければ、機会を失うものもある。\n\n一方で、予算者も評価条件も見えず、研究者の守る線も揺れ、開示安全性も低いまま、大きな曲線だけを輸入すると、生存確率は下がる。\n\n投資家に会う前に、三つだけ聞く。\n\n- この資金は、どの不確実性を下げるのか\n- この支払いは、未来の道を明らかにするのか、それとも低い天井の安心へ逃がすのか\n- この成長物語は、この研究成果の証拠から来ているのか\n\n## 結論直前に使う\n\n四枚の紙は、会議の冒頭で説明するものではない。\n\n結論が出そうになった瞬間に使う。\n\n「会社化へ進めましょう」\n\nそのとき、deck sentenceを弱く戻す。\n\n「投資家に見せましょう」\n\nそのとき、開示地図を話者まで確認する。\n\n「いったん待ちましょう」\n\nそのとき、WAIT ledgerに戻る日とやらないことを書く。\n\n「企業反応があります」\n\nそのとき、探索担当、評価者、予算者、導入責任者を分ける。\n\n道具は、答えを出すためではない。\n\n粗い答えで止まらないためにある。\n\n次のToolkitでは、この四枚を個別案件だけで終わらせず、研究機関の九十日pilotへ入れる。\n"},{"file":"24-institution-nursery-checklist.md","title":"Field Toolkit C: 研究機関の九十日pilot charter","markdown":"# Field Toolkit C: 研究機関の九十日pilot charter\n\nここは、制度改革を語る章ではない。\n\n研究機関側が持ち帰り、九十日だけ試すための運用紙である。\n\n本編の終盤で見えたのは、研究者を孤独にしない苗床の必要性だった。このToolkitでは、それを大きな改革ではなく、三つのシーズ、三つの道具、三つの責任導線へ縮める。\n\n## 使う場面\n\n個別案件の反省を、次の研究者にも残したいときに使う。\n\n会議では、すぐ大きな案が出る。\n\n全学の起業支援メニューを見直す。企業連携の仕組みを作り直す。外部経営人材のネットワークを整える。医療PoCの標準手順を作る。若い事業化人材の育成制度を置く。月次レビュー会議を新設する。\n\nどれも必要に見える。\n\nだが、全部を一度に始めれば、会議だけが増える。\n\n研究者はまた、誰に相談すればよいのか分からなくなる。産学連携担当者は資料作成に追われる。若い事業化人材は、権限のないまま新しい会議を回す。支援メニューは増えるが、責任の導線はまた細くなる。\n\nだから、最初は九十日に縮める。\n\n## 紙1: pilot charter\n\npilot charterは、事業計画ではない。\n\n制度改革の宣言でもない。\n\n九十日だけ、研究機関がどの責任を持つかを確認する小さな約束である。\n\n書くことは四つ。\n\n**対象**\n\n三つのシーズだけを選ぶ。\n\n医療隣接のシーズ。素材系のシーズ。AI応用のシーズ。\n\n分野をばらすのは、同じ道具が違う現場で使えるかを見るためである。三つで十分だ。多すぎると、また運用が目的になる。\n\n**使う道具**\n\n三つだけにする。\n\n一つ目は、三層の開示表。公開情報、限定開示、まだ出さないものを分ける。\n\n二つ目は、顧客信号の階段。探索担当、評価者、予算者、導入責任者を分ける。\n\n三つ目は、月次の低い条件レビュー。WAIT、HOLD、RESOURCE_SHIFTが放置されず、戻る条件を持つ。\n\n**owner**\n\n産学連携担当者。知財担当者。若い事業化人材。企業接続の担当者。必要に応じて病院や外部人材の窓口。\n\nownerは、責任を全部持つ人ではない。\n\n次の研究者が迷ったとき、最初にどこへ戻ればよいかを見えるようにする人である。\n\n**九十日後に見ること**\n\n研究者が一人でつなぎ直していた負荷は下がったか。\n\n道具は実際のメール、面談、資料修正で使われたか。\n\n戻る日が置かれた判断は、戻ってきたか。\n\n## 紙2: unknownとnot_startedを分ける\n\npilotの初日は、足りないものが多く見える。\n\n外部経営人材のリストはあるのか。\n\n医療PoCの倫理入口はどこか。\n\n企業の予算者へ進む導線はあるのか。\n\n若い事業化人材に、聞く、翻訳する、記録する、戻す権限はあるのか。\n\n月次で低い条件を見る場はあるのか。\n\nここで、全部を「ない」と書かない。\n\n**unknown**\n\nあるかもしれないが、まだ確認していないもの。\n\n二営業日で確認する。起業支援部門、卒業生ネットワーク、地域企業、病院窓口、既存の共同研究先に聞く。実はあるものを、新しく作り直さない。\n\n**not_started**\n\n本当にまだ始まっていないもの。\n\n九十日で小さく作る。標準化された開示前レビュー表。企業予算者へ進む質問文。若い事業化人材の三十日権限。低い条件を見る月次の場。\n\nこの区別は、地味である。\n\nだが、確認で済むものを制度改革にしてしまうと、運用は重くなる。作るべき導線を「たぶんどこかにある」と置くと、研究者の孤独は残る。\n\n九十日pilotでは、unknownを確認済みに変える。not_startedを、小さな運用へ変える。\n\nそれ以上は、まだしない。\n\n## 紙3: responsibility pipeline\n\npilotで見るのは、メニューの数ではない。\n\n責任の流れである。\n\n月次では、各シーズについてこの順で見る。\n\n**最初の相談**\n\n研究者が最初に相談したとき、誰が開示の順番を確認するのか。\n\n**企業反応**\n\n企業から「面白い」と言われたとき、誰が評価者、予算者、導入責任者を分けて聞くのか。\n\n**現場検証**\n\n病院や工場に相談するとき、誰が医師、技師、倫理窓口、現場責任者、利用者説明の入口を分けるのか。\n\n**外部人材**\n\n外部経営候補を紹介するとき、誰が研究者の守る線を先に共有し、候補者がそれを復唱できるかを見るのか。\n\n**戻る判断**\n\nWAITやRESOURCE_SHIFTになったとき、誰が戻る日を持つのか。\n\n最後に、三つだけ聞く。\n\n- 次に下げる不確実性は何か\n- それを誰が持っているか\n- 研究者が一人でつなぎ直している場所はどこか\n\nこの三つが見えれば、pilotは進む。\n\n## stop / expand gate\n\n九十日後、pilotは自動で広げない。\n\n続けるか、縮めるか、止めるかを決める。\n\n**expand**\n\n広げてよいのは、研究者の負荷が実際に下がったときである。\n\n三つのシーズすべてで、初回企業面談前に開示表が使われた。企業の探索担当で止まらず、少なくとも評価者か予算者への条件確認が始まった。WAITやRESOURCE_SHIFTに戻る日が置かれた。若い事業化人材が、何を持ってよいかを最初に確認できた。\n\nそのときは、pilotを広げてよい。\n\n**shrink**\n\n縮めるべきなのは、会議だけが増えたときである。\n\n研究者が説明する場が増えただけ。産学連携担当者が資料を作るだけ。若い事業化人材が議事録係になるだけ。企業接続は探索担当で止まったまま。開示表は作ったが、実際のメールや面談で使われない。\n\nそのときは、道具を減らす。\n\n三層開示表だけにする。顧客信号の階段だけにする。月次レビューを三十分だけにする。\n\n**stop**\n\n止めるべきなのは、研究者の負荷を増やしていると分かったときである。\n\n説明する相手が増えただけなら止める。責任者の名前が増えて、戻る場所が増えただけなら止める。道具を埋めること自体が目的になったなら止める。\n\n苗床は、制度の大きさではなく、研究者の孤独が減るかどうかで見る。\n\n## 紙束の後に残る問い\n\nこの紙束は、研究成果を必ず会社にしようと言っているのではない。\n\n会社にする前に、見落とされやすい条件を読むための道具である。\n\n会社にするべきものもある。まだ待つべきものもある。会社にしない方が研究成果を守れるものもある。会社以外の形で社会に出すべきものもある。\n\n大事なのは、熱量、制度、資本、支援メニューの圧に押されて、未整理のままZeroを越えないことである。\n\n最後に残る問いは、単純である。\n\nこの研究成果は、いま会社になるべきか。\n\nその前に、どの不確実性を、誰が、どの順番で下げるのか。\n\nそして、次の研究者が同じ問いを一人で抱え込まないために、研究機関はどの習慣を持つのか。\n\n九十日のpilotは、その問いを機関の中に残すための、いちばん小さな始まりである。\n"},{"file":"25-epilogue.md","title":"Epilogue: その一文は、少しだけ弱くなった","markdown":"# Epilogue: その一文は、少しだけ弱くなった\n\n半年後、若い事業化人材は、別の会議室にいた。\n\n机の上には、また研究成果の資料があった。今回は医療隣接のシーズではない。材料系の研究で、企業から問い合わせが来ていた。研究者は、会社を作りたいと言ったわけではない。ただ、外から関心が来て、何をどこまで話してよいのか分からなくなっていた。\n\n会議の始まりは、どこか見覚えがあった。\n\n企業は「面白い」と言っている。支援制度の締切は近い。大学の中には、知財を先に見たい人がいる。外部人材を紹介できるかもしれないという話もある。投資家に詳しい人は、領域の熱を感じている。\n\n前と同じだった。\n\nけれど、まったく同じではなかった。\n\n研究者は、最初から一人でメニューを渡り歩いていなかった。最初の相談の場に、産学連携担当者と若い事業化人材がいた。資料の一枚目には、赤、黄、青の小さな印がついていた。企業から来たメールの横には、探索担当、評価者、予算者、導入責任者という空欄があった。\n\n会議の中央には、まだ空白の多い一枚の紙が置かれていた。\n\nそこには、こう書かれていた。\n\n「会社にするかどうかを決める前に、九十日で下げる不確実性」\n\n研究者は、その紙を少し長く見ていた。\n\n「これは、会社を作る前提の資料ですか」\n\n若い事業化人材は、首を振った。\n\n「違います。会社にするかどうかを、早く決めすぎないための資料です」\n\nその言葉で、研究者の肩が少し下がった。\n\n## 最初の文が変わった\n\n企業へ返すメールの下書きは、すでに作られていた。\n\n最初の文は、こうだった。\n\n「本技術は、御社との共同検証を通じて、事業化に向けた応用可能性を確認したいと考えています」\n\n悪い文ではなかった。\n\n相手にも失礼ではない。前向きで、支援制度にも使いやすく、次の面談にもつながりそうだった。\n\nけれど、若い事業化人材は、少しだけ手を止めた。\n\n半年前なら、この文をそのまま送ったかもしれない。少し弱いと思えば、もっと強くしたかもしれない。「事業化に向けた共同検証」と書けば、部屋は進みやすくなる。企業も返事をしやすい。支援部署も説明しやすい。\n\nでも、彼はもう知っていた。\n\n強い文は、歩き出す。\n\n一度歩き出した文は、企業面談、支援制度、公募資料、投資家更新、学内説明の中で、少しずつ約束に近づいていく。\n\nだから、最初の文を弱くした。\n\n「本技術について、御社のどの業務課題に近い可能性があるかを確認したいと考えています。現時点では、評価者、予算者、導入条件は未確認です。まずは、既存工程のどこに負荷があるかを伺えればと思います」\n\n弱い文だった。\n\nでも、研究者はそれを見て言った。\n\n「この文なら、送れます」\n\nその一言だけで、半年前の沈黙は少しだけ遠くなった。\n\n## 弱い文は、弱いまま終わらない\n\n弱い文は、挑戦を小さくするためにあるのではない。\n\nまだ分からないものを、分からないまま相手に渡すためにある。研究者が守りたい線を守るためにある。企業の関心を、顧客の証拠へ急いで変えないためにある。支援制度の締切を、会社化の圧力ではなく、低い条件を下げる仕事へ変えるためにある。\n\n弱い文は、次の問いを生む。\n\n誰が評価するのか。\n\n誰が予算を持つのか。\n\nどの業務が変わるのか。\n\nどの情報はまだ外へ出さないのか。\n\n研究者は何を持ち、外部の人は何を補うのか。\n\n九十日後、何が分かれば次へ進めるのか。\n\n弱い文は、逃げではない。\n\n弱い文は、まだ背負えない約束を、次に確かめる仕事へ戻す。\n\n## 紙の端に残ったもの\n\n送信後、若い事業化人材は、手元の紙をもう一度見た。\n\nそこに残っていたのは、一つの成功談ではなかった。\n\n拍手の後に残った違和感。企業の「面白い」が顧客候補へ変わる危うさ。送信予約の残り十七分。登記を急がせる空気。九十日のWAITが放置へ崩れかけた会議。投資家に古い言葉を突かれる痛み。外部経営候補が一度強めた言葉を、もう一度弱く戻すメール。支援メニューが増えても、研究者が最初のページで止まる孤独。\n\nどれも、大きな事件のようには見えない。\n\nだが、会社になる前の研究成果は、こういう小さなところで壊れる。\n\nそして、同じ小さなところから、少しだけ壊れにくくもなる。\n\n強すぎる一文を弱く戻す。\n\n「面白い」を予算者の問いへ戻す。\n\n開示線を送信前に置く。\n\n小さな対価が、便利な売上なのか、稼げる体質の入口なのかを見る。\n\n会社化を急がず、生存確率を下げる低さを先に見る。\n\n外部人材を研究者の置き換えにしない。\n\n支援メニューを増やす前に、責任の流れを作る。\n\nこうした仕事は、派手ではない。\n\nけれど、研究成果が社会へ出る直前には、この派手ではない仕事が、未来の形を決める。\n\n## Zeroを越える前に\n\n若い事業化人材は、送信前の紙の端に、もう一つだけ線を引いた。\n\nそこには、半年前から何度も戻ってきた問いがあった。\n\n会社を作るべき研究成果はある。早く資本を入れ、強いチームを作り、大きな市場へ挑むべきものもある。\n\n一方で、まだ会社にしない方がよいものもある。会社以外の形で社会へ出る方がよいものもある。九十日だけ待つことで、会社になった後の生存確率が上がるものもある。\n\nだから、若い事業化人材は「起業すべきです」とは言わなかった。\n\n「起業しない方がいいです」とも言わなかった。\n\nただ、Zeroを越える前に、紙の上へもう一度だけ問いを戻した。\n\nこの一文は、強すぎないか。\n\nその強さは、誰の期待を楽にしているのか。\n\nその強さで、誰があとから傷つくのか。\n\n弱く戻したとき、次に下げる不確実性は見えるのか。\n\n若い事業化人材は、企業へ送るメールの最後を読み返した。\n\n研究者も、産学連携担当者も、支援部署の担当者も、その文を見ていた。\n\nメールは、強くはなかった。\n\nしかし、次の会議へ進むには十分だった。\n\n送信ボタンが押された。\n\n今回は、研究者は黙らなかった。\n\nそれが、Before Zeroの仕事が少しだけ進んだということだった。\n"},{"file":"26-method-how-to-read-the-model.md","title":"Method Appendix M0 — モデルをどう読むか","markdown":"# Method Appendix M0 — モデルをどう読むか\n\nこの補遺は、物語を読み終えたあとで開くための場所である。\n\n本文で起きたことは、ひとつの強すぎた一文が、証拠、開示、会社化、創業者機能、WAIT、リスク資本、学習ログ、研究機関の苗床へ波及していく過程だった。ここから先では、その判断を支えていた地図を、変数と式で見えるようにする。\n\nただし、モデルは判定機ではない。\n\n高い数値が出たから会社にする、低い数値が出たからあきらめる、という読み方はしない。モデルは、次に下げる不確実性を見つけるための会話の紙である。数値は、現場でまだ確認できていない条件を隠すためではなく、見落としにくくするために置く。\n\nこの補遺で扱う式は、本文の人物の判断を置き換えない。研究者、支援者、外部経営候補、企業、投資家、研究機関がそれぞれ持っていた局所的な合理性を、同じ紙の上で見比べるために使う。\n\nだから、最初に守るべき読み方は一つだけでよい。\n\nモデルを読むときは、「この案件は何点か」ではなく、「この案件が壊れるなら、次にどの条件が壊すのか」と問う。\n"},{"file":"27-method-notation-and-scale.md","title":"Method Appendix M1 — 記号と尺度","markdown":"# Method Appendix M1 — 記号と尺度\n\nこの補遺では、本文で出てきた準備度や追い風を、同じ紙の上で扱えるようにするための表記を置く。\n\n多くの軸は、0から9までの尺度で読む。0は価値がないという意味ではない。まだ現場で確認されていない、または次の判断に使えるほどには整理されていない、という意味に近い。9は完成ではない。少なくともその時点の判断に使える程度には、条件が見えているという意味である。\n\n式の中では、軸の値に1を足すことがある。\n\nこれは、どこか一つの軸が0に近いとき、その軸を無視して全体を強く見せないための工夫である。同時に、0を掛けて全体を完全に消してしまわないための工夫でもある。\n\nこの補遺では、観測、解釈、判断を分けて読む。\n\n観測は、会議で実際に見えたもの。予算者がいなかった、支払いが断られた、開示前の文が強すぎた、九十日メモに空欄が残った、という事実である。\n\n解釈は、その観測がどの条件を弱く見せているかを読むこと。\n\n判断は、その読みから、GO、WAIT、HOLD、NO_GO、RESOURCE_SHIFTのどれに近い動きを選ぶかである。\n\n式は、この三つを混ぜないために使う。\n\nこの補遺でよく使う記号は、次のように読む。\n\n- `X_i`: ある一つの軸の値\n- `alpha_i`: その軸をどれくらい重く見るか\n- `K`: 全体の尺度を整える定数\n- `S`: 統合された準備度\n- `s`: 研究機関側の小さな評価単位\n- `A_k`: 研究機関側の一つの軸の平均\n\nここで気をつけたいのは、記号が増えたからといって、現場が正確になったわけではないことだ。\n\n予算者がいないこと、開示前の文が強すぎること、外部候補が弱い事実を強く言い直してしまうこと。そういう観測を、どの軸に置くかは人間の判断である。式は、その判断を会議で検証しやすくする。\n\nつまり、モデルに入れる前の問いが大事になる。\n\nそれは、「この値はいくつか」ではなく、「この値を置いた理由を、次の会議で誰が説明できるか」である。\n"},{"file":"28-method-macro-alignment.md","title":"Method Appendix M2 — マクロの追い風を分けて読む","markdown":"# Method Appendix M2 — マクロの追い風を分けて読む\n\n本文では、追い風は何度も案件を急がせた。\n\n公募の締切、企業の関心、投資家の熱、政策上の注目。どれも前へ進む理由になる。しかし、それらが同じ方向を向いているように見えても、研究成果が会社になる条件を満たしたとは限らない。\n\nここでは、その追い風を三つに分けて読む。\n\n- `mu_A`: 学術側の勢い\n- `mu_I`: 産業側の勢い\n- `mu_G`: 政策・行政側の勢い\n\nこの三つを合わせて、マクロの整合度を `sigma_SU` と呼ぶ。\n\n代表的な形は次のように置ける。\n\n`sigma_SU = (((mu_A + 1)(mu_I + 1)(mu_G + 1))^(1/3)) - 1`\n\nここで大事なのは、三つのどれか一つだけが高くても、全体がきれいに整ったとは読まないことである。政策の追い風が強くても、企業の予算者がいないことはある。企業の技術部門が熱心でも、学術側の開示順序がまだ整っていないことはある。\n\nマクロの追い風は、GOの許可ではない。\n\nそれは、低い条件を急いで見に行く理由である。\n\nもう少し細かく読むなら、各モメンタムは観測量から作る。\n\n`mu_x = sum(c_xp * y_p) / sum(c_xp)`\n\nここで `y_p` は観測量であり、`c_xp` はその観測量がどのモメンタムにどれくらい効くかを表す重みである。\n\nたとえば、政策予算、研究費、論文、企業発表、投資件数、競合の増え方は、それぞれ違う方向から追い風を見せる。けれど、同じ観測でも、学術側の勢いを示すものと、産業側の勢いを示すものと、政策側の勢いを示すものでは意味が違う。\n\n状態空間モデルのように、時間方向の動きを扱うこともできる。\n\n`x_(t+1) = A x_t + B u_t + e_t`\n\n`y_t = C x_t + D u_t + n_t`\n\nただし、この本の公開本文で重要なのは、状態方程式そのものではない。\n\n重要なのは、追い風が強いときほど、現場の人が「もう進めてよい」と言いたくなることだ。式は、その前に一度立ち止まり、どの追い風が本当に整っていて、どの追い風がまだ文書や予算者や開示線に落ちていないかを見るために使う。\n"},{"file":"29-method-readiness-axes.md","title":"Method Appendix M3 — 五つの準備度","markdown":"# Method Appendix M3 — 五つの準備度\n\n本文では、「準備できていますか」という一文が、会議室で五つの違う問いに割れた。\n\nこの補遺では、その五つを次のように置く。\n\n- TRL: 技術そのものが、次の検証に耐えられるか\n- BRL: 顧客、課題、対価、予算者への道が見えているか\n- GRL: 規制、知財、開示、契約、責任の順序が壊れていないか\n- SRL: 実際に使われる現場、社会的な受容、導入時の摩擦が読めているか\n- HRL: 人と組織が、その次の九十日を運べるか\n\nこの五つは、点数を競わせるための軸ではない。\n\n技術が強い案件ほど、TRLだけで話を進めたくなる。けれど、本文で繰り返し起きた問題は、技術が弱いことではなかった。予算者がいない、開示前の文が強い、創業者機能が空いている、支援制度が責任の流れを受け止めきれない。そういう別の低い条件が、次の一手を壊していた。\n\n五つの準備度は、「どこが高いか」よりも、「どこがまだ次の判断を壊しうるか」を見るために使う。\n\n強い軸は希望になる。低い軸は、次に仕事を置く場所になる。\n\n実務上は、それぞれの軸を0から9で置く。\n\n0に近い軸は、その領域が重要ではないという意味ではない。むしろ、まだ次の判断に使えるほど見えていないという意味になる。9に近い軸も、完成を意味しない。少なくともいまの九十日を進めるうえで、関係者が説明できる状態に近い、という程度に読む。\n\nこの五つを並べるとき、平均だけで見ない。\n\n平均は、低い軸を隠すことがある。技術が高く、追い風も強い案件では、BRLやGRLやHRLの低さが見えにくくなる。けれど、本文で壊れかけたのはその場所だった。\n\nだから、準備度の紙では、いちばん低い軸の横に次の問いを書く。\n\nBRLが低いなら、次に会うべき予算者は誰か。\n\nGRLが低いなら、まだ外に出してはいけない一文はどれか。\n\nHRLが低いなら、九十日のあいだ誰が悪い知らせを戻すのか。\n\n五つの軸は、点数表ではなく、次の会議のagendaを作るためにある。\n"},{"file":"30-method-founder-function.md","title":"Method Appendix M4 — 創業者機能と役割の適合","markdown":"# Method Appendix M4 — 創業者機能と役割の適合\n\n本文で外部経営候補が現れたとき、問題は「誰がCEOになるか」だけではなかった。\n\n研究者が守りたい線を理解できるか。弱い事実を弱いまま戻せるか。企業や投資家の前で、強い言葉に滑ったときに戻ってこられるか。九十日のあいだ、誰がどの機能を持つのか。\n\nこの補遺では、そのまとまりをFRLと呼ぶ。\n\nFRLは、人格評価ではない。研究者を創業者向きかどうかで裁くための言葉でもない。\n\nむしろ、誰に何を背負わせると壊れるかを読むための配置設計である。\n\nここでは、少なくとも二つを分ける。\n\n- `F_character`: 信頼、言い直し、弱い事実を扱う態度\n- `F_capability`: 資金調達、採用、顧客開拓、交渉、実行を運ぶ力\n\n外部経営候補が補えるものはある。若い事業化人材が拾える空白もある。研究機関が受け止めるべき責任もある。\n\nけれど、研究者本人の保護線や技術の意味を、誰かが便利に置き換えることはできない。\n\nFRLは、その置き換え不能なものと補完できるものを分けるための地図である。\n\nFRLを数値として置く場合も、最初に見るべきものは面談の印象ではない。\n\n見るべきものは、行動である。\n\n研究者の保護線をそのまま言い返せるか。弱い支払い拒否を、強い顧客証拠に言い換えず持ち帰れるか。投資家の前で強い言葉に寄りそうになったあと、次のメールで戻れるか。採用、資金調達、顧客開拓、契約、チーム設計のうち、どれを九十日で本当に持てるか。\n\nこのため、FRLは一つの人格点ではなく、少なくとも二層で読む。\n\n`FRL = role_fit(F_character, F_capability, context)`\n\nここで `context` は、その案件の技術、開示線、企業側の関心、研究機関の支援導線を含む。\n\nつまり、同じ人でも案件が変わればFRLは変わる。ある研究成果では良い補完者になれる人が、別の研究成果では強い言葉を急がせてしまうこともある。\n\nだから、創業者機能を見るとは、誰かを選別することではない。\n\nその案件で、誰に何を持たせると信頼が残るかを決めることである。\n"},{"file":"31-method-integrated-readiness.md","title":"Method Appendix M5 — 統合準備度と次の一手","markdown":"# Method Appendix M5 — 統合準備度と次の一手\n\n本文のCh19では、統合地図は高期待の案件をさらに前へ押すためではなく、RESOURCE_SHIFTを選ぶために使われた。\n\nここでは、その地図を式として置く。\n\n代表的な形は、次のように書ける。\n\n`S = K * product((X_i + 1)^alpha_i)`\n\n`X_i` は、マクロ整合、技術、事業、ガバナンス、社会受容、人材、創業者機能などの軸である。`alpha_i` は、その軸をどれくらい重く見るかを表す。`K` は全体の尺度を整えるための定数である。\n\nもう少し分けて書くなら、次のようにも読める。\n\n`S = k * M * X * F`\n\n`M` はマクロの整合、`X` は五つの準備度のまとまり、`F` は創業者機能である。ここでも、どれか一つを強く見せるために分けるのではない。どこが全体を止めているかを見失わないために分ける。\n\nこの式は、案件をランキングするためのものではない。\n\nむしろ、どの低い条件が次の一手を止めているかを見るために使う。感度は次の形で読める。\n\n`dS/dX_i = alpha_i * S / (X_i + 1)`\n\nこれは、どの軸に仕事を置くと、統合地図がもっとも意味を持って変わるかを見るための手がかりである。\n\n低い軸ほど、同じ一手の意味が大きくなることがある。\n\nたとえば市場規模スライドを磨くより、予算者を一人確認するほうが地図を大きく変えることがある。投資家紹介を増やすより、開示前の一文を弱く戻すほうが、生存確率を上げることがある。短期の受託を取るより、その支払いが未来を狭めるかどうかを確認するほうが、稼げる体質の見え方を変えることがある。\n\nだから、Ch19で選ばれたのは足し算ではなかった。\n\n投資家紹介を増やす、市場規模スライドを磨く、短期の受託を取りにいく。そうした前向きな活動を、いったん減らす判断だった。戻った時間で、予算者、支払い拒否、開示線、九十日の見直し日を確認する。\n\n統合準備度は、勢いを数値化するためではない。\n\n何を減らして、何を確かめるかを決めるためにある。\n\n重み `alpha_i` は、固定された真理ではない。\n\n領域、時期、規制、研究機関の支援力、資金の性質によって、何を重く見るべきかは変わる。だから、重みは隠してはいけない。会議で説明し、必要なら見直す。\n\n数値が出たあとに問うべきことは、いつも同じである。\n\nこの値が正しいかではなく、この値を置いたことで、次に減らす仕事が変わったか。\n"},{"file":"32-method-evidence-rules.md","title":"Method Appendix M6 — 証拠ルールとretrofit","markdown":"# Method Appendix M6 — 証拠ルールとretrofit\n\n本文では、失敗をすぐ学習に変えようとすると、関係の痛みが消えてしまう場面があった。\n\n証拠ルールの更新は、責任追及ではない。けれど、何もなかったことにするための言葉でもない。\n\nここでは、二つの紙を分ける。\n\n- old evidence rule: そのとき、何を証拠として扱っていたか\n- new evidence rule: 次から、何を証拠として扱うべきか\n\nたとえば、企業の技術部門が「面白い」と言ったことを顧客候補として扱っていたなら、古い証拠ルールは強すぎた。予算者が不在で、支払い拒否が来て、来期条件だけが戻ってきたなら、新しい証拠ルールは別になる。\n\n支払い拒否は、失敗として捨てるものではない。\n\n予算者、時期、導入条件、繰り返し性、対価の理由を返す観測である。弱い証拠を弱いまま残せると、次の会議で強い言葉に戻りにくくなる。\n\nretrofitは、過去をきれいに説明し直すことではない。\n\n次に同じ強すぎた一文を書きそうになったとき、どの証拠ルールで止まるかを決め直す作業である。\n"},{"file":"33-method-institutional-nursery.md","title":"Method Appendix M7 — 研究機関の苗床準備度","markdown":"# Method Appendix M7 — 研究機関の苗床準備度\n\n本文の終盤で見えたのは、ひとつの案件だけの問題ではなかった。\n\n別の研究者も、別の支援メニューPDFの前で止まった。支援制度が足りないのではなく、最初に責任を受ける人、弱い事実を戻す人、九十日後に見直す人が、毎回空きやすかった。\n\nこの補遺では、その研究機関側の準備をERSとして読む。\n\nERSは、支援メニューの数ではない。\n\n見るべきものは、責任導線である。\n\n- 最初に受ける人はいるか\n- unknownとnot_startedを分けているか\n- 予算者、開示、外部候補、研究者本人、支援制度の空欄が見えるか\n- 九十日pilotの止める条件と広げる条件があるか\n\n簡単な正規化は、次のように置ける。\n\n`s = (lv - 1) / 4`\n\n`A_k = mean(axis k sub-scores)`\n\n`ERS = 100 * sum(w_k * A_k)`\n\nただし、ここでも数値は運用を置き換えない。\n\nERSが見せるべきものは、研究機関が「支援しています」と言えるかではない。次の案件で、同じ孤独がどこに再発するかである。\n\n`lv` は、サブ軸ごとの到達レベルである。\n\nそれを0から1に正規化したものが `s` になる。いくつかの `s` を平均すると、その軸の `A_k` になる。さらに軸ごとに重み `w_k` を置いて足し合わせると、ERSになる。\n\nこの形は便利だが、危険もある。\n\n支援メニューが多い研究機関ほど、点数が高く見えてしまうことがある。けれど、本文で研究者を孤独にしたのは、メニューの少なさだけではなかった。最初に受ける人がいない。悪い知らせを戻す人がいない。予算者確認が誰の仕事か決まらない。九十日後に見直す会議がない。\n\nだから、ERSの各サブ軸には、必ず「誰が持つか」を添える。\n\n担当が空白の高得点は、まだ高得点として扱わない。\n\n研究機関の苗床は、制度の数ではなく、責任が流れる道で測る。\n"},{"file":"34-method-misuse-warnings.md","title":"Method Appendix M8 — 誤用しないために","markdown":"# Method Appendix M8 — 誤用しないために\n\nこのモデルは、研究成果を急いで会社にするための道具ではない。\n\nむしろ、急がせる力が強くなったときに、まだ見ていない条件を残すための道具である。\n\n誤用しやすい読み方を、ここで止めておく。\n\n高い数値を、起業の許可として使わない。\n\n低い数値を、研究者の能力不足として使わない。\n\n創業者機能を、研究者本人への人格評価として使わない。\n\n小さな支払いを、いつでも良い証拠として扱わない。その支払いが、未来を広げるのか、短期の安心と引き換えに本来の道を狭めるのかを見る。\n\n支払い拒否を、失敗として捨てない。予算者、時期、導入条件、繰り返し性を返す観測として読む。\n\nJカーブやIPOの言葉を、すべてのシーズに同じように当てない。大きく伸びる可能性を閉じないことは大事だが、まだ稼げる体質も生存確率も見えていない案件に、会社化だけを急がせることも危うい。\n\n現場メモを、そのまま公開しない。匿名化しても、関係者が特定できる濃さが残ることはある。\n\n強すぎる一文を書けることを、良い支援だと思わない。\n\nこの補遺の式は、強い言葉を正当化するためではなく、弱い事実を弱いまま会議に戻すためにある。\n"}]</script>
  <script>
    const chapters = JSON.parse(document.getElementById("chapters-data").textContent);
    const deck = document.getElementById("deck");
    const chapterSelect = document.getElementById("chapterSelect");
    const progress = document.getElementById("progress");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");
    const tocButton = document.getElementById("tocButton");
    const fontRange = document.getElementById("fontRange");
    const storageKey = "before-zero-reader-page";
    const fontKey = "before-zero-reader-font-size";
    const pageMap = [];
    let currentPage = Number(localStorage.getItem(storageKey) || 0);

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(new RegExp(String.fromCharCode(96) + "([^" + String.fromCharCode(96) + "]+)" + String.fromCharCode(96), "g"), "<code>$1</code>");
    }

    function renderBlocks(markdown) {
      const lines = markdown.split(/\r?\n/);
      const html = [];
      let paragraph = [];
      let list = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push("<p>" + inlineMarkdown(paragraph.join(" ")) + "</p>");
        paragraph = [];
      }

      function flushList() {
        if (!list.length) return;
        html.push("<ul>" + list.map((item) => "<li>" + inlineMarkdown(item) + "</li>").join("") + "</ul>");
        list = [];
      }

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) {
          flushParagraph();
          flushList();
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          html.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
          continue;
        }
        const bullet = line.match(/^-\s+(.+)$/);
        if (bullet) {
          flushParagraph();
          list.push(bullet[1]);
          continue;
        }
        if (line.startsWith(">")) {
          flushParagraph();
          flushList();
          html.push("<blockquote><p>" + inlineMarkdown(line.replace(/^>\s?/, "")) + "</p></blockquote>");
          continue;
        }
        flushList();
        paragraph.push(line);
      }

      flushParagraph();
      flushList();
      return html.join("\n");
    }

    function splitChapter(chapter, chapterIndex) {
      const blocks = chapter.markdown.split(/\n(?=##\s+|#\s+)/g);
      const pages = [];
      let bucket = "";
      const maxChars = chapterIndex >= 26 ? 1500 : 1250;

      for (const block of blocks) {
        if (!bucket) {
          bucket = block;
          continue;
        }
        if ((bucket + "\n\n" + block).length > maxChars) {
          pages.push(bucket);
          bucket = block;
        } else {
          bucket += "\n\n" + block;
        }
      }
      if (bucket) pages.push(bucket);
      return pages.length ? pages : [chapter.markdown];
    }

    function render() {
      const savedFont = localStorage.getItem(fontKey);
      if (savedFont) {
        document.documentElement.style.setProperty("--font-size", savedFont + "px");
        fontRange.value = savedFont;
      }

      chapters.forEach((chapter, chapterIndex) => {
        const option = document.createElement("option");
        option.value = String(chapterIndex);
        option.textContent = chapter.title;
        chapterSelect.appendChild(option);

        const pages = splitChapter(chapter, chapterIndex);
        pages.forEach((pageMarkdown, localPageIndex) => {
          pageMap.push({ chapterIndex, localPageIndex, title: chapter.title });
          const page = document.createElement("article");
          page.className = "page";
          page.innerHTML =
            '<div class="sheet">' +
            '<div class="chapter-kicker">' +
            escapeHtml(String(chapterIndex).padStart(2, "0")) +
            " / " +
            escapeHtml(chapter.file.replace(/\.md$/, "")) +
            "</div>" +
            renderBlocks(pageMarkdown) +
            '<p class="fineprint">Swipe sideways. Page ' +
            (pageMap.length) +
            "</p>" +
            "</div>";
          deck.appendChild(page);
        });
      });

      currentPage = Math.min(Math.max(currentPage, 0), pageMap.length - 1);
      updateProgress();
      requestAnimationFrame(() => goToPage(currentPage, false));
    }

    function goToPage(index, smooth = true) {
      currentPage = Math.min(Math.max(index, 0), pageMap.length - 1);
      const pageWidth = deck.clientWidth;
      deck.scrollTo({ left: currentPage * pageWidth, behavior: smooth ? "smooth" : "auto" });
      updateProgress();
    }

    function updateProgress() {
      const page = pageMap[currentPage];
      if (!page) return;
      chapterSelect.value = String(page.chapterIndex);
      progress.textContent = (currentPage + 1) + " / " + pageMap.length + " · " + page.title;
      localStorage.setItem(storageKey, String(currentPage));
    }

    function currentPageFromScroll() {
      return Math.round(deck.scrollLeft / Math.max(deck.clientWidth, 1));
    }

    deck.addEventListener("scroll", () => {
      window.clearTimeout(deck._scrollTimer);
      deck._scrollTimer = window.setTimeout(() => {
        currentPage = currentPageFromScroll();
        updateProgress();
      }, 80);
    });

    prevButton.addEventListener("click", () => goToPage(currentPage - 1));
    nextButton.addEventListener("click", () => goToPage(currentPage + 1));
    tocButton.addEventListener("click", () => {
      const chapter = pageMap[currentPage]?.chapterIndex ?? 0;
      const firstPage = pageMap.findIndex((page) => page.chapterIndex === chapter);
      if (firstPage >= 0) goToPage(firstPage);
    });
    chapterSelect.addEventListener("change", () => {
      const chapterIndex = Number(chapterSelect.value);
      const firstPage = pageMap.findIndex((page) => page.chapterIndex === chapterIndex);
      if (firstPage >= 0) goToPage(firstPage);
    });
    fontRange.addEventListener("input", () => {
      document.documentElement.style.setProperty("--font-size", fontRange.value + "px");
      localStorage.setItem(fontKey, fontRange.value);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") goToPage(currentPage - 1);
      if (event.key === "ArrowRight" || event.key === " ") goToPage(currentPage + 1);
    });

    window.addEventListener("resize", () => goToPage(currentPage, false));

    render();
  </script>
</body>
</html>
